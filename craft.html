      <line class="ln" style="--d:1.1;--len:480" x1="20" y1="186" x2="500" y2="186" stroke="#2EB34A" stroke-width="1.5" stroke-dasharray="6 4"/>
      <g class="fx" style="--d:1.4"><rect x="40" y="188" width="226" height="16" fill="var(--gyp)" stroke="#CFC7BA"/><rect x="272" y="188" width="208" height="16" fill="var(--gyp)" stroke="#CFC7BA"/>
        <path d="M262 204 L269 192 L276 204" fill="#E0C992"/></g>
      <g class="fx" style="--d:1.6" fill="#555"><circle cx="67" cy="196" r="2.5"/><circle cx="167" cy="196" r="2.5"/><circle cx="367" cy="196" r="2.5"/><circle cx="457" cy="196" r="2.5"/></g>
      <g class="fx" style="--d:1.9"><text class="dm" x="40" y="244">俯视 · 封板排版</text>
        <g stroke="#CFC7BA" fill="var(--gyp)"><rect x="40" y="254" width="150" height="40"/><rect x="190" y="254" width="150" height="40"/><rect x="340" y="254" width="140" height="40"/>
        <rect x="40" y="294" width="80" height="40"/><rect x="120" y="294" width="150" height="40"/><rect x="270" y="294" width="150" height="40"/><rect x="420" y="294" width="60" height="40"/></g>
        <path class="dim" d="M120 342 V354 M190 342 V354 M120 350 H190"/><text class="dm" x="155" y="372" text-anchor="middle">≥300mm</text></g>
      <path class="ldr ln" style="--d:1.8;--len:120" d="M260 100 H330"/><text class="lb" style="--d:2" x="336" y="104">吊杆 → 主龙骨 → 副龙骨</text>
      <path class="ldr ln" style="--d:1.9;--len:120" d="M269 196 V222 H330"/><text class="lb" style="--d:2.1" x="336" y="226">切口 45° 倒角 · 嵌缝</text>
      <text class="dm fx" style="--d:2.1" x="24" y="178">平整度 ≤3mm/2m</text>`,
    paint:`<g id="paintStack"></g>`,
    handover:`
      <rect x="30" y="30" width="60" height="320" fill="var(--tile)" stroke="#CFC7BA"/>
      <path d="M30 90H90M30 150H90M30 210H90M30 270H90" stroke="#CFC7BA"/>
      <g class="fx" style="--d:.3"><rect x="90" y="190" width="360" height="20" fill="#EEEAE2" stroke="#C9C2B6"/><rect x="110" y="210" width="320" height="140" fill="var(--wood)"/><path d="M270 210V350" stroke="#7E583B"/></g>
      <g class="fx" style="--d:.8"><rect x="180" y="160" width="120" height="22" rx="4" fill="#fff" stroke="#9AA0A3"/><path d="M196 171 H284" stroke="#3C9A5A" stroke-width="3"/><circle cx="240" cy="171" r="5" fill="#C7E7C3" stroke="#3C9A5A"/></g>
      <g class="fx" style="--d:1.2"><circle cx="94" cy="192" r="52" fill="#FBF9F5" stroke="#1A1C1E" stroke-width="2"/>
        <clipPath id="mag"><circle cx="94" cy="192" r="50"/></clipPath>
        <g clip-path="url(#mag)"><rect x="40" y="130" width="54" height="120" fill="var(--tile)"/><rect x="94" y="196" width="80" height="60" fill="#EEEAE2"/><path d="M94 196 q-12 0 -12 -12 v-4 h12z" fill="#F7F7F7" stroke="#B7B2A8"/></g></g>
      <g class="fx" style="--d:1.9"><rect x="430" y="30" width="72" height="92" rx="4" fill="#fff" stroke="#9A958C" stroke-width="2"/><rect x="452" y="24" width="28" height="12" rx="3" fill="#9A958C"/><path d="M442 56h48M442 72h48M442 88h30" stroke="#CFC7BA" stroke-width="3"/><path d="M444 106 q10 -12 20 0 t20 0" fill="none" stroke="#1A3A2A" stroke-width="2"/><text class="dm" x="466" y="140" text-anchor="middle">验收单签字</text></g>
      <path class="ldr ln" style="--d:1.6;--len:240" d="M80 178 L60 110 H160"/><text class="lb" style="--d:1.8" x="166" y="114">防霉胶收口 · 水进不去</text>
      <path class="ldr ln" style="--d:1.7;--len:100" d="M300 171 H340"/><text class="lb" style="--d:1.9" x="346" y="175">水平尺校平</text>
      <path class="ldr ln" style="--d:1.8;--len:100" d="M270 300 H340"/><text class="lb" style="--d:2" x="346" y="304">门缝统一调整</text>`
  };

  const DEFS=`<defs>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0L8 8M8 0L0 8" stroke="#6E6A62" stroke-width=".8"/></pattern>
    <pattern id="weld" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 0H22M0 0V22" stroke="#8C9196" stroke-width="1.6"/></pattern>
    <pattern id="foil" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D9B34A"/><circle cx="5" cy="5" r="3" fill="#E8C866"/></pattern>
    <pattern id="quilt" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H14M0 0V14" stroke="#A9AEB3" stroke-width="1"/></pattern></defs>`;

  let lang='zh';
  try{const site=localStorage.getItem('houzy-lang');lang=localStorage.getItem('houzy-partner-language')||(site&&site.startsWith('zh')?'zh':'en')}catch(e){}
  if(lang!=='en')lang='zh';
  /* ---------- hero: isometric wall that opens on scroll ---------- */
  const iso=document.getElementById('iso');
  const W=360,H=300,C=.866;
  const P=(x,y,z)=>[330+(x-y)*C,330+(x+y)*.5-z];
  const pts=a=>a.map(p=>P(...p).map(n=>n.toFixed(1)).join(',')).join(' ');
  const LAYERS=[
    {name:'砖墙 + 防水反坎',sub:'植筋 200mm · 反坎 18–20cm',en:['Brick + waterproof kerb','rebar 200mm · kerb 18–20cm'],t:30,f:'#A9553E',s:'#7F3E2C',tp:'#C47A62',tex:'brick'},
    {name:'水电管线',sub:'线管间距 20mm · 打压 0.6MPa',en:['Pipes & wiring','conduits 20mm apart · 0.6MPa test'],t:10,tex:'pipes'},
    {name:'防水层',sub:'两遍交叉 · 总厚 ≥1.5mm',en:['Waterproofing','two crossed coats · ≥1.5mm'],t:4,f:'#D9713A',s:'#A9542A',tp:'#E89462'},
    {name:'瓷砖胶',sub:'双面上胶 · 齿痕交叉',en:['Tile adhesive','both sides · crossed notches'],t:5,f:'#9A958C',s:'#7A766E',tp:'#B5B0A6',tex:'comb'},
    {name:'瓷砖',sub:'十字卡 2–3mm · 逐块敲击',en:['Tile','2–3mm spacers · every tile tapped'],t:8,f:'#F4F1EA',s:'#CFC9BE',tp:'#FFFFFF',tex:'tile'}
  ];
  const poly=(a,fill)=>`<polygon points="${pts(a)}" fill="${fill}"/>`;
  const line=(a,b,st,sw,ex='')=>{const p=P(...a),q=P(...b);return `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${st}" stroke-width="${sw}" ${ex}/>`};
  const pipe=(path,y,st,sw)=>`<polyline points="${path.map(([x,z])=>P(x,y,z).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${st}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  function drawIso(e){
    let s='',y=0;const gap=64*e,anchors=[];
    LAYERS.forEach((L,i)=>{
      const y0=y+gap*i,y1=y0+L.t;y+=L.t;
      if(L.tex==='pipes'){
        const yy=y0+2;
        s+=pipe([[40,H],[40,180],[60,160],[120,160]],yy,'#E07A2B',4)+pipe([[52,H],[52,186],[68,172],[120,172]],yy,'#E07A2B',4)+pipe([[90,H],[90,220],[200,220]],yy,'#8466B8',3)
          +pipe([[0,64],[250,64],[250,120]],yy,'#C8483C',5)+pipe([[0,46],[290,46],[290,120]],yy,'#3C78C2',5);
      } else {
        s+=poly([[0,y0,H],[W,y0,H],[W,y1,H],[0,y1,H]],L.tp)+poly([[W,y0,0],[W,y1,0],[W,y1,H],[W,y0,H]],L.s)+poly([[0,y1,0],[W,y1,0],[W,y1,H],[0,y1,H]],L.f);
        if(L.tex==='brick'){
          s+=poly([[0,y1,0],[W,y1,0],[W,y1,26],[0,y1,26]],'#8E8A82');
          for(let r=1;r<10;r++)s+=line([0,y1,26+r*28],[W,y1,26+r*28],'#E7D2C6',1.1,'opacity=".5"');
          for(let r=0;r<10;r++)for(let x=(r%2?30:60);x<W;x+=60)s+=line([x,y1,26+r*28],[x,y1,Math.min(H,26+r*28+28)],'#E7D2C6',1.1,'opacity=".5"');}
        if(L.tex==='comb')for(let z=10;z<H;z+=10)s+=line([0,y1,z],[W,y1,z],'#7A766E',1,'opacity=".55"');
        if(L.tex==='tile'){for(let x=60;x<W;x+=60)s+=line([x,y1,0],[x,y1,H],'#C9C2B6',1.4);for(let z=60;z<H;z+=60)s+=line([0,y1,z],[W,y1,z],'#C9C2B6',1.4);}
      }
      anchors.push(P(W,y0+L.t/2,H*.82-i*6));
    });
    s=`<ellipse cx="${P(W/2,y/2+gap*2,0)[0]}" cy="${P(W/2,y/2+gap*2,0)[1]+26}" rx="${310+gap*2}" ry="${36+gap*.3}" fill="#000" opacity=".28"/>`+s;
    const op=Math.max(0,Math.min(1,(e-.45)/.35));
    anchors.forEach((a,i)=>{const lx=690,ly=96+i*92;
      s+=`<g opacity="${op.toFixed(2)}"><circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="3.5" fill="#E0C992"/><path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)} L${lx-20} ${ly} H${lx-6}" stroke="#E0C992" stroke-width="1" fill="none" opacity=".7"/>
        <text x="${lx}" y="${ly-4}"><tspan class="n">0${i+1}  </tspan><tspan class="lbl">${lang==='en'?LAYERS[i].en[0]:LAYERS[i].name}</tspan></text><text class="sub" x="${lx}" y="${ly+16}">${lang==='en'?LAYERS[i].en[1]:LAYERS[i].sub}</text></g>`});
    iso.innerHTML=s;
    document.getElementById('meter').textContent=T[lang][e<.1?'m0':e<.9?'m1':'m2']+' · '+Math.round(e*100)+'%';
  }
  let lastE=-1;
  function onScroll(){
    const h=document.getElementById('hero'),r=h.getBoundingClientRect();
    const e=Math.min(1,Math.max(0,-r.top/(h.offsetHeight-innerHeight))*1.25);
    if(Math.abs(e-lastE)>.002){lastE=e;drawIso(e)}
    let cur=0;document.querySelectorAll('.ch').forEach((c,i)=>{if(c.getBoundingClientRect().top<innerHeight*.5)cur=i+1});
    document.querySelectorAll('#spine a').forEach((a,i)=>a.classList.toggle('cur',i+1===cur));
  }

  /* ---------- chapters ---------- */
  const wrap=document.getElementById('chapters');
  const loc=(c,i)=>lang==='en'?Object.assign({},c,EN_CH[i],{pts:c.pts.map((p,k)=>[p[0],p[1],EN_CH[i].pts[k][0],EN_CH[i].pts[k][1]])}):c;
  const localize=svg=>lang==='zh'?svg:svg.replace(/>([^<>]+)</g,(m,t)=>EN_LB[t.trim()]?'>'+EN_LB[t.trim()]+'<':m);
  let io;
  function build(){
  const L=T[lang];
  wrap.querySelectorAll('.ch').forEach(n=>n.remove());
  CH.forEach((c0,i)=>{const c=loc(c0,i);
    const n=String(i+1).padStart(2,'0'),sec=document.createElement('article');sec.className='ch';sec.id='step'+(i+1);
    sec.innerHTML=`<div>
        <div class="no"><b>${n}</b>${L.step.replace('{n}',i+1)}</div>
        <h2>${c.t}</h2><p class="why">${c.why}</p>
        <div class="nums">${c.nums.map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join('')}</div>
        <ol class="flow">${c.flow.map(f=>`<li>${f}</li>`).join('')}</ol>
        <div class="vs"><div class="bad"><h4>✕ ${L.bad}</h4>${c.bad}</div><div class="good"><h4>✓ ${L.good}</h4>${c.good}</div></div>
        <div class="ptsh">${L.ptsh}</div>
        <ol class="pts">${c.pts.map((p,k)=>`<li data-k="${k}"><i>${k+1}</i><div><b>${p[2]}</b><small>${L.how}${p[3]}</small></div></li>`).join('')}</ol></div>
      <figure class="plate"><figcaption><span>${c.cap}</span><span>${n} / ${String(CH.length).padStart(2,'0')}</span></figcaption>
        <svg viewBox="0 0 520 380" role="img" aria-label="${c.cap}">${DEFS}${localize(PL[c.plate])}<g class="hs">${c.pts.map((p,k)=>`<g class="hp" data-k="${k}" style="--d:${(2.4+k*.15).toFixed(2)}" transform="translate(${p[0]} ${p[1]})"><circle class="ring" r="13"/><circle r="11"/><text y="4">${k+1}</text></g>`).join('')}</g></svg></figure>`;
    wrap.appendChild(sec);
  });
  document.getElementById('spine').innerHTML=CH.map((c,i)=>`<li><a href="#step${i+1}">${String(i+1).padStart(2,'0')}<span>${loc(c,i).t}</span></a></li>`).join('');
  document.getElementById('nSteps').textContent=CH.length;
  document.getElementById('nChecks').textContent=CH.reduce((n,c)=>n+c.pts.length,0);

  // generated parts of drawings
  (function(){
    let h='';for(let r=0;r<8;r++){const y=262-r*28;for(let x=120+(r%2?-30:0);x<500;x+=60){const x0=Math.max(120,x),w=Math.min(x+57,500)-x0;if(w>4)h+=`<rect class="fx" style="--d:${(.5+r*.07).toFixed(2)}" x="${x0}" y="${y+1}" width="${w}" height="25" fill="var(--brick)"/>`}}
    document.getElementById('brickRows').innerHTML=h;
    let d='M118 30';for(let y=30;y<350;y+=10)d+=` L136 ${y+5} L118 ${y+10}`;document.getElementById('comb').setAttribute('d',d+' Z');
    let hz='',vt='';for(let y=52;y<170;y+=12)hz+=`M300 ${y}H490`;for(let x=342;x<520;x+=12)vt+=`M${x} 70V200`;
    document.getElementById('hz').setAttribute('d',hz);document.getElementById('vt').setAttribute('d',vt);
    // conduits: parallel runs with a wide-radius bend, gap between each
    let cd='';const col=['#E0523A','#E0523A','#E0523A','#9AA3AD','#9AA3AD'];
    col.forEach((c,i)=>{const x=160+i*20,r=60+i*20;
      const p=`M${x} 20 V${250-0} `;cd+=`<path class="ln" style="--d:${(.2+i*.12).toFixed(2)};--len:500" d="M${x} 250 V${150} Q${x} ${150-r*.6} ${x-r*.6} ${150-r*.6} H30" stroke="${c}" stroke-width="12" fill="none" stroke-linecap="round"/>`});
    document.getElementById('conduits').innerHTML=cd;
    const names=lang==='en'?['Brick / substrate','Primer','Cement render','Gypsum levelling','Mesh tape (50mm at joints)','Two skim coats + sanding','Primer + top coats']:['砖墙 / 基层','界面剂','水泥砂浆打底','石膏找平','网格布（交界 50mm）','腻子两遍 + 打磨','乳胶漆 底漆 + 面漆'];
    const cols=['#BDB8AE','#D7D2C4','#A9A49B','#ECE8E0','#E3C66A','#F3F0EA','#EADBC3'];let ph='';
    names.forEach((n,i)=>{const y=330-i*40,x=10+i*24;
      ph+=`<g class="fx" style="--d:${(i*.22).toFixed(2)}"><path d="M${x} ${y} L${x+220} ${y} L${x+260} ${y-30} L${x+40} ${y-30} Z" fill="${cols[i]}" stroke="#CFC7BA"/><path d="M${x} ${y} v12 h220 l40 -30 v-12" fill="${cols[i]}" stroke="#CFC7BA" style="filter:brightness(.9)"/></g>
          <text class="lb" style="--d:${(i*.22+.4).toFixed(2)}" x="${x+268}" y="${y-8}">${n}</text>`});
    ph+=`<text class="dm fx" style="--d:2" x="10" y="372">${lang==='en'?'Moisture ≤10% before painting · top coat water ≤30%':'含水率 ≤10% 才刷 · 面漆兑水 ≤30%'}</text>`;
    document.getElementById('paintStack').innerHTML=ph;
  })();

  document.querySelectorAll('.ch').forEach(sec=>{
    const on=(k,v)=>sec.querySelectorAll(`[data-k="${k}"]`).forEach(e=>e.classList.toggle('hot',v));
    sec.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;
      e.addEventListener('mouseenter',()=>on(k,true));e.addEventListener('mouseleave',()=>on(k,false));
      e.addEventListener('click',()=>{sec.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));on(k,true)})});
  });
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.2});
  document.querySelectorAll('.ch').forEach(s=>io.observe(s));
  }
  function render(){
    const L=T[lang];
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=L.title;
    document.querySelectorAll('[data-t]').forEach(e=>e.textContent=L[e.dataset.t]);
    document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=L[e.dataset.h]);
    document.querySelectorAll('[data-a]').forEach(e=>e.setAttribute('aria-label',L[e.dataset.a]));
    document.getElementById('lang').textContent=lang==='zh'?'EN':'中文';
    build();lastE=-1;onScroll();
  }
  document.getElementById('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('houzy-partner-language',lang)}catch(e){}render()};
  addEventListener('scroll',()=>requestAnimationFrame(onScroll),{passive:true});
  addEventListener('resize',onScroll);
  render();
  </script>
</body>
</html>
