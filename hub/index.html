<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>合屋协作台 · HOUZY Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--pine:#153927;--cypress:#244837;--gold:#C8A96E;--warm:#E0C992;--parch:#F4EFE5;--ink:#171717;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans SC',sans-serif;background:#eceae4;color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}
  #gate{position:fixed;inset:0;background:var(--pine);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:50;}
  #gate img{height:54px;width:54px;margin-bottom:14px;}
  #gate .wm{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--gold);letter-spacing:2px;text-align:center;}
  #gate .wm small{display:block;font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:6px;color:var(--parch);font-weight:500;margin-top:4px;}
  #gate .t{font-family:'Noto Serif SC',serif;color:#fff;font-size:16px;margin:18px 0 4px;}
  #gate .d{font-size:12px;color:var(--warm);margin-bottom:18px;}
  #gate input{width:min(86vw,300px);padding:13px 16px;border-radius:8px;border:1px solid rgba(200,169,110,.4);background:rgba(255,255,255,.06);color:#fff;font-size:15px;text-align:center;outline:none;}
  #gate input::placeholder{color:rgba(244,239,229,.5);}
  #gate button{width:min(86vw,300px);margin-top:12px;padding:13px;border:none;border-radius:8px;background:var(--gold);color:var(--pine);font-size:15px;font-weight:700;cursor:pointer;}
  #gate .err{color:#ff9b9b;font-size:13px;margin-top:12px;height:18px;}
  #board{display:none;}
  .wrap{max-width:760px;margin:0 auto;padding:0 0 40px;}
  header{background:var(--pine);color:var(--parch);padding:16px 18px;position:sticky;top:0;z-index:5;}
  header .top{display:flex;align-items:center;gap:10px;}
  header img{height:28px;width:28px;}
  header .wm{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;letter-spacing:1px;color:var(--gold);}
  header .lo{margin-left:auto;font-size:11px;color:var(--warm);text-decoration:underline;cursor:pointer;}
  header h1{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;margin-top:9px;}
  header .meta{font-size:11px;color:var(--warm);margin-top:3px;}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#666;padding:12px 16px 4px;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .hint{font-size:11.5px;color:#8a7;padding:2px 16px 0;}
  .person{background:#fff;margin:14px 14px 0;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .person .ph{background:var(--pine);color:var(--parch);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;}
  .person .ph .nm{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;}
  .person .ph .ro{font-size:11px;color:var(--warm);}
  .task{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid #f0ede6;}
  .task:last-child{border-bottom:none;}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .p1{background:#dc2626;}.p2{background:#e0a000;}.p3{background:#3a9d5d;}
  .task .body{flex:1;min-width:0;} .task .ti{font-size:13.5px;color:#222;font-weight:500;} .task .sub{font-size:11.5px;color:#888;margin-top:2px;}
  .task.done .ti{text-decoration:line-through;color:#aaa;}
  .st{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px;cursor:pointer;user-select:none;}
  .st-todo{background:#eee;color:#777;} .st-doing{background:#fff3d6;color:#92400e;} .st-done{background:#d6e8db;color:#1a6b3a;} .st-late{background:#fde2e2;color:#c0392b;}
  .foot{text-align:center;font-size:11px;color:#999;padding:24px 16px 0;} .foot b{color:var(--pine);}
  #loading{text-align:center;color:#999;padding:40px;font-size:13px;}
</style>
</head>
<body>

<div id="gate">
  <img src="/favicon.svg" alt="">
  <div class="wm">HOUZY HUB<small>合 屋 协 作 台</small></div>
  <div class="t">员工登录</div>
  <div class="d">请输入团队密码</div>
  <input id="pw" type="password" placeholder="团队密码" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">进入协作台</button>
  <div class="err" id="err"></div>
</div>

<div id="board"><div class="wrap">
  <header>
    <div class="top"><img src="/favicon.svg" alt=""><span class="wm">HOUZY HUB · 合屋协作台</span><span class="lo" onclick="lock()">退出</span></div>
    <h1>团队每日工作安排 · 开业冲刺</h1>
    <div class="meta">今天 <span id="today"></span> · 点状态可切换并自动保存</div>
  </header>
  <div class="legend">
    <span><i class="dot p1"></i>高</span><span><i class="dot p2"></i>中</span><span><i class="dot p3"></i>低</span> ·
    <span class="st st-todo">待办</span><span class="st st-doing">进行中</span><span class="st st-done">已完成</span>
  </div>
  <div class="hint">👉 点右侧状态徽章可循环切换:待办 → 进行中 → 已完成,改了自动保存,全员同步。</div>
  <div id="loading">加载中…</div>
  <div id="board-content"></div>
  <div class="foot">由 <b>HOUZY 助手</b>维护任务 · 员工可自行更新进度<br>HOUZY HOME SDN. BHD. · 内部使用,请勿外传</div>
</div></div>

<script>
  var HASH="c1fbf1087afa75786d23e6a4e0fc1b1fb06f16aae31f70125f0bf1ef100509c0";
  var SB_URL="https://csabbxiijzghooppayae.supabase.co";
  var SB_KEY="sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH";
  var PERSONS=[['老板','统筹·决策'],['张梦','线上自媒体·商城'],['小霞','后端·线下所有'],['雷霆','数字化·助手协助']];
  var STNEXT={todo:'doing',doing:'done',done:'todo',late:'doing'};
  var STLABEL={todo:'待办',doing:'进行中',done:'已完成',late:'逾期'};
  var sb;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  async function sha256(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  function showDate(){var d=new Date();var w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];document.getElementById('today').textContent=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+w;}
  async function show(){document.getElementById('gate').style.display='none';document.getElementById('board').style.display='block';showDate();await loadBoard();}
  async function unlock(){var v=document.getElementById('pw').value;var h=await sha256(v);if(h===HASH){sessionStorage.setItem('houzy_hub','1');show();}else{document.getElementById('err').textContent='密码不对,请重试';document.getElementById('pw').value='';}}
  function lock(){sessionStorage.removeItem('houzy_hub');location.reload();}
  async function loadBoard(){
    sb=supabase.createClient(SB_URL,SB_KEY);
    var res=await sb.from('hub_tasks').select('*').order('sort');
    var el=document.getElementById('board-content');
    document.getElementById('loading').style.display='none';
    if(res.error){el.innerHTML='<div class="foot" style="color:#c0392b">读取任务失败:请确认数据库表 hub_tasks 已创建。<br>'+esc(res.error.message)+'</div>';return;}
    var tasks=res.data||[];
    var html='';
    PERSONS.forEach(function(p){
      var name=p[0],role=p[1];
      var mine=tasks.filter(function(t){return t.person===name;});
      if(!mine.length)return;
      html+='<div class="person"><div class="ph"><span class="nm">'+esc(name)+'</span><span class="ro">'+esc(role)+'</span></div>';
      mine.forEach(function(t){
        html+='<div class="task '+(t.status==='done'?'done':'')+'" id="task-'+t.id+'">'
          +'<i class="dot p'+(t.priority||2)+'"></i>'
          +'<div class="body"><div class="ti">'+esc(t.title)+'</div>'+(t.subtitle?'<div class="sub">'+esc(t.subtitle)+'</div>':'')+'</div>'
          +'<span class="st st-'+t.status+'" data-st="'+t.status+'" onclick="cycle(\''+t.id+'\',this)">'+STLABEL[t.status]+'</span></div>';
      });
      html+='</div>';
    });
    el.innerHTML=html||'<div class="foot">暂无任务(请先在数据库种子任务)。</div>';
  }
  async function cycle(id,elx){
    var cur=elx.dataset.st;var next=STNEXT[cur]||'todo';
    elx.className='st st-'+next;elx.dataset.st=next;elx.textContent=STLABEL[next];
    var row=document.getElementById('task-'+id);if(row)row.classList.toggle('done',next==='done');
    var r=await sb.from('hub_tasks').update({status:next,updated_at:new Date().toISOString()}).eq('id',id);
    if(r.error){elx.textContent='保存失败';}
  }
  if(sessionStorage.getItem('houzy_hub')==='1'){show();}
</script>
</body>
</html>
