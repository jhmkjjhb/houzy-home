<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — 物流门户</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#153927">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#153927','gg':'#245640','gd':'#c8a96e','gc':'#fbf8f1'}}}}</script>
<link rel="stylesheet" href="houzy-brand.css?v=4">
<script src="houzy-icons.js?v=4"></script>
</head>
<body class="bg-gc min-h-screen" style="font-family:Inter,'Noto Sans SC',sans-serif">

<!-- Header -->
<nav class="bg-hg shadow-md">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <img src="/favicon.svg" alt="HOUZY" class="w-7 h-7 rounded-md flex-shrink-0">
      <span class="text-white text-sm hz-serif" style="font-weight:700;letter-spacing:.5px">HOUZY HOME</span>
    </a>
    <div class="flex items-center gap-4">
      <span id="log-name" class="text-gd text-sm"></span>
      <button onclick="logout()" class="text-gray-400 hover:text-white text-xs border border-white/20 px-3 py-1 rounded">退出</button>
    </div>
  </div>
</nav>

<!-- Orders list -->
<div id="v-orders" class="max-w-3xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-lg font-bold text-gray-800">物流管理</h1>
    <span id="order-count" class="text-sm text-gray-400"></span>
  </div>

  <!-- Status filter -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
    <button class="filter-btn active px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('',this)">全部</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('shipped',this)">待揽件</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('in_transit',this)">运输中</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('arrived',this)">已到货</button>
  </div>

  <div id="orders-list"></div>
</div>

<!-- Order detail -->
<div id="v-detail" class="hidden max-w-3xl mx-auto px-4 py-6">
  <div class="flex items-center gap-3 mb-5">
    <button onclick="show('v-orders')" class="text-gray-400 hover:text-gray-600">← 返回</button>
    <h1 class="text-lg font-bold text-gray-800">订单详情</h1>
  </div>
  <div id="detail-content"></div>
</div>

<style>
  .filter-btn { background: white; color: #6b7280; border: 1px solid #e5e7eb; }
  .filter-btn.active { background: #1a3a2a; color: white; border-color: #1a3a2a; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

let profile = null, allOrders = [], currentFilter = '';

const STATUS = {
  production_complete: { label:'生产完成/待提货', cls:'bg-indigo-100 text-indigo-700' },
  shipped:             { label:'已发货/运输中',   cls:'bg-orange-100 text-orange-700' },
  in_transit:          { label:'在途',           cls:'bg-orange-200 text-orange-800' },
  arrived:             { label:'已到货',          cls:'bg-teal-100 text-teal-700' },
  installing:          { label:'安装中',          cls:'bg-teal-200 text-teal-800' },
  completed:           { label:'已完成',          cls:'bg-green-100 text-green-700' },
};

// Logistics handles: pickup confirmation → transit → delivery signed
// production_complete → shipped (pickup confirmed, with tracking_no)
// shipped → in_transit (dispatched)
// in_transit → arrived (delivered to customer)
// 发货由厂家确认；物流从 shipped 开始接手
const MY_TRANSITIONS = {
  shipped:    { next: 'in_transit', label: '已揽件发出', requireTracking: false },
  in_transit: { next: 'arrived',   label: '已到货签收', requireTracking: false },
};

function badge(s) {
  const x = STATUS[s] || { label: s, cls: 'bg-gray-100 text-gray-500' };
  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${x.cls}">${x.label}</span>`;
}
// Escape DB text before interpolating into innerHTML (prevent XSS)
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtAmt(v) {
  const n = Number(v);
  if (v === null || v === undefined || !isFinite(n)) return 'RM -';
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleDateString('zh-CN', { month:'short', day:'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function show(id) {
  ['v-orders','v-detail'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  profile = await sb.rpc('get_my_profile').then(r => r.data);
  if (!profile || profile.role !== 'logistics') {
    alert('权限不足'); window.location.href = 'login.html'; return;
  }

  document.getElementById('log-name').textContent = `${profile.name}`;
  await loadOrders();
}

let loadError = null;

async function loadOrders() {
  const { data, error } = await sb.from('orders')
    .select('*, stores(name), customers(name,phone,address), suppliers(name,phone)')
    .in('status', ['shipped','in_transit','arrived'])
    .order('updated_at', { ascending: false });
  // Fail loud: surface query errors instead of showing the same "暂无" empty state
  loadError = error || null;
  if (error) console.error('[logistics loadOrders]', error.message);
  allOrders = data || [];
  renderOrders();
}

function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const el = document.getElementById('orders-list');

  // Fail loud: distinct visible error state (not the same "暂无" empty state)
  if (loadError) {
    document.getElementById('order-count').textContent = '';
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="text-red-600 font-medium">订单加载失败</p>
      <p class="text-gray-400 text-sm mt-1">${esc(loadError.message || '请检查网络或权限后重试')}</p>
    </div>`;
    return;
  }

  // L2: when no filter is chosen, hide terminal "arrived" orders (already
  // delivered, no logistics action left) so the default list stays actionable.
  const base = currentFilter
    ? allOrders.filter(o => o.status === currentFilter)
    : allOrders.filter(o => o.status !== 'arrived');
  const filtered = base;

  document.getElementById('order-count').textContent = `共 ${filtered.length} 条`;

  if (!filtered.length) {
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">🚚</div>
      <p class="text-gray-400">暂无需要处理的物流订单</p>
    </div>`;
    return;
  }

  el.innerHTML = filtered.map(o => {
    const tr = MY_TRANSITIONS[o.status];
    const actionBtn = tr ? `<button onclick="quickUpdate('${o.id}','${o.status}','${tr.next}',${tr.requireTracking})"
            class="px-3 py-1.5 text-xs bg-hg text-white rounded-lg hover:bg-gg whitespace-nowrap">
      ${tr.label}
    </button>` : '';
    // L2: arrived is a terminal state for logistics — show a "done" badge
    // (staff advances to installing; logistics owns no further transition).
    const doneBadge = o.status === 'arrived'
      ? `<span class="inline-flex items-center gap-1 text-xs text-teal-700 bg-teal-50 border border-teal-200 px-2 py-1 rounded-lg">✅ 已交付，等待门店安装</span>`
      : '';
    return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-3">
      <div class="flex items-start justify-between mb-3">
        <div>
          <div class="font-mono font-bold text-hg text-sm">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-xs mt-0.5">${esc(o.stores?.name)} · ${fmtDate(o.updated_at)}</div>
        </div>
        ${badge(o.status)}
      </div>
      <div class="text-sm text-gray-700 mb-1">${esc(o.customers?.name)} · ${esc(o.customers?.phone)}</div>
      ${o.customers?.address ? `<div class="text-xs text-gray-400 mb-1">${esc(o.customers.address)}</div>` : ''}
      ${o.tracking_no ? `<div class="text-xs text-orange-600 font-mono mb-2">${esc(o.tracking_no)}</div>` : ''}
      ${o.suppliers?.name ? `<div class="text-xs text-gray-400 mb-2">来自: ${esc(o.suppliers.name)}</div>` : ''}
      ${doneBadge ? `<div class="mb-2">${doneBadge}</div>` : ''}
      <div class="flex items-center justify-between mt-3">
        <span class="font-bold text-hg text-sm">${fmtAmt(o.amount)}</span>
        <div class="flex gap-2">
          <button onclick="openDetail('${o.id}')"
                  class="px-3 py-1.5 text-xs border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
            详情
          </button>
          ${actionBtn}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function quickUpdate(orderId, curStatus, newStatus, requireTracking) {
  let trackingNo = null;
  if (requireTracking) {
    trackingNo = prompt('请填写物流单号（必填）：');
    if (!trackingNo || !trackingNo.trim()) { alert('必须填写物流单号'); return; }
    trackingNo = trackingNo.trim();
  }
  const notes = prompt(`更新到「${STATUS[newStatus]?.label || newStatus}」，填写备注（可选）：`);
  if (notes === null) return;

  const update = { status: newStatus };
  if (trackingNo) update.tracking_no = trackingNo;
  const { error } = await sb.from('orders').update(update).eq('id', orderId);
  if (error) { alert('更新失败: ' + error.message); return; }

  const logNotes = [trackingNo ? `物流单号：${trackingNo}` : null, notes || null].filter(Boolean).join(' | ');
  await sb.from('order_logs').insert({
    order_id: orderId, status: newStatus,
    operator_id: profile.id,
    operator_role: 'logistics',
    operator_name: profile.name,
    notes: logNotes || null,
  });
  await loadOrders();
}

async function openDetail(id) {
  show('v-detail');
  document.getElementById('detail-content').innerHTML =
    '<div class="text-center py-10 text-gray-400">加载中…</div>';

  const { data: o } = await sb.from('orders')
    .select('*, stores(name), customers(name,phone,address), suppliers(name,phone)')
    .eq('id', id).single();

  const { data: logs } = await sb.from('order_logs')
    .select('*').eq('order_id', id).order('created_at', { ascending: true });

  const logsHtml = (logs || []).map((l, i, arr) => {
    const isLast = i === arr.length - 1;
    const statusInfo = STATUS[l.status] || { label: l.status, cls: 'bg-gray-100 text-gray-500' };
    return `<div class="flex gap-3">
      <div class="flex flex-col items-center flex-shrink-0 w-4">
        <div class="w-2.5 h-2.5 rounded-full ${isLast ? 'bg-hg' : 'bg-gray-300'} mt-0.5"></div>
        ${!isLast ? '<div class="w-px bg-gray-200 flex-1 my-1 mx-auto"></div>' : ''}
      </div>
      <div class="pb-3 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs px-2 py-0.5 rounded-full font-medium ${statusInfo.cls}">${statusInfo.label}</span>
          <span class="text-gray-400 text-xs">${fmtDateTime(l.created_at)}</span>
        </div>
        ${l.notes ? `<p class="text-gray-600 text-sm mt-0.5">${esc(l.notes)}</p>` : ''}
        <p class="text-gray-400 text-xs">${esc(l.operator_name)} · ${esc(l.operator_role)}</p>
      </div>
    </div>`;
  }).join('');

  const tr = MY_TRANSITIONS[o?.status];
  const trackingInput = (tr && tr.requireTracking) ? `
    <div class="mb-3">
      <label class="block text-xs font-medium text-gray-600 mb-1">物流单号 <span class="text-red-500">*</span></label>
      <input type="text" id="det-tracking" placeholder="必填"
             class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-hg">
    </div>` : '';

  const updateSection = tr ? `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-3">更新物流状态</h3>
      ${trackingInput}
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-600 mb-1">备注</label>
        <input type="text" id="det-notes" placeholder="可选备注"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-hg">
      </div>
      <button onclick="updateFromDetail('${o.id}','${o.status}','${tr.next}',${tr.requireTracking})"
              class="w-full py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg transition text-sm">
        ${tr.label}
      </button>
      <p id="det-msg" class="text-green-600 text-sm mt-2 text-center hidden">✓ 已更新</p>
    </div>` : '';

  document.getElementById('detail-content').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div class="font-mono font-bold text-hg text-xl">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-sm">${esc(o.stores?.name)}</div>
        </div>
        ${badge(o.status)}
      </div>
      <div class="space-y-2 text-sm">
        <div><span class="text-gray-400">客户</span> <span class="font-medium">${esc(o.customers?.name)}</span></div>
        <div><span class="text-gray-400">手机</span> <span>${esc(o.customers?.phone)}</span></div>
        ${o.customers?.address ? `<div><span class="text-gray-400">地址</span> <span>${esc(o.customers.address)}</span></div>` : ''}
        <div><span class="text-gray-400">金额</span> <span class="font-bold text-hg">${fmtAmt(o.amount)}</span></div>
        ${o.suppliers?.name ? `<div><span class="text-gray-400">来源厂家</span> <span>${esc(o.suppliers.name)}</span></div>` : ''}
        ${o.tracking_no ? `<div><span class="text-gray-400">物流单号</span> <span class="font-mono font-medium text-orange-600">${esc(o.tracking_no)}</span></div>` : ''}
        ${o.logistics_notes ? `<div><span class="text-gray-400">物流备注</span> <span>${esc(o.logistics_notes)}</span></div>` : ''}
      </div>
      ${o.description ? `<p class="mt-3 text-sm text-gray-600 border-t pt-3">${esc(o.description)}</p>` : ''}
    </div>

    ${updateSection}

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
      <h3 class="font-semibold text-gray-800 mb-4">物流日志</h3>
      ${logsHtml || '<p class="text-gray-400 text-sm">暂无记录</p>'}
    </div>`;
}

async function updateFromDetail(id, curStatus, newStatus, requireTracking) {
  const trackingEl = document.getElementById('det-tracking');
  const trackingNo = trackingEl ? trackingEl.value.trim() : '';
  const notes = document.getElementById('det-notes')?.value.trim() || '';

  if (requireTracking && !trackingNo) { alert('必须填写物流单号'); return; }

  const update = { status: newStatus };
  if (trackingNo) update.tracking_no = trackingNo;
  const { error } = await sb.from('orders').update(update).eq('id', id);
  if (error) { alert('更新失败: ' + error.message); return; }

  const logNotes = [trackingNo ? `物流单号：${trackingNo}` : null, notes || null].filter(Boolean).join(' | ');
  await sb.from('order_logs').insert({
    order_id: id, status: newStatus,
    operator_id: profile.id,
    operator_role: 'logistics',
    operator_name: profile.name,
    notes: logNotes || null,
  });

  document.getElementById('det-msg').classList.remove('hidden');
  setTimeout(() => document.getElementById('det-msg').classList.add('hidden'), 2000);
  await loadOrders();
  openDetail(id);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
</body>
</html>
