const LANG_LABELS = { 'en':'English', 'zh-CN':'简体中文', 'zh-TW':'繁體中文', 'ms':'Bahasa Melayu', 'th':'ภาษาไทย' };
let currentLang = localStorage.getItem('houzy-lang') || 'zh-CN';
if (!LG_I18N[currentLang]) currentLang = 'zh-CN';
function t(k) { return (LG_I18N[currentLang] || LG_I18N['zh-CN'])[k] || k; }
function toggleLangDrop() { document.getElementById('lang-drop').classList.toggle('hidden'); }
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('houzy-lang', lang);
  const lbl = LANG_LABELS[lang] || lang;
  const lblEl = document.getElementById('lang-label'); if (lblEl) lblEl.textContent = lbl;
  document.getElementById('lang-drop')?.classList.add('hidden');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n); if (v) el.textContent = v;
  });
  document.body.style.fontFamily = lang === 'th' ? "Inter,'Noto Sans Thai',sans-serif" : "Inter,'Noto Sans SC',sans-serif";
  document.documentElement.lang = lang;
  // 重渲列表 + 详情（如果已加载）
  renderOrders();
  if (window.__lastDetailId) openDetail(window.__lastDetailId);
}
window.addEventListener('DOMContentLoaded', () => setLang(currentLang));
document.addEventListener('click', (e) => {
  const drop = document.getElementById('lang-drop');
  if (!drop || drop.classList.contains('hidden')) return;
  if (e.target.closest('button')?.getAttribute('onclick')?.includes('toggleLangDrop')) return;
  drop.classList.add('hidden');
});

const STATUS = {
  production_complete: { key: 'st_production_complete', cls:'bg-indigo-100 text-indigo-700' },
  shipped:             { key: 'st_shipped',             cls:'bg-orange-100 text-orange-700' },
  in_transit:          { key: 'st_in_transit',          cls:'bg-orange-200 text-orange-800' },
  arrived:             { key: 'st_arrived',             cls:'bg-teal-100 text-teal-700' },
  installing:          { key: 'st_installing',          cls:'bg-teal-200 text-teal-800' },
  completed:           { key: 'st_completed',           cls:'bg-green-100 text-green-700' },
};
function stLabel(s) { return t(STATUS[s]?.key || s); }

const MY_TRANSITIONS = {
  shipped:    { next: 'in_transit', labelKey: 'btn_picked_up', requireTracking: false },
  in_transit: { next: 'arrived',   labelKey: 'btn_signed',     requireTracking: false },
};
function trLabel(tr) { return tr ? t(tr.labelKey) : ''; }

function badge(s) {
  const x = STATUS[s];
  const lbl = stLabel(s);
  const cls = x?.cls || 'bg-gray-100 text-gray-500';
  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${cls}">${lbl}</span>`;
}
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtAmt(v) {
  const n = Number(v);
  if (v === null || v === undefined || !isFinite(n)) return 'RM -';
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function _loc() { return { 'zh-CN':'zh-CN','zh-TW':'zh-TW','en':'en-MY','ms':'ms-MY','th':'th-TH' }[currentLang] || 'zh-CN'; }
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleDateString(_loc(), { month:'short', day:'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleString(_loc(), { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function show(id) {
  ['v-orders','v-detail'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  profile = await sb.rpc('get_my_profile').then(r => r.data);
  if (!profile || profile.role !== 'logistics') {
    alert(t('no_permission')); window.location.href = 'login.html'; return;
  }

  document.getElementById('log-name').textContent = `${profile.name}`;
  await loadOrders();
}

async function loadOrders() {
  const { data, error } = await sb.from('orders')
    .select('*, stores(name), customers(name,phone,address), suppliers(name,phone)')
    .in('status', ['shipped','in_transit','arrived'])
    .order('updated_at', { ascending: false });
  loadError = error || null;
  if (error) console.error('[logistics loadOrders]', error.message);
  allOrders = data || [];
  renderOrders();
}

function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const el = document.getElementById('orders-list');
  if (!el) return;

  if (loadError) {
    document.getElementById('order-count').textContent = '';
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="text-red-600 font-medium">${t('load_failed')}</p>
      <p class="text-gray-400 text-sm mt-1">${esc(loadError.message || t('retry_hint'))}</p>
    </div>`;
    return;
  }

  const base = currentFilter
    ? allOrders.filter(o => o.status === currentFilter)
    : allOrders.filter(o => o.status !== 'arrived');
  const filtered = base;

  document.getElementById('order-count').textContent = `${t('count_pfx')}${filtered.length}${t('count_sfx')}`;

  if (!filtered.length) {
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">🚚</div>
      <p class="text-gray-400">${t('no_orders')}</p>
    </div>`;
    return;
  }

  el.innerHTML = filtered.map(o => {
    const tr = MY_TRANSITIONS[o.status];
    const actionBtn = tr ? `<button onclick="quickUpdate('${o.id}','${o.status}','${tr.next}',${tr.requireTracking})"
            class="px-3 py-1.5 text-xs bg-hg text-white rounded-lg hover:bg-gg whitespace-nowrap">
      ${trLabel(tr)}
    </button>` : '';
    const doneBadge = o.status === 'arrived'
      ? `<span class="inline-flex items-center gap-1 text-xs text-teal-700 bg-teal-50 border border-teal-200 px-2 py-1 rounded-lg">${t('delivered_wait')}</span>`
      : '';
    return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-3">
      <div class="flex items-start justify-between mb-3">
        <div>
          <div class="font-mono font-bold text-hg text-sm">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-xs mt-0.5">${esc(o.stores?.name)} · ${fmtDate(o.updated_at)}</div>
        </div>
        ${badge(o.status)}
      </div>
      <div class="text-sm text-gray-700 mb-1">${esc(o.customers?.name)} · ${esc(o.customers?.phone)}</div>
      ${o.customers?.address ? `<div class="text-xs text-gray-400 mb-1">${esc(o.customers.address)}</div>` : ''}
      ${o.tracking_no ? `<div class="text-xs text-orange-600 font-mono mb-2">${esc(o.tracking_no)}</div>` : ''}
      ${o.suppliers?.name ? `<div class="text-xs text-gray-400 mb-2">${t('from_prefix')}${esc(o.suppliers.name)}</div>` : ''}
      ${doneBadge ? `<div class="mb-2">${doneBadge}</div>` : ''}
      <div class="flex items-center justify-between mt-3">
        <span class="font-bold text-hg text-sm">${fmtAmt(o.amount)}</span>
        <div class="flex gap-2">
          <button onclick="openDetail('${o.id}')"
                  class="px-3 py-1.5 text-xs border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
            ${t('detail_btn')}
          </button>
          ${actionBtn}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function quickUpdate(orderId, curStatus, newStatus, requireTracking) {
  let trackingNo = null;
  if (requireTracking) {
    trackingNo = prompt(t('ph_tracking_required'));
    if (!trackingNo || !trackingNo.trim()) { alert(t('err_tracking_required')); return; }
    trackingNo = trackingNo.trim();
  }
  const notes = prompt(t('ph_update_notes').replace('{label}', stLabel(newStatus)));
  if (notes === null) return;

  const update = { status: newStatus };
  if (trackingNo) update.tracking_no = trackingNo;
  const { error } = await sb.from('orders').update(update).eq('id', orderId);
  if (error) { alert(t('err_update_failed') + error.message); return; }

  const logNotes = [trackingNo ? `${t('tracking_prefix')}${trackingNo}` : null, notes || null].filter(Boolean).join(' | ');
  await sb.from('order_logs').insert({
    order_id: orderId, status: newStatus,
    operator_id: profile.id,
    operator_role: 'logistics',
    operator_name: profile.name,
    notes: logNotes || null,
  });
  await loadOrders();
}

async function openDetail(id) {
  window.__lastDetailId = id;
  show('v-detail');
  document.getElementById('detail-content').innerHTML =
    `<div class="text-center py-10 text-gray-400">${t('loading')}</div>`;

  const { data: o } = await sb.from('orders')
    .select('*, stores(name), customers(name,phone,address), suppliers(name,phone)')
    .eq('id', id).single();

  const { data: logs } = await sb.from('order_logs')
    .select('*').eq('order_id', id).order('created_at', { ascending: true });

  const logsHtml = (logs || []).map((l, i, arr) => {
    const isLast = i === arr.length - 1;
    const statusInfo = STATUS[l.status];
    const cls = statusInfo?.cls || 'bg-gray-100 text-gray-500';
    return `<div class="flex gap-3">
      <div class="flex flex-col items-center flex-shrink-0 w-4">
        <div class="w-2.5 h-2.5 rounded-full ${isLast ? 'bg-hg' : 'bg-gray-300'} mt-0.5"></div>
        ${!isLast ? '<div class="w-px bg-gray-200 flex-1 my-1 mx-auto"></div>' : ''}
      </div>
      <div class="pb-3 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs px-2 py-0.5 rounded-full font-medium ${cls}">${stLabel(l.status)}</span>
          <span class="text-gray-400 text-xs">${fmtDateTime(l.created_at)}</span>
        </div>
        ${l.notes ? `<p class="text-gray-600 text-sm mt-0.5">${esc(l.notes)}</p>` : ''}
        <p class="text-gray-400 text-xs">${esc(l.operator_name)} · ${esc(l.operator_role)}</p>
      </div>
    </div>`;
  }).join('');

  const tr = MY_TRANSITIONS[o?.status];
  const trackingInput = (tr && tr.requireTracking) ? `
    <div class="mb-3">
      <label class="block text-xs font-medium text-gray-600 mb-1">${t('lbl_tracking')} <span class="text-red-500">${t('required_mark')}</span></label>
      <input type="text" id="det-tracking" placeholder="${t('ph_required')}"
             class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-hg">
    </div>` : '';

  const updateSection = tr ? `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-3">${t('section_update')}</h3>
      ${trackingInput}
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-600 mb-1">${t('lbl_notes')}</label>
        <input type="text" id="det-notes" placeholder="${t('ph_notes_optional')}"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-hg">
      </div>
      <button onclick="updateFromDetail('${o.id}','${o.status}','${tr.next}',${tr.requireTracking})"
              class="w-full py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg transition text-sm">
        ${trLabel(tr)}
      </button>
      <p id="det-msg" class="text-green-600 text-sm mt-2 text-center hidden">${t('updated_ok')}</p>
    </div>` : '';

  document.getElementById('detail-content').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div class="font-mono font-bold text-hg text-xl">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-sm">${esc(o.stores?.name)}</div>
        </div>
        ${badge(o.status)}
      </div>
      <div class="space-y-2 text-sm">
        <div><span class="text-gray-400">${t('lbl_customer')}</span> <span class="font-medium">${esc(o.customers?.name)}</span></div>
        <div><span class="text-gray-400">${t('lbl_phone')}</span> <span>${esc(o.customers?.phone)}</span></div>
        ${o.customers?.address ? `<div><span class="text-gray-400">${t('lbl_address')}</span> <span>${esc(o.customers.address)}</span></div>` : ''}
        <div><span class="text-gray-400">${t('lbl_amount')}</span> <span class="font-bold text-hg">${fmtAmt(o.amount)}</span></div>
        ${o.suppliers?.name ? `<div><span class="text-gray-400">${t('lbl_from_supplier')}</span> <span>${esc(o.suppliers.name)}</span></div>` : ''}
        ${o.tracking_no ? `<div><span class="text-gray-400">${t('lbl_tracking')}</span> <span class="font-mono font-medium text-orange-600">${esc(o.tracking_no)}</span></div>` : ''}
        ${o.logistics_notes ? `<div><span class="text-gray-400">${t('lbl_logistics_notes')}</span> <span>${esc(o.logistics_notes)}</span></div>` : ''}
      </div>
      ${o.description ? `<p class="mt-3 text-sm text-gray-600 border-t pt-3">${esc(o.description)}</p>` : ''}
    </div>

    ${updateSection}

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
      <h3 class="font-semibold text-gray-800 mb-4">${t('section_log')}</h3>
      ${logsHtml || `<p class="text-gray-400 text-sm">${t('no_logs')}</p>`}
    </div>`;
}

async function updateFromDetail(id, curStatus, newStatus, requireTracking) {
  const trackingEl = document.getElementById('det-tracking');
  const trackingNo = trackingEl ? trackingEl.value.trim() : '';
  const notes = document.getElementById('det-notes')?.value.trim() || '';

  if (requireTracking && !trackingNo) { alert(t('err_tracking_required')); return; }

  const update = { status: newStatus };
  if (trackingNo) update.tracking_no = trackingNo;
  const { error } = await sb.from('orders').update(update).eq('id', id);
  if (error) { alert(t('err_update_failed') + error.message); return; }

  const logNotes = [trackingNo ? `${t('tracking_prefix')}${trackingNo}` : null, notes || null].filter(Boolean).join(' | ');
  await sb.from('order_logs').insert({
    order_id: id, status: newStatus,
    operator_id: profile.id,
    operator_role: 'logistics',
    operator_name: profile.name,
    notes: logNotes || null,
  });

  document.getElementById('det-msg').classList.remove('hidden');
  setTimeout(() => document.getElementById('det-msg').classList.add('hidden'), 2000);
  await loadOrders();
  openDetail(id);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
