function _loc(){ return ({'en':'en-MY','zh-CN':'zh-CN','zh-TW':'zh-TW','ms':'ms-MY','th':'th-TH'})[CL]||'en-MY'; }

// 转义用户/数据库字符串后再拼进 innerHTML，防止 XSS
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtAmt(v) {
  const n = Number(v);
  if (v == null || !isFinite(n)) return 'RM —';
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString(_loc(), { year:'numeric', month:'short', day:'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleString(_loc(), { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function searchOrders() {
  const raw = document.getElementById('phone-in').value.trim().replace(/[\s\-\(\)]/g, '');
  if (!raw) { showErr(ct('err_no_phone')); return; }
  const countryCode = document.getElementById('country-code').value;
  const localNum = raw.replace(/^0+/, '');
  const phone = countryCode + localNum;

  const btn = document.getElementById('search-btn');
  const err = document.getElementById('phone-err');
  btn.textContent = ct('searching'); btn.disabled = true; err.classList.add('hidden');

  // 用「区号+本地号」做唯一规范查询。
  // 不再在结果为空时回退到裸号码：裸号码会跨区号匹配，
  // 可能返回另一位客户的订单(隐私泄露)。只有首次查询真正报错(网络/服务异常)
  // 时才用裸号码重试一次,空结果属正常的「无此订单」,不重试。
  let { data, error } = await sb.rpc('get_orders_by_phone', { p_phone: phone });
  if (error) {
    const r2 = await sb.rpc('get_orders_by_phone', { p_phone: localNum });
    if (!r2.error) { data = r2.data; error = null; }
  }
  btn.textContent = ct('btn_search'); btn.disabled = false;

  if (error) { showErr(ct('err_query_fail')); return; }

  myPhone = phone;
  myOrders = data || [];
  renderOrders();
  show('s-orders');
}

function renderCustomerWarranty(o, logs) {
  if (!['after_sales','completed'].includes(o.status)) return '';
  // 质保起始时间：after_sales 日志 → 签名时间 → 完成时间 → 创建时间（老单无日志也能显示）
  const startLog = (logs || []).find(l => l.status === 'after_sales');
  const wStartIso = startLog?.created_at || o.signed_at || o.completed_at || o.created_at;
  if (!wStartIso) return '';

  let warrantyData = null;
  if (o.warranty_info) {
    try { warrantyData = JSON.parse(o.warranty_info); } catch(e) {}
  }
  if (!warrantyData || warrantyData.length === 0) {
    warrantyData = [{
      seriesId:'generic', seriesName:ct('generic_series'), icon:'🛡️', startIso: wStartIso,
      components:[{ name:ct('generic_comp'), years:1 }],
    }];
  }

  // 到期日一律按「真实质保起始 = 客户签收时间」+ 各部件年限重算（按日历年），
  // 不依赖 warranty_info 里存的旧 endIso（可能锚定下单时间）
  const _wStart = new Date(wStartIso);
  warrantyData.forEach(s => {
    s.startIso = wStartIso;
    s.components.forEach(c => {
      const e = new Date(_wStart);
      e.setFullYear(e.getFullYear() + Number(c.years || 1));
      c.endIso = e.toISOString();
    });
  });
  // 总质保期 = 所有部件中最长年限
  const _maxYears = Math.max(1, ...warrantyData.flatMap(s => s.components.map(c => Number(c.years || 1))));
  const _totEnd = new Date(_wStart);
  _totEnd.setFullYear(_totEnd.getFullYear() + _maxYears);

  const now = Date.now();
  const allExpired = warrantyData.every(s => s.components.every(c => new Date(c.endIso).getTime() < now));
  const borderClr  = allExpired ? '#dc2626' : '#1e40af';

  const seriesHtml = warrantyData.map(series => {
    const maxEndMs  = Math.max(...series.components.map(c => new Date(c.endIso).getTime()));
    const sExp      = maxEndMs < now;
    const rows = series.components.map(comp => {
      const expired = new Date(comp.endIso).getTime() < now;
      const dot     = expired
        ? `<span style="color:#dc2626;font-size:10px;font-weight:600">${ct('expired')}</span>`
        : `<span style="color:#16a34a;font-size:10px;font-weight:600">${ct('in_warranty')}</span>`;
      return `<tr>
        <td style="padding:4px 8px;font-size:12px;color:#374151">${esc(wname(comp.name))}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center;color:#6b7280">${esc(comp.years)} ${ct('years')}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center;color:#6b7280">${esc(String(comp.endIso).slice(0,10))}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center">${dot}</td>
      </tr>`;
    }).join('');
    return `<div class="mb-3">
      <div class="flex items-center gap-1 mb-1">
        <span>${esc(series.icon)}</span>
        <span style="font-size:13px;font-weight:600;color:#1e3a5f">${esc(wname(series.seriesName))}</span>
        <span style="font-size:10px;color:${sExp?'#dc2626':'#16a34a'};margin-left:4px">${sExp?ct('expired'):ct('in_warranty')}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;border:1px solid #e5e7eb">
        <thead>
          <tr style="background:#f9fafb">
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:left;font-weight:500">${ct('th_part')}</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">${ct('th_period')}</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">${ct('th_expiry')}</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">${ct('th_status')}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  _wcStash = {
    orderNo: o.order_no || '',
    store:   o.store_name || '',
    startDate: new Date(wStartIso).toLocaleDateString(),
    maxYears: _maxYears,
    totEnd:  _totEnd.toISOString().slice(0,10),
    series:  warrantyData.map(s => ({
      name: wname(s.seriesName), icon: s.icon,
      comps: s.components.map(c => ({ name: wname(c.name), years: c.years })),
    })),
  };

  return `<div class="bg-white rounded-xl shadow-sm p-5 mb-4" style="border-left:3px solid ${borderClr}">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-lg">${allExpired ? '⚠️' : '🛡️'}</span>
      <h3 class="font-semibold text-gray-800">${ct('warranty_title')}</h3>
      <span class="text-xs px-2 py-0.5 rounded-full ml-auto"
            style="background:${allExpired?'#fef2f2':'#eff6ff'};color:${borderClr};border:1px solid ${borderClr}33">
        ${allExpired ? ct('all_expired') : ct('w_active')}
      </span>
    </div>
    <div class="rounded-lg px-3 py-2 mb-3" style="background:#eff6ff;border:1px solid #1e40af22">
      <div style="font-size:13px;font-weight:700;color:#1e3a5f">${ct('total_warranty')} ${_maxYears} ${ct('years')}</div>
      <div style="font-size:11px;color:#6b7280;margin-top:2px">${ct('w_start')} ${new Date(wStartIso).toLocaleDateString(_loc())} · ${ct('w_until')} ${_totEnd.toISOString().slice(0,10)} ${ct('w_seedetail')}</div>
    </div>
    ${seriesHtml}
    <button onclick="genWarrantyCard()"
      class="w-full mt-3 py-2.5 rounded-lg text-sm font-bold"
      style="background:linear-gradient(135deg,#1A3A2A,#2D5E43);color:#C8A96E;letter-spacing:1px">
      ${ct('gen_card')}
    </button>
    <p class="text-xs text-gray-400 text-center mt-2">${ct('warranty_help')}</p>
  </div>`;
}

async function openDetail(id) {

  // 以服务器最新 status 为准(缓存列表可能已过期),签收面板按最新状态判断
  const freshStatus = freshOrder?.status || o.status;

  // 用最新数据更新本地缓存，防止重新搜索后签名状态丢失
  if (freshOrder) {

    if (freshOrder.signed_by)     o.signed_by     = freshOrder.signed_by;

  // 进度记录：只显示状态名 + 时间，不显示备注和操作人
  const _logItems = (logs || []).map((l, i, arr) => {
    const isLast = i === arr.length - 1;
    return `
    <div class="flex gap-3">
      <div class="flex flex-col items-center flex-shrink-0 w-5">
        <div class="w-3 h-3 rounded-full ${isLast ? 'bg-hg' : 'bg-gray-300'} mt-0.5"></div>

  const _LOG_LIMIT = 3;
  const _logVis  = _logItems.slice(0, _LOG_LIMIT).join('');

  const dispStep = sInfo.disp ?? 0;
  // 终态(已取消/已关闭):不画进度条、不高亮任何步骤,显示明确的终止徽标
  const isClosedTerminal = sInfo.term === true;
  // after_sales 视作已完成进度满格;completed 同理
  const isDone = o.status === 'completed' || o.status === 'after_sales';
  const progressPct = isClosedTerminal ? 0 : isDone ? 100 : Math.round(((dispStep + 1) / 7) * 100);
  const progressBar = isClosedTerminal ? `

                   <button onclick="submitDwgSig('${id}','${dw.supplier_id}')" class="flex-none py-1.5 px-4 text-xs bg-hg text-white font-semibold rounded-lg">${itx('dwg_confirm')}</button>

      <p class="text-xs text-gray-400 mt-1">${itx('dwg_tip')}</p>
    </div>` : '';

  document.getElementById('detail-content').innerHTML = `

    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">

// 复用现有签名风格的小画板（多个共存，按 supplier_id 区分）
let _dwgSigs = {};
function _initDwgSigOn(canvas){
  const dpr = window.devicePixelRatio||1;
  const r = canvas.getBoundingClientRect();
  canvas.width  = r.width  * dpr;
  canvas.height = r.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr); ctx.strokeStyle='#1a3a2a'; ctx.lineWidth=2; ctx.lineCap='round';
  const s = { canvas, ctx, pen:false, has:false };
  const pos = e => { const b=canvas.getBoundingClientRect(); return [(e.clientX-b.left),(e.clientY-b.top)]; };
  canvas.addEventListener('mousedown', e=>{ s.pen=true; s.has=true; ctx.beginPath(); ctx.moveTo(...pos(e)); });
  canvas.addEventListener('mousemove', e=>{ if(!s.pen) return; ctx.lineTo(...pos(e)); ctx.stroke(); });
  canvas.addEventListener('mouseup',   ()=>{ s.pen=false; });
  canvas.addEventListener('mouseleave',()=>{ s.pen=false; });
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); s.pen=true; s.has=true; ctx.beginPath(); ctx.moveTo(...pos(e.touches[0])); }, {passive:false});
  canvas.addEventListener('touchmove',  e=>{ e.preventDefault(); if(!s.pen) return; ctx.lineTo(...pos(e.touches[0])); ctx.stroke(); }, {passive:false});
  canvas.addEventListener('touchend',   ()=>{ s.pen=false; });
  return s;
}
function clearDwgSig(supId){
  const s=_dwgSigs[supId]; if(!s) return;
  s.ctx.setTransform(1,0,0,1,0,0);
  s.ctx.clearRect(0,0,s.canvas.width,s.canvas.height);
  s.ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  s.ctx.strokeStyle='#1a3a2a'; s.ctx.lineWidth=2; s.ctx.lineCap='round';
  s.has=false;
}
async function submitDwgSig(orderId, supId){
  const s=_dwgSigs[supId];
  if(!s || !s.has){ alert(ct('err_sign_first')||'请先签名'); return; }
  await custDrawingConfirm(orderId, supId, s.canvas.toDataURL('image/png'));
}

let _sigCanvas, _sigCtx, _sigPen = false, _sigHasContent = false;

function initSigCanvas() {
  _sigCanvas = document.getElementById('sig-canvas');
  if (!_sigCanvas) return;
  _sigHasContent = false;
  const dpr = window.devicePixelRatio || 1;
  const r = _sigCanvas.getBoundingClientRect();
  _sigCanvas.width  = r.width  * dpr;
  _sigCanvas.height = r.height * dpr;
  _sigCtx = _sigCanvas.getContext('2d');
  _sigCtx.scale(dpr, dpr);
  _sigCtx.strokeStyle = '#1a3a2a';
  _sigCtx.lineWidth   = 2.5;
  _sigCtx.lineCap     = 'round';
  _sigCtx.lineJoin    = 'round';

  function pos(e) {
    const b = _sigCanvas.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  }
  _sigCanvas.addEventListener('mousedown', e => { _sigPen=true; _sigHasContent=true; _sigCtx.beginPath(); _sigCtx.moveTo(...pos(e)); });
  _sigCanvas.addEventListener('mousemove', e => { if (!_sigPen) return; _sigCtx.lineTo(...pos(e)); _sigCtx.stroke(); });
  _sigCanvas.addEventListener('mouseup',   () => _sigPen = false);
  _sigCanvas.addEventListener('mouseleave',() => _sigPen = false);
  _sigCanvas.addEventListener('touchstart', e => { e.preventDefault(); _sigPen=true; _sigHasContent=true; _sigCtx.beginPath(); _sigCtx.moveTo(...pos(e.touches[0])); }, {passive:false});
  _sigCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (!_sigPen) return; _sigCtx.lineTo(...pos(e.touches[0])); _sigCtx.stroke(); }, {passive:false});
  _sigCanvas.addEventListener('touchend',   () => _sigPen = false);
}

function clearSig() {
  if (_sigCtx) { _sigCtx.clearRect(0, 0, _sigCanvas.width, _sigCanvas.height); _sigHasContent = false; }
}

async function custDrawingConfirm(orderId, supId, signDataUrl) {
  const { data, error } = await sb.rpc('drawing_customer_confirm',
    { p_order_id: orderId, p_phone: myPhone, p_supplier_id: supId,
      p_sign_image: signDataUrl || null });
  if (error) { alert(error.message); return; }
  if (!data || !data.ok) { alert((data && data.message) || ct('submit_fail')); return; }
  openDetail(orderId);
}

async function submitSig(orderId) {
  if (!_sigCanvas || !_sigHasContent) {
    const e = document.getElementById('sig-err');
    if (e) { e.textContent = ct('err_sign_first'); e.classList.remove('hidden'); }
    return;
  }
  const dataURL = _sigCanvas.toDataURL('image/png');
  const btn = event?.currentTarget;
  if (btn) { btn.textContent = ct('submitting'); btn.disabled = true; }

  const { data, error } = await sb.rpc('customer_submit_signature', {
    p_order_id:   orderId,
    p_phone:      myPhone,
    p_sign_image: dataURL,
  });

  if (error || !data) {
    if (btn) { btn.textContent = ct('confirm_sig'); btn.disabled = false; }
    const e = document.getElementById('sig-err');
    // 签收失败且本单未付清 → 多半是尾款未结清（Step C·乙 服务端关卡）
    const ord = myOrders.find(x => x.id === orderId);
    const msg = (!error && ord && ord.payment_status !== 'paid')
      ? itx('pay_first')
      : (error?.message || ct('submit_fail'));
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
    return;
  }

  const o = myOrders.find(x => x.id === orderId);
  if (o) o.sign_image = dataURL;
  openDetail(orderId);
}

// ── 一键生成质保卡（HOUZY VI 色，可保存发朋友圈）──
function _wcEsc(s){ return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

async function genWarrantyCard() {
  if (!_wcStash) { alert(ct('card_notready')); return; }
  const d = _wcStash;
  // 汇总部件（最多 9 条，保持卡面精致）
  const comps = [];

  const top = comps.slice(0, 9);
  const rowsHtml = top.map(c => `

  card.style.cssText = 'position:fixed;left:-9999px;top:0;width:390px;font-family:\'PingFang SC\',\'Noto Sans SC\',sans-serif';
  card.innerHTML = `
    <div style="background:linear-gradient(160deg,#1A3A2A 0%,#22432F 55%,#1A3A2A 100%);padding:30px 26px 26px;color:#F5F2ED;position:relative">
      <div style="border:1.5px solid rgba(200,169,110,0.55);border-radius:14px;padding:24px 20px">
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:800;letter-spacing:3px;color:#C8A96E">HOUZY HOME</div>
          <div style="font-size:11px;letter-spacing:4px;color:#9db5a3;margin-top:3px">${_wcEsc(ct('card_brandsub'))}</div>
          <div style="width:46px;height:2px;background:#C8A96E;margin:13px auto"></div>
          <div style="font-size:16px;font-weight:700;letter-spacing:2px;color:#F5F2ED">${_wcEsc(ct('card_title'))}</div>
          <div style="font-size:9px;letter-spacing:3px;color:#9db5a3;margin-top:3px">${_wcEsc(ct('card_sub'))}</div>
        </div>
        <div style="text-align:center;margin:20px 0 16px">
          <div style="font-size:12px;color:#9db5a3;letter-spacing:1px">${_wcEsc(ct('card_maxlabel'))}</div>
          <div style="font-size:48px;font-weight:800;color:#C8A96E;line-height:1.1">${_wcEsc(d.maxYears)}<span style="font-size:20px;margin-left:4px">${_wcEsc(ct('years'))}</span></div>
          <div style="font-size:11px;color:#9db5a3;margin-top:2px">${_wcEsc(ct('card_until'))} ${_wcEsc(d.totEnd)}</div>
        </div>
        <div style="background:rgba(0,0,0,0.16);border-radius:10px;padding:6px 14px 10px;margin-bottom:16px">
          ${rowsHtml}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#9db5a3;letter-spacing:0.5px">
          <span>${_wcEsc(ct('card_order'))} ${_wcEsc(d.orderNo)}</span><span>${_wcEsc(ct('card_from'))} ${_wcEsc(d.startDate)}</span>
        </div>
        <div style="text-align:center;margin-top:18px">
          <div style="font-size:12.5px;color:#F5F2ED;letter-spacing:1px;line-height:1.85;padding:0 6px">
            ${ct('card_thanks1')}<br>
            <span style="color:#E0C992">${ct('card_thanks2')}</span>
          </div>
          <div style="width:40px;height:1.5px;background:rgba(200,169,110,0.5);margin:14px auto"></div>
          <div style="font-size:14px;font-weight:700;color:#C8A96E;letter-spacing:3px">${_wcEsc(ct('slogan'))}</div>
          <div style="font-size:9px;color:#9db5a3;letter-spacing:2px;margin-top:4px">${_wcEsc(ct('slogan_sub'))}</div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(card);

  try {
    const canvas = await html2canvas(card.firstElementChild, { scale: 2, useCORS: true, backgroundColor: null, logging: false });
    const url = canvas.toDataURL('image/png');
    document.body.removeChild(card);
    showCardOverlay(url, d.orderNo);
  } catch (e) {
    if (card.parentNode) document.body.removeChild(card);
    alert(ct('card_fail'));
  }
}

function showCardOverlay(url, orderNo) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:auto';

         style="padding:9px 18px;background:#C8A96E;color:#1A3A2A;font-weight:700;font-size:13px;border-radius:8px;text-decoration:none">${_wcEsc(ct('ov_download'))}</a>

         style="padding:9px 18px;background:rgba(255,255,255,0.15);color:#fff;font-size:13px;border:none;border-radius:8px">${_wcEsc(ct('ov_close'))}</button>

  document.body.appendChild(ov);
}
