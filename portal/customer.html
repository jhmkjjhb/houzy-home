<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

let myPhone = '', myOrders = [];

// step  = real progress index (drives % bar)
// disp  = which CORE_STEPS indicator this status highlights (0..6)
// term  = terminal state (cancelled/closed): no progress bar, no step highlight
const STATUS = {
  pending_payment:    { label:'待付款', cls:'bg-yellow-100 text-yellow-800', step:0, disp:0 },
  paid:               { label:'已付款', cls:'bg-blue-100 text-blue-700',    step:1, disp:1 },
  assigned:           { label:'已派单', cls:'bg-blue-100 text-blue-700',    step:1, disp:1 },
  accepted:           { label:'工厂接单',cls:'bg-violet-100 text-violet-700',step:2, disp:2 },
  in_production:      { label:'生产中', cls:'bg-violet-100 text-violet-700',step:2, disp:2 },
  production_complete:{ label:'生产完成',cls:'bg-indigo-100 text-indigo-700',step:2, disp:2 },
  shipped:            { label:'已发货', cls:'bg-orange-100 text-orange-700',step:3, disp:3 },
  in_transit:         { label:'运输中', cls:'bg-orange-100 text-orange-700',step:3, disp:3 },
  arrived:            { label:'已到货', cls:'bg-teal-100 text-teal-700',    step:4, disp:4 },
  installing:         { label:'安装中', cls:'bg-teal-100 text-teal-700',    step:5, disp:5 },
  completed:          { label:'已完成', cls:'bg-green-100 text-green-700',  step:6, disp:6 },
  after_sales:        { label:'质保服务',cls:'bg-blue-100 text-blue-700',   step:6, disp:6 },
  closed:             { label:'已关闭', cls:'bg-gray-100 text-gray-500',    step:-1, disp:-1, term:true },
  cancelled:          { label:'已取消', cls:'bg-red-100 text-red-700',      step:-1, disp:-1, term:true },
};
const CORE_STEPS = ['pending_payment','paid','in_production','shipped','arrived','installing','completed'];

function show(id) {
  ['s-phone','s-orders','s-detail'].forEach(s =>
    document.getElementById(s).classList.toggle('hidden', s !== id)
  );
}

function badge(status) {
  const s = STATUS[status] || { label: status, cls: 'bg-gray-100 text-gray-600' };
  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${s.cls}">${esc(s.label)}</span>`;
}

// 转义用户/数据库字符串后再拼进 innerHTML，防止 XSS
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtAmt(v) {
  const n = Number(v);
  if (v == null || !isFinite(n)) return 'RM —';
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('zh-CN', { year:'numeric', month:'short', day:'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function searchOrders() {
  const raw = document.getElementById('phone-in').value.trim().replace(/[\s\-\(\)]/g, '');
  if (!raw) { showErr('请输入手机号码'); return; }
  const countryCode = document.getElementById('country-code').value;
  const localNum = raw.replace(/^0+/, '');
  const phone = countryCode + localNum;

  const btn = document.getElementById('search-btn');
  const err = document.getElementById('phone-err');
  btn.textContent = '查询中...'; btn.disabled = true; err.classList.add('hidden');

  // 用「区号+本地号」做唯一规范查询。
  // 不再在结果为空时回退到裸号码：裸号码会跨区号匹配，
  // 可能返回另一位客户的订单(隐私泄露)。只有首次查询真正报错(网络/服务异常)
  // 时才用裸号码重试一次,空结果属正常的「无此订单」,不重试。
  let { data, error } = await sb.rpc('get_orders_by_phone', { p_phone: phone });
  if (error) {
    const r2 = await sb.rpc('get_orders_by_phone', { p_phone: localNum });
    if (!r2.error) { data = r2.data; error = null; }
  }
  btn.textContent = '查询订单'; btn.disabled = false;

  if (error) { showErr('查询失败，请稍后再试'); return; }

  myPhone = phone;
  myOrders = data || [];
  renderOrders();
  show('s-orders');
}

function showErr(msg) {
  const e = document.getElementById('phone-err');
  e.textContent = msg; e.classList.remove('hidden');
}

function renderOrders() {
  const el = document.getElementById('orders-list');
  if (!myOrders.length) {
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-5xl mb-3">📦</div>
      <p class="text-gray-500 font-medium">未找到相关订单</p>
      <p class="text-gray-400 text-sm mt-1">请确认手机号码，或联系我们</p>
      <a href="https://wa.me/60105898786" target="_blank"
         class="inline-block mt-4 px-5 py-2 bg-green-500 text-white text-sm rounded-lg">
        WhatsApp 联系客服
      </a>
    </div>`;
    return;
  }
  el.innerHTML = myOrders.map(o => `
    <div onclick="openDetail('${o.id}')"
         class="bg-white rounded-xl shadow-sm p-5 mb-3 cursor-pointer hover:shadow-md transition-shadow border border-gray-100 active:scale-[0.99]">
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="font-mono font-bold text-hg text-sm">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-xs mt-0.5">${esc(o.store_name)} · ${fmtDate(o.created_at)}</div>
        </div>
        ${badge(o.status)}
      </div>
      ${o.description ? `<p class="text-gray-600 text-sm mb-3 line-clamp-2">${esc(o.description)}</p>` : ''}
      <div class="flex items-center justify-between pt-2 border-t border-gray-50">
        <span class="font-bold text-hg">${fmtAmt(o.amount)}</span>
        <span class="text-gray-400 text-xs flex items-center gap-1">
          查看进度
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </span>
      </div>
    </div>`).join('');
}

function renderCustomerWarranty(o, logs) {
  if (!['after_sales','completed'].includes(o.status)) return '';
  const startLog = (logs || []).find(l => l.status === 'after_sales');
  if (!startLog) return '';

  let warrantyData = null;
  if (o.warranty_info) {
    try { warrantyData = JSON.parse(o.warranty_info); } catch(e) {}
  }
  if (!warrantyData || warrantyData.length === 0) {
    warrantyData = [{
      seriesId:'generic', seriesName:'产品质保', icon:'🛡️', startIso: startLog.created_at,
      components:[{ name:'整体产品', years:1 }],
    }];
  }

  // 到期日一律按「真实质保起始 = 客户签收时间」+ 各部件年限重算（按日历年），
  // 不依赖 warranty_info 里存的旧 endIso（可能锚定下单时间）
  const _wStart = new Date(startLog.created_at);
  warrantyData.forEach(s => {
    s.startIso = startLog.created_at;
    s.components.forEach(c => {
      const e = new Date(_wStart);
      e.setFullYear(e.getFullYear() + Number(c.years || 1));
      c.endIso = e.toISOString();
    });
  });
  // 总质保期 = 所有部件中最长年限
  const _maxYears = Math.max(1, ...warrantyData.flatMap(s => s.components.map(c => Number(c.years || 1))));
  const _totEnd = new Date(_wStart);
  _totEnd.setFullYear(_totEnd.getFullYear() + _maxYears);

  const now = Date.now();
  const allExpired = warrantyData.every(s => s.components.every(c => new Date(c.endIso).getTime() < now));
  const borderClr  = allExpired ? '#dc2626' : '#1e40af';

  const seriesHtml = warrantyData.map(series => {
    const maxEndMs  = Math.max(...series.components.map(c => new Date(c.endIso).getTime()));
    const sExp      = maxEndMs < now;
    const rows = series.components.map(comp => {
      const expired = new Date(comp.endIso).getTime() < now;
      const dot     = expired
        ? `<span style="color:#dc2626;font-size:10px;font-weight:600">已到期</span>`
        : `<span style="color:#16a34a;font-size:10px;font-weight:600">质保中</span>`;
      return `<tr>
        <td style="padding:4px 8px;font-size:12px;color:#374151">${esc(comp.name)}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center;color:#6b7280">${esc(comp.years)}年</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center;color:#6b7280">${esc(String(comp.endIso).slice(0,10))}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:center">${dot}</td>
      </tr>`;
    }).join('');
    return `<div class="mb-3">
      <div class="flex items-center gap-1 mb-1">
        <span>${esc(series.icon)}</span>
        <span style="font-size:13px;font-weight:600;color:#1e3a5f">${esc(series.seriesName)}</span>
        <span style="font-size:10px;color:${sExp?'#dc2626':'#16a34a'};margin-left:4px">${sExp?'已到期':'质保中'}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;border:1px solid #e5e7eb">
        <thead>
          <tr style="background:#f9fafb">
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:left;font-weight:500">配件</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">质保期</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">到期日</th>
            <th style="padding:4px 8px;font-size:11px;color:#6b7280;text-align:center;font-weight:500">状态</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  return `<div class="bg-white rounded-xl shadow-sm p-5 mb-4" style="border-left:3px solid ${borderClr}">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-lg">${allExpired ? '⚠️' : '🛡️'}</span>
      <h3 class="font-semibold text-gray-800">质保服务详情</h3>
      <span class="text-xs px-2 py-0.5 rounded-full ml-auto"
            style="background:${allExpired?'#fef2f2':'#eff6ff'};color:${borderClr};border:1px solid ${borderClr}33">
        ${allExpired ? '全部已到期' : '质保中'}
      </span>
    </div>
    <div class="rounded-lg px-3 py-2 mb-3" style="background:#eff6ff;border:1px solid #1e40af22">
      <div style="font-size:13px;font-weight:700;color:#1e3a5f">总质保期：最长 ${_maxYears} 年</div>
      <div style="font-size:11px;color:#6b7280;margin-top:2px">质保开始 ${new Date(startLog.created_at).toLocaleDateString()} · 最长保至 ${_totEnd.toISOString().slice(0,10)}（各部件年限见下表）</div>
    </div>
    ${seriesHtml}
    <p class="text-xs text-gray-400 text-center mt-2">如有质保问题，请联系客服</p>
  </div>`;
}

async function openDetail(id) {
  const o = myOrders.find(x => x.id === id);
  if (!o) return;
  document.getElementById('detail-content').innerHTML =
    `<div class="text-center py-10 text-gray-400">加载中…</div>`;
  show('s-detail');

  const [{ data: logs }, { data: freshOrder }] = await Promise.all([
    sb.rpc('get_order_timeline', { p_order_id: id, p_phone: myPhone }),
    sb.from('orders').select('status,sign_image,signed_at,signed_by,warranty_info').eq('id', id).single(),
  ]);

  // 以服务器最新 status 为准(缓存列表可能已过期),签收面板按最新状态判断
  const freshStatus = freshOrder?.status || o.status;

  // 用最新数据更新本地缓存，防止重新搜索后签名状态丢失
  if (freshOrder) {
    if (freshOrder.sign_image)    o.sign_image    = freshOrder.sign_image;
    if (freshOrder.signed_at)     o.signed_at     = freshOrder.signed_at;
    if (freshOrder.signed_by)     o.signed_by     = freshOrder.signed_by;
    if (freshOrder.warranty_info) o.warranty_info = freshOrder.warranty_info;
  }

  // 进度记录：只显示状态名 + 时间，不显示备注和操作人
  const logsHtml = (logs || []).map((l, i, arr) => {
    const st = STATUS[l.status] || { label: l.status };
    const isLast = i === arr.length - 1;
    return `
    <div class="flex gap-3">
      <div class="flex flex-col items-center flex-shrink-0 w-5">
        <div class="w-3 h-3 rounded-full ${isLast ? 'bg-hg' : 'bg-gray-300'} mt-0.5"></div>
        ${!isLast ? '<div class="w-0.5 bg-gray-200 flex-1 my-1"></div>' : ''}
      </div>
      <div class="pb-3 flex-1">
        <span class="font-medium text-sm text-gray-800">${esc(st.label)}</span>
        <span class="text-gray-400 text-xs ml-2">${fmtDateTime(l.created_at)}</span>
      </div>
    </div>`;
  }).join('');

  // Build progress bar + step timeline
  const sInfo    = STATUS[o.status] || { label:o.status, step:0, disp:0 };
  // dispStep = 该状态对应的「已展示核心步骤」序号(0..6),用于进度条 + 横向步骤高亮
  const dispStep = sInfo.disp ?? 0;
  // 终态(已取消/已关闭):不画进度条、不高亮任何步骤,显示明确的终止徽标
  const isClosedTerminal = sInfo.term === true;
  // after_sales 视作已完成进度满格;completed 同理
  const isDone = o.status === 'completed' || o.status === 'after_sales';
  const progressPct = isClosedTerminal ? 0 : isDone ? 100 : Math.round(((dispStep + 1) / 7) * 100);
  const progressBar = isClosedTerminal ? `
    <div class="mt-4 pt-4 border-t border-gray-100">
      <div class="rounded-lg px-4 py-3 text-center text-sm font-medium ${o.status==='cancelled' ? 'bg-red-50 text-red-700' : 'bg-gray-100 text-gray-500'}">
        ${o.status === 'cancelled' ? '此订单已取消' : '此订单已关闭'}
      </div>
    </div>` : `
    <div class="mt-4 pt-4 border-t border-gray-100">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs font-medium" style="color:#1a3a2a">${esc(sInfo.label)}</span>
        <span class="text-xs text-gray-400">${progressPct}%</span>
      </div>
      <div class="h-1.5 rounded-full bg-gray-100 mb-2">
        <div class="h-full rounded-full transition-all" style="width:${progressPct}%;background:#1a3a2a"></div>
      </div>
    </div>`;

  // Signature section for installing status — 用服务器最新 status 判断(防御缓存过期;
  // 服务器端 customer_submit_signature RPC 仍是最终权威)
  const signatureSection = freshStatus === 'installing' ? `
    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-1">安装签收确认</h3>
      ${o.sign_image
        ? `<p class="text-xs text-gray-400 mb-3">您已完成签收确认</p>
           <img src="${o.sign_image}" alt="电子签名" class="w-full max-w-xs mx-auto block border border-gray-200 rounded-lg">
           <p class="text-center text-green-600 text-sm font-medium mt-3">✓ 签名已提交</p>`
        : `<p class="text-sm text-gray-500 mb-3">请在下方手写签名，确认安装完成</p>
           <div class="relative rounded-lg overflow-hidden" style="border:2px dashed #d1d5db;background:#fafafa">
             <canvas id="sig-canvas" style="display:block;touch-action:none;width:100%;height:150px"></canvas>
             <span class="absolute bottom-2 right-3 text-xs text-gray-300 pointer-events-none select-none">在此签名</span>
           </div>
           <div class="flex gap-2 mt-3">
             <button onclick="clearSig()" class="flex-1 py-2 text-sm border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition">清除</button>
             <button onclick="submitSig('${o.id}')" class="flex-none py-2 px-5 text-sm bg-hg text-white font-semibold rounded-lg hover:bg-green-900 transition">确认签名</button>
           </div>
           <p id="sig-err" class="text-red-500 text-xs mt-2 hidden"></p>`
      }
    </div>` : '';

  // Horizontal step timeline
  const stepTimeline = `
    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-4">订单状态</h3>
      <div class="overflow-x-auto pb-1 -mx-1 px-1">
        <div class="flex items-start min-w-max gap-0">
          ${CORE_STEPS.map((s, i) => {
            // 终态不点亮任何步骤;否则按 disp(已展示核心步骤序号)判断 已完成/当前
            const done    = !isClosedTerminal && (i < dispStep || isDone);
            const current = !isClosedTerminal && !isDone && i === dispStep;
            const log     = (logs || []).find(l => (STATUS[l.status]?.disp ?? -1) === i);
            let bg, color, icon;
            if (done)         { bg='#1a3a2a'; color='#fff'; icon='✓'; }
            else if (current) { bg='#c8a96e'; color='#fff'; icon='●'; }
            else              { bg='#f3f4f6'; color='#9ca3af'; icon=String(i+1); }
            const timeText = done && log ? fmtDateTime(log.created_at) : current && log ? fmtDateTime(log.created_at) : '';
            const connector = i < CORE_STEPS.length - 1
              ? `<div class="flex-shrink-0 w-3" style="height:2px;background:${done?'#1a3a2a':'#e5e7eb'};margin-top:20px;align-self:flex-start"></div>`
              : '';
            return `<div class="flex flex-col items-center flex-shrink-0" style="min-width:60px">
                      <div class="flex flex-col items-center gap-1 rounded-xl px-2 py-2 w-14 text-xs font-medium"
                           style="background:${bg};color:${color};border:2px solid ${current?'#1a3a2a':'transparent'}">
                        <span class="text-sm leading-none">${icon}</span>
                        <span class="leading-tight text-center" style="font-size:10px;word-break:keep-all">${esc(STATUS[s].label)}</span>
                      </div>
                      <span class="text-center mt-0.5 px-0.5" style="font-size:9px;color:#9ca3af;min-width:60px;word-break:break-all">${timeText}</span>
                    </div>${connector}`;
          }).join('')}
        </div>
      </div>
      ${o.status === 'after_sales' ? `<div class="mt-3 text-xs text-blue-600 font-medium">质保服务中</div>` : ''}
      ${o.status === 'closed'      ? `<div class="mt-3 text-xs text-gray-400">订单已关闭</div>` : ''}
      ${o.status === 'cancelled'   ? `<div class="mt-3 text-xs text-red-600 font-medium">订单已取消</div>` : ''}
    </div>`;

  document.getElementById('detail-content').innerHTML = `
    <!-- Info card -->
    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div class="font-mono font-bold text-hg text-lg">${esc(o.order_no)}</div>
          <div class="text-gray-400 text-sm">${esc(o.store_name)}</div>
        </div>
        ${badge(o.status)}
      </div>
      ${o.description ? `<p class="text-gray-600 text-sm pb-3 mb-3 border-b border-gray-100">${esc(o.description)}</p>` : ''}
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-500">订单金额</span>
          <span class="font-bold text-hg text-base">${fmtAmt(o.amount)}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">支付状态</span>
          <span class="font-medium ${o.payment_status === 'paid' ? 'text-green-600' : 'text-red-500'}">
            ${o.payment_status === 'paid' ? '已支付 ✓' : '待支付'}
          </span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">创建时间</span>
          <span class="text-gray-700">${fmtDate(o.created_at)}</span>
        </div>
        ${o.completed_at ? `<div class="flex justify-between">
          <span class="text-gray-500">完成时间</span>
          <span class="text-gray-700">${fmtDate(o.completed_at)}</span>
        </div>` : ''}
      </div>
      ${progressBar}
    </div>

    ${stepTimeline}

    ${signatureSection}

    <!-- Timeline log -->
    <div class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-4">进度记录</h3>
      ${logsHtml || '<p class="text-gray-400 text-sm">暂无进度记录</p>'}
    </div>

    ${renderCustomerWarranty(o, logs)}

    <!-- WhatsApp CTA -->
    <a href="https://wa.me/60105898786?text=${encodeURIComponent('您好，我想查询订单 ' + o.order_no + ' 的状态')}"
       target="_blank"
       class="flex items-center justify-center gap-2 w-full py-3.5 bg-green-500 text-white font-semibold rounded-xl hover:bg-green-600 transition text-sm">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      WhatsApp 联系客服
    </a>`;

  initSigCanvas();
}

let _sigCanvas, _sigCtx, _sigPen = false, _sigHasContent = false;

function initSigCanvas() {
  _sigCanvas = document.getElementById('sig-canvas');
  if (!_sigCanvas) return;
  _sigHasContent = false;
  const dpr = window.devicePixelRatio || 1;
  const r = _sigCanvas.getBoundingClientRect();
  _sigCanvas.width  = r.width  * dpr;
  _sigCanvas.height = r.height * dpr;
  _sigCtx = _sigCanvas.getContext('2d');
  _sigCtx.scale(dpr, dpr);
  _sigCtx.strokeStyle = '#1a3a2a';
  _sigCtx.lineWidth   = 2.5;
  _sigCtx.lineCap     = 'round';
  _sigCtx.lineJoin    = 'round';

  function pos(e) {
    const b = _sigCanvas.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  }
  _sigCanvas.addEventListener('mousedown', e => { _sigPen=true; _sigHasContent=true; _sigCtx.beginPath(); _sigCtx.moveTo(...pos(e)); });
  _sigCanvas.addEventListener('mousemove', e => { if (!_sigPen) return; _sigCtx.lineTo(...pos(e)); _sigCtx.stroke(); });
  _sigCanvas.addEventListener('mouseup',   () => _sigPen = false);
  _sigCanvas.addEventListener('mouseleave',() => _sigPen = false);
  _sigCanvas.addEventListener('touchstart', e => { e.preventDefault(); _sigPen=true; _sigHasContent=true; _sigCtx.beginPath(); _sigCtx.moveTo(...pos(e.touches[0])); }, {passive:false});
  _sigCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (!_sigPen) return; _sigCtx.lineTo(...pos(e.touches[0])); _sigCtx.stroke(); }, {passive:false});
  _sigCanvas.addEventListener('touchend',   () => _sigPen = false);
}

function clearSig() {
  if (_sigCtx) { _sigCtx.clearRect(0, 0, _sigCanvas.width, _sigCanvas.height); _sigHasContent = false; }
}

async function submitSig(orderId) {
  if (!_sigCanvas || !_sigHasContent) {
    const e = document.getElementById('sig-err');
    if (e) { e.textContent = '请先签名'; e.classList.remove('hidden'); }
    return;
  }
  const dataURL = _sigCanvas.toDataURL('image/png');
  const btn = event?.currentTarget;
  if (btn) { btn.textContent = '提交中…'; btn.disabled = true; }

  const { data, error } = await sb.rpc('customer_submit_signature', {
    p_order_id:   orderId,
    p_phone:      myPhone,
    p_sign_image: dataURL,
  });

  if (error || !data) {
    if (btn) { btn.textContent = '确认签名'; btn.disabled = false; }
    const e = document.getElementById('sig-err');
    if (e) { e.textContent = error?.message || '提交失败，请重试'; e.classList.remove('hidden'); }
    return;
  }

  const o = myOrders.find(x => x.id === orderId);
  if (o) o.sign_image = dataURL;
  openDetail(orderId);
}
