<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Info - HOUZY HOME</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#153927">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOUZY HOME">
<script>if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(e){console.warn('[PWA] SW reg failed:',e);});});}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { hg:'#1a3a2a', gd:'#c8a96e' } } } };
</script>
<style>
  body { font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f5f0; }
  .card { background:white; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
</style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 pt-8">

<!-- Floating language picker -->
<div class="fixed top-3 right-3 z-50">
  <div class="relative">
    <button onclick="toggleLangDrop()" class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-700 shadow-sm">
      🌐 <span id="lang-label">简体中文</span>
      <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div id="lang-drop" class="hidden absolute right-0 top-full mt-1 bg-white rounded-lg shadow-xl py-1 overflow-hidden min-w-[140px]">
      <button onclick="setLang('en')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
      <button onclick="setLang('zh-CN')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
      <button onclick="setLang('zh-TW')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁體中文</button>
      <button onclick="setLang('ms')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
      <button onclick="setLang('th')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
    </div>
  </div>
</div>

<div class="w-full max-w-sm">

  <!-- Header -->
  <div class="text-center mb-6">
    <div class="text-xl font-bold" style="color:#1a3a2a">HOUZY HOME</div>
    <div class="text-xs text-gray-400 mt-0.5" data-i18n="page_sub">产品信息查询</div>
  </div>

  <!-- Loading -->
  <div id="loading" class="card p-8 text-center text-sm text-gray-400" data-i18n="loading">加载中…</div>

  <!-- Product card -->
  <div id="product-card" class="hidden space-y-3">

    <!-- Basic info -->
    <div class="card p-5">
      <div id="p-img-wrap" class="hidden mb-4 -mx-0 rounded-xl overflow-hidden">
        <img id="p-img" class="w-full object-cover" style="max-height:220px">
      </div>
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="font-mono text-xs font-bold mb-1" style="color:#c8a96e" id="p-sku"></div>
          <div class="text-lg font-bold text-gray-900 leading-tight" id="p-name"></div>
          <div class="text-sm text-gray-400 mt-0.5" id="p-cat"></div>
        </div>
        <span id="p-unit" class="text-xs font-semibold px-2 py-1 rounded-full" style="background:#d1fae5;color:#065f46"></span>
      </div>
    </div>

    <!-- Specs -->
    <div id="p-specs-card" class="hidden card p-5">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3" data-i18n="specs_title">产品规格</div>
      <div id="p-specs-inner" class="grid grid-cols-2 gap-2 text-xs"></div>
    </div>

    <!-- Inventory -->
    <div class="card p-5">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3" data-i18n="inv_title">库存情况</div>
      <div id="p-inv" class="text-xs text-center text-gray-300 py-2" data-i18n="querying">查询中…</div>
    </div>

    <!-- Supplier codes -->
    <div id="p-codes-card" class="hidden card p-5">
      <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3" data-i18n="codes_title">厂家编码</div>
      <div id="p-codes" class="text-xs divide-y divide-gray-50"></div>
    </div>

    <div class="text-center text-xs text-gray-300 pb-6"><span data-i18n="scan_time_pfx">扫描时间：</span><span id="p-ts"></span></div>
  </div>

  <!-- Error -->
  <div id="error-card" class="hidden card p-8 text-center">
    <div class="text-4xl mb-3">🔍</div>
    <div class="font-semibold text-gray-700 mb-2" data-i18n="err_not_found">未找到该产品</div>
    <div class="text-xs text-gray-400" id="error-msg"></div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ============================================================================
// 5 语言 i18n (en/zh-CN/zh-TW/ms/th)
// ============================================================================
const PL_I18N = {
  'zh-CN': {
    page_sub: '产品信息查询',
    loading: '加载中…',
    specs_title: '产品规格',
    inv_title: '库存情况',
    querying: '查询中…',
    codes_title: '厂家编码',
    scan_time_pfx: '扫描时间：',
    err_not_found: '未找到该产品',
    err_no_sku: '链接缺少产品编码',
    err_sku_not_exist: '产品编码 {sku} 不存在',
    no_inv: '暂无库存记录',
    available_sfx: '可用',
    default_unit: '件',
    cat: { WY:'卫浴', CT:'瓷砖', DB:'地板/地砖', CG:'橱柜', MC:'门窗', DJ:'灯具', JJ:'家具', WJ:'五金', DQ:'电器', TL:'涂料/壁纸', QT:'其他' },
  },
  'zh-TW': {
    page_sub: '產品資訊查詢',
    loading: '載入中…',
    specs_title: '產品規格',
    inv_title: '庫存情況',
    querying: '查詢中…',
    codes_title: '廠家編碼',
    scan_time_pfx: '掃描時間：',
    err_not_found: '未找到該產品',
    err_no_sku: '連結缺少產品編碼',
    err_sku_not_exist: '產品編碼 {sku} 不存在',
    no_inv: '暫無庫存記錄',
    available_sfx: '可用',
    default_unit: '件',
    cat: { WY:'衛浴', CT:'瓷磚', DB:'地板/地磚', CG:'櫥櫃', MC:'門窗', DJ:'燈具', JJ:'傢俱', WJ:'五金', DQ:'電器', TL:'塗料/壁紙', QT:'其他' },
  },
  'en': {
    page_sub: 'Product Information',
    loading: 'Loading…',
    specs_title: 'Specifications',
    inv_title: 'Stock Status',
    querying: 'Querying…',
    codes_title: 'Factory Codes',
    scan_time_pfx: 'Scanned at: ',
    err_not_found: 'Product not found',
    err_no_sku: 'Link missing product code',
    err_sku_not_exist: 'Product code {sku} not found',
    no_inv: 'No stock records',
    available_sfx: 'available',
    default_unit: 'pcs',
    cat: { WY:'Bathroom', CT:'Tile', DB:'Flooring / Tiles', CG:'Kitchen Cabinet', MC:'Doors & Windows', DJ:'Lighting', JJ:'Furniture', WJ:'Hardware', DQ:'Appliances', TL:'Paint / Wallpaper', QT:'Other' },
  },
  'ms': {
    page_sub: 'Maklumat Produk',
    loading: 'Memuat…',
    specs_title: 'Spesifikasi',
    inv_title: 'Status Stok',
    querying: 'Mencari…',
    codes_title: 'Kod Kilang',
    scan_time_pfx: 'Diimbas: ',
    err_not_found: 'Produk tidak dijumpai',
    err_no_sku: 'Pautan tiada kod produk',
    err_sku_not_exist: 'Kod produk {sku} tidak wujud',
    no_inv: 'Tiada rekod stok',
    available_sfx: 'tersedia',
    default_unit: 'unit',
    cat: { WY:'Bilik Mandi', CT:'Jubin', DB:'Lantai / Jubin', CG:'Kabinet Dapur', MC:'Pintu & Tingkap', DJ:'Pencahayaan', JJ:'Perabot', WJ:'Perkakas', DQ:'Elektrik', TL:'Cat / Wallpaper', QT:'Lain-lain' },
  },
  'th': {
    page_sub: 'ข้อมูลผลิตภัณฑ์',
    loading: 'กำลังโหลด…',
    specs_title: 'ข้อมูลจำเพาะ',
    inv_title: 'สถานะสต็อก',
    querying: 'กำลังค้นหา…',
    codes_title: 'รหัสโรงงาน',
    scan_time_pfx: 'สแกนเมื่อ: ',
    err_not_found: 'ไม่พบสินค้า',
    err_no_sku: 'ลิงก์ขาดรหัสสินค้า',
    err_sku_not_exist: 'ไม่พบรหัสสินค้า {sku}',
    no_inv: 'ไม่มีบันทึกสต็อก',
    available_sfx: 'พร้อมจำหน่าย',
    default_unit: 'ชิ้น',
    cat: { WY:'ห้องน้ำ', CT:'กระเบื้อง', DB:'พื้น / กระเบื้อง', CG:'ตู้ครัว', MC:'ประตู & หน้าต่าง', DJ:'ไฟ', JJ:'เฟอร์นิเจอร์', WJ:'ฮาร์ดแวร์', DQ:'เครื่องใช้ไฟฟ้า', TL:'สี / วอลเปเปอร์', QT:'อื่นๆ' },
  },
};
const LANG_LABELS = { 'en':'English', 'zh-CN':'简体中文', 'zh-TW':'繁體中文', 'ms':'Bahasa Melayu', 'th':'ภาษาไทย' };
let currentLang = localStorage.getItem('houzy-lang') || 'zh-CN';
if (!PL_I18N[currentLang]) currentLang = 'zh-CN';
function t(k) { return (PL_I18N[currentLang] || PL_I18N['zh-CN'])[k] || k; }
function catLabel(code) { return (PL_I18N[currentLang]?.cat || PL_I18N['zh-CN'].cat)[code] || code; }

function toggleLangDrop() {
  document.getElementById('lang-drop').classList.toggle('hidden');
}
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('houzy-lang', lang);
  const lbl = LANG_LABELS[lang] || lang;
  const lblEl = document.getElementById('lang-label'); if (lblEl) lblEl.textContent = lbl;
  document.getElementById('lang-drop')?.classList.add('hidden');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n); if (v) el.textContent = v;
  });
  document.body.style.fontFamily = lang === 'th' ? "'Noto Sans Thai',sans-serif" : "'Noto Sans SC',sans-serif";
  document.documentElement.lang = lang;
  // 重渲产品分类标签（如果产品已加载）
  if (window.__loadedProduct) {
    const p = window.__loadedProduct;
    document.getElementById('p-cat').textContent = catLabel(p.category) || p.category || '—';
    document.getElementById('p-unit').textContent = p.unit || t('default_unit');
  }
}
window.addEventListener('DOMContentLoaded', () => setLang(currentLang));
document.addEventListener('click', (e) => {
  const drop = document.getElementById('lang-drop');
  if (!drop || drop.classList.contains('hidden')) return;
  if (e.target.closest('button')?.getAttribute('onclick')?.includes('toggleLangDrop')) return;
  drop.classList.add('hidden');
});

// Roles allowed to see sourcing info (厂家编号/供应商). 店员(staff) & 未登录 不可见。
const SOURCE_ROLES = ['warehouse','store_manager','regional_manager','general_manager','superadmin','admin'];
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
async function canSeeSource() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  const { data: prof } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  return !!prof && SOURCE_ROLES.includes(prof.role);
}

(async () => {
  const sku = new URLSearchParams(location.search).get('sku');
  if (!sku) { showError(t('err_no_sku')); return; }

  const { data: prod, error } = await sb.from('products').select('*').eq('sku', sku).maybeSingle();
  if (error || !prod) { showError(t('err_sku_not_exist').replace('{sku}', sku)); return; }
  window.__loadedProduct = prod;

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('product-card').classList.remove('hidden');
  document.getElementById('p-sku').textContent  = prod.sku;
  document.getElementById('p-name').textContent = prod.name;
  document.getElementById('p-cat').textContent  = catLabel(prod.category) || prod.category || '—';
  document.getElementById('p-unit').textContent = prod.unit || t('default_unit');
  const tsLoc = { 'zh-CN':'zh-CN','zh-TW':'zh-TW','en':'en-MY','ms':'ms-MY','th':'th-TH' }[currentLang] || 'zh-CN';
  document.getElementById('p-ts').textContent   = new Date().toLocaleString(tsLoc);

  if (prod.image_url) {
    document.getElementById('p-img').src = prod.image_url;
    document.getElementById('p-img-wrap').classList.remove('hidden');
  }

  if (prod.specs) {
    const pairs = prod.specs.split(' | ').filter(Boolean);
    if (pairs.length) {
      document.getElementById('p-specs-card').classList.remove('hidden');
      document.getElementById('p-specs-inner').innerHTML = pairs.map(pair => {
        const idx = pair.indexOf(':');
        const k = pair.slice(0, idx), v = pair.slice(idx + 1);
        return `<div class="bg-gray-50 rounded-lg px-2.5 py-2">
          <div class="text-gray-400 mb-0.5">${esc(k)}</div>
          <div class="font-semibold text-gray-700">${esc(v)}</div>
        </div>`;
      }).join('');
    }
  }

  const showSource = await canSeeSource();
  const [{ data: inv }, codesRes] = await Promise.all([
    sb.from('inventory').select('qty_on_hand,qty_reserved,warehouses(name)').eq('product_id', prod.id),
    showSource
      ? sb.from('product_supplier_codes').select('supplier_code,suppliers(name)').eq('product_id', prod.id)
      : Promise.resolve({ data: null }),
  ]);
  const codes = codesRes.data;

  const invEl = document.getElementById('p-inv');
  if (inv?.length) {
    invEl.innerHTML = inv.map(r => {
      const avail = (r.qty_on_hand||0) - (r.qty_reserved||0);
      const unit = prod.unit || t('default_unit');
      return `<div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
        <span class="text-gray-600 font-medium">${esc(r.warehouses?.name||'—')}</span>
        <span class="font-bold ${avail>0?'text-green-700':'text-red-500'}">${avail} <span class="font-normal text-gray-400">${esc(unit)} ${t('available_sfx')}</span></span>
      </div>`;
    }).join('');
  } else {
    invEl.textContent = t('no_inv');
  }

  if (showSource && codes?.length) {
    document.getElementById('p-codes-card').classList.remove('hidden');
    document.getElementById('p-codes').innerHTML = codes.map(c =>
      `<div class="flex items-center justify-between py-2">
        <span class="font-mono text-gray-700">${esc(c.supplier_code)}</span>
        <span class="text-gray-400">${esc(c.suppliers?.name || '')}</span>
      </div>`).join('');
  }
})();

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-card').classList.remove('hidden');
  document.getElementById('error-msg').textContent = msg;
}
</script>
</body>
</html>
