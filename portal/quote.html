<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全屋报价器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F3; --surface: #FFFFFF; --line: #DEDAD1;
    --ink: #1C1B19; --ink-dim: #6B6860;
    --navy: #17324F; --navy-soft: #E7EDF3; --on-navy: #FFFFFF;
    --accent: #C4501C; --ok: #2F6B4F; --off: #B8B3A7;
    --red: #B42318; --red-soft: #FDECEA; --yellow: #8A5A00; --yellow-soft: #FFF4D6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151A; --surface: #1E1D23; --line: #34333A;
      --ink: #EDEBE6; --ink-dim: #9A968D;
      --navy: #9FC0E0; --navy-soft: #202B36; --on-navy: #16151A;
      --accent: #E37A46; --ok: #5FA382; --off: #4A4840;
      --red: #F08A80; --red-soft: #3A1F1E; --yellow: #E8C06A; --yellow-soft: #33291A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16151A; --surface: #1E1D23; --line: #34333A;
    --ink: #EDEBE6; --ink-dim: #9A968D;
    --navy: #9FC0E0; --navy-soft: #202B36; --on-navy: #16151A;
    --accent: #E37A46; --ok: #5FA382; --off: #4A4840;
    --red: #F08A80; --red-soft: #3A1F1E; --yellow: #E8C06A; --yellow-soft: #33291A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 130px; }
  .wrap.wide { max-width: 1180px; }
  header.top { padding: 4px 2px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  header.top h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  header.top p { margin: 0; color: var(--ink-dim); font-size: 12.5px; line-height: 1.6; }
  .btn-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }

  /* 步骤条 */
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 8px 0; }
  .step-btn { position: relative; border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 9px; padding: 8px 2px 7px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; line-height: 1.3; }
  .step-btn b { display: block; font-size: 14px; font-family: "IBM Plex Mono", monospace; }
  .step-btn.active { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
  .step-btn .bdg { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; font-size: 10.5px; line-height: 18px; padding: 0 5px; color: #fff; background: var(--red); font-family: "IBM Plex Mono", monospace; }
  .step-btn .bdg.okb { background: var(--ok); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .hint { font-size: 12px; color: var(--ink-dim); line-height: 1.6; margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fld label { display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; }
  .fld input, .fld select, .txt {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font: inherit; font-size: 14px;
    background: var(--surface); color: var(--ink);
  }
  .fld input.num { font-family: "IBM Plex Mono", monospace; font-weight: 600; text-align: right; }
  .fld .u { font-size: 10.5px; color: var(--ink-dim); margin-left: 2px; }
  .fld.bad input { border-color: var(--red); background: var(--red-soft); }
  .full { grid-column: 1 / -1; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: none; background: var(--surface); color: var(--ink-dim); font: inherit; font-size: 12.5px; padding: 7px 11px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--navy); color: var(--on-navy); font-weight: 600; }

  .room { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
  .room-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--navy-soft); }
  .room-head input { flex: 1; border: none; background: transparent; font: inherit; font-weight: 700; font-size: 14.5px; color: var(--ink); min-width: 0; }
  .room-head .area { font-size: 12px; color: var(--navy); font-weight: 600; white-space: nowrap; }
  .room-head .x { border: none; background: none; color: var(--ink-dim); font-size: 16px; cursor: pointer; padding: 0 2px; }
  .room-body { padding: 12px; }
  .room-body .segrow { margin-top: 10px; }
  .room-body .segrow > span { display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; }
  .add-rooms { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .level-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 8px; padding-bottom: 6px; border-bottom: 2px solid var(--navy); color: var(--navy); font-size: 15px; }
  .level-head span { font-size: 12px; }
  .add-rooms button { border: 1px dashed var(--navy); background: none; color: var(--navy); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .kpi { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-dim); padding: 4px 0; }
  .kpi b { color: var(--ink); }

  /* 必答问题 */
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; background: var(--surface); }
  .q.todo { border-color: var(--red); box-shadow: inset 3px 0 0 var(--red); }
  .q-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .q-text { font-size: 13.5px; font-weight: 600; line-height: 1.45; }
  .q-why { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; line-height: 1.5; }
  .yn { display: flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .yn button { border: none; background: var(--surface); color: var(--ink-dim); font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer; }
  .yn button + button { border-left: 1px solid var(--line); }
  .yn button.y.active { background: var(--ok); color: #fff; font-weight: 600; }
  .yn button.n.active { background: var(--ink-dim); color: var(--surface); font-weight: 600; }
  .q-inputs { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .warnbox { margin-top: 8px; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.55; }
  .group-title { font-size: 12px; color: var(--ink-dim); font-weight: 600; margin: 14px 2px 8px; }

  /* 清单 */
  .stage { margin-bottom: 14px; }
  .stage-head { display: flex; align-items: center; gap: 10px; padding: 6px 2px 8px; }
  .stage-no { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--on-navy); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: "IBM Plex Mono", monospace; flex-shrink: 0; }
  .stage-name { font-size: 14.5px; font-weight: 700; }
  .stage-sub { font-size: 11px; color: var(--ink-dim); }
  .stage-amt { margin-left: auto; font-weight: 700; color: var(--accent); }
  .line { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  .line.off { opacity: .55; }
  .line.off .line-title { text-decoration: line-through; }
  .line.flag { border-color: var(--red); }
  .line-main { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
  .line-l { flex: 1; min-width: 0; }
  .line-title { font-size: 13.5px; font-weight: 600; }
  .badge { display: inline-block; font-size: 10.5px; color: var(--navy); background: var(--navy-soft); border-radius: 5px; padding: 1px 6px; margin-right: 6px; font-weight: 600; vertical-align: 1px; }
  .tag { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px; margin-left: 5px; font-weight: 600; vertical-align: 1px; }
  .tag.req { color: var(--accent); border: 1px solid var(--accent); }
  .tag.cust { color: var(--yellow); background: var(--yellow-soft); }
  .tag.man { color: var(--red); background: var(--red-soft); }
  .tag.pick { color: var(--ok); background: var(--navy-soft); font-weight: 600; }
  .work-item:has(.tile-editor) {grid-column:1 / -1;}
  .tile-editor { margin-top:12px;padding:12px;background:var(--navy-soft);border-radius:8px; }
  .fld > label:has(input[type="checkbox"]) {display:flex;align-items:center;gap:8px;}
  .fld input[type="checkbox"] {width:18px;height:18px;flex:0 0 18px;margin:0;}
  .room-panel { margin-top: 10px; }
  .room-panel > summary { cursor: pointer; font-weight: 600; color: var(--navy); padding: 8px 0; }
  .room-panel > summary:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; }
  .room-panel .panel-action { float: right; font-size: 12px; font-weight: 400; color: var(--ink-dim); }
  .room-panel .panel-action::after { content: '点击展开'; }
  .room-panel[open] .panel-action::after { content: '点击收起'; }
  .room-panel .panel-body { padding-top: 10px; }
  .pickbox { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
  .pick-t { font-size: 11.5px; color: var(--navy); font-weight: 600; margin-bottom: 6px; }
  .doc .qt .pk { color: #1C1B19; }
  .line-sub { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; line-height: 1.45; }
  .line-amt { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .line-detail { border-top: 1px dashed var(--line); padding: 10px 12px 12px; display: grid; gap: 10px; }
  .dl { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-dim); flex-wrap: wrap; }
  .dl b { color: var(--ink); }
  .switch { position: relative; width: 42px; height: 25px; flex-shrink: 0; border-radius: 999px; border: none; padding: 0; cursor: pointer; background: var(--off); }
  .switch.on { background: var(--ok); }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
  .switch.on .knob { transform: translateX(17px); }
  .note { font-size: 11.5px; line-height: 1.55; border-radius: 8px; padding: 8px 10px; background: var(--navy-soft); color: var(--ink-dim); }
  .note.warn { background: var(--red-soft); color: var(--red); }

  /* 检查 */
  .chk { border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 13px; line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; }
  .chk.red { background: var(--red-soft); color: var(--red); }
  .chk.yellow { background: var(--yellow-soft); color: var(--yellow); }
  .chk.okc { background: var(--navy-soft); color: var(--ok); font-weight: 600; }
  .chk .go { margin-left: auto; flex-shrink: 0; border: none; background: none; color: inherit; font: inherit; font-size: 12px; font-weight: 700; text-decoration: underline; cursor: pointer; }

  /* 报价单文档 */
  .doc { background: #fff; color: #1C1B19; border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; position: relative; overflow: hidden; }
  .doc .draft { position: absolute; top: 14px; right: -34px; transform: rotate(35deg); background: #B42318; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 40px; }
  .doc h3 { margin: 0; font-size: 17px; }
  .doc .co { font-size: 11px; color: #6B6860; margin-bottom: 12px; }
  .doc .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; font-size: 12px; margin-bottom: 12px; color: #444; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .doc th { text-align: left; font-weight: 600; color: #6B6860; border-bottom: 1px solid #DEDAD1; padding: 5px 4px; font-size: 11px; }
  .doc td { border-bottom: 1px solid #EEEBE4; padding: 5px 4px; vertical-align: top; }
  .doc td.r, .doc th.r { text-align: right; white-space: nowrap; }
  .doc tr.st td { background: #E7EDF3; font-weight: 700; color: #17324F; }
  .doc .sum { margin-top: 12px; }
  .doc .sum div { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .doc .sum .tot { border-top: 2px solid #17324F; margin-top: 4px; padding-top: 8px; font-size: 16px; font-weight: 700; }
  .doc table.qt { min-width: 860px; }
  .doc .qt td:nth-child(3), .doc .qt td:nth-child(2) { white-space: nowrap; }
  .doc .qt td:nth-child(2) { white-space: normal; min-width: 130px; }
  .doc .qt td.ds { font-size: 10.5px; color: #6B6860; line-height: 1.45; min-width: 180px; }
  .doc .qt .rn { display: inline-block; font-size: 10px; color: #17324F; background: #E7EDF3; border-radius: 4px; padding: 0 4px; margin-right: 4px; }
  .doc .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; font-size: 12px; }
  .doc .sign span { display: inline-block; min-width: 90px; border-bottom: 1px solid #999; margin: 0 6px; }
  .pdesc { font-size: 10.5px; color: var(--ink-dim); margin-top: 2px; line-height: 1.4; max-width: 260px; }
  .tpls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tpl { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px; font: inherit; cursor: pointer; display: grid; gap: 3px; }
  .tpl b { font-size: 14.5px; color: var(--navy); }
  .tpl span { font-size: 11.5px; color: var(--ink-dim); }
  .doc .terms { font-size: 11px; color: #6B6860; line-height: 1.65; margin-top: 12px; }
  .doc .sub-h { font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
  .primary { width: 100%; border: none; border-radius: 10px; padding: 12px; font: inherit; font-size: 14.5px; font-weight: 700; background: var(--navy); color: var(--on-navy); cursor: pointer; margin-top: 10px; }
  .primary:disabled { background: var(--off); cursor: not-allowed; }

  /* 价目表 */
  .ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptable th { text-align: left; color: var(--ink-dim); font-weight: 600; font-size: 11px; padding: 6px 3px; border-bottom: 1px solid var(--line); }
  .ptable td { padding: 5px 3px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
  .ptable input:disabled { background: var(--navy-soft); color: var(--ink-dim); }
  .ptable input { width: 58px; border: 1px solid var(--line); border-radius: 6px; padding: 5px; text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 12px; background: var(--surface); color: var(--ink); }
  .ptable tr.chg td { background: var(--yellow-soft); }
  .ptable .rs { border: none; background: none; color: var(--navy); cursor: pointer; font-size: 11px; text-decoration: underline; }
  .scroll-x { overflow-x: auto; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
  .bar-in { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar .t { flex: 1; }
  .bar .t small { display: block; font-size: 11.5px; color: var(--ink-dim); }
  .bar .t b { font-size: 21px; color: var(--accent); }
  .bar .st { border: none; border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .bar .st.bad { background: var(--red-soft); color: var(--red); }
  .bar .st.good { background: var(--navy-soft); color: var(--ok); }

  @media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } .step-btn { font-size: 10.5px; } }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    .doc table.qt { min-width: 0; }
    .scroll-x { overflow: visible; }
    body { background: #fff; }
    body * { visibility: hidden; }
    #quote-doc, #quote-doc * { visibility: visible; }
    #quote-doc { position: absolute; left: 0; top: 0; width: 100%; border: none; padding: 0; }
    .bar, .steps { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>全屋报价器</h1>
      <p>按顺序走完 ① → ④：填房间尺寸 → 回答必答问题 → 系统自动生成清单和数量 → 通过检查才能出报价单。员工只填尺寸和数量，单价统一来自价目表。</p>
    </div>
    <button class="btn-ghost" data-new>新建报价</button>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="main"></main>
</div>
<div class="bar">
  <div class="bar-in">
    <div class="t"><small>当前总报价（含设计费、管理费，已减优惠）</small><b class="mono" id="bar-total">RM 0</b></div>
    <button class="st" id="bar-status" data-step="4"></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  一、价目表（全公司统一单价 · 示例价，请按公司实际价格修改这里）
  //  每一项拆成 主材 + 辅材 + 人工，并附工艺说明 · 单位都是 RM
  // =====================================================================
  const STAGES = [
    { id: 'prep',   no: 1, name: '拆改与现场保护', sub: '第9-14步 · 放线验收后才能拆' },
    { id: 'mep',    no: 2, name: '水电隐蔽',       sub: '第15-23步 · 隐蔽验收后才能进泥水' },
    { id: 'wp',     no: 3, name: '防水',           sub: '第24-27步 · 闭水试验通过后才能贴砖' },
    { id: 'tile',   no: 4, name: '泥水瓷砖 / 地面', sub: '第28-31步' },
    { id: 'ceil',   no: 5, name: '天花墙面',       sub: '第32-38步' },
    { id: 'custom', no: 6, name: '定制柜与门窗',   sub: '第39-45步 · 复尺后下单' },
    { id: 'equip',  no: 7, name: '设备安装与收尾', sub: '第46-54步' },
    { id: 'outdoor', no: 8, name: '户外与外围工程', sub: '有地房屋 · 扩建/雨棚/围墙/大门' },
    { id: 'soft',   no: 9, name: '软装',           sub: '第55-60步 · 交付前', soft: true }
  ];

  // 字段：mat=主材单价（有损耗） aux=辅材单价 lab=人工单价 waste=主材损耗%
  //      desc=工艺做法及材料说明（会印在客户报价单上）
  //      forced=必做项（关掉必须写原因）  needs=做了这项就一定要有的配套项（同一房间）
  // 全部是【示范价】，请换成公司实际价格
  const PRICE = {
    setout:      { stage: 'prep', name: '开工放线定位', unit: '项', mat: 0, aux: 0, lab: 150, forced: true,
                   desc: '按设计图现场弹出墙体、门洞、柜体、水电点位位置线，与客户现场确认后开工' },
    protect:     { stage: 'prep', name: '成品及公共区域保护（地面/电梯/走廊）', unit: '项', mat: 250, aux: 50, lab: 200, forced: true,
                   desc: '室内地面铺保护膜+夹板，门框、窗框、电梯、走廊贴保护，完工后撤除' },

      if(s.closed||s.points.length>=40)return;const prev=s.points.at(-1);if(s.mode==='ortho'&&prev){if(Math.abs(x-prev.x)>Math.abs(y-prev.y)){y=prev.y;if(Math.abs(x-s.points[0].x)<15)x=s.points[0].x;}else{x=prev.x;if(Math.abs(y-s.points[0].y)<15)y=s.points[0].y;}}if(prev&&Math.hypot(x-prev.x,y-prev.y)<5)return;s.points.push({x,y});s.coords.push({x:'',y:''});invalidateSketch(r);render();return;}

    add(ALL, 'circuit', acN + htN, `空调 ${acN} 台 + 热水器 ${htN} 台，每台一条专用回路`);
    const wN = P.rooms.reduce((s, r) => s + (workOn(r,'water_pt')?num(r.workQty?.water_pt ?? r.wpts):0), 0);
    if (wN > 0) add(ALL, 'pipe_test', 1, `全屋有 ${wN} 个水点位，封槽前必须打压`);
    if (levels() > 1) {
      // 楼上房间：面积 × (所在楼层 − 1)，越高搬得越辛苦
      const up = P.rooms.filter(r => (r.level || 1) > 1 && !['outdoor','stairs'].includes(roomBase(r)));
      const upQty = up.reduce((s, r) => s + geo(r).floor * ((r.level || 1) - 1), 0);
      add(ALL, 'carry_up', upQty, up.map(r => `${roomLabel(r)} ${nf(geo(r).floor)}×${(r.level || 1) - 1}`).join(' + ') || '楼上还没有房间');
      if (yes('stairs')) {
        const stairCode=({'瓷砖':'stair_tread','木饰面':'stair_wood','天然石材／人造石':'stair_stone','其他材料':'stair_other'})[ans('stairs').material];
        if(stairCode)add(ALL,stairCode,an('stairs','steps'),'本次实际施工踏步级数');
        add(ALL,'stair_landing',an('stairs','landing'),'平台实际施工面积，独立于踏步级数');
        add(ALL, 'stair_rail', an('stairs', 'rail'), '必答问题填写');
        add(ALL,'stair_light',an('stairs','lights'),'客户选择的本次新增灯及双控套数');
      }
      if (yes('void')) add(ALL, 'scaffold', an('void', 'count'), '必答问题填写');
    }

    P.rooms.forEach(r => {
      const g = geo(r), t = roomBase(r);
      Object.keys(FITOUT).filter(code=>fitSelected(r,code)).forEach(code=>add(r,code,fitQty(r,code),'客户勾选；'+(code==='window_new'?'单樘窗宽×高×数量（平方尺）':'按确认尺寸／数量计量'),'selected-fitout-'+code));
      if (t === 'outdoor' || t === 'stairs') return; // Scope priced in the whole-house questions; no indoor finishes.
      const fl = nf(g.floor), pe = nf(g.perim);
      const floorF = r.sketch?.applied?`手绘实测闭合轮廓面积 = ${fl}`:`${nf(g.L)}×${nf(g.W)} = ${fl}`;
      const wallF = `周长${pe}×层高${nf(g.H)}` + (g.doors ? ` − 门洞${g.doors}×21` : '') + ` = ${nf(g.wall)}`;

      // 水电
      add(r, 'wire', num(r.pts), '房间填写的点位');
      add(r, 'panel', num(r.pts), '= 插座/开关点位数（布线多少个，面板就多少个）');
      add(r, 'light', num(r.lights), '房间填写的灯位');
      add(r, 'water_pt', num(r.wpts), '房间填写的水点位');
      add(r, 'aircon_pipe', num(r.ac), '房间填写的空调台数');

      // 天花
      if (t !== 'balcony') {
        if (r.ceiling === 'flat' || r.ceiling === 'feature') add(r, 'plaster_ceiling', g.floor, `天花面积 = 地面 ${floorF}`);
        if (r.ceiling === 'feature') {
          add(r, 'ceiling_step', g.perim, `沿房间实测周长 = ${pe}`);
          add(r, 'led_strip', g.perim, `= 灯槽长度 ${pe}`);
        }
        add(r, 'paint_ceiling', g.floor, `天花面积 = 地面 ${floorF}`);
      }

      if (t === 'living' || t === 'bedroom' || t === 'other') {
        if (r.floor === 'laminate') add(r, 'laminate', g.floor, floorF);
        else {
          add(r, 'floor_tile', g.floor, floorF); add(r, 'grout', g.floor, `= 地砖面积 ${fl}`);
          if (r.tileDim ? ['900×1800 mm', '1200×2400 mm'].includes(r.tileDim) : r.tileSize === 'big') add(r, 'big_tile_extra', g.floor, `大板砖：地砖面积 ${fl}`);
        }
        add(r, 'fan_point', num(r.fan), '= 吊扇数量'); add(r, 'ceiling_fan', num(r.fan), '房间填写的吊扇数量');
        if (r.cornice === 'yes') add(r, 'cornice', g.perim, `沿房间周长 ${pe}`);
        add(r, 'sideboard', num(r.sideboard), '房间填写'); add(r, 'headboard', num(r.headboard), '房间填写'); add(r, 'bookcase', num(r.bookcase), '房间填写');
        const sk = Math.max(0, g.perim - g.doors * 3);
        add(r, 'skirting', sk, `周长${pe}` + (g.doors ? ` − 门宽${g.doors}×3` : '') + ` = ${nf(sk)}`);
        add(r, 'skim', g.wall, wallF);
        if (r.wallFinish === 'wallpaper') add(r, 'wallpaper', g.wall, wallF);
        else if (r.wallFinish === 'art') add(r, 'art_paint', g.wall, wallF);
        else add(r, 'paint_wall', g.wall, wallF);
        if (t === 'bedroom') add(r, 'wardrobe', num(r.wardrobe), '房间填写的衣柜长度');
        if (t === 'living') { add(r, 'shoe_cab', num(r.shoeCab), '房间填写的鞋柜长度'); add(r, 'tv_cab', num(r.tvCab), '房间填写的电视柜长度'); }
      }

      if (t === 'kitchen') {
        const cabLow = num(r.backsplashLength ?? r.cabLow);
        const tileWall = workOn(r,'wall_tile') ? (r.wallTile === 'full' ? g.wall : Math.min(g.wall, cabLow * 2.5)) : 0;
        const tileWallF = r.wallTile === 'full' ? '满铺：' + wallF : `操作区：地柜长${nf(cabLow)}×挡水高2.5 = ${nf(tileWall)}`;
        add(r, 'floor_tile', g.floor, floorF);
        add(r, 'wall_tile', tileWall, tileWallF);
        add(r, 'grout', g.floor + tileWall, `地砖${fl} + 墙砖${nf(tileWall)}`);
        add(r, 'wp', g.floor, `厨房地面 ${floorF}`);
        add(r, 'flood_test', 1, '做了防水就要闭水');
        add(r, 'pipe_box', 1, '厨房通常有 1 根下水立管，没有就关掉');
        const paintWall = Math.max(0, g.wall - tileWall);
        add(r, 'skim', paintWall, `墙面${nf(g.wall)} − 墙砖${nf(tileWall)} = ${nf(paintWall)}`);
        add(r, 'paint_wall', paintWall, `墙面${nf(g.wall)} − 墙砖${nf(tileWall)} = ${nf(paintWall)}`);
        add(r, 'cab_low', cabLow, '房间填写的地柜长度');
        add(r, 'cab_up', num(r.cabUp), '房间填写的吊柜长度');
        add(r, 'counter', cabLow, '= 地柜长度（有地柜就一定有台面）');
        add(r, 'sink', 1, '厨房必配');
        add(r, 'cab_basket', num(r.basket), '房间填写的拉篮数量');
        add(r, 'hood', 1, '厨房必配');
      }

      if (t === 'bath') {
        const wpA = g.floor + g.perim * 1 + 36;
        add(r, 'wp', wpA, `地面${fl} + 周长${pe}×上翻1尺 + 淋浴区墙6×6 = ${nf(wpA)}`);
        add(r, 'flood_test', 1, '做了防水就要闭水');
        add(r, 'slope', g.floor, floorF);
        add(r, 'pipe_box', 1, '卫生间通常有 1 根下水立管，没有就关掉');
        add(r, 'exhaust', 1, '卫生间必配');
        add(r, 'bath_acc', 1, '每个卫生间 1 套');
        add(r, 'mirror', fitSelected(r,'vanity') ? fitQty(r,'vanity') : 0, '= 客户选做浴室柜数量');
        add(r, 'floor_tile', g.floor, floorF);
        add(r, 'wall_tile', g.wall, '满铺：' + wallF);
        add(r, 'grout', g.floor + g.wall, `地砖${fl} + 墙砖${nf(g.wall)}`);
        add(r, 'drain', num(r.drains), '房间填写的地漏数');
        add(r, 'threshold', g.doors, '= 门数（每个门口一条挡水）');
        ['toilet', 'vanity', 'shower', 'screen', 'heater'].forEach(c => add(r, c, num(r[c]), '房间填写'));
        if (r.moved === true) add(r, 'bath_drop', g.floor, `改位置：地面 ${floorF}`);
      }

      if (t === 'laundry') {
        add(r, 'floor_tile', g.floor, floorF);
        add(r, 'grout', g.floor, `= 地砖面积 ${fl}`);
        add(r, 'wp', g.floor, `洗衣区地面 ${floorF}`);
        add(r, 'flood_test', 1, '做了防水就要闭水');
        add(r, 'drain', num(r.drains), '房间填写的地漏数');
        add(r, 'laundry_cab', num(r.laundryCab), '房间填写的洗衣柜长度');
        add(r, 'rack', num(r.rack), '房间填写');
      }

      if (t === 'balcony') {
        add(r, 'floor_tile', g.floor, floorF);
        add(r, 'grout', g.floor, `= 地砖面积 ${fl}`);
        add(r, 'wp', g.floor, `阳台地面 ${floorF}`);
        add(r, 'flood_test', 1, '做了防水就要闭水');
        add(r, 'drain', num(r.drains), '房间填写的地漏数');
        add(r, 'rack', num(r.rack), '房间填写');
        if (r.seal === true) add(r, 'balc_seal', g.L, `阳台长度 ${nf(g.L)}`);
      }

      if (P.legacyWholeOpenings && yes('doors') && !fitSelected(r,'door') && t !== 'balcony') add(r, 'door', g.doors, '房间填写的室内门数');
      if (yes('curtain')) {
        add(r, 'curtain', num(r.win), '房间填写的窗户总宽');
        if (r.ceiling === 'flat' || r.ceiling === 'feature') add(r, 'curtain_box', num(r.win), '有吊顶又做窗帘 → 窗帘盒 = 窗宽');
      }
      if (t !== 'bath' && t !== 'balcony') add(r, 'window_sill', num(r.win), '= 窗户总宽');
    });

    P.rooms.forEach(r=>{
      const g=geo(r);
      if(r.workLegacy)return;
      workCodes(r).filter(code=>workOn(r,code)).forEach(code=>{
        if(out.some(x=>x.roomId===r.id&&x.code===code))return;
        const explicit=r.workQty?.[code];
        let qty=explicit!==undefined && String(explicit).trim()!==''?num(explicit):0;
        if(!qty) {
          if(['demo_floor','demo_ceiling','floor_tile','laminate','porch_tile','screed','slope','wp','plaster_ceiling','paint_ceiling','awning'].includes(code))qty=g.floor;
          else if(['demo_skin','wall_tile','skim','paint_wall','wallpaper','art_paint'].includes(code))qty=g.wall;
          else if(['skirting','ceiling_step','led_strip','cornice'].includes(code))qty=g.perim;
          else if(['window_sill','curtain','curtain_box','balc_seal'].includes(code))qty=num(r.win);
          else if(['wire','panel'].includes(code))qty=num(r.pts);
          else if(code==='light')qty=num(r.lights);
          else if(['fan_point','ceiling_fan'].includes(code))qty=num(r.fan);
          else if(code==='aircon_pipe')qty=num(r.ac);
          else if(code==='water_pt')qty=num(r.wpts);
          else if(code==='drain')qty=num(r.drains);
          else if(['toilet','shower','screen','heater','rack'].includes(code))qty=num(r[code]);
          else if(code==='flood_test')qty=1;
        }
        add(r,code,qty,'客户勾选；按本次填写的施工量或空间尺寸计算');
      });
    });

    // 垃圾清运：基础1车 + 拆墙每100平方尺1车 + 铲砖每400平方尺1车 + 旧件每10件1车
    const dw = yes('demoWall') ? an('demoWall', 'area') : 0;
    const df = yes('old') ? an('old', 'floor') : 0;
    const dp = yes('old') ? an('old', 'pieces') : 0;
    const trips = 1 + Math.ceil(dw / 100) + Math.ceil(df / 400) + Math.ceil(dp / 10);
    add(ALL, 'waste_out', trips, `基础1 + 拆墙${nf(dw)}÷100 + 铲砖${nf(df)}÷400 + 旧件${nf(dp)}÷10（都进位）`);
    add(ALL, 'clean', totalFloor(), '= 全部房间地面面积合计');
    if (yes('decor')) add(ALL, 'decor', 1, '必答问题填写');
    out.filter(x=>x.code==='grout' && x.roomId!=='all').forEach(x=>{const room=P.rooms.find(r=>r.id===x.roomId);if(String(room.workQty?.grout??'').trim()==='')x.qty=r1(out.filter(t=>t.roomId===x.roomId&&['floor_tile','wall_tile','porch_tile'].includes(t.code)).reduce((sum,t)=>sum+t.qty,0));});
    return out.filter(x=>x.qty>0);
  }

  // =====================================================================
  //  五、算钱：每一行先四舍五入到整数 RM，再加总 → 分项加起来一定等于总数
  // =====================================================================
  function compute() {
    const rows = gen().map(l => {
      const d = PRICE[l.code], st = P.lines[l.key] || {}, p = price(l.code);
      if(TILE_CODES.includes(l.code)&&P.rooms.find(r=>r.id===l.roomId)?.tileConfig?.[l.code])return tilePriceRow(l,st);
      if(activeCatalog().length)return companyRow(l,st);
      const manual = st.qty !== undefined && st.qty !== null && st.qty !== '';
      const qty = manual ? num(st.qty) : l.qty;
      const supply = st.supply === 'customer' ? 'customer' : 'company';
      // 单价 = 主材(含损耗) + 辅材 + 人工；合价 = 数量 × 单价（四舍五入到整数）
      // 主材选型（选填）：这一行填了主材单价，就只在这一行用它，损耗照加
      const mOwn = st.mprice !== undefined && st.mprice !== null && String(st.mprice).trim() !== '';
      const matBase = mOwn ? num(st.mprice) : p.mat;
      const uMat = supply === 'customer' ? 0 : Math.round(matBase * (1 + p.waste / 100) * 100) / 100;
      const pick = [l.code.startsWith('stair_') ? stairPick() : '', materialPick(l.roomId, l.code), fitPick(P.rooms.find(r=>r.id===l.roomId),l.code), st.brand, st.model].map(x => String(x || '').trim()).filter(Boolean).join(' ');
      const unit = uMat + p.aux + p.lab;
      const total = Math.round(qty * unit);
      const mat = Math.round(qty * uMat), aux = Math.round(qty * p.aux), lab = total - mat - aux;
      return Object.assign({}, l, { name: l.code==='counter' && fitSelected(P.rooms.find(r=>r.id===l.roomId)||{},'counter') ? '厨房定制台面' : d.name, unit: d.unit, stage: d.stage, forced: !!d.forced, soft: d.stage === 'soft', desc: FITOUT[l.code] && fitSelected(P.rooms.find(r=>r.id===l.roomId)||{},l.code) ? '按本项确认的材质、尺寸和配置制作安装；价格以核定清单为准。' : d.desc || '',
        st, manual, autoQty: l.qty, qty, on: !st.off, supply, p, uMat, mOwn, pick, hasMain: p.mat > 0 || p.bomMat, uAux: p.aux, uLab: p.lab, uPrice: unit, mat, aux, lab, total });
    });
    P.custom.forEach(c => {
      const qty = num(c.qty), uPrice = num(c.mat) + num(c.lab), total = Math.round(qty * uPrice), mat = Math.round(qty * num(c.mat));
      rows.push({ key: 'c:' + c.id, custom: c, code: null, roomId: 'custom', roomName: c.room || '全屋', name: c.name || '（未命名自定义项）',
        unit: c.unit || '项', stage: c.stage || 'equip', soft: c.stage === 'soft', qty, on: true, supply: 'company', desc: c.reason || '',
        uMat: num(c.mat), uAux: 0, uLab: num(c.lab), uPrice, mat, aux: 0, lab: total - mat, total, formula: '自定义项目', st: {} });
    });

    let hard = 0, material = 0, auxSum = 0, soft = 0;
    const byStage = {};
    rows.forEach(r => {
      byStage[r.stage] = byStage[r.stage] || 0;
      if (!r.on) return;
      byStage[r.stage] += r.total;
      if (r.soft) soft += r.total; else { hard += r.lab; material += r.mat; auxSum += r.aux; }
    });
    const floorSum = totalFloor();
    const designArea = num(P.spaArea) || floorSum;
    const design = Math.round(designArea * num(P.settings.designRate));
    const base = round2(hard + material + auxSum + soft);
    const mgmt = Math.round(base * num(P.settings.mgmtRate) / 100);
    const before = round2(base + design + mgmt);
    const discount = Math.min(Math.round(num(P.discount)), before);
    const afterDiscount = before - discount;
    const sst = Math.round(afterDiscount * num(P.settings.sst) / 100);
    const total = round2(afterDiscount + sst);
    // 付款节点：前几期四舍五入，最后一期 = 总价 − 前面各期，保证加起来刚好等于总价
    const pay = P.settings.pay.map(x => ({ name: x.name, pct: num(x.pct), amt: 0 }));
    let paid = 0;
    pay.forEach((x, i) => { x.amt = i === pay.length - 1 ? round2(total - paid) : round2(total * x.pct / 100); paid = round2(paid+x.amt); });
    return { sst, rows, byStage, hard, material, auxSum, soft, base, design, designArea, floorSum, mgmt, before, discount, total, pay };
  }

  // =====================================================================
  //  六、漏项 / 错误检查（红色 = 必须处理才能出单；黄色 = 提醒确认）
  // =====================================================================
  function checks(C) {
    const red = [], yellow = [];
    C.rows.filter(r=>r.on&&r.catalogPending).forEach(r=>red.push({m:`「${r.roomName} · ${r.name}」${r.catalogReason}，请在价目表补齐`,go:5}));
    if(!houseDef(P.houseType)) red.push({m:'请先选择住宅类型',go:1});
    P.rooms.filter(r => r.planImported && !r.surveyConfirmed).forEach(r => red.push({m: `「${roomLabel(r)}」图纸尺寸待现场复尺确认`,go:1}));
    P.rooms.filter(r => r.planImported && !r.planReviewed).forEach(r => red.push({m: `「${roomLabel(r)}」来自图纸，请核对设备点位及施工范围后确认`, go: 1}));
    P.rooms.filter(r => ['outdoor','stairs'].includes(roomBase(r))).forEach(r => yellow.push({m: `「${roomLabel(r)}」仅记录空间尺寸；施工量请在必答问题的户外/楼梯项目中填写，不自动套用室内做法`, go: 2}));
    if (!P.info.customer.trim()) red.push({ m: '没填客户姓名', go: 1 });
    if (!P.info.phone.trim()) yellow.push({ m: '没填客户电话', go: 1 });
    if (!P.rooms.length) red.push({ m: '还没有添加任何房间', go: 1 });
    P.rooms.forEach(r => {
      if(r.sketch?.pointsLinked&&r.sketch.pointsReview)red.push({m:`「${roomLabel(r)}」图上点位已变更，请重新确认点位数量`,go:1});
      if ((r.planImported || P.layoutId) && TYPES[r.type].fields.includes('H') && !(Number.isFinite(Number(r.H)) && Number(r.H) > 0)) red.push({m: `「${roomLabel(r)}」请填写实际层高，不使用默认层高`, go: 1});
      if (r.sketch?.points?.length&&!r.sketch.bypass&&(!r.sketch.applied||sketchMetrics(r.sketch).error)) red.push({m:`「${roomLabel(r)}」手绘尺寸尚未确认：${sketchMetrics(r.sketch).error||'请点击应用面积／周长'}`,go:1});
      if ((!r.sketch?.points?.length||r.sketch.bypass)&&(!num(r.L) || !num(r.W))) red.push({ m: `「${roomLabel(r)}」没填长/宽，面积算不出来`, go: 1 });
      if ((r.level || 1) > levels()) red.push({ m: `「${r.name}」设在${floorName(r.level)}，但房屋只有 ${levels()} 层`, go: 1 });
      (TYPES[r.type].roomQ || []).forEach(q => { if (r.workVersion && ['moved','seal'].includes(q.k)) return; if (r[q.k] !== true && r[q.k] !== false) red.push({ m: `「${roomLabel(r)}」${q.q} 还没回答`, go: 2 }); });
      if (roomBase(r) === 'kitchen' && !fitSelected(r,'cab_low')) yellow.push({ m: `「${roomLabel(r)}」没有地柜，确认客户不做橱柜？`, go: 1 });
      if (r.type === 'bath' && !num(r.toilet)) yellow.push({ m: `「${roomLabel(r)}」没有马桶，确认吗？`, go: 1 });
      if (r.type === 'bath' && workOn(r,'drain') && !num(r.drains) && !num(r.workQty?.drain)) red.push({ m: `「${roomLabel(r)}」地漏是 0，卫生间至少要 1 个`, go: 1 });
    });
    P.rooms.forEach(r=>invalidFitout(r).forEach(code=>red.push({m:`「${roomLabel(r)}」原有${FITOUT[code][0]}与空间不匹配，请取消此项或更正空间类型`,go:1})));
    P.rooms.forEach(r=>Object.keys(FITOUT).filter(code=>fitSelected(r,code)).forEach(code=>{
      const st=r.fitout[code],name=`「${roomLabel(r)}」${FITOUT[code][0]}`;
      if(!(fitQty(r,code)>0)) red.push({m:`${name}已勾选，请填写有效尺寸／数量`,go:1});
      if(!fitKeys(code).every(k=>st[k])) red.push({m:`${name}请补齐材质、规格及专业配置`,go:1});
      if(code!=='cab_basket' && (!(num(st.height)>0) || !(num(st.length)>0))) red.push({m:`${name}请确认宽度及高度`,go:1});
      if(code==='window_new' && P.legacyWholeOpenings && yes('windows')) red.push({m:`${name}已逐空间选择，请关闭全屋更换窗户项，避免重复报价`,go:2});
      if(!['door','window_new','cab_basket'].includes(code) && !(num(st.depth)>0)) red.push({m:`${name}请填写深度`,go:1});
      const line=C.rows.find(x=>x.roomId===r.id && x.code===code);
      if(line && !line.catalogMatch && !(line.uPrice>0)) red.push({m:`${name}尚未核定单价，请在价目表填写价格`,go:5});
    }));
    if(P.houseType==='terrace' && !P.rooms.some(r=>r.type==='porch')) yellow.push({m:'排屋尚未记录车廊，请在底层补充车廊并确认实际尺寸及施工范围',go:1});
    if(levels()>1 && yes('stairs')) {
      const a=ans('stairs');
      if(stairKeys(a).some(k=>!a[k]))red.push({m:'楼梯请补齐材料、铺法、立面处理、收边、防滑及基层选项',go:2});
      if(!String(a.spec||'').trim())red.push({m:'楼梯请填写面层规格及厚度',go:2});
      if(a.material==='瓷砖' && a.tileMethod==='下挂（踏面前沿下挂）' && !num(a.hang))red.push({m:'楼梯下挂做法请填写下挂高度',go:2});
      if(a.material==='其他材料' && !String(a.other||'').trim())red.push({m:'请填写楼梯其他材料的名称和做法',go:2});
      C.rows.filter(r=>r.code?.startsWith('stair_') && r.on && !r.catalogMatch && !(r.uPrice>0)).forEach(r=>red.push({m:`${r.name}单价待核定，请在价目表填写`,go:5}));
    }
    P.rooms.forEach(r=>{
      const selected=workCodes(r).filter(code=>workOn(r,code));
      TILE_CODES.filter(code=>workOn(r,code)&&r.tileConfig?.[code]).forEach(code=>{const c=r.tileConfig[code];if(!tileMetrics(r,code,1).ready||!c.finish||!c.method||!c.thickness)red.push({m:`「${roomLabel(r)}」${PRICE[code].name}请补齐规格、厚度、表面、铺法、承包范围；价格未匹配时请联系公司补价`,go:1});if(workOn(r,'big_tile_extra'))red.push({m:`「${roomLabel(r)}」瓷砖人工价已含规格工艺，请取消单列大板加价以避免重复`,go:1});});
      const missingSpecs=materialFields(r).filter(k=>!String(r[k]||'').trim());
      if(missingSpecs.length)red.push({m:`「${roomLabel(r)}」已选工程的材料规格待补：${missingSpecs.map(k=>MATERIAL_SPEC[k].label).join('、')}`,go:1});
      selected.forEach(code=>{if(!C.rows.some(x=>x.roomId===r.id&&x.code===code&&x.qty>0))red.push({m:`「${roomLabel(r)}」已勾选${PRICE[code].name}，请填写有效施工量`,go:1});});
      [['wp','flood_test'],['wire','panel'],['floor_tile','grout'],['wall_tile','grout']].forEach(([main,mate])=>{if(workOn(r,main)&&!workOn(r,mate))yellow.push({m:`「${roomLabel(r)}」已选${PRICE[main].name}，请确认是否需要${PRICE[mate].name}`,go:1});});
      if(workOn(r,'floor_tile')&&workOn(r,'laminate')&&(!num(r.workQty?.floor_tile)||!num(r.workQty?.laminate)))red.push({m:`「${roomLabel(r)}」瓷砖与木地板同时勾选，请分开填写各自施工量或只保留一种`,go:1});
    });
    [['porch','porch_tile'],['porch','drain_ch'],['awning','awning'],['extPaint','ext_paint'],['grille','grille']].forEach(([question,code])=>{if(yes(question)&&P.rooms.some(r=>workOn(r,code)))red.push({m:`${PRICE[code].name}在全屋问题与空间中重复选择，请只保留一处并核对工程量`,go:2});});
    const types = P.rooms.map(roomBase);
    if (P.rooms.length && !types.includes('bath')) yellow.push({ m: '没有卫生间，确认是局部装修？', go: 1 });
    if (P.rooms.length && !types.includes('kitchen')) yellow.push({ m: '没有厨房，确认是局部装修？', go: 1 });
    for (let lv = 1; lv <= levels(); lv++) if (!P.rooms.some(r => (r.level || 1) === lv)) red.push({ m: `房屋有 ${levels()} 层，但${floorName(lv)}还没有房间`, go: 1 });
    if (levels() > 1 && !P.rooms.some(r => (r.level || 1) > 1 && r.type === 'bath')) yellow.push({ m: '楼上没有卫生间，确认吗？', go: 1 });

    activeQs().forEach(q => {
      const a = ans(q.id);
      if (a.v !== true && a.v !== false) red.push({ m: `必答问题没回答：${q.q}`, go: 2 });
      else if (a.v && q.inputs) q.inputs.forEach(i => { if (!i.optional && !num(a[i.k])) red.push({ m: `「${q.q}」答了"是"，但${i.label}是 0`, go: 2 }); });
    });
    if (yes('loadWall')) yellow.push({ m: '动承重墙：签约前必须拿到结构工程师签字，否则不能开工', go: 2 });

    const spa = num(P.spaArea);
    if (!spa) yellow.push({ m: `没填套内面积，设计费暂按房间面积合计 ${nf(C.floorSum)} 平方尺算`, go: 1 });
    else if (C.floorSum < spa * 0.85) yellow.push({ m: `房间面积合计 ${nf(C.floorSum)} 比套内面积 ${nf(spa)} 少了 ${Math.round((1 - C.floorSum / spa) * 100)}%，是不是漏了走廊/储物间/过道？`, go: 1 });
    else if (C.floorSum > spa * 1.1) yellow.push({ m: `房间面积合计 ${nf(C.floorSum)} 比套内面积 ${nf(spa)} 还大，检查尺寸是否量错或房间重复`, go: 1 });

    C.rows.forEach(r => {
      const label = `「${r.roomName} · ${r.name}」`;
      if (r.custom) {
        if (!r.custom.name || !num(r.custom.qty) || !(num(r.custom.mat) + num(r.custom.lab))) red.push({ m: `自定义项目${label}名称/数量/单价没填完整`, go: 3 });
        if (!String(r.custom.reason || '').trim()) red.push({ m: `自定义项目${label}没写原因`, go: 3 });
        else yellow.push({ m: `自定义项目${label}不在价目表里，需主管确认价格`, go: 3 });
        return;
      }
      if (!r.on && r.forced && !String(r.st.offReason || '').trim()) red.push({ m: `${label}是必做项，关掉要写原因`, go: 3, key: r.key });
      if (r.manual && !String(r.st.qtyReason || '').trim()) red.push({ m: `${label}手动改了数量，要写原因`, go: 3, key: r.key });
      if (r.on && r.manual && r.autoQty > 0 && Math.abs(r.qty - r.autoQty) / r.autoQty > 0.3)
        yellow.push({ m: `${label}手动数量 ${nf(r.qty)} 和自动算的 ${nf(r.autoQty)} 相差超过30%`, go: 3, key: r.key });
      if (r.on && r.supply === 'customer') yellow.push({ m: `${label}客户自备材料，要跟客户约好送货时间，否则会拖工期`, go: 3, key: r.key });
      if (r.on && PRICE[r.code].needs) PRICE[r.code].needs.forEach(nc => {
        const mates = C.rows.filter(x => x.roomId === r.roomId && x.code === nc);
        if (mates.length && mates.every(x => !x.on)) yellow.push({ m: `${label}做了，但配套的「${PRICE[nc].name}」被关掉了，是不是漏了？`, go: 3 });
      });
    });
    Object.keys(PRICE).forEach(c => { if (priceChanged(c)) yellow.push({ m: `本单改了「${PRICE[c].name}」的单价（不是公司统一价）`, go: 5 }); });

    const pctSum = P.settings.pay.reduce((s, x) => s + num(x.pct), 0);
    if (Math.abs(pctSum - 100) > 0.01) red.push({ m: `付款节点比例加起来是 ${nf(pctSum)}%，必须等于 100%`, go: 5 });
    if (C.discount > 0 && C.before > 0) {
      const pct = C.discount / C.before * 100;
      if (pct > num(P.settings.discountLimit) && !String(P.discountBy || '').trim())
        red.push({ m: `优惠 ${nf(pct)}% 超过 ${nf(P.settings.discountLimit)}%，要填审批人`, go: 4 });
    }
    return { red, yellow };
  }

  // =====================================================================
  //  七、页面渲染
  // =====================================================================
  const STEP_NAMES = ['', '房间尺寸', '必答问题', '核对清单', '报价单', '价目表'];

  function unansweredCount() {
    let n = activeQs().filter(q => ans(q.id).v !== true && ans(q.id).v !== false).length;
    P.rooms.forEach(r => (TYPES[r.type].roomQ || []).forEach(q => { if (r[q.k] !== true && r[q.k] !== false) n++; }));
    return n;
  }

  function renderSteps(K) {
    const redBy = s => K.red.filter(x => x.go === s).length;
    document.getElementById('steps').innerHTML = [1, 2, 3, 4, 5].map(s => {
      let b = '';
      if (s === 2) { const n = unansweredCount(); b = n ? `<span class="bdg">${n}</span>` : '<span class="bdg okb">✓</span>'; }
      else if (s !== 4 && redBy(s)) b = `<span class="bdg">${redBy(s)}</span>`;
      else if (s === 4 && K.red.length) b = `<span class="bdg">${K.red.length}</span>`;
      return `<button class="step-btn ${s === step ? 'active' : ''}" data-step="${s}"><b>${s === 5 ? '⚙' : s}</b>${STEP_NAMES[s]}${b}</button>`;
    }).join('');
  }

  function fld(label, unit, attrs, val, bad, isNum) {
    return `<div class="fld ${bad ? 'bad' : ''}"><label>${label}${unit ? `<span class="u">（${unit}）</span>` : ''}</label>
      <input ${isNum ? 'class="num" inputmode="decimal"' : ''} type="text" ${attrs} value="${esc(val)}"></div>`;
  }

  function renderStep1() {
    const i = P.info;
    let h = houseCard() + planHtml() + `<div class="card"><h2>客户信息</h2>
      <div class="grid2">
        ${houseDef(P.houseType)?.apartment ? fld('单位所在楼层（楼栋）', '', 'data-info="buildingFloor" placeholder="如 18 楼 / Level 18"', i.buildingFloor || '') + fld('楼栋 / 单位号', '', 'data-info="unitNo" placeholder="如 Tower A / 18-08"', i.unitNo || '') : ''}
        ${fld('客户姓名', '', 'data-info="customer"', i.customer, !i.customer.trim())}
        ${fld('电话', '', 'data-info="phone" inputmode="tel"', i.phone)}
        <div class="full">${fld('地址', '', 'data-info="address"', i.address)}</div>
        ${fld('报价顾问', '', 'data-info="staff"', i.staff)}
        ${fld('套内面积（各层合计）', '平方尺', 'data-spa', P.spaArea, false, true)}
        <div class="full segrow"><span style="display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:4px">本户内部有几层</span><div class="seg">
          ${[[1, '单层单位 / 单层住宅'], [2, '2层'], [3, '3层'], [4, '4层']].map(([v, l]) => `<button class="${levels() === v ? 'active' : ''}" data-levels="${v}">${l}</button>`).join('')}</div></div>
      </div>
      <div class="kpi" style="margin-top:10px"><span>室内及阳台面积合计（不含户外/楼梯）</span><b class="mono" data-out="floorsum"></b></div>
      <p class="hint" style="margin:4px 0 0">套内面积按买卖合约(SPA)填，用来算设计费，也用来核对是不是漏了房间。</p>
    </div>
    <div class="card"><h2>马来西亚住宅空间</h2><p class="hint">${houseDef(P.houseType)?.apartment ? '单层公寓所有房间属于同一户内层；复式按户内下层、上层分组。' : '底层 Ground Floor 是第 1 层，楼上 First Floor 是第 2 层。'}规则房间填长宽高；不规则房间点击房间标题旁的「✎ 手绘标尺寸」，可上传手绘图或直接画线，再标注实测尺寸。面积、墙面积、踢脚线长度等由系统计算。有几间就加几间，走廊/过道也要加。</p>`;
    if(usesPlanRooms()) h += roomInventoryHtml(P.rooms);
    const roomCard = r => {
      const T = TYPES[r.type];
      const fitFields = new Set(Object.values(FITOUT).map(x=>x[1]));
      const nums = T.fields.filter(f => !F[f].opts && !fitFields.has(f) && !['doors','win'].includes(f) && !((r.sketch?.points?.length&&!r.sketch.bypass)&&['L','W'].includes(f)) && !(r.sketch?.pointsLinked&&['lights','wpts','pts'].includes(f))), segs = T.fields.filter(f => F[f].opts && f !== 'tileSize');
      const lvSeg = levels() > 1 || (r.level || 1) > 1
        ? `<div class="segrow"><span>在几楼</span><div class="seg">${Array.from({ length: Math.max(levels(), r.level || 1) }, (_, k) => k + 1).map(v =>
            `<button class="${(r.level || 1) === v ? 'active' : ''}" data-room-level="${r.id}" data-v="${v}">${floorName(v)}</button>`).join('')}</div></div>` : '';
      return `<div class="room">
        <div class="room-head"><span class="badge">${T.label}</span><input data-room="${r.id}" data-f="name" value="${esc(r.name)}">
          <span class="area mono" data-out="area-${r.id}"></span><button class="btn-ghost" data-sk-open="${r.id}">✎ 手绘标尺寸</button><button class="x" data-del-room="${r.id}" title="删除房间">✕</button></div>
        <div class="room-body">${sketchHtml(r)}${r.sketch?.points?.length&&!r.sketch.bypass?`<div class="note">${r.sketch.applied?`面积已从手绘自动带入：${nf2(geo(r).floor)} 平方尺；周长 ${nf2(geo(r).perim)} 英尺，无需重复填长宽。`:'正在使用手绘量尺；完成后确认应用面积，无需再填矩形长宽。'}</div>`:''}${r.sketch?.pointsLinked?`<div class="note">图上点位已带入：灯位 ${num(r.lights)}；水点 ${num(r.wpts)}；插座／开关 ${num(r.pts)}。修改请在图上操作并重新确认。</div>`:''}<div class="grid3">
          ${nums.map(f => fld(F[f].label, F[f].unit, `data-room="${r.id}" data-f="${f}"`, r[f], (f === 'L' || f === 'W') && !r.sketch?.applied && !num(r[f]), true)).join('')}
        </div>
        ${segs.map(f => `<div class="segrow"><span>${F[f].label}</span><div class="seg">${F[f].opts.map(([v, l]) =>
          `<button class="${r[f] === v ? 'active' : ''}" data-room-seg="${r.id}" data-f="${f}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}
        <div class="grid3">${fld('现有门洞／门数量','樘',`data-room="${r.id}" data-f="doors"`,r.doors??'',false,true)}${fld('现有窗数量','樘',`data-room="${r.id}" data-f="windowCount"`,r.windowCount??'',false,true)}${fld('现有窗户总宽','尺',`data-room="${r.id}" data-f="win"`,r.win??'',false,true)}</div>
        ${roomBase(r)==='kitchen' ? fld('厨房操作区墙砖铺贴长度','尺',`data-room="${r.id}" data-f="backsplashLength"`,r.backsplashLength ?? r.cabLow ?? '',false,true) : ''}
        ${workHtml(r)}
        ${fitoutHtml(r)}
        ${materialSelects(r)}
        ${lvSeg}
        ${r.planImported ? `<div class="note">来自：${esc(r.planSource.file)} · 第 ${r.planSource.page} 页。${r.planSource.levelEvidence?`源图楼层标题：${esc(r.planSource.levelEvidence)}。`:""}${r.surveyConfirmed?'尺寸已现场复尺确认。':'当前尺寸为图纸参考或待补录，须现场复尺确认。'}点位和设备数量需按实际补充。
          <label style="display:block;margin-top:8px"><input type="checkbox" data-room-surveyed="${r.id}" ${r.surveyConfirmed?'checked':''} ${missingDimensions(r)?'disabled':''}> 已现场复尺并确认本房间尺寸${missingDimensions(r)?'（请先补齐长宽及所需层高）':''}</label><label style="display:block;margin-top:8px"><input type="checkbox" data-room-reviewed="${r.id}" ${r.planReviewed?'checked':''}> 已核对本房间施工范围、设备及点位</label></div>` : ''}
        ${['outdoor','stairs'].includes(roomBase(r)) ? '<p class="hint">此空间不计入室内面积。户外工程在本空间勾选并填写实际施工量；楼梯做法在第②步填写。</p>' : ''}
        </div></div>`;
    };
    const addBar = lv => ROOM_GROUPS.map(([title,ids]) => `<div class="group-title">${title}</div><div class="add-rooms">${ids.map(t=>`<button data-add-room="${t}" data-lv="${lv}">+ ${TYPES[t].label}</button>`).join('')}</div>`).join('');
    const maxLv = Math.max(levels(), ...P.rooms.map(r => r.level || 1));
    if (maxLv === 1) h += P.rooms.map(roomCard).join('') + (usesPlanRooms() ? '' : addBar(1));
    else for (let lv = 1; lv <= maxLv; lv++) {
      const rs = P.rooms.filter(r => (r.level || 1) === lv);
      h += `<div class="level-head"><b>${floorName(lv)}</b><span class="mono" data-out="lvarea-${lv}"></span></div>`
        + (rs.length ? rs.map(roomCard).join('') : '<div class="note" style="margin-bottom:8px">这一层还没有房间</div>') + (usesPlanRooms() ? '' : addBar(lv));
    }
    if(usesPlanRooms()) {
      h += `<div style="margin-top:16px"><button class="btn-ghost" data-extra-rooms aria-expanded="${extraRoomsOpen}" aria-controls="extra-room-options">${extraRoomsOpen?'收起空间分类':'＋补充遗漏空间'}</button>
        ${extraRoomsOpen?`<div id="extra-room-options">${maxLv>1?`<div class="fld" style="margin-top:10px"><label>添加到哪一层<select data-extra-room-level>${Array.from({length:maxLv},(_,i)=>i+1).map(lv=>`<option value="${lv}" ${lv===extraRoomLevel?'selected':''}>${floorName(lv)}</option>`).join('')}</select></label></div>`:''}${addBar(Math.min(extraRoomLevel,maxLv))}</div>`:''}</div>`;
    }
    h += `</div>`;
    return h;
  }

  function ynHtml(v, attrs) {
    return `<div class="yn"><button class="y ${v === true ? 'active' : ''}" ${attrs} data-v="1">是</button><button class="n ${v === false ? 'active' : ''}" ${attrs} data-v="0">否</button></div>`;
  }

  function renderStep2() {
    let h = `<div class="card" style="padding:12px 14px"><p class="hint" style="margin:0">这些问题<b>每一题都要问客户</b>并选"是/否"。红框 = 还没回答。答"是"系统会自动把对应项目和配套项目加进清单，不用自己记。</p></div>`;
    h += serviceHtml();
    h += `<div class="group-title">全屋问题</div>`;
    activeQs().forEach(q => {
      const a = ans(q.id), done = a.v === true || a.v === false;
      h += `<div class="q ${done ? '' : 'todo'}"><div class="q-top"><div><div class="q-text">${q.q}</div>${q.why ? `<div class="q-why">${q.why}</div>` : ''}</div>
        ${ynHtml(a.v, `data-ans="${q.id}"`)}</div>`;
      if (a.v === true && q.inputs) h += `<div class="q-inputs">${q.inputs.map(i => fld(i.label, i.unit, `data-ans-n="${q.id}" data-k="${i.k}"`, a[i.k], !i.optional && !num(a[i.k]), true)).join('')}</div>`;
      if(a.v===true && q.id==='stairs') h+=stairHtml(a);
      if (a.v === true && q.id === 'loadWall') h += `<div class="warnbox">⚠ ${q.why}。系统已自动加上「结构工程师审图签字」。</div>`;
      h += `</div>`;
    });
    const rq = [];
    P.rooms.forEach(r => (TYPES[r.type].roomQ || []).forEach(q => rq.push({ r, q })));
    if (rq.length) {
      h += `<div class="group-title">房间问题</div>`;
      rq.forEach(({ r, q }) => {
        const v = r[q.k], done = v === true || v === false;
        h += `<div class="q ${done ? '' : 'todo'}"><div class="q-top"><div><div class="q-text"><span class="badge">${esc(roomLabel(r))}</span>${q.q}</div><div class="q-why">${q.why}</div></div>
          ${ynHtml(v, `data-rq="${r.id}" data-k="${q.k}"`)}</div></div>`;
      });
    }
    return h;
  }

  function lineHtml(r) {
    const open = expanded.has(r.key);
    const needReason = (!r.on && r.forced && !String(r.st.offReason || '').trim()) || (r.manual && !String(r.st.qtyReason || '').trim());
    const tags = (r.forced ? '<span class="tag req">必做</span>' : '') + (r.supply === 'customer' ? '<span class="tag cust">客户自备</span>' : '') + (r.manual ? '<span class="tag man">手动数量</span>' : '') + (r.pick || r.mOwn ? `<span class="tag pick">${esc(r.pick || '主材自定价')}</span>` : '');
    let h = `<div class="line ${r.on ? '' : 'off'} ${needReason ? 'flag' : ''}">
      <div class="line-main" data-exp="${esc(r.key)}"><div class="line-l">
        <div class="line-title"><span class="badge">${esc(r.roomName)}</span>${esc(r.name)}${tags}</div>

  // 报价单按「房间」或「工序」分组；全屋/公共项目排最前
  function docGroups(C) {
    const rows = C.rows.filter(r => r.on && (r.total > 0 || r.supply === 'customer'));
    const stIdx = id => STAGES.findIndex(s => s.id === id);
    if (P.docGroup === 'stage') {
      return STAGES.map(s => ({ name: s.name, rows: rows.filter(r => r.stage === s.id) })).filter(g => g.rows.length);
    }
    const order = ['全屋'].concat([...P.rooms].sort((a, b) => (a.level || 1) - (b.level || 1)).map(roomLabel));
    rows.forEach(r => { if (!order.includes(r.roomName)) order.push(r.roomName); });
    return order.map(n => ({ name: n === '全屋' ? '全屋 / 公共项目' : n,
      rows: rows.filter(r => r.roomName === n).sort((a, b) => stIdx(a.stage) - stIdx(b.stage)) })).filter(g => g.rows.length);
  }

  // 导出 Excel（CSV 格式，Excel 能直接打开；带 BOM 防中文乱码）
  function exportCsv(C) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const i = P.info, lines = [];
    if (P.docView === 'purchase') {
      lines.push([q('材料采购单'), q(i.quoteNo), q(i.customer)].join(','));
      lines.push(['#', '材料', '单位', '计算用量', '采购数量', '用在哪些项目'].map(q).join(','));
      purchase(C).list.forEach((x, n) => lines.push([n + 1, x.name, x.unit, x.raw.toFixed(2), x.qty, x.uses.join('、')].map(q).join(',')));
      lines.push('');lines.push(['待拆分材料／采购核对项目','空间','施工量','单位','规格／工艺','采购责任'].map(q).join(','));
      purchase(C).pending.forEach(r=>lines.push([r.name,r.roomName,r.qty,r.unit,r.pick||r.desc,r.supply==='customer'?'主材客户自备，辅材另核':'公司采购明细待拆分'].map(q).join(',')));
      return download(lines, `材料采购单_${i.customer || '未命名'}_${i.quoteNo}.csv`);
    }
    lines.push([q('装修工程预算报价单'), q(i.quoteNo), q(i.date)].join(','));
    lines.push([q('客户'), q(i.customer), q('电话'), q(i.phone), q('地址'), q(i.address)].join(','));
    lines.push([q('住宅类型'), q(houseDef(P.houseType)?.name || ''), q('楼栋楼层'), q(i.buildingFloor || ''), q('楼栋/单位'), q(i.unitNo || '')].join(','));
    lines.push('');
    lines.push(['序号', '项目名称', '位置', '单位', '数量', '主材单价', '辅材单价', '人工单价', '单价', '合价', '工艺做法及材料说明'].map(q).join(','));
    docGroups(C).forEach((g, gi) => {
      lines.push([q(gi + 1), q(g.name), '', '', '', '', '', '', '', q(g.rows.reduce((a, r) => a + r.total, 0))].join(','));
      g.rows.forEach((r, ri) => lines.push([gi + 1 + '.' + (ri + 1), r.name, r.roomName, r.unit, r1(r.qty), r.supply === 'customer' ? '甲供' : r.uMat.toFixed(2),
        r.uAux.toFixed(2), r.uLab.toFixed(2), r.uPrice.toFixed(2), r.total, (r.pick ? '主材：' + r.pick + '；' : '') + r.desc].map(q).join(',')));
    });
    lines.push('');
    [['主材', C.material], ['辅材', C.auxSum], ['施工人工', C.hard], ['软装', C.soft], ['设计费', C.design], ['管理费', C.mgmt], ['优惠', -C.discount], ['SST', C.sst], ['工程总造价', C.total]]
      .forEach(([k, v]) => lines.push([q(k), q(v)].join(',')));
    download(lines, `报价单_${i.customer || '未命名'}_${i.quoteNo}.csv`);
  }
  function download(lines, filename) {
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // 整页重画（点按钮、切步骤时用）

    const a = document.activeElement;
    let focusSel = null, caret = null;
    if (a && main.contains(a) && a.matches('input, select')) {
      focusSel = a.tagName.toLowerCase() + [...a.attributes].filter(x => x.name.startsWith('data-')).map(x => `[${x.name}="${CSS.escape(x.value)}"]`).join('');

    main.innerHTML = choosing ? renderChooser() : step === 1 ? renderStep1() : step === 2 ? renderStep2() : step === 3 ? renderStep3(C) : step === 4 ? renderStep4(C, K) : renderStep5();

      const el = main.querySelector(focusSel);
      if (el) { el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) { /* select 没有光标 */ } }
    }

  }
  // 只刷新数字（打字时用，不打断输入）
  function refresh(C, K) {

    const ck = document.getElementById('checks'); if (ck) ck.innerHTML = checksHtml(K);
    const doc = document.getElementById('quote-doc'); if (doc) doc.innerHTML = docHtml(C, K);
    const pb = document.querySelector('[data-print]');
    if (pb) { pb.disabled = !!K.red.length || TEST_MODE; pb.textContent = K.red.length ? `还有 ${K.red.length} 个问题没处理，不能出单` : (TEST_MODE ? '✓ 可以出单（测试版不能打印，正式上线后可打印/存 PDF）' : '打印 / 保存为 PDF 发给客户'); }

    renderSteps(K);
    save();
  }

  // 危险操作点两次才生效（不用弹窗，手机上更好按，也不会误删）
  let pending = null;
  function askTwice(btn, key, label) {
    if (pending && pending.key === key && Date.now() - pending.at < 4000) { pending = null; return true; }
    pending = { key, at: Date.now() };
    const old = btn.textContent; btn.textContent = label; btn.style.color = 'var(--red)';
    setTimeout(() => { if (btn.isConnected) { btn.textContent = old; btn.style.color = ''; } }, 4000);
    return false;
  }

    if(ds.skRoom){const r=P.rooms.find(r=>r.id===ds.skRoom);if(!r)return;const s=sketchData(r);if(ds.skField){s[ds.skField]=v;if(ds.skField==='tool'){render();return;}}else if(ds.skLength!==undefined)s.lengths[+ds.skLength]=v;else if(ds.skPoint!==undefined){s.coords[+ds.skPoint]=s.coords[+ds.skPoint]||{};s.coords[+ds.skPoint][ds.skAxis]=v;}else return;invalidateSketch(r);}
    else if(ds.catalogField){catalogDraft[ds.catalogField]=v;if(ds.catalogField==='code'){catalogDraft.unit=PRICE[v].unit;catalogDraft.materialUnit=PRICE[v].unit;}}
    else if(ds.tileRoom){const r=P.rooms.find(r=>r.id===ds.tileRoom);if(r){r.tileConfig=r.tileConfig||{};const c=r.tileConfig[ds.tileCode]=r.tileConfig[ds.tileCode]||{areaMode:'auto',areaUnit:'ft2',rateUnit:'ft2',waste:0};c[ds.f]=v;if(r.planImported)r.planReviewed=false;}}
    else if(ds.workQty){const r=P.rooms.find(r=>r.id===ds.workQty);if(r){r.workQty=r.workQty||{};r.workQty[ds.workCode]=v;if(r.planImported)r.planReviewed=false;}}
    else if(ds.fitRoom) {const r=P.rooms.find(r=>r.id===ds.fitRoom);if(r){r.fitout=r.fitout||{};const st=r.fitout[ds.fitCode]=r.fitout[ds.fitCode]||{};st[ds.f]=v;if(r.planImported)r.planReviewed=false;}}
    else if (ds.info) P.info[ds.info] = v;
    else if (t.hasAttribute('data-spa')) P.spaArea = v;
    else if (ds.room) { const r = P.rooms.find(x => x.id === ds.room); if (r) { r[ds.f] = v; if (ds.f === 'wallBrand') r.wallSeries = ''; if (ds.f === 'wallWork' && ['living','bedroom','other'].includes(roomBase(r))) r.wallFinish = v.startsWith('墙纸') ? 'wallpaper' : v.startsWith('艺术漆') ? 'art' : 'paint'; if (r.planImported) {r.planReviewed = false; if(['L','W','H'].includes(ds.f)) r.surveyConfirmed=false;} } }
    else if (ds.ansN) { const a=P.answers[ds.ansN]=P.answers[ds.ansN]||{};a[ds.k]=v;if(ds.ansN==='stairs' && ds.k==='material'){delete a.tileMethod;delete a.hang;delete a.woodType;delete a.stoneType;delete a.other;} }
    else if (ds.line) {
      const s = lineState(ds.line);
      if (ds.f === 'qty' && v.trim() === '') delete s.qty; else s[ds.f] = v;
    }
    else if (ds.custom) { const c = P.custom.find(x => x.id === ds.custom); if (c) c[ds.f] = v; }
    else if (ds.price) { (P.prices[ds.price] = P.prices[ds.price] || {})[ds.f] = v; }
    else if (ds.set) P.settings[ds.set] = v;
    else if (ds.pay) P.settings.pay[+ds.pay][ds.f] = v;
    else if (ds.top) P[ds.top] = v;
    else return;
    refresh();
  });
  // 离开输入框时整体重画一次（更新红框、"必填原因"输入框的出现/消失等）
  // 等焦点落到下一个框之后再重画，重画后再把焦点放回那个框
  document.addEventListener('change', e => { if (e.target.matches('input, select')) setTimeout(render, 0); });

  if(P.rooms.some(r=>r.workLegacy)){const originalRows=gen();P.rooms.filter(r=>r.workLegacy).forEach(r=>{r.work=Object.fromEntries(originalRows.filter(x=>x.roomId===r.id&&!FITOUT[x.code]&&!P.lines[x.key]?.off).map(x=>[x.code,true]));delete r.workLegacy;});}
  render();
})();
</script>
