<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — 店员后台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#1a3a2a','gg':'#2d5e43','gd':'#c8a96e','gc':'#f5f2ed'}}}}</script>
<style>
  .nav-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/10 hover:text-white transition cursor-pointer; }
  .nav-link.active { @apply bg-white/15 text-white font-semibold; }
  .card { @apply bg-white rounded-xl shadow-sm border border-gray-100; }
  .btn-primary { @apply px-4 py-2 bg-hg text-white text-sm font-semibold rounded-lg hover:bg-gg transition; }
  .btn-gold { @apply px-4 py-2 bg-gd text-hg text-sm font-semibold rounded-lg hover:brightness-110 transition; }
  .input { @apply w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm; }
  .label { @apply block text-xs font-medium text-gray-600 mb-1; }
  [x-cloak] { display: none; }
  /* Brand VI focus — override iOS Safari blue ring */
  input, select, textarea {
    -webkit-tap-highlight-color: rgba(26,58,42,0.1);
  }
  input:focus, select:focus, textarea:focus {
    outline: none !important;
    -webkit-appearance: none;
    border-color: #1a3a2a !important;
    box-shadow: 0 0 0 3px rgba(26,58,42,0.25) !important;
    -webkit-box-shadow: 0 0 0 3px rgba(26,58,42,0.25) !important;
  }
  select { cursor: pointer; }
  select option:checked { background-color: #1a3a2a; color: #ffffff; }
  @keyframes overduePulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.6; }
  }
  .row-overdue-badge { animation: overduePulse 1.5s ease-in-out infinite; }
  .row-warn    { background: #fffbeb; }
  @keyframes cdTick {
    0%   { transform: scale(1);    opacity: 1; }
    30%  { transform: scale(1.12); opacity: 0.7; }
    100% { transform: scale(1);    opacity: 1; }
  }
  .cd-tick { animation: cdTick 0.35s ease-out; display:inline-block; }
  @media print { body * { visibility: hidden; } #pdf-preview, #pdf-preview * { visibility: visible; } #pdf-preview { position:fixed;top:0;left:0;width:100%;z-index:9999; } }
  /* Responsive order list layout — used in JS-generated HTML so must live here not in Tailwind classes */
  .ord-desktop { display:none; }
  .ord-mobile  { display:block; }
  @media (min-width:768px) { .ord-desktop { display:block; } .ord-mobile { display:none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gc min-h-screen" style="font-family:'Noto Sans SC',sans-serif">

<!-- Mobile Top Bar -->
<div class="md:hidden bg-hg flex items-center justify-between px-4 h-14 fixed top-0 left-0 right-0 z-30">
  <a href="/" class="flex items-center gap-2">
    <div class="w-7 h-7 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
    <span class="text-white font-bold text-sm">HOUZY HOME</span>
  </a>
  <button onclick="toggleMobileMenu()" class="text-white p-2">
    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</div>

<!-- Mobile Sidebar Overlay -->
<div id="mobile-overlay" class="hidden fixed inset-0 z-40 md:hidden">
  <div class="absolute inset-0 bg-black/50" onclick="toggleMobileMenu()"></div>
  <aside class="absolute left-0 top-0 bottom-0 w-64 bg-hg flex flex-col">
    <div class="px-4 py-5 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
        <div class="text-white font-bold text-sm">HOUZY HOME</div>
      </div>
      <button onclick="toggleMobileMenu()" class="text-gray-400 hover:text-white">✕</button>
    </div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <div class="nav-link" onclick="goto('dashboard');toggleMobileMenu()">🏠 <span data-i18n="nav_dashboard">总览</span></div>
      <div class="nav-link" onclick="goto('orders');toggleMobileMenu()">📋 <span data-i18n="nav_orders">订单管理</span></div>
      <div class="nav-link" onclick="goto('create');toggleMobileMenu()">＋ <span data-i18n="nav_new">新建订单</span></div>
      <div class="nav-link" onclick="goto('customers');toggleMobileMenu()">👤 <span data-i18n="nav_customers">客户管理</span></div>
      <div class="nav-link hidden admin-nav" data-perm="registrations" onclick="goto('registrations');toggleMobileMenu()">📝 <span>注册审核</span><span id="reg-badge-m" class="hidden ml-1 bg-red-500 text-white text-xs rounded-full px-1.5">0</span></div>
      <div class="nav-link hidden admin-nav" data-perm="users" onclick="goto('users');toggleMobileMenu()">👥 <span>用户管理</span></div>
      <!-- Language selector -->
      <div class="relative mt-2">
        <button onclick="toggleMobileLangDrop()" class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-xs text-gray-400 hover:bg-white/10 hover:text-white transition">
          🌐 <span id="m-lang-label">简体中文</span>
          <svg class="w-3 h-3 ml-auto opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="m-lang-drop" class="hidden absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-xl z-50 py-1 overflow-hidden">
          <button onclick="setLang('en');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
          <button onclick="setLang('zh-CN');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
          <button onclick="setLang('zh-TW');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁体中文</button>
          <button onclick="setLang('ms');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
          <button onclick="setLang('th');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
        </div>
      </div>
    </nav>
    <div class="p-3 border-t border-white/10">
      <div id="mobile-user-info" class="text-xs text-gray-400 mb-2 px-2"></div>
      <button onclick="logout()" class="nav-link w-full text-red-400">🚪 <span data-i18n="nav_logout">退出</span></button>
    </div>
  </aside>
</div>

<!-- Layout -->
<div class="flex h-screen overflow-hidden pt-14 md:pt-0">

  <!-- Sidebar -->
  <aside id="sidebar" class="hidden md:flex w-56 bg-hg flex-shrink-0 flex-col">
    <!-- Logo -->
    <div class="px-4 py-5 border-b border-white/10">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
        <div>
          <div class="text-white font-bold text-sm tracking-wide">HOUZY HOME</div>
          <div class="text-gd text-xs" data-i18n="sidebar_title">店员后台</div>
        </div>
      </a>
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <div class="nav-link active" id="nav-dashboard" onclick="goto('dashboard')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span data-i18n="nav_dashboard">总览</span>
      </div>
      <div class="nav-link" id="nav-orders" onclick="goto('orders')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span data-i18n="nav_orders">订单管理</span>
      </div>
      <div class="nav-link" id="nav-create" onclick="goto('create')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span data-i18n="nav_new">新建订单</span>
      </div>
      <div class="nav-link" id="nav-customers" onclick="goto('customers')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span data-i18n="nav_customers">客户管理</span>
      </div>
      <div class="nav-link hidden admin-nav" id="nav-registrations" data-perm="registrations" onclick="goto('registrations')">
        📝 <span>注册审核</span><span id="reg-badge" class="hidden ml-1 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
      </div>
      <div class="nav-link hidden admin-nav" id="nav-users" data-perm="users" onclick="goto('users')">
        👥 <span>用户管理</span>
      </div>
    </nav>

    <!-- User info + Language picker -->
    <div class="p-3 border-t border-white/10">
      <!-- Language selector -->
      <div class="relative mb-1">
        <button onclick="toggleLangDrop()" class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-xs text-gray-400 hover:bg-white/10 hover:text-white transition">
          🌐 <span id="lang-label">简体中文</span>
          <svg class="w-3 h-3 ml-auto opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="lang-drop" class="hidden absolute bottom-full left-0 right-0 mb-1 bg-white rounded-lg shadow-xl z-50 py-1 overflow-hidden">
          <button onclick="setLang('en')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
          <button onclick="setLang('zh-CN')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
          <button onclick="setLang('zh-TW')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁体中文</button>
          <button onclick="setLang('ms')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
          <button onclick="setLang('th')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
        </div>
      </div>
      <div id="user-info" class="text-xs text-gray-400 mb-2 px-2"></div>
      <button onclick="logout()" class="nav-link w-full text-red-400 hover:text-red-300 hover:bg-red-900/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span data-i18n="nav_logout">退出</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">

    <!-- ── DASHBOARD ── -->
    <div id="v-dashboard" class="p-6 max-w-5xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-6" data-i18n="dash_title">总览 Dashboard</h1>
      <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold text-gray-800" data-i18n="dash_recent">最近订单</h2>
          <button onclick="goto('orders')" class="text-xs text-hg hover:underline" data-i18n="dash_view_all">查看全部 →</button>
        </div>
        <div id="recent-orders"></div>
      </div>
    </div>

    <!-- ── ORDERS LIST ── -->
    <div id="v-orders" class="hidden p-6 max-w-5xl mx-auto">
      <div class="flex items-center justify-between mb-5">
        <h1 class="text-xl font-bold text-gray-800" data-i18n="orders_title">订单管理</h1>
        <button onclick="goto('create')" class="btn-gold" data-i18n="orders_new_btn">+ 新建订单</button>
      </div>
      <!-- Filters -->
      <div class="card p-4 mb-4 space-y-2">
        <!-- Row 1: search + status -->
        <div class="flex flex-wrap gap-2">
          <input type="text" id="f-search" placeholder="搜索订单号 / 客户" oninput="filterOrders()" data-i18n-ph="filter_search"
                 class="input flex-1 min-w-40">
          <select id="f-status" onchange="filterOrders()" class="input w-32">
            <option value="">全部状态</option>
            <option value="pending_payment" data-i18n-opt="status_pending_payment">待付款</option>
            <option value="paid" data-i18n-opt="status_paid">已付款</option>
            <option value="in_production" data-i18n-opt="status_in_production">生产中</option>
            <option value="shipped" data-i18n-opt="status_shipped">已发货</option>
            <option value="arrived" data-i18n-opt="status_arrived">已到货</option>
            <option value="installing" data-i18n-opt="status_installing">安装中</option>
            <option value="completed" data-i18n-opt="status_completed">已完成</option>
            <option value="after_sales" data-i18n-opt="status_after_sales">质保服务</option>
            <option value="closed" data-i18n-opt="status_closed">已关闭</option>
            <option value="cancelled" data-i18n-opt="status_cancelled">已取消</option>
          </select>
        </div>
        <!-- Row 2: store + date + month -->
        <div class="flex flex-wrap gap-2 items-center">
          <select id="f-store" onchange="filterOrders()" class="input w-36 hidden" title="门店筛选">
            <option value="">全部门店</option>
          </select>
          <input type="date" id="f-date" onchange="onDateChange('date')" class="input w-40" title="按日期查询">
          <input type="month" id="f-month" onchange="onDateChange('month')" class="input w-36" title="按月查询">
          <button onclick="clearDateFilters()" class="text-xs text-gray-400 hover:text-gray-600 px-2 py-1 border border-gray-200 rounded" data-i18n="filter_clear_date">清除日期</button>
        </div>
      </div>
      <!-- Monthly Stats Panel -->
      <div id="monthly-stats" class="hidden card p-4 mb-4"></div>
      <div class="card overflow-hidden overflow-x-auto">
        <div id="orders-table"></div>
      </div>
    </div>

    <!-- ── CREATE ORDER ── -->
    <div id="v-create" class="hidden p-6 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="goto('orders')" class="text-gray-400 hover:text-gray-600">←</button>
        <h1 class="text-xl font-bold text-gray-800" data-i18n="create_title">新建订单</h1>
      </div>

      <!-- Step 1: Customer -->
      <div id="step-customer" class="card p-6 mb-4">
        <h2 class="font-semibold text-gray-800 mb-4" data-i18n="create_step1">1. 客户信息</h2>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_country">国家区号 *</label>
          <select id="c-country" class="input">
            <option value="">— 请选择国家区号 —</option>
            <option value="60">🇲🇾 马来西亚 +60</option>
            <option value="65">🇸🇬 新加坡 +65</option>
            <option value="86">🇨🇳 中国 +86</option>
            <option value="62">🇮🇩 印尼 +62</option>
            <option value="66">🇹🇭 泰国 +66</option>
            <option value="63">🇵🇭 菲律宾 +63</option>
            <option value="84">🇻🇳 越南 +84</option>
            <option value="673">🇧🇳 文莱 +673</option>
            <option value="886">🇹🇼 台湾 +886</option>
            <option value="852">🇭🇰 香港 +852</option>
            <option value="81">🇯🇵 日本 +81</option>
            <option value="82">🇰🇷 韩国 +82</option>
            <option value="91">🇮🇳 印度 +91</option>
            <option value="61">🇦🇺 澳洲 +61</option>
            <option value="1">🇺🇸 美国/加拿大 +1</option>
            <option value="44">🇬🇧 英国 +44</option>
            <option value="971">🇦🇪 阿联酋 +971</option>
            <option value="966">🇸🇦 沙特 +966</option>
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" data-i18n="lbl_phone">手机号码 *</label>
            <input type="tel" id="c-phone" placeholder="10-1234 5678" oninput="debounceSearch(); validatePhone()" class="input">
            <p id="phone-err" class="hidden text-xs text-red-500 mt-1"></p>
          </div>
          <div>
            <label class="label" data-i18n="lbl_name">姓名 *</label>
            <input type="text" id="c-name" placeholder="客户姓名" data-i18n-ph="ph_name" class="input">
          </div>
        </div>
        <div id="customer-found" class="hidden rounded-lg p-3 text-sm mb-3" style="background:#d6e8db;color:#1a3a2a;border:1px solid #aed0b8"></div>
        <div>
          <label class="label" data-i18n="lbl_address">地址</label>
          <input type="text" id="c-address" placeholder="配送地址（选填）" data-i18n-ph="ph_address" class="input">
        </div>
      </div>

      <!-- Supplement order: read-only customer summary (replaces step-customer) -->
      <div id="supplement-customer-info" class="hidden card p-4 mb-4 flex items-center gap-3" style="border-left:3px solid #c8a96e">
        <span class="text-xl">👤</span>
        <div>
          <div class="text-xs text-gray-400 mb-0.5">补件单关联客户</div>
          <div id="supplement-customer-text" class="font-medium text-gray-800 text-sm"></div>
        </div>
      </div>

      <!-- Step 2: Order Items -->
      <div class="card p-6 mb-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold text-gray-800">2. 商品明细</h2>
          <button type="button" onclick="addItemRow()"
                  class="text-sm font-medium flex items-center gap-1" style="color:#c8a96e">
            <span class="text-lg leading-none">+</span> 添加商品
          </button>
        </div>
        <div class="text-xs text-gray-400 mb-3">名称、数量、单价填写后自动合计到订单金额</div>
        <datalist id="staff-product-datalist"></datalist>
        <div id="items-list" class="mb-3"></div>
        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
          <span class="text-sm text-gray-500">商品合计</span>
          <span id="items-total" class="font-bold text-hg text-base">MYR 0.00</span>
        </div>
      </div>

      <!-- Step 3: Order details -->
      <div class="card p-6 mb-4">
        <h2 class="font-semibold text-gray-800 mb-4" data-i18n="create_step2">3. 订单信息</h2>
        <select id="o-store" class="hidden" onchange="autoSetCurrency()">
          <option value="">— 请选择 —</option>
        </select>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_amount">订单金额 *</label>
          <div class="flex gap-1">
              <select id="o-currency" class="input w-28 flex-shrink-0">
                <option value="MYR">🇲🇾 MYR</option>
                <option value="SGD">🇸🇬 SGD</option>
                <option value="THB">🇹🇭 THB</option>
                <option value="IDR">🇮🇩 IDR</option>
                <option value="PHP">🇵🇭 PHP</option>
                <option value="VND">🇻🇳 VND</option>
                <option value="CNY">🇨🇳 CNY</option>
                <option value="HKD">🇭🇰 HKD</option>
                <option value="USD">🇺🇸 USD</option>
              </select>
              <input type="number" id="o-amount" placeholder="0.00" min="0" step="0.01" data-i18n-ph="ph_amount" oninput="updateSplitAmounts()" class="input flex-1 min-w-0">
            </div>
        </div>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_desc">套餐/项目描述</label>
          <input type="text" id="o-desc" placeholder="如：品质套餐 120m²" data-i18n-ph="ph_desc" class="input">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" data-i18n="lbl_referrer">推荐人</label>
            <select id="o-referrer" class="input">
              <option value="">无推荐人</option>
            </select>
          </div>
        </div>
        <!-- Installment Plan -->
        <div class="mb-3">
          <label class="label">付款计划</label>
          <div class="flex gap-2 mb-2">
            <button type="button" id="inst-btn-1" onclick="setInstallments(1)"
                    class="flex-1 py-1.5 rounded-lg text-sm font-semibold border-2 border-hg bg-hg text-white">全款</button>
            <button type="button" id="inst-btn-2" onclick="setInstallments(2)"
                    class="flex-1 py-1.5 rounded-lg text-sm font-semibold border-2 border-gray-200 text-gray-600">2期</button>
            <button type="button" id="inst-btn-3" onclick="setInstallments(3)"
                    class="flex-1 py-1.5 rounded-lg text-sm font-semibold border-2 border-gray-200 text-gray-600">3期</button>
          </div>
          <div id="inst-splits" class="space-y-2 bg-gray-50 rounded-lg p-3 text-sm"></div>
        </div>
        <!-- Fulfillment Mode -->
        <div class="mb-3">
          <label class="label">安装方式</label>
          <div class="flex gap-2 mb-1">
            <button type="button" id="fm-btn-all" onclick="setFulfillmentMode('all_together')"
                    class="flex-1 py-1.5 rounded-lg text-sm font-semibold border-2 border-hg bg-hg text-white">等齐安装</button>
            <button type="button" id="fm-btn-phased" onclick="setFulfillmentMode('phased')"
                    class="flex-1 py-1.5 rounded-lg text-sm font-semibold border-2 border-gray-200 text-gray-600">分批安装</button>
          </div>
          <div id="fulfillment-mode-hint" class="text-xs text-amber-600"></div>
          <input type="hidden" id="o-fulfillment-mode" value="all_together">
        </div>
        <div>
          <label class="label" data-i18n="lbl_notes">备注</label>
          <textarea id="o-notes" rows="2" placeholder="内部备注（客户不可见）" data-i18n-ph="ph_notes" class="input resize-none"></textarea>
        </div>
      </div>

      <!-- Supplement order: liability section (hidden for normal orders) -->
      <div id="supplement-liability" class="hidden card p-6 mb-4" style="border-left:3px solid #ef4444">
        <h2 class="font-semibold text-gray-800 mb-4">4. 责任与亏损</h2>
        <div class="mb-3">
          <label class="label">责任方</label>
          <select id="o-liability-party" class="input">
            <option value="supplier">供应商承担</option>
            <option value="store">店面承担</option>
            <option value="shared">双方协商</option>
          </select>
        </div>
        <div>
          <label class="label">店面亏损金额（若店面承担或双方协商填写）</label>
          <input type="number" id="o-loss-amount" placeholder="0.00" min="0" step="0.01" class="input">
        </div>
      </div>

      <button onclick="submitOrder()" id="submit-btn" class="btn-gold w-full py-3 text-base" data-i18n="create_btn">
        创建订单
      </button>
      <p id="create-err" class="text-red-500 text-sm mt-2 text-center hidden"></p>
    </div>

    <!-- ── CUSTOMERS ── -->
    <div id="v-customers" class="hidden p-6 max-w-5xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-5" data-i18n="customers_title">客户管理</h1>
      <div class="card p-4 mb-4">
        <input type="text" id="cust-search" placeholder="搜索姓名 / 手机号" oninput="filterCustomers()" data-i18n-ph="cust_search"
               class="input max-w-sm">
      </div>
      <div class="card overflow-hidden">
        <div id="customers-table"></div>
      </div>
    </div>

    <!-- ── ORDER DETAIL ── -->
    <div id="v-detail" class="hidden p-6 max-w-3xl mx-auto">
      <div class="flex items-center gap-3 mb-5">
        <button id="detail-back" onclick="goto('orders')" class="text-gray-400 hover:text-gray-600">←</button>
        <h1 class="text-xl font-bold text-gray-800">订单详情</h1>
      </div>
      <div id="detail-content"></div>
    </div>


    <!-- ── REGISTRATIONS (admin only) ── -->
    <div id="v-registrations" class="hidden p-6 max-w-3xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-2">注册审核</h1>
      <!-- status filter tabs -->
      <div id="reg-filter" class="flex gap-2 mb-4">
        <button onclick="setRegFilter('pending')" id="rf-pending" class="px-3 py-1 rounded-full text-xs font-medium bg-hg text-white">待审核</button>
        <button onclick="setRegFilter('approved')" id="rf-approved" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">已通过</button>
        <button onclick="setRegFilter('rejected')" id="rf-rejected" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">已拒绝</button>
      </div>
      <div id="registrations-list" class="space-y-3"></div>
    </div>

    <!-- ── USER MANAGEMENT (L3+) ── -->
    <div id="v-users" class="hidden p-4 md:p-6 max-w-3xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-4">用户管理</h1>
      <!-- Tabs -->
      <div class="flex gap-1 mb-5 border-b border-gray-200">
        <button id="utab-btn-staff" onclick="switchUserTab('staff')"
                class="hidden px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 -mb-px hover:text-gray-800 transition">
          👤 员工
        </button>
        <button id="utab-btn-supplier" onclick="switchUserTab('supplier')"
                class="px-4 py-2 text-sm font-medium border-b-2 border-hg text-hg -mb-px">
          🏭 供应商
        </button>
      </div>

      <!-- ── Staff tab ── -->
      <div id="utab-staff" class="hidden">
        <div class="mb-4">
          <input id="user-search" type="text" placeholder="搜索姓名/手机号…"
                 oninput="filterUsers(this.value)"
                 class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-hg w-full sm:w-64">
        </div>
        <div id="users-list" class="space-y-3"></div>
        <div id="user-op-log-wrap" class="hidden mt-6">
          <h2 class="text-sm font-semibold text-gray-500 mb-2">操作日志</h2>
          <div id="user-op-log" class="bg-white rounded-xl border border-gray-100 shadow-sm divide-y divide-gray-100"></div>
        </div>
      </div>

      <!-- ── Supplier tab ── -->
      <div id="utab-supplier">
        <!-- Add supplier form -->
        <div class="card p-4 mb-4">
          <h2 class="text-sm font-semibold text-gray-700 mb-3" data-i18n="sup_add">添加供应商</h2>
          <div class="flex flex-wrap gap-2 mb-3">
            <input type="text" id="sup-name" placeholder="供应商名称 *" data-i18n-ph="th_name" class="input flex-1 min-w-36">
            <input type="tel" id="sup-phone" placeholder="联系电话" data-i18n-ph="th_phone" class="input w-36">
            <select id="sup-tier" class="input w-28">
              <option value="3">⭐⭐⭐</option>
              <option value="2" selected>⭐⭐</option>
              <option value="1">⭐</option>
            </select>
          </div>
          <div class="mb-3">
            <p class="text-xs text-gray-500 mb-1.5">专业供应产品类型（可多选）</p>
            <div class="flex flex-wrap gap-x-4 gap-y-1.5">
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="WY"><span class="text-xs text-gray-700">卫浴</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="CG"><span class="text-xs text-gray-700">橱柜</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="DB"><span class="text-xs text-gray-700">地板/地砖</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="DJ"><span class="text-xs text-gray-700">灯具</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="MC"><span class="text-xs text-gray-700">门窗</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="JJ"><span class="text-xs text-gray-700">家具</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="WJ"><span class="text-xs text-gray-700">五金</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="DQ"><span class="text-xs text-gray-700">电器</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="TL"><span class="text-xs text-gray-700">涂料/壁纸</span></label>
              <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="sup-pt-check accent-yellow-600" value="QT"><span class="text-xs text-gray-700">其他</span></label>
            </div>
          </div>
          <button onclick="addSupplier()" class="btn-gold px-4 py-2" data-i18n="sup_add_btn">添加</button>
          <p id="sup-err" class="text-red-500 text-xs mt-2 hidden"></p>
        </div>
        <!-- Suppliers list -->
        <div class="card overflow-hidden">
          <div id="suppliers-table"></div>
        </div>
      </div>
    </div>

  </main>
</div>
