<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — 店员后台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#1a3a2a','gg':'#2d5e43','gd':'#c8a96e','gc':'#f5f2ed'}}}}</script>
<style>
  .nav-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-gray-300 hover:bg-white/10 hover:text-white transition cursor-pointer; }
  .nav-link.active { @apply bg-white/15 text-white font-semibold; }
  .card { @apply bg-white rounded-xl shadow-sm border border-gray-100; }
  .btn-primary { @apply px-4 py-2 bg-hg text-white text-sm font-semibold rounded-lg hover:bg-gg transition; }
  .btn-gold { @apply px-4 py-2 bg-gd text-hg text-sm font-semibold rounded-lg hover:brightness-110 transition; }
  .input { @apply w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm; }
  .label { @apply block text-xs font-medium text-gray-600 mb-1; }
  [x-cloak] { display: none; }
  /* Brand VI focus — override iOS Safari blue ring */
  input, select, textarea {
    -webkit-tap-highlight-color: rgba(26,58,42,0.1);
  }
  input:focus, select:focus, textarea:focus {
    outline: none !important;
    -webkit-appearance: none;
    border-color: #1a3a2a !important;
    box-shadow: 0 0 0 3px rgba(26,58,42,0.25) !important;
    -webkit-box-shadow: 0 0 0 3px rgba(26,58,42,0.25) !important;
  }
  select { cursor: pointer; }
  select option:checked { background-color: #1a3a2a; color: #ffffff; }
</style>
</head>
<body class="bg-gc min-h-screen" style="font-family:'Noto Sans SC',sans-serif">

<!-- Mobile Top Bar -->
<div class="md:hidden bg-hg flex items-center justify-between px-4 h-14 fixed top-0 left-0 right-0 z-30">
  <a href="/" class="flex items-center gap-2">
    <div class="w-7 h-7 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
    <span class="text-white font-bold text-sm">HOUZY HOME</span>
  </a>
  <button onclick="toggleMobileMenu()" class="text-white p-2">
    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</div>

<!-- Mobile Sidebar Overlay -->
<div id="mobile-overlay" class="hidden fixed inset-0 z-40 md:hidden">
  <div class="absolute inset-0 bg-black/50" onclick="toggleMobileMenu()"></div>
  <aside class="absolute left-0 top-0 bottom-0 w-64 bg-hg flex flex-col">
    <div class="px-4 py-5 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
        <div class="text-white font-bold text-sm">HOUZY HOME</div>
      </div>
      <button onclick="toggleMobileMenu()" class="text-gray-400 hover:text-white">✕</button>
    </div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <div class="nav-link" onclick="goto('dashboard');toggleMobileMenu()">🏠 <span data-i18n="nav_dashboard">总览</span></div>
      <div class="nav-link" onclick="goto('orders');toggleMobileMenu()">📋 <span data-i18n="nav_orders">订单管理</span></div>
      <div class="nav-link" onclick="goto('create');toggleMobileMenu()">＋ <span data-i18n="nav_new">新建订单</span></div>
      <div class="nav-link" onclick="goto('customers');toggleMobileMenu()">👤 <span data-i18n="nav_customers">客户管理</span></div>
      <div class="nav-link hidden admin-nav" onclick="goto('suppliers');toggleMobileMenu()">🏭 <span data-i18n="nav_suppliers">供应商管理</span></div>
      <!-- Language selector -->
      <div class="relative mt-2">
        <button onclick="toggleMobileLangDrop()" class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-xs text-gray-400 hover:bg-white/10 hover:text-white transition">
          🌐 <span id="m-lang-label">简体中文</span>
          <svg class="w-3 h-3 ml-auto opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="m-lang-drop" class="hidden absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-xl z-50 py-1 overflow-hidden">
          <button onclick="setLang('en');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
          <button onclick="setLang('zh-CN');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
          <button onclick="setLang('zh-TW');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁体中文</button>
          <button onclick="setLang('ms');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
          <button onclick="setLang('th');toggleMobileMenu()" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
        </div>
      </div>
    </nav>
    <div class="p-3 border-t border-white/10">
      <div id="mobile-user-info" class="text-xs text-gray-400 mb-2 px-2"></div>
      <button onclick="logout()" class="nav-link w-full text-red-400">🚪 <span data-i18n="nav_logout">退出</span></button>
    </div>
  </aside>
</div>

<!-- Layout -->
<div class="flex h-screen overflow-hidden pt-14 md:pt-0">

  <!-- Sidebar -->
  <aside id="sidebar" class="hidden md:flex w-56 bg-hg flex-shrink-0 flex-col">
    <!-- Logo -->
    <div class="px-4 py-5 border-b border-white/10">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
        <div>
          <div class="text-white font-bold text-sm tracking-wide">HOUZY HOME</div>
          <div class="text-gd text-xs" data-i18n="sidebar_title">店员后台</div>
        </div>
      </a>
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <div class="nav-link active" id="nav-dashboard" onclick="goto('dashboard')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span data-i18n="nav_dashboard">总览</span>
      </div>
      <div class="nav-link" id="nav-orders" onclick="goto('orders')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span data-i18n="nav_orders">订单管理</span>
      </div>
      <div class="nav-link" id="nav-create" onclick="goto('create')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span data-i18n="nav_new">新建订单</span>
      </div>
      <div class="nav-link" id="nav-customers" onclick="goto('customers')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span data-i18n="nav_customers">客户管理</span>
      </div>
      <div class="nav-link hidden admin-nav" id="nav-suppliers" onclick="goto('suppliers')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        <span data-i18n="nav_suppliers">供应商管理</span>
      </div>
    </nav>

    <!-- User info + Language picker -->
    <div class="p-3 border-t border-white/10">
      <!-- Language selector -->
      <div class="relative mb-1">
        <button onclick="toggleLangDrop()" class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-xs text-gray-400 hover:bg-white/10 hover:text-white transition">
          🌐 <span id="lang-label">简体中文</span>
          <svg class="w-3 h-3 ml-auto opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="lang-drop" class="hidden absolute bottom-full left-0 right-0 mb-1 bg-white rounded-lg shadow-xl z-50 py-1 overflow-hidden">
          <button onclick="setLang('en')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
          <button onclick="setLang('zh-CN')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
          <button onclick="setLang('zh-TW')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁体中文</button>
          <button onclick="setLang('ms')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
          <button onclick="setLang('th')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
        </div>
      </div>
      <div id="user-info" class="text-xs text-gray-400 mb-2 px-2"></div>
      <button onclick="logout()" class="nav-link w-full text-red-400 hover:text-red-300 hover:bg-red-900/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span data-i18n="nav_logout">退出</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">

    <!-- ── DASHBOARD ── -->
    <div id="v-dashboard" class="p-6 max-w-5xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-6" data-i18n="dash_title">总览 Dashboard</h1>
      <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold text-gray-800" data-i18n="dash_recent">最近订单</h2>
          <button onclick="goto('orders')" class="text-xs text-hg hover:underline" data-i18n="dash_view_all">查看全部 →</button>
        </div>
        <div id="recent-orders"></div>
      </div>
    </div>

    <!-- ── ORDERS LIST ── -->
    <div id="v-orders" class="hidden p-6 max-w-5xl mx-auto">
      <div class="flex items-center justify-between mb-5">
        <h1 class="text-xl font-bold text-gray-800" data-i18n="orders_title">订单管理</h1>
        <button onclick="goto('create')" class="btn-gold" data-i18n="orders_new_btn">+ 新建订单</button>
      </div>
      <!-- Filters -->
      <div class="card p-4 mb-4 space-y-2">
        <!-- Row 1: search + status -->
        <div class="flex flex-wrap gap-2">
          <input type="text" id="f-search" placeholder="搜索订单号 / 客户" oninput="filterOrders()" data-i18n-ph="filter_search"
                 class="input flex-1 min-w-40">
          <select id="f-status" onchange="filterOrders()" class="input w-32">
            <option value="">全部状态</option>
            <option value="pending_payment" data-i18n-opt="status_pending_payment">待付款</option>
            <option value="paid" data-i18n-opt="status_paid">已付款</option>
            <option value="in_production" data-i18n-opt="status_in_production">生产中</option>
            <option value="shipped" data-i18n-opt="status_shipped">已发货</option>
            <option value="arrived" data-i18n-opt="status_arrived">已到货</option>
            <option value="installing" data-i18n-opt="status_installing">安装中</option>
            <option value="completed" data-i18n-opt="status_completed">已完成</option>
            <option value="after_sales" data-i18n-opt="status_after_sales">售后中</option>
            <option value="closed" data-i18n-opt="status_closed">已关闭</option>
          </select>
        </div>
        <!-- Row 2: store + date + month -->
        <div class="flex flex-wrap gap-2 items-center">
          <select id="f-store" onchange="filterOrders()" class="input w-36 hidden" title="门店筛选">
            <option value="">全部门店</option>
          </select>
          <input type="date" id="f-date" onchange="onDateChange('date')" class="input w-40" title="按日期查询">
          <input type="month" id="f-month" onchange="onDateChange('month')" class="input w-36" title="按月查询">
          <button onclick="clearDateFilters()" class="text-xs text-gray-400 hover:text-gray-600 px-2 py-1 border border-gray-200 rounded" data-i18n="filter_clear_date">清除日期</button>
        </div>
      </div>
      <!-- Monthly Stats Panel -->
      <div id="monthly-stats" class="hidden card p-4 mb-4"></div>
      <div class="card overflow-hidden overflow-x-auto">
        <div id="orders-table"></div>
      </div>
    </div>

    <!-- ── CREATE ORDER ── -->
    <div id="v-create" class="hidden p-6 max-w-2xl mx-auto">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="goto('orders')" class="text-gray-400 hover:text-gray-600">←</button>
        <h1 class="text-xl font-bold text-gray-800" data-i18n="create_title">新建订单</h1>
      </div>

      <!-- Step 1: Customer -->
      <div id="step-customer" class="card p-6 mb-4">
        <h2 class="font-semibold text-gray-800 mb-4" data-i18n="create_step1">1. 客户信息</h2>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_country">国家区号 *</label>
          <select id="c-country" class="input">
            <option value="">— 请选择国家区号 —</option>
            <option value="60">🇲🇾 马来西亚 +60</option>
            <option value="65">🇸🇬 新加坡 +65</option>
            <option value="86">🇨🇳 中国 +86</option>
            <option value="62">🇮🇩 印尼 +62</option>
            <option value="66">🇹🇭 泰国 +66</option>
            <option value="63">🇵🇭 菲律宾 +63</option>
            <option value="84">🇻🇳 越南 +84</option>
            <option value="673">🇧🇳 文莱 +673</option>
            <option value="886">🇹🇼 台湾 +886</option>
            <option value="852">🇭🇰 香港 +852</option>
            <option value="81">🇯🇵 日本 +81</option>
            <option value="82">🇰🇷 韩国 +82</option>
            <option value="91">🇮🇳 印度 +91</option>
            <option value="61">🇦🇺 澳洲 +61</option>
            <option value="1">🇺🇸 美国/加拿大 +1</option>
            <option value="44">🇬🇧 英国 +44</option>
            <option value="971">🇦🇪 阿联酋 +971</option>
            <option value="966">🇸🇦 沙特 +966</option>
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" data-i18n="lbl_phone">手机号码 *</label>
            <input type="tel" id="c-phone" placeholder="10-1234 5678" oninput="debounceSearch()" class="input">
          </div>
          <div>
            <label class="label" data-i18n="lbl_name">姓名 *</label>
            <input type="text" id="c-name" placeholder="客户姓名" data-i18n-ph="ph_name" class="input">
          </div>
        </div>
        <div id="customer-found" class="hidden rounded-lg p-3 text-sm mb-3" style="background:#d6e8db;color:#1a3a2a;border:1px solid #aed0b8"></div>
        <div>
          <label class="label" data-i18n="lbl_address">地址</label>
          <input type="text" id="c-address" placeholder="配送地址（选填）" data-i18n-ph="ph_address" class="input">
        </div>
      </div>

      <!-- Step 2: Order details -->
      <div class="card p-6 mb-4">
        <h2 class="font-semibold text-gray-800 mb-4" data-i18n="create_step2">2. 订单信息</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" data-i18n="lbl_store">国家/地区 *</label>
            <select id="o-store" class="input" onchange="autoSetCurrency()">
              <option value="">— 请选择 —</option>
            </select>
          </div>
          <div>
            <label class="label" data-i18n="lbl_amount">订单金额 *</label>
            <div class="flex gap-1">
              <select id="o-currency" class="input w-28 flex-shrink-0">
                <option value="MYR">🇲🇾 MYR</option>
                <option value="SGD">🇸🇬 SGD</option>
                <option value="THB">🇹🇭 THB</option>
                <option value="IDR">🇮🇩 IDR</option>
                <option value="PHP">🇵🇭 PHP</option>
                <option value="VND">🇻🇳 VND</option>
                <option value="CNY">🇨🇳 CNY</option>
                <option value="HKD">🇭🇰 HKD</option>
                <option value="USD">🇺🇸 USD</option>
              </select>
              <input type="number" id="o-amount" placeholder="0.00" min="0" step="0.01" data-i18n-ph="ph_amount" class="input flex-1 min-w-0">
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_desc">套餐/项目描述</label>
          <input type="text" id="o-desc" placeholder="如：品质套餐 120m²" data-i18n-ph="ph_desc" class="input">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label" data-i18n="lbl_referrer">推荐人</label>
            <select id="o-referrer" class="input">
              <option value="">无推荐人</option>
            </select>
          </div>
          <div>
            <label class="label" data-i18n="lbl_pay_status">支付状态</label>
            <select id="o-payment" class="input">
              <option value="unpaid" data-i18n-opt="opt_unpaid">待支付</option>
              <option value="paid" data-i18n-opt="opt_paid">已支付</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="label" data-i18n="lbl_pay_method">支付方式</label>
          <select id="o-pay-method" class="input">
            <option value="">—</option>
            <option value="cash" data-i18n-opt="pay_cash">💵 现金</option>
            <option value="transfer" data-i18n-opt="pay_transfer">🏦 银行转账</option>
            <option value="ewallet" data-i18n-opt="pay_ewallet">📱 电子钱包</option>
            <option value="card" data-i18n-opt="pay_card">💳 刷卡</option>
          </select>
        </div>
        <div>
          <label class="label" data-i18n="lbl_notes">备注</label>
          <textarea id="o-notes" rows="2" placeholder="内部备注（客户不可见）" data-i18n-ph="ph_notes" class="input resize-none"></textarea>
        </div>
      </div>

      <button onclick="submitOrder()" id="submit-btn" class="btn-gold w-full py-3 text-base" data-i18n="create_btn">
        创建订单
      </button>
      <p id="create-err" class="text-red-500 text-sm mt-2 text-center hidden"></p>
    </div>

    <!-- ── CUSTOMERS ── -->
    <div id="v-customers" class="hidden p-6 max-w-5xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-5" data-i18n="customers_title">客户管理</h1>
      <div class="card p-4 mb-4">
        <input type="text" id="cust-search" placeholder="搜索姓名 / 手机号" oninput="filterCustomers()" data-i18n-ph="cust_search"
               class="input max-w-sm">
      </div>
      <div class="card overflow-hidden">
        <div id="customers-table"></div>
      </div>
    </div>

    <!-- ── ORDER DETAIL ── -->
    <div id="v-detail" class="hidden p-6 max-w-3xl mx-auto">
      <div class="flex items-center gap-3 mb-5">
        <button id="detail-back" onclick="goto('orders')" class="text-gray-400 hover:text-gray-600">←</button>
        <h1 class="text-xl font-bold text-gray-800">订单详情</h1>
      </div>
      <div id="detail-content"></div>
    </div>

    <!-- ── SUPPLIERS (admin only) ── -->
    <div id="v-suppliers" class="hidden p-6 max-w-3xl mx-auto">
      <h1 class="text-xl font-bold text-gray-800 mb-5" data-i18n="nav_suppliers">供应商管理</h1>
      <!-- Add supplier form -->
      <div class="card p-4 mb-4">

function renderStatusTimeline(currentStatus) {
  const curStep = STATUS[currentStatus]?.step ?? -1;
  const isSpecial = STATUS[currentStatus]?.step === -1;

  const stepsHtml = CORE_STEPS.map((s, i) => {
    const done    = i < curStep || (!isSpecial && currentStatus === 'completed' && i <= 6);
    const current = s === currentStatus;
    const lbl     = t('status_' + s) || STATUS[s].label;
    let bg, color, icon;
    if (done)    { bg='#1a3a2a'; color='#fff'; icon='✓'; }
    else if (current) { bg=STATUS[s].s.match(/background:([^;]+)/)?.[1]||'#e5e7eb'; color=STATUS[s].s.match(/color:([^;]+)/)?.[1]||'#333'; icon='●'; }
    else         { bg='#f3f4f6'; color='#9ca3af'; icon=String(i+1); }
    const border = current ? 'border:2px solid #1a3a2a;' : 'border:2px solid transparent;';
    return `<button id="step-${s}" onclick="selectStep('${s}')"
              class="flex flex-col items-center gap-1 rounded-xl px-2 py-2 text-xs font-medium transition-all flex-shrink-0 w-16"
              style="background:${bg};color:${color};${border}cursor:pointer;">
              <span class="step-icon text-sm leading-none">${icon}</span>
              <span class="leading-tight text-center" style="font-size:10px;word-break:keep-all">${lbl}</span>
            </button>
            ${i < CORE_STEPS.length-1 ? `<div class="flex-shrink-0 w-3" style="height:2px;background:${i<curStep?'#1a3a2a':'#e5e7eb'};margin-top:-8px"></div>` : ''}`;
  }).join('');

  const specialHtml = ['after_sales','closed'].map(s => {
    const active = s === currentStatus;
    const lbl = t('status_' + s) || STATUS[s].label;
    return `<button id="step-${s}" onclick="selectStep('${s}')"
              class="px-3 py-1.5 rounded-lg text-xs font-medium border transition"
              style="${active ? STATUS[s].s+';border-color:#1a3a2a' : 'background:white;color:#6b7280;border-color:#e5e7eb'};cursor:pointer;">
              ${lbl}
            </button>`;
  }).join('');

  return `<div class="overflow-x-auto pb-1 -mx-1 px-1">
            <div class="flex items-center min-w-max">${stepsHtml}</div>
          </div>
          <div class="flex gap-2 mt-2">${specialHtml}</div>
          <input type="hidden" id="upd-status" value="${currentStatus}">`;
}

function selectStep(s) {
  document.getElementById('upd-status').value = s;
  const curStep = STATUS[s]?.step ?? -1;
  const isSpecial = curStep === -1;
  CORE_STEPS.forEach((step, i) => {
    const btn = document.getElementById('step-' + step);
    if (!btn) return;
    const done    = !isSpecial && i < curStep;
    const current = step === s;
    let bg, color, icon;
    if (done)         { bg='#1a3a2a'; color='#fff'; icon='✓'; }
    else if (current) { bg=STATUS[step].s.match(/background:([^;]+)/)?.[1]||'#e5e7eb'; color=STATUS[step].s.match(/color:([^;]+)/)?.[1]||'#333'; icon='●'; }
    else              { bg='#f3f4f6'; color='#9ca3af'; icon=String(i+1); }
    btn.style.cssText = `background:${bg};color:${color};border:2px solid ${current?'#1a3a2a':'transparent'};cursor:pointer;`;
    btn.querySelector('.step-icon').textContent = icon;
    // connector color
    const connector = btn.nextElementSibling;
    if (connector && connector.tagName === 'DIV') connector.style.background = done ? '#1a3a2a' : '#e5e7eb';
  });
  ['after_sales','closed'].forEach(spec => {
    const btn = document.getElementById('step-' + spec);
    if (!btn) return;
    btn.style.cssText = spec === s ? STATUS[spec].s+';border-color:#1a3a2a;cursor:pointer;' : 'background:white;color:#6b7280;border-color:#e5e7eb;cursor:pointer;';
  });
  onUpdStatusChange();
}

const CURRENCY_SYMBOL = { MYR:'RM', SGD:'S$', THB:'฿', IDR:'Rp', PHP:'₱', VND:'₫', CNY:'¥', HKD:'HK$', USD:'US$' };
const FLAG_CURRENCY   = { '🇲🇾':'MYR', '🇸🇬':'SGD', '🇹🇭':'THB', '🇮🇩':'IDR', '🇵🇭':'PHP', '🇻🇳':'VND', '🇨🇳':'CNY', '🇭🇰':'HKD' };

}

function fmtAmt(v, currency) {
  const sym = CURRENCY_SYMBOL[currency] || (currency || 'RM');
  return sym + ' ' + Number(v).toLocaleString('en-MY', { minimumFractionDigits: 2 });
}
function fmtDate(d) { return new Date(d).toLocaleDateString('zh-CN', { month:'short', day:'numeric' }); }

// ── Deadline / SLA ──
// Default SLA in hours per status (admin can override per-order)
const STATUS_SLA_HOURS = {
  pending_payment: 0.25,  // 15 min
  paid:            2,     // 2h to start production
  in_production:   600,   // 25 days default (variable)
  shipped:         480,   // 20 days default (variable)
  arrived:         24,    // 24h to book install
  installing:      120,   // 5 days
  after_sales:     72,
};
// Statuses with variable-day slider
const STATUS_VAR_DAYS = {
  in_production: { max: 25, default: 25 },
  shipped:       { max: 30, default: 20 },
};

function calcDeadline(status, customDays) {
  if (customDays) return new Date(Date.now() + customDays * 86400000).toISOString();
  const h = STATUS_SLA_HOURS[status];
  if (!h) return null;
  return new Date(Date.now() + h * 3600000).toISOString();
}

function fmtCountdown(deadlineAt) {
  if (!deadlineAt) return null;
  const diff = new Date(deadlineAt) - Date.now();
  if (diff <= 0) return { text: '⚠️ ' + t('overdue'), overdue: true, warn: false };
  const totalMin = Math.floor(diff / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  const warn = totalMin < 240; // warn if < 4h
  if (h >= 24) { const d = Math.floor(h/24); return { text: `⏱ ${d}${t('stat_day_pfx')} ${h%24}h`, overdue: false, warn }; }
  if (h === 0) return { text: `⏱ ${m}m`, overdue: false, warn: true };
  return { text: `⏱ ${h}h ${m}m`, overdue: false, warn };
}

function deadlineRowStyle(o) {
  if (['completed','closed'].includes(o.status)) return '';
  const cd = fmtCountdown(o.deadline_at);
  if (cd?.overdue) return 'background:#fef2f2;';
  if (cd?.warn)   return 'background:#fffbeb;';
  return '';
}

let _notifiedOverdue = new Set();
function checkOverdueAlerts() {
  const now = Date.now();
  allOrders.forEach(o => {
    if (['completed','closed'].includes(o.status)) return;
    if (!o.deadline_at) return;
    const overdue = new Date(o.deadline_at) < now;
    if (overdue && !_notifiedOverdue.has(o.id)) {
      _notifiedOverdue.add(o.id);
      if (Notification.permission === 'granted') {
        new Notification('⚠️ 订单逾期', { body: `${o.order_no} — ${o.customers?.name || ''}`, icon: '/favicon.ico' });
      }
    }
  });
  // Re-render order list if visible to update colors
  const vOrders = document.getElementById('v-orders');
  if (vOrders && !vOrders.classList.contains('hidden')) renderOrdersTable(filterGetCurrent());
}

  if (storeErr) {
    sel.innerHTML = `<option value="">⚠️ 读取失败: ${storeErr.message}</option>`;

  if (!storeData || storeData.length === 0) {

        { name: '新山门店',   code: 'JBN', address: '新山, 柔佛, Malaysia', active: true },
        { name: '002 Singapore', code: '002', address: 'Singapore', active: true },
      ]);
      if (insErr) {
        sel.innerHTML = `<option value="">⚠️ 插入失败: ${insErr.message}</option>`;
        return;
      }
      const { data: fresh } = await sb.from('stores').select('*').order('name');
      stores = fresh || [];

  } else {

      const codes = stores.map(s => s.code);
      if (codes.includes('JB')) await sb.from('stores').update({ name: '001 Austin', code: '001' }).eq('code', 'JB');
      if (codes.includes('SG')) await sb.from('stores').update({ name: '002 Singapore', code: '002' }).eq('code', 'SG');
      if (!codes.includes('JBN')) await sb.from('stores').insert({ name: '新山门店', code: 'JBN', address: '新山, 柔佛, Malaysia', active: true });
      const { data: fresh } = await sb.from('stores').select('*').order('name');
      if (fresh?.length) stores = fresh;
    }
  }

  // Country flag mapping by store code prefix
  const COUNTRY_FLAG = {
    '001':'🇲🇾', 'JBN':'🇲🇾', 'JB':'🇲🇾', 'KL':'🇲🇾', 'PG':'🇲🇾',
    '002':'🇸🇬', 'SG':'🇸🇬',
    'BKK':'🇹🇭', 'TH':'🇹🇭',
    'JKT':'🇮🇩', 'ID':'🇮🇩',
    'MNL':'🇵🇭', 'PH':'🇵🇭',
    'HCM':'🇻🇳', 'VN':'🇻🇳',
  };
  const flag = s => COUNTRY_FLAG[s.code] || '🏳️';
  const label = s => `${flag(s)} ${s.name}`;

  // Sort: Malaysia first, then by name
  const sorted = [...stores].sort((a, b) => {
    const aM = flag(a) === '🇲🇾' ? 0 : 1;

function filterOrders() {
  const q     = document.getElementById('f-search').value.toLowerCase();
  const s     = document.getElementById('f-status').value;
  const store = document.getElementById('f-store')?.value || '';
  const date  = document.getElementById('f-date').value;   // "2026-04-27"
  const month = document.getElementById('f-month').value;  // "2026-04"

  const filtered = allOrders.filter(o => {
    const txt   = (o.order_no + (o.customers?.name||'') + (o.customers?.phone||'')).toLowerCase();
    const oDate = o.created_at.slice(0, 10);
    const oMon  = o.created_at.slice(0, 7);
    return (!q     || txt.includes(q))
        && (!s     || o.status === s)
        && (!store || o.store_id === store)
        && (!date  || oDate === date)
        && (!month || oMon  === month);
  });

  const statPeriod = month || (date ? date.slice(0, 7) : '');
  renderMonthlyStats(filtered, statPeriod, date);
  renderOrdersTable(filtered);
}

function renderMonthlyStats(orders, period, specificDate) {
  const panel = document.getElementById('monthly-stats');
  if (!period) { panel.classList.add('hidden'); return; }

  const total   = orders.length;
  const paid    = orders.filter(o => o.payment_status === 'paid').length;
  const unpaid  = orders.filter(o => o.payment_status === 'unpaid').length;
  const revenue = orders.filter(o => o.payment_status === 'paid')
                        .reduce((s, o) => s + Number(o.amount), 0);

  // store breakdown
  const storeMap = {};
  orders.forEach(o => {
    const n = o.stores?.name || '未知';
    if (!storeMap[n]) storeMap[n] = { count: 0, rev: 0 };
    storeMap[n].count++;
    if (o.payment_status === 'paid') storeMap[n].rev += Number(o.amount);
  });
  const storeRows = Object.entries(storeMap).map(([n, v]) =>
    `<span class="inline-block rounded px-2 py-0.5 text-xs mr-1 mb-1" style="background:#d6e8db;color:#1a3a2a">${n}: ${v.count}单 / ${fmtAmt(v.rev)}</span>`
  ).join('');

  const dayPfx = t('stat_day_pfx'); const monPfx = t('stat_month_pfx');
  const title = specificDate ? `📅 ${specificDate} (${dayPfx})` : `📊 ${period} (${monPfx})`;

  panel.classList.remove('hidden');
  panel.innerHTML = `
    <div class="text-sm font-semibold text-gray-700 mb-3">${title}</div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
      <div class="rounded-lg p-3 text-center" style="background:#f5f2ed">
        <div class="text-xs text-gray-400 mb-1">${t('stat_total_ord')}</div>
        <div class="text-2xl font-bold" style="color:#1a3a2a">${total}</div>
      </div>
      <div class="rounded-lg p-3 text-center" style="background:#d6e8db">
        <div class="text-xs text-gray-400 mb-1">${t('stat_paid_cnt')}</div>
        <div class="text-2xl font-bold" style="color:#1a3a2a">${paid}</div>
      </div>
      <div class="rounded-lg p-3 text-center" style="background:#fef3c7">
        <div class="text-xs text-gray-400 mb-1">${t('stat_unpaid_cnt')}</div>
        <div class="text-2xl font-bold" style="color:#92400e">${unpaid}</div>
      </div>
      <div class="rounded-lg p-3 text-center" style="background:#1a3a2a">
        <div class="text-xs mb-1" style="color:#c8a96e">${t('stat_revenue_total')}</div>
        <div class="text-base font-bold" style="color:#c8a96e">${fmtAmt(revenue)}</div>
      </div>
    </div>
    ${storeRows ? `<div class="text-xs text-gray-500 font-medium mb-1">${t('stat_store_detail')}</div><div>${storeRows}</div>` : ''}
  `;
}

function renderOrdersTable(orders) {
  const overdueCount = orders.filter(o => !['completed','closed'].includes(o.status) && o.deadline_at && new Date(o.deadline_at) < Date.now()).length;
  const banner = overdueCount > 0
    ? `<div class="px-4 py-2 text-sm font-semibold" style="background:#fef2f2;color:#dc2626;border-bottom:1px solid #fecaca">⚠️ ${overdueCount} ${t('overdue_banner')}</div>`
    : '';

  document.getElementById('orders-table').innerHTML = orders.length
    ? banner + `<table class="w-full text-sm"><thead><tr class="bg-gray-50 text-left text-gray-500 text-xs">
        <th class="px-4 py-3">${t('th_order_no')}</th><th class="px-4 py-3">${t('th_customer')}</th><th class="px-4 py-3">${t('th_store')}</th>
        <th class="px-4 py-3">${t('th_amount')}</th><th class="px-4 py-3">${t('th_status')}</th><th class="px-4 py-3">${t('th_time')}</th>
       </tr></thead><tbody>${orders.map(o => {
        const cd = fmtCountdown(o.deadline_at);
        const rs = deadlineRowStyle(o);
        const cdHtml = cd ? `<div class="text-xs mt-0.5 font-medium" style="color:${cd.overdue?'#dc2626':cd.warn?'#d97706':'#6b7280'}">${cd.text}</div>` : '';
        return `
        <tr class="border-t border-gray-100 cursor-pointer hover:opacity-90" style="${rs}" onclick="openDetail('${o.id}')">
          <td class="px-4 py-3 font-mono text-xs font-semibold" style="color:${rs?'#dc2626':'#1a3a2a'}">${o.order_no}</td>
          <td class="px-4 py-3">
            <div class="font-medium">${o.customers?.name || '-'}</div>
            <div class="text-gray-400 text-xs">${o.customers?.phone || ''}</div>
          </td>
          <td class="px-4 py-3 text-gray-500 text-xs">${o.stores?.name || '-'}</td>
          <td class="px-4 py-3 font-semibold">${fmtAmt(o.amount, o.currency)}</td>
          <td class="px-4 py-3">${badge(o.status)}</td>
          <td class="px-4 py-3 text-gray-400 text-xs">${fmtDate(o.created_at)}${cdHtml}</td>
        </tr>`;}).join('')}</tbody></table>`
    : `<p class="text-gray-400 text-sm text-center py-10">${t('no_orders')}</p>`;
}

// ── Create Order ──
function resetCreateForm() {
  ['c-phone','c-name','c-address','o-amount','o-desc','o-notes'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('customer-found').classList.add('hidden');
  document.getElementById('o-currency').value = 'MYR';
  document.getElementById('o-payment').value = 'unpaid';
  document.getElementById('create-err').classList.add('hidden');
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(lookupCustomer, 400);
}

async function lookupCustomer() {
  const raw = document.getElementById('c-phone').value.trim().replace(/[\s\-]/g,'');
  if (raw.length < 6) { document.getElementById('customer-found').classList.add('hidden'); return; }
  const cc = document.getElementById('c-country').value || '60';
  const phone = (() => { const n = raw.replace(/^0+/,''); return n.startsWith(cc) ? n : cc + n; })();
  const { data } = await sb.from('customers').select('*').eq('phone', phone).limit(1);
  const el = document.getElementById('customer-found');
  if (data?.length) {
    el.innerHTML = `✓ 找到客户：<strong>${data[0].name}</strong>（${data[0].phone}）`;
    el.classList.remove('hidden');
    document.getElementById('c-name').value = data[0].name;
    document.getElementById('c-address').value = data[0].address || '';
    el.dataset.id = data[0].id;
  } else {
    el.classList.add('hidden');
    delete el.dataset.id;
  }
}

async function submitOrder() {
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('create-err');
  err.classList.add('hidden');

  const raw = document.getElementById('c-phone').value.trim().replace(/[\s\-]/g,'');
  const name = document.getElementById('c-name').value.trim();
  const storeId = document.getElementById('o-store').value;
  const amount = parseFloat(document.getElementById('o-amount').value);

  const cc = document.getElementById('c-country').value;
  if (!cc) { showCreateErr('请选择国家区号'); return; }
  if (!raw || !name) { showCreateErr('请填写客户手机号和姓名'); return; }
  if (!storeId) { showCreateErr('请选择门店'); return; }
  if (!amount || amount <= 0) { showCreateErr('请输入有效金额'); return; }

  btn.textContent = t('creating'); btn.disabled = true;
  const phone = (() => { const n = raw.replace(/^0+/,''); return n.startsWith(cc) ? n : cc + n; })();

  // Get or create customer
  let custId = document.getElementById('customer-found').dataset?.id;
  if (!custId) {
    const { data: newCust, error: ce } = await sb.from('customers').insert({
      name, phone,
      address: document.getElementById('c-address').value.trim() || null,
    }).select().single();
    if (ce) { showCreateErr('创建客户失败: ' + ce.message); btn.textContent='创建订单'; btn.disabled=false; return; }
    custId = newCust.id;
  }

  // Get store code
  const store = stores.find(s => s.id === storeId);
  const { data: orderNo } = await sb.rpc('generate_order_no', { p_store_code: store.code });

  const refId = document.getElementById('o-referrer').value || null;
  const currency = document.getElementById('o-currency').value || 'MYR';
  const initStatus = document.getElementById('o-payment').value === 'paid' ? 'paid' : 'pending_payment';
  const { data: order, error: oe } = await sb.from('orders').insert({
    order_no: orderNo,
    store_id: storeId,
    customer_id: custId,
    staff_id: profile.id,
    referrer_id: refId,
    amount,
    currency,
    status: initStatus,
    payment_status: document.getElementById('o-payment').value,
    payment_method: document.getElementById('o-pay-method').value || null,
    description: document.getElementById('o-desc').value.trim() || null,
    notes: document.getElementById('o-notes').value.trim() || null,
    deadline_at: calcDeadline(initStatus),
  }).select().single();

  if (oe) { showCreateErr('创建订单失败: ' + oe.message); btn.textContent='创建订单'; btn.disabled=false; return; }

  // Log initial status
  await sb.from('order_logs').insert({
    order_id: order.id,
    status: order.status,
    operator_id: profile.id,
    operator_role: profile.role,
    operator_name: profile.name,
    notes: '订单创建',
  });

  btn.textContent = t('create_btn'); btn.disabled = false;
  await loadOrders();
  openDetail(order.id, 'orders');
}

function showCreateErr(msg) {
  const e = document.getElementById('create-err');
  e.textContent = msg; e.classList.remove('hidden');
  document.getElementById('submit-btn').textContent = t('create_btn');
  document.getElementById('submit-btn').disabled = false;
}

function onUpdStatusChange() {
  const status = document.getElementById('upd-status')?.value;
  const varCfg = STATUS_VAR_DAYS[status];
  const row = document.getElementById('sla-days-row');
  const slider = document.getElementById('sla-days');
  const valEl = document.getElementById('sla-days-val');

  if (varCfg && row) {
    row.classList.remove('hidden');
    slider.max = varCfg.max;
    slider.value = varCfg.default;
    valEl.textContent = varCfg.default;
    // Auto-fill deadline from slider default
    const inp = document.getElementById('upd-deadline');
    if (inp) {
      const dl = calcDeadline(status, varCfg.default);
      inp.value = new Date(new Date(dl).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    }
    // Update deadline live as slider moves
    slider.oninput = function() {
      valEl.textContent = this.value;
      const dl2 = calcDeadline(status, parseInt(this.value));
      const inp2 = document.getElementById('upd-deadline');
      if (inp2 && dl2) inp2.value = new Date(new Date(dl2).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    };
  } else {
    row?.classList.add('hidden');
    const dl = calcDeadline(status);
    const inp = document.getElementById('upd-deadline');
    if (!inp) return;
    if (dl) {
      inp.value = new Date(new Date(dl).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    } else {
      inp.value = '';
    }
  }
}

      <label class="block text-xs font-medium text-gray-600 mb-1">${t('del_pw_lbl')}</label>
      <input type="password" id="del-pw" placeholder="${t('del_pw_ph')}"
             class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-400 mb-3">
      <p id="del-err" class="text-red-500 text-xs mb-3 hidden">${t('del_err_pw')}</p>
      <div class="flex gap-2">
        <button onclick="document.getElementById('delete-modal').remove()"
                class="flex-1 py-2.5 border border-gray-200 text-gray-600 text-sm font-semibold rounded-lg hover:bg-gray-50">
          ${t('btn_cancel')}
        </button>
        <button onclick="doDelete('${id}')"
                class="flex-1 py-2.5 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600">
          ${t('btn_confirm_del')}
        </button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('del-pw').focus();
}

async function doDelete(id) {
  const pw = document.getElementById('del-pw').value;
  if (pw !== '12345678') {
    document.getElementById('del-err').classList.remove('hidden');
    return;
  }
  document.getElementById('delete-modal').remove();

  await sb.from('orders').update({ status: 'closed', updated_at: new Date().toISOString() }).eq('id', id);
  await sb.from('order_logs').insert({
    order_id: id,
    status: 'closed',
    operator_id: profile.id,
    operator_role: profile.role,
    operator_name: profile.name,
    notes: `[已删除] 操作账户：${profile.name}（${profile.role}）`,
  });

  await loadOrders();
  goto('orders');
}

async function updateOrder(id) {
  const status = document.getElementById('upd-status').value;
  const payment = document.getElementById('upd-payment').value;
  const payMethod = document.getElementById('upd-pay-method')?.value;
  const supplier = document.getElementById('upd-supplier').value || null;
  const notes = document.getElementById('upd-notes').value.trim();
  const dlVal = document.getElementById('upd-deadline')?.value;
  const slaRow = document.getElementById('sla-days-row');
  const customDays = (slaRow && !slaRow.classList.contains('hidden'))
    ? parseInt(document.getElementById('sla-days')?.value || 0) : null;

  // Use manual deadline if set, else slider days, else auto-calc from SLA
  const deadline_at = dlVal ? new Date(dlVal).toISOString() : calcDeadline(status, customDays);

  const upd = { status, payment_status: payment, supplier_id: supplier, deadline_at, updated_at: new Date().toISOString() };
  if (payMethod) upd.payment_method = payMethod;
  if (status === 'completed' || status === 'closed') { upd.completed_at = new Date().toISOString(); upd.deadline_at = null; }

  await sb.from('orders').update(upd).eq('id', id);
  await sb.from('order_logs').insert({
    order_id: id, status,
    operator_id: profile.id,
    operator_role: profile.role,
    operator_name: profile.name,
    notes: notes || null,
  });

  document.getElementById('upd-msg').classList.remove('hidden');
  setTimeout(() => document.getElementById('upd-msg').classList.add('hidden'), 2000);
  await loadOrders();
  openDetail(id);
}

// ── Suppliers (admin) ──
const PAY_METHOD_LABELS = { cash:'💵 现金', transfer:'🏦 银行转账', ewallet:'📱 电子钱包', card:'💳 刷卡' };

const TIER_STARS = { 3:'⭐⭐⭐', 2:'⭐⭐', 1:'⭐' };

async function renderSuppliersPage() {
  const { data: sups } = await sb.from('suppliers').select('*').order('tier', { ascending: false }).order('name');
  const rows = (sups || []);
  document.getElementById('suppliers-table').innerHTML = rows.length
    ? `<table class="w-full text-sm">
        <thead><tr class="bg-gray-50 text-left text-gray-500 text-xs">
          <th class="px-4 py-3">${t('th_name')}</th><th class="px-4 py-3">${t('lbl_sup_tier')}</th>
          <th class="px-4 py-3">${t('th_phone')}</th><th class="px-4 py-3">${t('th_status')}</th><th class="px-4 py-3"></th>
        </tr></thead>
        <tbody>${rows.map(s => `
          <tr class="border-t border-gray-100 hover:bg-gc">
            <td class="px-4 py-3 font-medium">${s.name}</td>
            <td class="px-4 py-3">
              <select onchange="setSupplierTier('${s.id}',this.value)" class="text-xs border border-gray-200 rounded px-1 py-1 bg-white">
                <option value="3" ${s.tier===3?'selected':''}>⭐⭐⭐</option>
                <option value="2" ${(!s.tier||s.tier===2)?'selected':''}>⭐⭐</option>
                <option value="1" ${s.tier===1?'selected':''}>⭐</option>
              </select>
            </td>
            <td class="px-4 py-3 text-gray-600">${s.phone || '-'}</td>
            <td class="px-4 py-3">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="${s.active?'background:#d6e8db;color:#1a3a2a':'background:#f3f4f6;color:#9ca3af'}">
                ${s.active ? t('sup_active') : t('sup_inactive')}
              </span>
            </td>
            <td class="px-4 py-3">
              <button onclick="toggleSupplier('${s.id}',${s.active})"
                      class="text-xs px-2 py-1 rounded border ${s.active?'border-gray-300 text-gray-500 hover:bg-gray-50':'border-green-300 text-green-700 hover:bg-green-50'}">
                ${s.active ? t('sup_disable') : t('sup_enable')}
              </button>
            </td>
          </tr>`).join('')}
        </tbody></table>`
    : `<p class="text-gray-400 text-sm text-center py-10">${t('no_suppliers')}</p>`;
}

async function addSupplier() {
  const name = document.getElementById('sup-name').value.trim();
  const phone = document.getElementById('sup-phone').value.trim();
  const tier = parseInt(document.getElementById('sup-tier').value);
  const errEl = document.getElementById('sup-err');
  if (!name) { errEl.textContent = '请填写供应商名称'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');
  const { error } = await sb.from('suppliers').insert({ name, phone: phone || null, tier, active: true });
  if (error) { errEl.textContent = '添加失败: ' + error.message; errEl.classList.remove('hidden'); return; }
  document.getElementById('sup-name').value = '';
  document.getElementById('sup-phone').value = '';
  document.getElementById('sup-tier').value = '2';
  await renderSuppliersPage();
}

async function toggleSupplier(id, active) {
  await sb.from('suppliers').update({ active: !active }).eq('id', id);
  await renderSuppliersPage();
}

async function setSupplierTier(id, tier) {
  await sb.from('suppliers').update({ tier: parseInt(tier) }).eq('id', id);
  await renderSuppliersPage();
}

// ── Auth ──
async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
