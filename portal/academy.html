<style>
:root{
  --bg:#fbf8f1; --surface:#ffffff; --sunk:#f4efe5; --ink:#1b211d; --muted:#6c6a62;
  --green:#153927; --green2:#245640; --gold:#a8874a; --gold-soft:#c8a96e;
  --line:rgba(168,135,74,.32); --line-soft:rgba(21,57,39,.10);
  --ok:#2f7a4d; --ok-bg:#e6f2ea; --bad:#a6402f; --bad-bg:#f8e7e2; --warn:#8a6512; --warn-bg:#f8efd9;
  --serif:'Noto Serif SC','Songti SC',Georgia,serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --latin:'Playfair Display',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1712; --surface:#16211b; --sunk:#1c2a22; --ink:#e9e6dc; --muted:#a3a093;
    --green:#cfe3d4; --green2:#9fc4aa; --gold:#d4b57a; --gold-soft:#c8a96e;
    --line:rgba(212,181,122,.28); --line-soft:rgba(233,230,220,.10);
    --ok:#7fcf9c; --ok-bg:#1d3326; --bad:#f0a08f; --bad-bg:#3a201b; --warn:#e8c46e; --warn-bg:#352b14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1712; --surface:#16211b; --sunk:#1c2a22; --ink:#e9e6dc; --muted:#a3a093;
  --green:#cfe3d4; --green2:#9fc4aa; --gold:#d4b57a; --gold-soft:#c8a96e;
  --line:rgba(212,181,122,.28); --line-soft:rgba(233,230,220,.10);
  --ok:#7fcf9c; --ok-bg:#1d3326; --bad:#f0a08f; --bad-bg:#3a201b; --warn:#e8c46e; --warn-bg:#352b14;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;color:var(--green);line-height:1.3;margin:0}
.mast{border-bottom:1px solid var(--line);padding-block:36px 26px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mast h1{font-size:clamp(30px,5vw,46px);font-weight:900}
.mast h1 .lat{font-family:var(--latin);font-weight:600;letter-spacing:.04em}
.mast p{margin:0;max-width:68ch;color:var(--muted)}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bar{flex:1 1 220px;max-width:360px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-soft);width:0;transition:width .4s}
.layout{display:grid;grid-template-columns:240px 1fr;gap:36px;margin-top:28px;align-items:start}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:2px;font-size:14px}
nav.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr 16px;gap:6px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink)}
nav.toc button:hover{background:var(--sunk)}
nav.toc button:focus-visible{outline:2px solid var(--gold-soft)}
nav.toc button[aria-current="true"]{background:var(--green);color:var(--bg)}
nav.toc button[aria-current="true"] .no{color:var(--gold-soft)}
nav.toc .no{font-family:var(--latin);color:var(--gold);font-size:13px}
nav.toc .done{color:var(--ok);font-size:13px}
nav.toc button[aria-current="true"] .done{color:var(--gold-soft)}
.toc-label{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:12px 10px 4px}
main{min-width:0}
section.ch{display:grid;gap:28px}
.ch-head{display:grid;gap:8px}
.ch-head h2{font-size:clamp(24px,3.4vw,32px);font-weight:900}
.ch-head .meta{font-size:13px;color:var(--muted)}
.lede{font-size:16px;max-width:68ch;margin:0}
.block{display:grid;gap:12px}
.block>h3{font-size:19px;display:flex;align-items:baseline;gap:10px}
.block>h3 small{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.prose b{color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.fact .k{font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:700}
.fact .v{font-family:var(--serif);font-size:17px;color:var(--green);font-weight:700}
.fact p{margin:0;font-size:14px;color:var(--muted)}
.talk{border-left:3px solid var(--gold-soft);background:var(--sunk);padding:12px 16px;border-radius:0 8px 8px 0;max-width:72ch}
.talk .who{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.1em}
.talk p{margin:4px 0 0}
.qa{display:grid;gap:10px;max-width:76ch}
details{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 16px}
details summary{cursor:pointer;font-weight:700;color:var(--green)}
details summary:focus-visible{outline:2px solid var(--gold-soft)}
details p{margin:8px 0 2px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13.5px;max-width:76ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{background:var(--sunk);font-weight:700;color:var(--green);font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--green2);margin:1px 3px 1px 0;white-space:nowrap}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter input{flex:1 1 220px;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.filter input:focus-visible{outline:2px solid var(--gold-soft)}
.count{font-size:12.5px;color:var(--muted)}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:18px}
.quiz h3{font-size:19px}
.q{display:grid;gap:8px}
.q .stem{font-weight:700}
.opts{display:grid;gap:6px}
.opts button{all:unset;cursor:pointer;border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;background:var(--bg)}
.opts button:hover{border-color:var(--gold-soft)}
.opts button:focus-visible{outline:2px solid var(--gold-soft)}
.opts button.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opts button[disabled]{cursor:default}
.why{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.btn{all:unset;cursor:pointer;background:var(--green);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--gold-soft)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.calc{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:640px}
.calc .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.calc label{font-size:13px;color:var(--muted);display:grid;gap:3px}
.calc input,.calc select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;width:150px}
.calc .out{font-family:var(--serif);font-size:17px;color:var(--green);font-variant-numeric:tabular-nums}
.steps{counter-reset:s;display:grid;gap:10px;max-width:76ch;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px}
.steps li::before{content:counter(s);font-family:var(--latin);color:var(--gold);font-size:20px;line-height:1.3}
.src{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:18px}
  nav.toc{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
  .toc-label{grid-column:1/-1;padding-top:4px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

[hidden]{display:none!important}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-block:12px 0}
.topbar a{color:var(--gold);text-decoration:none}
</style>
</head>

function table(head, rows, numCols=[] , codeCols=[]){
  return `<div class="tbl"><table><thead><tr>${head.map((h,i)=>`<th class="${numCols.includes(i)?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${numCols.includes(i)?'num':''}${codeCols.includes(i)?' code':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function filterable(id, head, rows, numCols, codeCols){
  return `<div class="filter"><input id="f-${id}" type="search" placeholder="输入型号 / 名称 / 颜色筛选" data-target="t-${id}" aria-label="筛选产品"><span class="count" id="c-${id}">共 ${rows.length} 项</span></div><div id="t-${id}">${table(head,rows,numCols,codeCols)}</div>`;
}

{ id:'tile', no:'01', title:'瓷砖全系列', short:'瓷砖', meta:'大板 33 款 · 另有 300×600 / 600×600 / 木纹砖',
 body:()=>`
 <p class="lede">本店瓷砖有 750×1500、600×1200 大板（33 款，分三种表面工艺），也有 300×600、600×600 和木纹砖。导购要会四件事：讲清楚吸水率和工艺、解释「N 面随机」、算片数、提醒同批次。</p>
 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">吸水率 ≤ 0.5%</span><span class="v">瓷质砖（国际标准 ISO 13006 的 BIa 类）</span><p>吸水越低，越致密、越不容易渗污、开裂。客厅、厨卫、户外都能用。</p></div>
   <div class="fact"><span class="k">工艺 · 金丝绒</span><span class="v">细腻柔光哑面</span><p>手感像丝绒，不反光、不刺眼，显高级。适合客厅、卧室。</p></div>
   <div class="fact"><span class="k">工艺 · 干粒釉</span><span class="v">超级干粒模具 / 超细干粒</span><p>釉面撒干粒后高温烧成，有细微颗粒立体感，耐磨、表面更防滑；模具款带凹凸纹理。</p></div>
   <div class="fact"><span class="k">N 面随机</span><span class="v">同一款有 N 种不同纹理面</span><p>例如「12 面随机」= 12 种纹理随机出现，铺出来像天然石材，不会一眼看到重复。「单面」= 每片纹理一样。</p></div>
   <div class="fact"><span class="k">规格换算</span><span class="v">750×1500 = 1.125 ㎡/片<br>600×1200 = 0.72 ㎡/片</span><p>1 ㎡ = 10.764 sqft。马来西亚客户常说 sqft。</p></div>
   <div class="fact"><span class="k">防滑</span><span class="v">浴室地面建议 R10 以上</span><p>R9 适合室内干区，R10 是浴室地面最低要求，淋浴区 / 户外建议 R11。具体等级以厂家检测报告为准。</p></div>
  </div>
  <div class="prose">
   <p><b>批次号很重要：</b>同一款砖不同批次烧出来会有轻微色差。系统入库时瓷砖必须填批次号。开单和发货时，同一空间的砖要同一批次，客户后期补货也要按原批次找。</p>
   <p><b>大板铺贴要点：</b>750×1500 大板必须用瓷砖胶，建议背涂 + 地面双面上胶；留缝 1.5–2mm 再做美缝；找平要求高，要提醒客户找有大板经验的泥工（公司可安排）。</p>
   <p><b>损耗：</b>一般按 5–8% 加量，斜铺、异形空间、小面积损耗更高。</p>
  </div>
 </div>
 <div class="block"><h3><small>MORE</small>更多规格：300×600 · 600×600 · 木纹砖</h3>
  <div class="grid2">
   <div class="fact"><span class="k">300×600</span><span class="v">0.18 ㎡ / 片 · 墙砖主力</span><p>厨房、卫生间墙面最常用。片小、重量轻，墙面不够平也好贴；可横贴（显宽）或竖贴（显高）。</p></div>
   <div class="fact"><span class="k">600×600</span><span class="v">0.36 ㎡ / 片 · 经典地砖</span><p>新山排屋、公寓地面最常见的规格，搬运、切割、铺贴都方便，损耗低，人工费也比大板低。适合预算型整屋地面、厨房、阳台。</p></div>
   <div class="fact"><span class="k">木纹砖</span><span class="v">有木地板的样子，没有木地板的烦恼</span><p>常见长条规格如 150×900、200×1200。不怕水、不怕白蚁、不会发霉起拱，适合新山的潮湿气候。可用于卧室、客厅、阳台。</p></div>
   <div class="fact"><span class="k">铺法</span><span class="v">直铺 · 1/3 错缝 · 人字铺</span><p>长边 600mm 以上的砖不建议 1/2 错缝：砖中间略拱，半砖错开时高点对低点，容易出现高低差。用 1/3 错缝或直铺更平整。</p></div>
  </div>
  <div class="prose">
   <p><b>木纹砖铺贴要点</b>：</p>
   <ul>
    <li>按 1/3 长度错缝，或做人字铺 / 鱼骨铺（更有设计感，损耗更高，约 10–15%）。</li>
    <li>缝留 1.5–2mm，用接近砖色的美缝剂，看起来更像整片木地板。</li>
    <li>铺前先把几箱砖摊开混排，避免同一种纹理挤在一起。</li>
    <li>地面平整度要求高，大长条砖建议用找平器（调平夹）。</li>
    <li>户外、阳台要选防滑等级更高的户外款。</li>
   </ul>
  </div>
 </div>
 <div class="block"><h3><small>CASE</small>搭配案例（给客户讲方案用）</h3>
  <div class="grid2">
   <div class="fact"><span class="k">案例 1 · 公寓卫生间</span><span class="v">墙 300×600 浅灰哑光直铺到顶<br>地 600×600 防滑哑光</span><p>小卫生间墙砖直铺（对缝）线条干净，显得整齐；地面选防滑款，淋浴区做淋浴房干湿分离。浅色墙 + 稍深地面，空间不压抑。</p></div>
   <div class="fact"><span class="k">案例 2 · 排屋厨房</span><span class="v">墙 300×600 白色亮光横贴<br>地 600×600 水泥纹 / 石纹</span><p>亮光墙砖油污一擦就掉；横贴让厨房显宽。地面用耐脏的水泥纹或石纹，和全铝橱柜的木纹门板搭配。</p></div>
   <div class="fact"><span class="k">案例 3 · 卧室木纹砖</span><span class="v">200×1200 木纹砖 1/3 错缝<br>同色美缝</span><p>卧室要温暖感但怕潮怕白蚁，木纹砖是木地板的替代方案。搭配木定制或铝合金木纹衣柜，色调统一。</p></div>
   <div class="fact"><span class="k">案例 4 · 阳台 / 后院</span><span class="v">户外款木纹砖或 600×600 防滑砖</span><p>新山日晒雨淋，木地板和塑木在户外容易褪色变形；户外防滑砖耐晒耐水，常配折叠门把客厅和阳台连通。</p></div>
   <div class="fact"><span class="k">案例 5 · 客厅预算对比</span><span class="v">600×600 经济整洁<br>750×1500 大板高级通透</span><p>同一个客厅，600×600 材料和人工都省；大板缝少、更显大，但要瓷砖胶和大板师傅。先问预算，再给两个方案让客户选。</p></div>
   <div class="fact"><span class="k">案例 6 · 整屋统一</span><span class="v">客厅餐厅大板 + 卧室木纹砖<br>厨卫 300×600 墙 + 600×600 地</span><p>公区用大板显气派，卧室用木纹砖显温馨，厨卫用好打理的中小规格，一屋三种规格，色系保持统一。</p></div>
  </div>

 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">客户：「这砖为什么比 Shopee 贵？」</span><p>「您摸一下这个金丝绒面，吸水率在 0.5% 以内，是瓷质砖，不是便宜的釉面砖。750×1500 大板，缝少，客厅看起来更整、更大。我们按片卖，一片 RM 126，折合每平方呎大概 RM 10，新山同类大板一般在 RM 7–18 一平方呎。」</p></div>
  <div class="talk"><span class="who">客户：「浅色地砖会不会很快脏？」</span><p>「哑光面不像亮光砖那样一有脚印就看得到，干粒款表面有纹理，更耐脏也更防滑。日常用中性清洁剂拖就行。」</p></div>

 <div class="block"><h3><small>Q&A</small>客户常问</h3><div class="qa">
  <details><summary>大板能铺墙吗？</summary><p>可以，但必须用瓷砖胶并由有经验的师傅施工，墙面要先找平。750×1500 单片约 25–30kg，搬运也要两人。</p></details>
  <details><summary>浴室能用吗？会不会滑？</summary><p>可以用。浴室地面优先选干粒 / 哑光款，淋浴区可以搭配淋浴盘。具体防滑等级以厂家检测为准，不要口头保证「绝对不滑」。</p></details>

{ id:'cabinet', no:'02', title:'橱柜：布局、柜体、全铝工艺与台面', short:'橱柜与台面', meta:'厨房布局 · 柜体尺寸 · 全铝橱柜 · 7 种台面 · 报价项',
 body:()=>`
 <p class="lede">橱柜是整装里客单价最高、客户最用心比较的品类。导购要按顺序讲清楚四件事：<b>厨房怎么布局 → 橱柜由哪些柜组成 → 为什么选全铝 → 台面选哪种</b>。新山潮湿、白蚁多，夹板柜用几年就会发霉、起泡、被蛀，所以全铝橱柜是 HOUZY 最有说服力的产品。</p>
 <div class="block"><h3><small>LAYOUT</small>厨房布局：先看户型再推荐</h3>
  <div class="grid2">
   <div class="fact"><span class="k">一字型</span><span class="v">所有柜子沿一面墙</span><p>适合公寓小厨房、窄长厨房。动线简单，台面长度有限。</p></div>
   <div class="fact"><span class="k">L 型</span><span class="v">两面墙成直角</span><p>新山排屋最常见。转角要配飞碟拉篮，否则转角里面用不到。</p></div>
   <div class="fact"><span class="k">U 型</span><span class="v">三面墙围合</span><p>台面和收纳最多，适合常做饭的大家庭。两侧间距建议 ≥ 1200mm。</p></div>
   <div class="fact"><span class="k">二字型（走廊型）</span><span class="v">两面墙相对</span><p>一边洗切、一边烹饪。中间通道 1000–1200mm。</p></div>
   <div class="fact"><span class="k">岛台型</span><span class="v">L / 一字 + 中间岛台</span><p>适合开放式厨房、大户型。岛台可做早餐台、备餐台。干厨 + 湿厨分开是马来西亚华人家庭常见做法。</p></div>
   <div class="fact"><span class="k">黄金三角</span><span class="v">冰箱 → 水槽 → 炉灶</span><p>按「取菜 → 洗切 → 下锅」顺序排，三点之间不要太远也不要挤在一起。水槽和炉灶之间最好留 ≥ 600mm 切菜台面。</p></div>
  </div>
 </div>
 <div class="block"><h3><small>PARTS</small>橱柜由哪些柜组成 · 标准尺寸</h3>
  ${table(['柜体','作用','常用尺寸','讲解重点'],[
   ['地柜','放锅具、碗碟、调料，上面放台面','高 725mm（不含台面）· 深 550–600mm','加台面后操作高度约 850–900mm，可按客户身高调整（身高 ÷ 2 + 50–100mm）'],
   ['吊柜','装在墙上，放轻的杂物','深 300–350mm · 高 ≤ 1400mm','吊柜底离台面约 650–750mm，太低会碰头；可加升降拉篮'],
   ['高柜','到顶储物、嵌入式电器','宽 600mm 常见','可做嵌入冰箱、蒸烤箱、联动拉篮'],
   ['水槽柜','装水槽、下水、净水器','宽 800–900mm','柜内最潮湿，全铝最有优势；可加嵌门式垃圾桶'],
   ['灶台柜','装炉灶','按灶具开孔（如 730×410）','下方放锅，配碗碟拉篮；不放易燃物'],
   ['转角柜','L / U 型转角','900 转角','配飞碟拉篮，避免死角'],
   ['窄边柜','灶台旁调料','250–300mm','配调味篮、侧拉篮'],
   ['踢脚 / 收边','柜底挡板','高约 100mm','铝合金踢脚防水，拖地不泡柜脚']])}
  <div class="prose"><p><b>HOUZY 橱柜两条线</b>：</p><ul>
   <li><b>全铝合金橱柜</b>（主推）：柜体和门板全铝，防潮、防蛀、零甲醛，下面详细讲。</li>
   <li><b>高定系列</b>：实木、烤漆、模压、不锈钢等多种门板工艺，给追求造型和质感的客户（板材知识见「全屋定制」章）。具体工艺和价格以店长资料为准。</li>
  </ul></div>
 </div>

 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">材料</span><span class="v">全铝合金一体成型</span><p>防水、防潮、防白蚁，不发霉、不变形；没有人造板，所以没有甲醛释放。</p></div>
   <div class="fact"><span class="k">对比夹板 / MDF</span><span class="v">怕水、怕蛀、含胶</span><p>夹板柜在水槽柜底最先坏：泡水起鼓、发霉、被白蚁吃空。全铝柜可以直接用水冲洗。</p></div>
   <div class="fact"><span class="k">计价单位「呎」</span><span class="v">按柜体长度 running foot</span><p>1 呎 = 304.8mm。地柜 3 米长 ≈ 9.8 呎。端板按平方呎。</p></div>
   <div class="fact"><span class="k">标准尺寸</span><span class="v">地柜高 725mm（不含台面）<br>吊柜高 ≤ 1400mm</span><p>加台面后操作高度约 850–900mm，可按客户身高调整。</p></div>
  </div>
  <div class="prose">
   <p><b>门板 / 柜体工艺：是什么材料、有什么用</b></p>
  </div>
  ${table(['工艺','材料','怎么做','功能 / 好处','讲给客户听'],[
   ['<b>喷涂</b>（0.7 / 0.9mm）','铝合金板 + 粉末涂料（常见聚酯粉末）','静电把粉末吸附到铝板上，高温烘烤固化成一层漆膜','上色、防腐蚀、耐刮；颜色可选最多。0.7 / 0.9mm 是铝皮厚度，0.9mm 更挺、更耐撞','「和铝合金门窗一样的烤漆，不怕水、不掉色，颜色随您挑。」'],
   ['<b>PET 覆膜</b>','铝合金板 + PET 装饰膜（聚对苯二甲酸乙二醇酯，和矿泉水瓶同一类安全塑料）','把印好纹理的 PET 膜压贴在铝板表面','做出木纹、肤感（哑光防指纹）、高光等效果；耐磨、防潮、易清洁；膜本身不含甲醛','「看着是木纹、摸着像皮肤一样细腻，其实是铝，油污一擦就掉。」'],

   <div class="fact"><span class="k">外观</span><span class="v">木纹 · 肤感 · 珠光 · 哑光饰面</span><p>外观可以做出接近木柜的效果，带客户摸样柜。</p></div>
   <div class="fact"><span class="k">标配与计价</span><span class="v">柜体 + 柜门 + 五金 + 灯带</span><p>按正立面投影面积计价（宽 × 高，平方呎），单价以展厅标价和系统为准。功能五金、书桌、梳妆台另计。</p></div>
  </div>
 </div>

 <div class="block"><h3><small>WOOD</small>木作定制：常见木板种类</h3>
  <p class="prose">客户最常问「这是什么板？」。下面这张表要背熟，内容是市面上通用的板材知识。马来西亚市场最常见的是三聚氰胺板（颗粒板饰面）和夹板（Plywood），客户说「Melamine」「Plywood」时要能对上号。</p>
  ${table(['板材','怎么做出来的','优点','缺点','适合用在'],[
   ['<b>实木板</b>（原木 / 直拼板）','整块天然木材，或多条实木直接拼接','质感最好、天然木纹、可翻新','最贵；随湿度热胀冷缩，易开裂变形','高端门板、台面、家具'],
   ['<b>指接板</b>','短实木条像手指一样咬合拼接','用胶少、实木感强、比原木便宜','可能有拼接纹；稳定性不如多层板','柜体、层板'],
   ['<b>多层实木板</b>（夹板 / Plywood）','多层薄木片纵横交错热压','结构稳定不易变形、握钉力好、承重好','价格较高；表面需贴饰面','柜体、门板、浴室柜、厨房柜（中高端首选）'],
   ['<b>生态板</b>（免漆板）','多层板或细木工板表面直接贴三聚氰胺饰面纸','免油漆、颜色多、耐磨、环保性好','封边质量决定耐用度','衣柜、书柜柜体'],
   ['<b>颗粒板</b>（刨花板）','木屑颗粒加胶压制','平整、不易变形、价格友好、定制品牌常用','怕长时间泡水；握钉力一般，不适合反复拆装','衣柜、书柜（干区）'],
   ['<b>欧松板</b>（OSB 定向结构板）','大片木刨片定向排列压制','强度高、用胶相对少','表面粗糙，需饰面；国内外品质参差','柜体、隔墙'],
   ['<b>密度板</b>（MDF / HDF）','木纤维打碎加胶高压','表面最细腻，适合雕刻、烤漆、吸塑','最怕水，吸水膨胀；握钉力差','烤漆门板、造型门板'],
   ['<b>细木工板</b>（大芯板）','中间实木条，两面贴薄木皮','轻、握钉力好、便宜','芯材质量差别大，易变形','木工现场打柜、门套']])}
  <div class="grid2">
   <div class="fact"><span class="k">环保等级</span><span class="v">E1 → E0 → ENF</span><p>甲醛释放量依次更低，ENF 最严格。客户问到时按本店板材检测报告回答，不要自己编等级。</p></div>
   <div class="fact"><span class="k">封边</span><span class="v">PVC · ABS · 激光封边</span><p>板材侧面包边，挡住潮气进入板芯。封边不严是木柜受潮、起鼓的第一原因。激光封边几乎无胶线，最好。</p></div>
   <div class="fact"><span class="k">饰面</span><span class="v">三聚氰胺 · PET · 木皮 · 烤漆</span><p>三聚氰胺耐磨好打理；PET 环保、肤感好；木皮是真木纹；烤漆亮丽但怕磕碰。</p></div>
   <div class="fact"><span class="k">板厚</span><span class="v">柜体常用 18mm · 背板 5–9mm</span><p>背板太薄容易变形。层板跨度超过约 900mm 要加立板或加厚，防止压弯。</p></div>
  </div>
  <div class="prose"><p><b>门板工艺</b>：</p><ul>
   <li><b>实木门板</b>：天然质感，可做线条造型，价格高。</li>
   <li><b>烤漆门板</b>：密度板多层喷漆烘烤，颜色鲜亮、光滑，怕磕碰和油烟熏黄。</li>
   <li><b>模压 / 吸塑门板</b>：密度板雕型后用 PVC 膜一体热压包覆，造型多、无封边、好打理，怕长期高温。</li>
   <li><b>双饰面门板</b>：颗粒板 / 生态板两面贴饰面，性价比高，以平板为主。</li>
   <li><b>玻璃 / 铝框门</b>：适合展示柜、酒柜，轻盈通透。</li>
  </ul>
  <p><b>新山使用提醒</b>：木柜尽量不要贴着潮湿外墙，背板离墙或做防潮处理；靠地的柜子做铝合金踢脚线或抬高；装修前先做白蚁防治。</p></div>
 </div>

 <div class="block"><h3><small>HARDWARE</small>定制柜基础五金</h3>

   <div class="fact"><span class="k">拉手</span><span class="v">明装 · 隐形 · 免拉手</span><p>免拉手（反弹器 / 斜边拉手）外观简洁；有老人小孩的家庭明拉手更好用。</p></div>
   <div class="fact"><span class="k">功能五金</span><span class="v">裤架 · 升降衣架 · 拉篮</span><p>详见「收纳五金」章，按柜宽配。</p></div>

 </div>

 <div class="block"><h3><small>COMPARE</small>铝合金还是木作：怎么推荐</h3>

  <div class="talk"><span class="who">客户问「铝的好还是木的好？」</span><p>先问：「这个柜子放在哪个房间？靠不靠外墙？之前家里的柜子有没有发霉或者白蚁？」潮湿或有白蚁顾虑，推荐全铝；常开冷气的主卧、很喜欢木质感，推荐木作。也可以混搭：主卧客厅做木作，洗衣房、衣帽间、小孩房做铝。</p></div>
  <div class="talk"><span class="who">客户问「多层板和颗粒板差在哪？」</span><p>「多层板是一层层薄木片交错压出来的，结构稳、承重好、钉子咬得牢，比较贵；颗粒板是木屑压的，平整、便宜，放在干燥的卧室没问题，但怕长时间泡水。浴室、厨房这些潮湿地方，要么用多层板，要么直接用铝。」</p></div>

{ id:'toilet', no:'04', title:'马桶与智能卫浴', short:'马桶', meta:'12 个单品 · 普通 / 智能 / 智能盖板',
 body:()=>`
 <p class="lede">卖马桶前必须先问两个问题：<b>坑距多少？卫生间旁边有没有插座？</b>答不出这两个，就不能保证装得上。</p>
 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">坑距</span><span class="v">排污口中心到墙的距离</span><p>常见 300 / 400mm。买错坑距装不上或离墙太远。2970 是标准 400 坑距。先量再卖。</p></div>
   <div class="fact"><span class="k">冲水方式</span><span class="v">虹吸式 vs 直冲式</span><p>虹吸式靠管道虹吸把污物吸走，噪音小、返味少、挂壁少，但需要足够水量和水压；直冲式靠水流直接冲走，冲力猛、不易堵、对水压要求低，但声音大。<b>水压低的家庭优先推荐直冲式。</b></p></div>
   <div class="fact"><span class="k">带水箱智能马桶</span><span class="v">不怕水压低</span><p>无水箱款靠自来水压冲水，新山高层或老房子水压不足时冲不干净。本店 D1-T、H5-T、H8-A、E1-T 都带水箱，这是重要卖点。</p></div>
   <div class="fact"><span class="k">智能功能</span><span class="v">冲洗 · 座圈加热 · 暖风烘干 · 自动翻盖</span><p>D1-T 顶配还有语音控制。H1 支持无电清洗，停电时也能用。</p></div>
   <div class="fact"><span class="k">釉面</span><span class="v">全管道施釉 · 自洁釉</span><p>管道内也上釉，污物不易挂壁，减少堵塞和异味（8804）。</p></div>
   <div class="fact"><span class="k">智能盖板</span><span class="v">普通马桶升级方案</span><p>WLM002 盖板 RM 402，装在现有马桶上就有清洗功能。要量马桶圈尺寸，并要有电源。</p></div>
  </div>
  <div class="prose"><p><b>用电安全</b>：智能马桶需要靠近马桶的防水插座，并且要接地、配漏电保护。没有插座的要提醒客户请持证电工布线，导购不要说「随便拉个线就行」。</p>
  <p><b>节水标签</b>：马来西亚水务委员会 SPAN 有 WEPLS 节水产品标签，按星级评定，星越多越省水。客户问到时如实说明产品是否有该标签，没有就不要说有。</p></div>
 </div>
 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">智能马桶</span><p>「这款带水箱，就算楼上楼下同时用水、水压低，也能一次冲干净。冬天不冷，座圈是加热的，洗完还有暖风烘干，老人用特别方便。新山 Big Bath 一体马桶大概 RM 998–1,388，我们这款智能的 RM 1,499 左右。」</p></div>
  <div class="talk"><span class="who">预算有限</span><p>「如果预算有限，可以先买 RM 1,000 左右的虹吸普通马桶，再加一个 RM 402 的智能盖板，就有清洗功能了。」</p></div>
 </div>
 <div class="block"><h3><small>Q&A</small>客户常问</h3><div class="qa">
  <details><summary>智能马桶会不会漏电？</summary><p>正规安装要有接地和漏电保护的插座。请持证电工安装，并提醒客户不要用水直接冲洗电控部分。</p></details>
  <details><summary>虹吸马桶会不会容易堵？</summary><p>虹吸管道比直冲细，不要冲卫生巾、湿纸巾。正常使用不会比直冲更容易堵，而且全管道施釉更不易挂污。</p></details>
  <details><summary>不知道家里坑距怎么办？</summary><p>请客户拍照并用卷尺量「墙面到马桶后排污口中心」的距离；或量旧马桶后底座固定螺丝到墙。也可以安排量房。</p></details>
 </div></div>
 <div class="block"><h3><small>RANGE</small>本店全部马桶（12 款）</h3>
  ${filterable('toilet',['名称','型号','尺寸 mm','功能要点','零售价'],
    P.toilet.map(t=>[t[0],t[1],t[3],t[4],rm(t[5])]),[4],[1])}
  <div class="note">系统入库表里 8803 写的是「普通马桶」，备注却有智能冲洗、加热座圈等功能。卖之前看一下实物，确认它属于哪一类。</div>
 </div>`,

  ['虹吸式相比直冲式的优点：',['冲力更猛','噪音小、返味少','更便宜','不用水'],1,'虹吸式安静、防臭；直冲式冲力猛但声音大。'],
  ['客户有一个普通马桶，想要清洗功能但预算少：',['必须换智能马桶','推荐智能盖板 WLM002','推荐浴缸','无法实现'],1,'盖板 RM 402，量好马桶圈尺寸、有电源即可。'],
 ]},

/* ---------------- 5 浴室柜 面盆 ---------------- */
{ id:'vanity', no:'05', title:'全铝合金浴室柜、面盆与下水', short:'全铝浴室柜', meta:'16 个单品 · 全铝合金浴室柜 / 台上盆 / 立柱盆 / 玻璃盆',
 body:()=>`
 <p class="lede">HOUZY 的浴室柜全部是全铝合金柜体。浴室是全屋最湿的地方，柜子天天被水汽蒸、被水溅，木柜最容易在这里坏，所以「全铝」是这一章最重要的卖点。面盆、龙头、下水器要和柜子一起配，核心是「尺寸配得上、高度配得对」。</p>
 <div class="block"><h3><small>CORE</small>全铝合金浴室柜：五个卖点</h3>
  <div class="grid2">
   <div class="fact"><span class="k">防水</span><span class="v">柜体不怕水，不会泡烂</span><p>夹板、颗粒板、MDF 柜吸水后会起鼓、分层、柜脚发黑。铝不吸水，溅湿了擦干就好，柜底积水也不会烂。</p></div>
   <div class="fact"><span class="k">防霉</span><span class="v">柜内不发霉、不发臭</span><p>新山常年湿度高，木柜内侧和背板容易长霉、有霉味。铝材表面不会长霉，柜里放毛巾、纸巾也更干净。</p></div>
   <div class="fact"><span class="k">防白蚁</span><span class="v">白蚁吃不动铝</span><p>白蚁是马来西亚住户最头疼的问题之一，浴室柜靠墙、靠地、潮湿，正好是白蚁最爱的位置。铝柜没有木纤维，不会被蛀空。</p></div>
   <div class="fact"><span class="k">零甲醛</span><span class="v">没有人造板，没有胶水味</span><p>浴室空间小、门常关，人造板释放的甲醛容易积聚。全铝柜体没有板材胶黏剂释放问题，家里有小孩、孕妇更放心。</p></div>
   <div class="fact"><span class="k">耐用</span><span class="v">不变形、不褪色、好清洁</span><p>热水澡的蒸汽、清洁剂都不会让柜体变形。表面用湿布加中性清洁剂一擦就干净。柜门、五金和镜柜灯具的质保以系统质保卡为准。</p></div>
   <div class="fact"><span class="k">对比</span><span class="v">铝柜 vs 木柜 vs PVC 柜</span><p>木柜：好看但怕水怕蛀；PVC 柜：防水但软、易变色、承重差；全铝柜：防水、防蛀、结构硬，同时可以做木纹、肤感等饰面。</p></div>
  </div>
 </div>
 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">智能镜柜</span><span class="v">WSJ 系列 · 全铝柜体</span><p>全铝主柜 + 智能镜柜 + 陶瓷盆一整套。镜柜带收纳和灯光（一般有 LED 照明、除雾功能，以实物为准）。800 宽双门、600 宽单门。</p></div>
   <div class="fact"><span class="k">台上盆</span><span class="v">盆放在台面上</span><p>造型好看、颜色多（哑光粉、卡其）。要配高款龙头或墙出水龙头，普通矮龙头够不到盆中间。</p></div>
   <div class="fact"><span class="k">立柱盆</span><span class="v">一体落地，省空间</span><p>适合小卫生间、客卫。没有柜子收纳，可以配镜柜。</p></div>
   <div class="fact"><span class="k">挂墙盆</span><span class="v">HYp118</span><p>下方悬空，易打扫。墙体要能承重，需预埋固定。</p></div>
   <div class="fact"><span class="k">玻璃盆</span><span class="v">GL10D / GL38-IR</span><p>通透有设计感，耐污，但要提醒避免硬物撞击。</p></div>
   <div class="fact"><span class="k">下水器</span><span class="v">弹跳式 GYJJ002</span><p>按一下塞子弹起 / 落下，可蓄水。有溢水孔和无溢水孔的盆要配对应下水器。</p></div>
  </div>
 </div>
 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">开场：一句话讲全铝</span><p>「我们的浴室柜全部是全铝合金柜体。浴室天天有水汽，木柜用两三年柜脚就发黑起鼓，铝柜不吸水、不发霉，白蚁也咬不动，用多少年都是这个样子。」</p></div>
  <div class="talk"><span class="who">客户正在看木纹款，说「这不是木头吗？」</span><p>「您摸一下，看着是木纹，其实里面是全铝。外观有木头的温暖，用起来是铝的耐水，两样好处都有。」</p></div>
  <div class="talk"><span class="who">客户家里旧柜坏过</span><p>先问：「您之前的浴室柜是哪里先坏的？」客户多半会说柜底、柜脚、背板。接着讲：「对，那几个地方最常碰水。换成全铝的，这个问题就没有了，这次装好就不用再换了。」</p></div>
  <div class="talk"><span class="who">客户嫌贵</span><p>「新山基础铝合金浴室柜大概 RM 458–588，只有柜子；IKEA 这一类镜柜 RM 1,200 以上，一般是木质板材。我们是全铝主柜加智能镜柜加陶瓷盆一整套。浴室柜一装就是十年，木柜两三年换一次，算下来铝柜更省。」</p></div>
  <div class="talk"><span class="who">做演示</span><p>带客户到样柜前，打开柜门让他敲一敲柜体、摸一摸内侧，再说「这里面也是铝，不是板」。客户亲手摸到，比你讲十遍都有用。</p></div>
  <div class="talk"><span class="who">配套</span><p>卖台上盆时，主动一起推荐高款龙头（如 78112BRG）和下水器，并说明原因：「这款盆高 13 厘米，普通龙头会溅水，要配高龙头。」</p></div>
 </div>
 <div class="block"><h3><small>Q&A</small>客户常问</h3><div class="qa">
  <details><summary>浴室柜会不会泡水烂掉？</summary><p>不会。我们是全铝合金柜体，铝不吸水，不会像木柜那样起鼓、分层。日常溅到水擦干即可；如果柜下水管漏水，及时报修水管就好，柜子本身不会被泡坏。</p></details>
  <details><summary>铝柜会不会生锈？</summary><p>铝不会生铁那样的红锈，表面有氧化保护层，浴室环境正常使用不会锈蚀。不要用强酸、强碱或钢丝球清洁，以免刮伤表面饰面。</p></details>
  <details><summary>铝柜摸起来会不会冷冰冰、像工业风？</summary><p>不会。表面可以做木纹、肤感、哑光等饰面，本店有象牙白、雪花灰 / 胡桃木、深灰、浅灰、子午灰几种颜色，带客户看样柜。</p></details>
  <details><summary>铝柜能放重的东西吗？台面陶瓷盆压得住吗？</summary><p>柜体按配套陶瓷盆和日常收纳设计。安装时由师傅固定在墙上，确保牢固；特别重的物品（如整箱洗衣液）建议放下层。</p></details>
  <details><summary>哑光彩色盆会不会难清洗？</summary><p>日常用软布和中性清洁剂即可，不要用钢丝球和强酸强碱。</p></details>
 </div></div>
 <div class="block"><h3><small>RANGE</small>本店全部浴室柜与面盆（16 款）</h3>
  ${filterable('vanity',['名称','型号','颜色','尺寸 mm','零售价'],
    P.vanity.map(v=>[v[0]+(v[5]?`<br><span class="tag">${v[5]}</span>`:''),v[1],v[3],v[4],rm(v[6])]),[4],[1])}
 </div>`,

  ['小客卫空间有限，推荐：',['独立浴缸','立柱盆','双门 800 镜柜','岛台'],1,'立柱盆一体落地、占地小。'],
  ['WSJ-2506-60 是：',['800 双门镜柜','600 单门镜柜','台上盆','马桶'],1,'60 = 600 宽单门。'],
  ['HOUZY 浴室柜最核心的卖点是：',['价格最便宜','全铝合金柜体：防水、防霉、防白蚁、零甲醛','进口品牌','颜色最多'],1,'浴室最潮湿，全铝柜不吸水、不发霉、不被蛀。'],
  ['客户说「木纹款不就是木头吗？」，正确回答：',['对，是实木','外观是木纹饰面，柜体是全铝，好看又耐水','是 PVC','不清楚'],1,'木纹是表面饰面，柜体仍是全铝。'],
  ['客户问「铝柜会生锈吗？」：',['会，要定期上油','铝表面有氧化保护层，正常浴室环境不会锈蚀','只要不碰水就不会','会生红锈'],1,'铝不会生铁那样的红锈；避免强酸强碱和钢丝球。'],
 ]},

/* ---------------- 6 花洒龙头喷枪 ---------------- */
{ id:'shower', no:'06', title:'花洒、龙头与喷枪', short:'花洒龙头', meta:'23 个单品 · 花洒 / 龙头 / 喷枪',
 body:()=>`
 <p class="lede">五金件价差大（RM 104–830），客户最常问「差在哪里」。答案在四个地方：阀芯、主体材料、表面处理、功能挡位。</p>
 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">阀芯</span><span class="v">陶瓷阀芯</span><p>龙头的「心脏」，两片陶瓷片控制水流，耐磨、不滴水。便宜龙头漏水大多是阀芯问题。</p></div>
   <div class="fact"><span class="k">主体材料</span><span class="v">铜 · 不锈钢 · 太空铝</span><p>铜体最耐用、最重；不锈钢不生锈；太空铝轻、不生锈、价格友好。浴缸龙头 H-2000 是铜体。</p></div>
   <div class="fact"><span class="k">表面处理</span><span class="v">电镀 · 枪灰 · 拉丝金 · 玫瑰金</span><p>多层电镀更亮、更耐腐蚀。枪灰、拉丝金是时下流行色，不显水渍。</p></div>
   <div class="fact"><span class="k">挡位</span><span class="v">二挡 / 三挡 / 四挡</span><p>挡位 = 出水模式数量（顶喷、手持、下出水、喷枪等）。挡位越多功能越全。</p></div>
   <div class="fact"><span class="k">数显 / 灯带</span><span class="v">实时显示水温</span><p>老人小孩洗澡防烫，是加分卖点。</p></div>
   <div class="fact"><span class="k">喷枪</span><span class="v">马桶旁冲洗喷枪</span><p>马来西亚家庭几乎每个厕所都装。套装含喷枪、软管（电话管）、支架、角阀（望眼）。</p></div>
  </div>
  <div class="prose"><p><b>和热水器配合</b>：新山家庭多用储水式或即热式热水器。花洒是混水阀，要有冷热两路进水；只有冷水管的卫生间要先确认热水方案。</p>
  <p><b>节水</b>：SPAN 的 WEPLS 标签也覆盖龙头、混水阀和花洒。</p></div>
 </div>
 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">客户：「两个花洒长得差不多，为什么差这么多钱？」</span><p>「这款 RM 766 是四挡，带数显水温和灯带，还有大置物台，洗发水可以直接放；那款 RM 289 是二挡简易款，只有顶喷和手持。家里有老人小孩的话，数显能看水温，防烫。」</p></div>
 </div>
 <div class="block"><h3><small>Q&A</small>客户常问</h3><div class="qa">
  <details><summary>枪灰色会不会掉色？</summary><p>正常使用不会。清洁用软布，不要用钢丝球、去污粉和强酸清洁剂，这类东西会损伤电镀层。</p></details>
  <details><summary>水压小，花洒出水会不会很弱？</summary><p>顶喷面积越大，需要的水压越高。水压低的家庭推荐手持增压或小顶喷款，必要时加增压泵。</p></details>
 </div></div>
 <div class="block"><h3><small>RANGE</small>本店全部花洒、龙头、喷枪（23 款）</h3>
  ${filterable('shower',['名称','型号','颜色','配置','零售价'],
    P.shower.map(s=>[s[0],s[1],s[3],s[4],rm(s[5])]),[4],[1])}

 </div>`,

  ['龙头不滴水主要靠：',['表面电镀','陶瓷阀芯','颜色','软管长度'],1,'阀芯是龙头的核心部件。'],

 ]},

/* ---------------- 7 淋浴房 ---------------- */
{ id:'enclosure', no:'07', title:'淋浴房、淋浴隔断、淋浴盘与浴缸', short:'淋浴房隔断', meta:'干湿分离方案 · 淋浴房 / 淋浴隔断 / 淋浴盘 / 浴缸',
 body:()=>`
 <p class="lede">淋浴房解决的是「干湿分离」：洗完澡卫生间地面不湿、不滑、不发霉。按卫生间形状选型，按安全讲玻璃。</p>
 <div class="block"><h3><small>KNOW</small>按空间选型</h3>
  <div class="grid2">
   <div class="fact"><span class="k">一字型</span><span class="v">长方形卫生间，淋浴区在一端</span><p>只需一面玻璃。可选移门、双移门、平开门、联动门。</p></div>
   <div class="fact"><span class="k">方形</span><span class="v">淋浴区在墙角</span><p>两面玻璃，双开门。</p></div>
   <div class="fact"><span class="k">钻石型</span><span class="v">墙角、空间较小</span><p>斜切门，进出更宽，占地更省。</p></div>
   <div class="fact"><span class="k">挡水石基</span><span class="v">空心塑钢 · 实心人造石</span><p>淋浴房底部挡水条，实心人造石更扎实耐用。</p></div>
  </div>
  <div class="prose">
   <p><b>玻璃安全</b>：淋浴房必须用钢化玻璃。钢化玻璃破碎时成小颗粒，不易伤人，但有极小概率自爆，所以要加贴防爆膜，碎了也不会四溅。这一点要主动告诉客户。</p>
   <p><b>集成防漏淋浴盘</b>（SWY001，1400×1000 岩板）：整体淋浴底盘，不靠瓷砖缝防水，从根本上减少渗漏；配漩涡地漏排水快、防臭。属于高端款，价格现场报。</p>
   <p><b>一体淋浴板</b>（XFD001，1.12 ㎡）：墙面整板，无砖缝，不藏污、不发霉。</p>
   <p><b>独立式浴缸</b>（XW2009B，高密度亚克力）：保温好、易清洁。卖前确认：卫生间尺寸能否搬进、楼板承重（满水加人约 300kg 以上）、地漏和浴缸龙头位置。新山同类亚克力独立缸约 RM 3,688–6,300。</p>
  </div>
 </div>
 <div class="block"><h3><small>SCREEN</small>淋浴隔断：比淋浴房更简洁的干湿分离</h3>
  <p class="prose">淋浴隔断是用一片或几片玻璃把淋浴区隔开，不一定有门、不做全封闭。适合想要通透、简洁、好清洁的客户，也是公寓小卫生间最常用的方案。<b>淋浴房</b>是带门的半封闭或全封闭空间，保温、挡水更好；<b>淋浴隔断</b>更开放、更省钱、更不压抑。</p>
  <div class="grid2">
   <div class="fact"><span class="k">固定单片（Walk-in）</span><span class="v">一片玻璃，没有门</span><p>最简洁、最好打扫。淋浴区宽度建议 ≥ 900mm，花洒朝墙装，避免水溅出。</p></div>
   <div class="fact"><span class="k">一字推拉 / 平开</span><span class="v">固定片 + 活动门</span><p>长方形卫生间常用。推拉门不占外部空间；平开门开口大，进出方便，门宽建议 ≥ 600mm。</p></div>
   <div class="fact"><span class="k">L 型转角</span><span class="v">两面玻璃围住墙角</span><p>淋浴区在墙角时用，挡水效果比单片更好。</p></div>
   <div class="fact"><span class="k">浴缸屏风</span><span class="v">装在浴缸边上的玻璃</span><p>固定或可旋转折叠，有浴缸又想淋浴时用，替代浴帘。</p></div>
   <div class="fact"><span class="k">半墙 + 玻璃</span><span class="v">下半砌墙，上半玻璃</span><p>下方矮墙挡水、可做置物龛，上方玻璃透光，适合做设计感的卫生间。</p></div>
   <div class="fact"><span class="k">无框 / 极窄框</span><span class="v">玻璃用墙夹、地槽固定</span><p>视觉最通透，用 10mm 较厚玻璃更稳。对墙面、地面的平直度和安装手艺要求最高。</p></div>
  </div>
  ${table(['部件','常见材料 / 规格','作用','讲解重点'],[
   ['玻璃','钢化玻璃 6 / 8 / 10mm；透明、磨砂、长虹、灰玻、茶玻','隔水、透光','门片常用 8mm，大固定片或无框用 10mm。钢化玻璃碎了成小颗粒，不易伤人'],
   ['防爆膜','PET 安全膜，贴在玻璃内侧','玻璃万一自爆，碎片粘在膜上不四溅','钢化玻璃有极小概率自爆，一定要贴'],
   ['易洁镀膜','纳米疏水涂层','水珠滚落、少水垢','新山水质偏硬，镀膜后更好清洁，减少水垢白点'],
   ['型材 / 五金','铝合金或 304 不锈钢；黑、枪灰、拉丝金等颜色','固定玻璃、承重','304 不锈钢不生锈；颜色可以和花洒、龙头搭配'],
   ['稳定杆','不锈钢或铝合金顶拉杆','防止大块玻璃晃动','固定片较宽、较高时必须加'],
   ['挡水条 / 石基','磁吸胶条、硅胶条；人造石或塑钢石基','挡住地面流水','配合地面坡度和地漏，才能真正不漏水'],
   ['密封胶','防霉硅酮胶','玻璃与墙地之间密封','要用防霉款，打胶不严是漏水和发黑的主要原因']])}
  <div class="grid2">
   <div class="fact"><span class="k">量尺要点</span><span class="v">宽 · 高 · 墙是否垂直</span><p>淋浴区宽 ≥ 800–900mm；隔断高一般 1900–2000mm；看清墙面、地面是否垂直平整，花洒、开关、窗户位置要避开。</p></div>
   <div class="fact"><span class="k">安装顺序</span><span class="v">先防水，后隔断</span><p>地面防水、瓷砖、地漏做完，再装隔断；墙体有水管、电线的位置不能打孔。</p></div>
   <div class="fact"><span class="k">市场参考</span><span class="v">约 RM 44–70 / sqft（含安装）</span><p>按玻璃厚度、无框 / 有框、五金档次差别较大。常见 5'×6' 规格成套参考约 RM 1,800。HOUZY 淋浴隔断按同款淋浴房价目报价（见下方产品表）。</p></div>
   <div class="fact"><span class="k">保养</span><span class="v">洗完澡刮一下水</span><p>用玻璃刮把水刮干，减少水垢；不要用钢丝球和强酸清洁剂，以免伤到镀膜和五金。</p></div>
  </div>
  <div class="talk"><span class="who">客户：「淋浴房和淋浴隔断选哪个？」</span><p>「卫生间小、想要通透好打扫，选淋浴隔断，一片玻璃就把水挡住了，看起来空间更大。家里有老人小孩、想要洗澡时暖一点、水一点都不溅出来，选带门的淋浴房。」</p></div>
  <div class="talk"><span class="who">讲安全</span><p>「玻璃是钢化的，我们还会贴防爆膜，万一碎了碎片也粘在膜上，不会掉下来伤人。另外可以加一层易洁镀膜，洗完澡水珠自己滚下去，不容易留水垢。」</p></div>
  <span class="src">市场参考价来自马来西亚公开报价（如 <a href="https://www.mudah.my/pasang-glass-skrin-mandian-l-shower-glass-panel-114590149.htm" target="_blank" rel="noopener">Mudah 淋浴玻璃安装</a>）和本店价目表中的新山参考价，只用于帮客户理解价位，随市场变动。</span>
 </div>
 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">客户家里有老人</span><p>「做了干湿分离，洗手间外面地面一直是干的，老人上厕所不容易滑倒。玻璃是钢化的，再加防爆膜，万一碎了也不会掉下来伤人。」</p></div>
 </div>
 <div class="block"><h3><small>RANGE</small>淋浴房系列全部产品：淋浴房、淋浴隔断、淋浴盘、浴缸</h3>
  ${table(['名称','型号','规格','零售价','备注'],P.enclosure.map(e=>[e[0],e[1],e[2],e[3],e[4]?`<span class="tag w">${e[4]}</span>`:'']),[3],[1])}
  <div class="note">淋浴房各款在价目表里只有一个价格，没有写明是每套还是按面积。新山市场参考价为 RM 44 / sqft。报价前先和店长确认计价方式。</div>
 </div>`,
 quiz:[
  ['长方形卫生间、淋浴在一端，推荐：',['方形','一字型','钻石型','不用淋浴房'],1,'一字型只需一面玻璃。'],
  ['小公寓卫生间想要通透、好打扫，推荐：',['全封闭淋浴房','固定单片淋浴隔断','浴帘','不做干湿分离'],1,'一片玻璃挡水，空间看起来更大。'],
  ['无框大块淋浴隔断一般用多厚的钢化玻璃？',['4mm','6mm','10mm','20mm'],2,'门片常用 8mm，大固定片或无框用 10mm。'],
  ['淋浴隔断漏水、发黑最常见的原因：',['玻璃太厚','打胶不严、没用防霉胶','颜色太深','花洒太大'],1,'要用防霉硅酮胶并配合地面坡度和挡水条。'],
  ['为什么淋浴房玻璃要加防爆膜？',['好看','钢化玻璃有极小概率自爆，防止碎片四溅','防水','隔音'],1,'钢化玻璃安全但可能自爆，防爆膜兜底。'],
  ['卖独立浴缸前不需要确认的是：',['能否搬进卫生间','楼板承重','地漏位置','客户喜欢的电视剧'],3,'搬运、承重、排水是三大前提。'],
 ]},

/* ---------------- 8 门窗 ---------------- */
{ id:'window', no:'08', title:'铝合金系统门窗', short:'铝合金门窗', meta:'24 个系列 · 按 ㎡ 定制报价',
 body:()=>`
 <p class="lede">门窗是定制品，没有现货价，按「宽 × 高 = ㎡ × 单价」报。导购要会讲断桥、玻璃、五金三大件，并会算面积。</p>
 <div class="block"><h3><small>KNOW</small>专业知识</h3>
  <div class="grid2">
   <div class="fact"><span class="k">断桥铝</span><span class="v">中间有隔热条的铝型材</span><p>室内外两层铝之间用隔热条「断开」，热量不容易传进来。新山太阳猛，开冷气更省电。</p></div>
   <div class="fact"><span class="k">壁厚</span><span class="v">1.4 / 1.8 / 2.0 / 3.0 mm</span><p>型材铝壁的厚度。越厚越结实、越抗风。卧室窗 1.8 起，大面积门窗 2.0。</p></div>
   <div class="fact"><span class="k">中空玻璃</span><span class="v">5 白 + 20A + 5 白</span><p>两片 5mm 玻璃中间 20mm 空气层（A = 空气层）。隔音、隔热。27A 空气层更厚。</p></div>
   <div class="fact"><span class="k">夹胶玻璃</span><span class="v">+ 1.14 PVB</span><p>玻璃中间夹 PVB 胶片，碎了不掉，安全、隔音更好。临街、高层推荐。</p></div>
   <div class="fact"><span class="k">Low-E 玻璃</span><span class="v">低辐射镀膜</span><p>反射太阳热辐射，夏天室内更凉，减少紫外线晒褪色家具。</p></div>
   <div class="fact"><span class="k">五金</span><span class="v">希美克 · HOPO 等</span><p>铰链、执手、锁点决定窗户能用多久、关得多严。304 防坠绳防止窗扇坠落。</p></div>
  </div>
  <div class="prose">
   <p><b>开启方式</b>：</p>
   <ul>
    <li><b>平开 / 外开</b>：密封最好，隔音防雨强，最适合卧室。窗纱一体款防蚊。</li>
    <li><b>内开内倒</b>：可以向内开，也可以上部向内倒通风，下雨天也能开窗透气，适合高层。</li>
    <li><b>推拉</b>：不占空间，开启方便，密封比平开弱。三轨 = 两扇玻璃 + 一扇纱。</li>
    <li><b>提升推拉 / 侧压</b>：推拉的便利 + 接近平开的密封，中高端推拉。</li>
    <li><b>吊趟门</b>：轨道在上方，地面无轨不绊脚，厨房、衣帽间常用。</li>
    <li><b>折叠门</b>：可以全部推开，连通花园或阳台。</li>
   </ul>
   <p><b>面积计算</b>：面积 ㎡ = 宽 mm × 高 mm ÷ 1,000,000。按合同约定，平开窗不足 1 ㎡ 按 1 ㎡ 计。开启扇、纱窗、护栏等附加项按件另计。</p>
  </div>
 </div>
 <div class="block"><h3><small>TOOL</small>门窗面积计算器</h3>
  <div class="calc">
   <div class="row">
    <label for="wc-w">宽 mm<input id="wc-w" type="number" min="0" value="1200"></label>
    <label for="wc-h">高 mm<input id="wc-h" type="number" min="0" value="1500"></label>
    <label for="wc-p">单价 RM/㎡<input id="wc-p" type="number" min="0" value="500"></label>
    <label for="wc-min">不足 1㎡ 按 1㎡<select id="wc-min"><option value="1">是</option><option value="0">否</option></select></label>
   </div>
   <div class="out" id="wc-out"></div>
   <span class="src">示例取自员工系统手册：1200 × 1500，RM 500/㎡。单价为演示值，实际单价按系统和店长报价。</span>
  </div>
 </div>
 <div class="block"><h3><small>TALK</small>卖点话术</h3>
  <div class="talk"><span class="who">客户：「普通铝窗便宜很多，为什么要断桥？」</span><p>「新山下午太阳直晒，普通铝窗框摸上去是烫的，热量直接进屋，冷气开得再大也不凉。断桥铝中间有隔热条，再配中空玻璃，房间凉得快、电费省，下大雨也不容易渗水。」</p></div>
  <div class="talk"><span class="who">推荐主力</span><p>卧室主推 <b>星链 102 平开窗纱一体</b>：1.8mm 壁厚，信义中空玻璃，不锈钢静音铰链 + 304 防坠绳，窗和纱一体防蚊。要更高端选 <b>祝融 112 / 鲲龙 120</b>（2.0mm + 美国希美克五金）。</p></div>
 </div>
 <div class="block"><h3><small>Q&A</small>客户常问</h3><div class="qa">
  <details><summary>下暴雨会不会漏水？</summary><p>平开 / 内开内倒窗多道密封，防雨最好；注胶系统窗密封更好。漏水多数是安装打胶问题，所以安装要由公司安排的师傅做，完工做淋水测试。</p></details>
  <details><summary>多久能装好？</summary><p>门窗需要量尺 → 下单生产 → 物流 → 安装。具体交期以厂家确认为准，不要现场承诺日期。</p></details>
  <details><summary>能装防盗网吗？</summary><p>可以加固定护栏（附加项），也可以选窗纱一体款。</p></details>
 </div></div>
 <div class="block"><h3><small>RANGE</small>本店全部门窗系列（24 个）</h3>
  ${filterable('window',['系列','壁厚 mm','开启方式','标配五金 / 玻璃','适用'],P.windows,[1],[])}
  <div class="note">门窗没有固定零售价。在员工系统「新建订单 → 铝合金门窗」里选系列，会自动带出壁厚、玻璃和五金，再按客户确认方案填单价。价目表上的门窗价格没有标明对应哪种开启方式和单位，不要直接对客户报。</div>
 </div>`,
 quiz:[
  ['断桥铝最主要的好处是：',['更便宜','隔热，室内更凉、省电','更轻','颜色多'],1,'隔热条阻断热传导。'],
  ['5 白 + 20A + 5 白 中的 20A 指：',['20 年质保','20mm 空气层','20 号铝','A 级玻璃'],1,'A = Air 空气层。'],
  ['宽 1200mm × 高 1500mm 的窗面积是：',['1.8 ㎡','18 ㎡','2.7 ㎡','0.18 ㎡'],0,'1200 × 1500 ÷ 1,000,000 = 1.8 ㎡。'],
  ['高层住户想下雨天也能开窗通风，推荐：',['推拉窗','内开内倒窗','折叠门','吊趟门'],1,'内倒模式上部开缝通风，雨水进不来。'],
  ['卧室最推荐的开启方式：',['平开 / 窗纱一体','吊趟','折叠','非断桥推拉'],0,'平开密封隔音最好，窗纱一体防蚊。'],
 ]},

/* ---------------- 线上商城 ---------------- */
{ id:'shop', no:'', title:'线上商城：店里没有的，线上还有更多', short:'线上商城', meta:'更多款式 · 中国仓直发 · 5 种语言 · MYR 结算',
 body:()=>`
 <p class="lede">展厅面积有限，摆不下所有产品。<b>客户要的款式店里没有，不等于 HOUZY 没有。</b>线上商城有更多款式，大部分从中国仓直接发货到马来西亚。导购的任务是：店里没有的，马上打开商城帮客户找，不让客户空手离开。</p>
 <div class="block"><h3><small>CORE</small>店里没有？线上找</h3>
  <div class="grid2">
   <div class="fact"><span class="k">款式更多</span><span class="v">展厅是样板，商城是完整货架</span><p>厨房、卫浴、门窗、瓷砖、衣柜、整套方案，线上的款式、颜色、尺寸都比展厅多。</p></div>
   <div class="fact"><span class="k">中国仓直发</span><span class="v">中国仓直接发货到马来西亚</span><p>商城产品页标注「中国仓发货」的，从中国直发，<b>到货约 25 天</b>；标注「马来西亚仓发货」的是本地现货，到货更快。</p></div>
   <div class="fact"><span class="k">价格优势</span><span class="v">源头直发，少中间环节</span><p>从中国直接发货，不经过本地多层经销，同等品质价格更有竞争力。</p></div>
   <div class="fact"><span class="k">一样的服务</span><span class="v">一样的售后和安装</span><p>线上买的产品同样可以安排配送和上门安装（满 RM 1,000 免运送装，以商城当期说明为准）。</p></div>
  </div>
  <ol class="steps">
   <li><div><b>先确认需求</b>：客户要什么款式、颜色、尺寸、预算？店里样品哪里不满意？</div></li>

CH.forEach((c,i)=>c.no=String(i).padStart(2,'0'));
const KEY='houzy-academy-v1';
let state={passed:{},cur:'start'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) state=Object.assign(state,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};

function renderToc(){
  const toc=document.getElementById('toc');
  toc.innerHTML='<div class="toc-label">学习路线</div>'+CH.map(c=>`<button data-id="${c.id}" aria-current="${c.id===state.cur}"><span class="no">${c.no}</span><span>${c.short}</span><span class="done">${state.passed[c.id]?'✓':''}</span></button>`).join('')
   +'<div class="toc-label">考核</div>'+`<button data-id="final" aria-current="${state.cur==='final'}"><span class="no">✦</span><span>上岗综合考核</span><span class="done">${state.passed.final?'✓':''}</span></button>`;
  toc.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.id));
  const n=CH.filter(c=>state.passed[c.id]).length;
  document.getElementById('progTxt').textContent=`已通过 ${n} / ${CH.length} 章${state.passed.final?' · 综合考核已通过':''}`;
  document.getElementById('progBar').style.width=(n/CH.length*100)+'%';
}
function quizHtml(qs,id,title){
  return `<div class="quiz" data-quiz="${id}"><h3>${title}</h3>${qs.map((q,i)=>`<div class="q" data-i="${i}" data-a="${q[2]}"><div class="stem">${i+1}. ${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<button data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="why" hidden>${q[3]}</div></div>`).join('')}
  <div class="score"><span id="sc-${id}">已答 0 / ${qs.length}</span><button class="btn ghost" data-reset="${id}">重做</button></div></div>`;
}
function bindQuiz(root,id,total){
  let right=0,done=0;
  root.querySelectorAll('.q').forEach(q=>{
    q.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const a=+q.dataset.a, j=+b.dataset.j;
      q.querySelectorAll('.opts button').forEach(x=>{x.disabled=true; if(+x.dataset.j===a) x.classList.add('right');});
      if(j!==a) b.classList.add('wrong'); else right++;
      done++; q.querySelector('.why').hidden=false;
      const sc=document.getElementById('sc-'+id);
      if(done===total){
        const pass=right/total>=0.8;
        sc.textContent=`得分 ${right} / ${total} · ${pass?'通过 ✓':'未通过，复习后重做'}`;
        if(pass){state.passed[id]=true; save(); renderToc();}
      } else sc.textContent=`已答 ${done} / ${total} · 答对 ${right}`;
    });
  });
  root.querySelector('[data-reset]').onclick=()=>go(state.cur,true);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function go(id,keepScroll){
  state.cur=id; save(); renderToc();
  const main=document.getElementById('main');
  if(id==='final'){
    const all=shuffle(CH.flatMap(c=>c.quiz)).slice(0,20);
    main.innerHTML=`<section class="ch"><div class="ch-head"><div class="eyebrow">上岗综合考核</div><h2>从全部章节随机抽 20 题</h2><div class="meta">答对 16 题（80%）通过。每次重做都会重新抽题。通过后截图发给店长存档。</div></div>${quizHtml(all,'final','综合考核')}${pager(id)}</section>`;
    bindQuiz(main.querySelector('.quiz'),'final',all.length);
  } else {
    const c=CH.find(x=>x.id===id)||CH[0];
    main.innerHTML=`<section class="ch"><div class="ch-head"><div class="eyebrow">第 ${c.no} 章</div><h2>${c.title}</h2><div class="meta">${c.meta}</div></div>${c.body()}${quizHtml(c.quiz,c.id,'本章小测验')}${pager(c.id)}</section>`;
    bindQuiz(main.querySelector('.quiz'),c.id,c.quiz.length);
    main.querySelectorAll('.filter input').forEach(inp=>inp.oninput=()=>{
      const box=document.getElementById(inp.dataset.target), v=inp.value.trim().toLowerCase(); let n=0;
      box.querySelectorAll('tbody tr').forEach(tr=>{const hit=!v||tr.textContent.toLowerCase().includes(v); tr.hidden=!hit; if(hit)n++;});
      document.getElementById('c-'+inp.dataset.target.slice(2)).textContent=`显示 ${n} 项`;
    });
    bindCalcs();
  }
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(!keepScroll) window.scrollTo({top:0});
}
function pager(id){
  const ids=CH.map(c=>c.id).concat('final'), i=ids.indexOf(id);
  const name=x=>x==='final'?'综合考核':CH.find(c=>c.id===x).short;
  return `<div class="pager">${i>0?`<button class="btn ghost" data-go="${ids[i-1]}">← ${name(ids[i-1])}</button>`:'<span></span>'}${i<ids.length-1?`<button class="btn" data-go="${ids[i+1]}">下一章：${name(ids[i+1])} →</button>`:''}</div>`;
}
function bindCalcs(){
  const t=document.getElementById('tc-out');
  if(t){const f=()=>{let a=+document.getElementById('tc-area').value||0; if(document.getElementById('tc-unit').value==='sqft') a=a/10.764;
    const s=+document.getElementById('tc-size').value, l=+document.getElementById('tc-loss').value||0, n=Math.ceil(a*(1+l/100)/s-1e-9);
    t.textContent=`约 ${a.toFixed(2)} ㎡ × (1 + ${l}%) ÷ ${s} ㎡/片 = ${n} 片`;};
    ['tc-area','tc-unit','tc-size','tc-loss'].forEach(i=>document.getElementById(i).oninput=f); f();}
  const wd=document.getElementById('wd-out');
  if(wd){const f=()=>{const W=+document.getElementById('wd-w').value||0,H=+document.getElementById('wd-h').value||0,m=W*H;
    wd.textContent=`正立面 ${m.toFixed(2)} ㎡ ≈ ${(m*10.7639).toFixed(1)} 呎²`;};
    ['wd-w','wd-h'].forEach(i=>document.getElementById(i).oninput=f); f();}
  const w=document.getElementById('wc-out');
  if(w){const f=()=>{const W=+document.getElementById('wc-w').value||0,H=+document.getElementById('wc-h').value||0,p=+document.getElementById('wc-p').value||0;
    const a=W*H/1e6, bill=(document.getElementById('wc-min').value==='1')?Math.max(a,1):a;
