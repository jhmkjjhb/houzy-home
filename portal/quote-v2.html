<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新版报价器 · HOUZY</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F3; --surface: #FFFFFF; --line: #DEDAD1;
    --ink: #1C1B19; --ink-dim: #6B6860;
    --navy: #17324F; --navy-soft: #E7EDF3; --on-navy: #FFFFFF;
    --accent: #C4501C; --ok: #2F6B4F; --ok-soft: #E3F0E8; --off: #B8B3A7;
    --red: #B42318; --red-soft: #FDECEA; --yellow: #8A5A00; --yellow-soft: #FFF4D6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151A; --surface: #1E1D23; --line: #34333A; --ink: #EDEBE6; --ink-dim: #9A968D;
      --navy: #9FC0E0; --navy-soft: #202B36; --on-navy: #16151A; --accent: #E37A46; --ok: #5FA382; --ok-soft: #1D2E25; --off: #4A4840;
      --red: #F08A80; --red-soft: #3A1F1E; --yellow: #E8C06A; --yellow-soft: #33291A; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; color: var(--ink); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 120px; }

  /* 顶部：总价永远看得到 */
  .top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top h1 { font-size: 16px; margin: 0; }
  .top h1 small { display: block; font-size: 11px; color: var(--ink-dim); font-weight: 500; }
  .top .cust { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
  .top .sum { text-align: right; }
  .top .sum small { display: block; font-size: 11px; color: var(--ink-dim); }
  .top .sum b { font-size: 20px; color: var(--accent); }
  .tabs { max-width: 1080px; margin: 0 auto; padding: 0 16px 10px; display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 6px; }
  .tab[data-tab="book"] { padding: 8px 10px; font-size: 15px !important; }
  .card > h2:first-child { margin-top: 0; }
  .tab { border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 10px; padding: 8px 4px; font-weight: 600; font-size: 13px; position: relative; }
  .tab.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .tab .dot { position: absolute; top: -6px; right: -4px; background: var(--red); color: #fff; border-radius: 10px; font-size: 10px; padding: 1px 6px; }

  h2 { font-size: 17px; margin: 22px 0 6px; }
  .hint { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 12px; line-height: 1.5; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }

  /* ① 房屋类型 */
  .houses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .house { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; text-align: left; }
  .house b { display: block; font-size: 15px; }
  .house span { font-size: 12px; color: var(--ink-dim); }
  .house.on { border-color: var(--navy); background: var(--navy-soft); }

  /* 可视化平面：房间块大小按面积 */
  .floor { margin-top: 14px; }
  .floor h3 { font-size: 13px; color: var(--ink-dim); margin: 0 0 6px; font-weight: 600; }
  .plan { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); }
  .rm { min-width: 104px; min-height: 84px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); padding: 8px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); }
  .rm .ic { font-size: 20px; }
  .rm .nm { font-weight: 700; font-size: 13px; }
  .rm .dm { font-size: 11px; color: var(--ink-dim); }
  .rm .am { font-size: 12px; color: var(--accent); font-weight: 600; }
  .rm.work { background: var(--navy-soft); border-color: var(--navy); }
  .rm.bad { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px dashed var(--line); background: transparent; border-radius: 16px; padding: 5px 10px; color: var(--ink-dim); font-size: 12.5px; }
  .chip:hover { border-color: var(--navy); color: var(--navy); }

  /* ② 房间 */
  .roombar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  .rchip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; text-align: left; min-width: 96px; }
  .rchip small { display: block; font-size: 11px; color: var(--ink-dim); }
  .rchip.on { border-color: var(--navy); background: var(--navy-soft); }
  .rchip.bad { border-color: var(--red); }
  .dims { display: grid; grid-template-columns: 1fr 200px; gap: 14px; align-items: start; }
  @media (max-width: 640px) { .dims { grid-template-columns: 1fr; } .tab { font-size: 11.5px; padding: 8px 2px; } .tab .tl { display: none; } }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-dim); }
  .stp { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .stp button { border: none; background: var(--navy-soft); color: var(--navy); width: 34px; font-size: 18px; font-weight: 700; }
  .stp input { width: 64px; border: none; text-align: center; padding: 8px 2px; background: transparent; font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; }
  .stp input:focus { outline: 2px solid var(--navy); outline-offset: -2px; }
  .unit { font-size: 11px; color: var(--ink-dim); }
  .wins { margin-top: 10px; }
  .win { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .win .no { font-weight: 700; color: var(--ink-dim); width: 54px; font-size: 12px; }
  .x { border: none; background: transparent; color: var(--ink-dim); font-size: 16px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; color: var(--ink); }
  .btn.pri { background: var(--navy); border-color: var(--navy); color: var(--on-navy); font-weight: 600; }
  .btn.okb { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .btn.warn { border-color: var(--red); color: var(--red); }
  .bookStat { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .bookStat div { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .bookStat b { font-size: 22px; display: block; }
  .sketch { max-width: 220px; margin: 0 auto; width: 100%; }
  .sketch svg { width: 100%; height: auto; display: block; }
  .grp { margin-top: 16px; }
  .grp h3 { font-size: 12px; letter-spacing: .04em; color: var(--ink-dim); margin: 0 0 6px; font-weight: 700; }
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; align-items: start; }
  .pack { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; color: var(--ink); display: block; width: 100%; }
  .pack .h { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .pack .h .ic { font-size: 18px; }
  .pack .h .rm2 { margin-left: auto; font-size: 12px; color: var(--ink-dim); font-weight: 500; white-space: nowrap; }
  .pack.wide { grid-column: 1 / -1; }
  .pack.on { border-color: var(--navy); background: var(--navy-soft); }
  .pack.on .h .rm2 { color: var(--accent); font-weight: 700; }
  .pack.opt { width: auto; padding: 8px 12px; min-width: 110px; }
  .pack.opt .tick { vertical-align: -3px; }
  .pack .tick { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--off); display: inline-grid; place-items: center; font-size: 12px; flex: none; }
  .pack.on .tick { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .pkbody { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
  .pkbody .lines, .pkbody .chip { flex-basis: 100%; }
  .item { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .lines { font-size: 11.5px; color: var(--ink-dim); line-height: 1.6; }
  .subtotal { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 700; }

  /* ④ 检查与报价单 */
  .issue { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 9px; margin-bottom: 6px; font-size: 13px; width: 100%; text-align: left; border: none; color: var(--ink); }
  .issue.r { background: var(--red-soft); } .issue.r b { color: var(--red); }
  .issue.y { background: var(--yellow-soft); } .issue.y b { color: var(--yellow); }
  .issue.g { background: var(--ok-soft); } .issue.g b { color: var(--ok); }
  .ok { background: var(--ok-soft); color: var(--ok); padding: 10px 12px; border-radius: 9px; font-weight: 600; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 8px 0 6px; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  table.q { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.q th { text-align: left; font-size: 11px; color: var(--ink-dim); border-bottom: 1px solid var(--line); padding: 6px 4px; }
  table.q td { border-bottom: 1px dashed var(--line); padding: 6px 4px; vertical-align: top; }
  table.q td.r, table.q th.r { text-align: right; }
  table.q tr.st td { font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--line); padding-top: 12px; }
  .desc { font-size: 11px; color: var(--ink-dim); }
  .scroll-x { overflow-x: auto; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; }
  .priceRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .priceRow span { flex: 1; min-width: 160px; }
  @media print {
    .top, .tabs, .noprint { display: none !important; }
    body { background: #fff; color: #000; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <h1>新版报价器<small>试用版 · 价格沿用公司价目表</small></h1>
    <input class="cust" data-info="name" placeholder="客户姓名">
    <div class="sum"><small>报价总额</small><b class="mono" id="grand">RM 0</b></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap" id="app"></div>

<script src="quote-v2-price.js?v=20261115c"></script>
<script src="quote-v2-pricebook.js?v=20261115b"></script>
<script src="quote-v2-rules.js?v=20261115c"></script>
<script>
(function () {
  const Q = window.QV2, { ROOMS, PACKS, GROUPS, HOUSES, HOUSE_ITEMS, PRICE, STAGES, num, r2 } = Q;
  const STORE = 'houzy-quote-v2';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rm = n => 'RM ' + Math.round(n).toLocaleString('en-MY');
  const nf = n => (Math.round(num(n) * 100) / 100).toLocaleString('en-MY', { maximumFractionDigits: 2 });
  const STAGE_COLORS = ['#7A8B99', '#2F6FA3', '#3E8E7E', '#C4501C', '#B28A2E', '#6B4FA0', '#2F6B4F', '#8A5A3C', '#A0496B'];

  let P = load();
  let tab = P.houseType ? 'room' : 'house';
  let roomId = P.rooms[0]?.id || null;
  let confirmReset = false;

  function blank() { return { houseType: '', rooms: [], house: {}, prices: {}, info: { name: '' }, discount: 0, design: true, plans: [{ id: 'A', name: '方案 A', specs: {}, roomSpecs: {} }], planId: 'A', quoteMode: 'estimate' }; }
  function load() { try { const x = JSON.parse(localStorage.getItem(STORE) || 'null'); if (x && Array.isArray(x.rooms)) return Q.migrate({ ...blank(), ...x }); } catch (e) {} return blank(); }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {} }
  const room = id => P.rooms.find(r => r.id === id);

  function compute() { const lines = Q.buildLines(P); return { lines, T: Q.totals(P, lines), K: Q.checks(P, lines, P.quoteMode || 'estimate') }; }
  const plan = () => Q.activePlan(P);

  const roomTotal = (lines, id) => lines.filter(l => l.roomId === id).reduce((t, l) => t + l.total, 0);
  const badRooms = K => new Set(K.red.map(x => x.go));

  // ---------- 小部件 ----------
  const stepper = (attrs, value, step = 1) => `<span class="stp"><button type="button" data-stp="-${step}" ${attrs}>−</button><input inputmode="decimal" value="${esc(value)}" ${attrs}><button type="button" data-stp="+${step}" ${attrs}>+</button></span>`;
  const field = (label, unit, inner) => `<label class="fld">${label}<span>${inner} <span class="unit">${unit || ''}</span></span></label>`;

  // ---------- ① 户型 ----------
  function viewHouse(C) {
    const bad = badRooms(C.K);
    let h = `<h2>① 选房屋类型</h2><p class="hint">选好后自动排出常见房间，按实际情况增删。点任何一个房间就进入该房间。</p><div class="houses">`;
    h += Object.entries(HOUSES).map(([k, x]) => `<button class="house ${P.houseType === k ? 'on' : ''}" data-house="${k}"><b>${x.label}</b><span>${x.en}${x.landed ? ' · 有地' : ''}</span></button>`).join('') + '</div>';
    if (!P.houseType) return h;
    const levels = Math.max(HOUSES[P.houseType].levels, ...P.rooms.map(r => r.level || 1));
    h += `<h2>平面示意 <span class="hint" style="font-weight:400">· 方块大小按面积 · 蓝色 = 已选工程 · 红框 = 有待处理</span></h2>`;
    for (let lv = 1; lv <= levels; lv++) {
      const rs = P.rooms.filter(r => (r.level || 1) === lv);
      h += `<div class="floor"><h3>${levels > 1 ? (lv === 1 ? '底层 Ground Floor' : lv + ' 楼') : '户内'}</h3><div class="plan">${rs.map(r => {
        const g = Q.geo(r, P), t = roomTotal(C.lines, r.id);
        return `<button class="rm ${r.packs.length ? 'work' : ''} ${bad.has(r.id) ? 'bad' : ''}" style="flex:${Math.max(1, g.floor)} 1 ${Math.max(104, Math.sqrt(Math.max(g.floor, 1)) * 11)}px" data-goroom="${r.id}"><span class="ic">${ROOMS[r.type].icon}</span><span><span class="nm">${esc(r.name)}</span><br><span class="dm mono">${nf(g.L)}×${nf(g.W)} 尺 · ${nf(g.floor)} 平方尺</span></span><span class="am mono">${t ? rm(t) : ''}</span></button>`;
      }).join('') || '<span class="hint" style="margin:8px">这一层还没有房间</span>'}</div>
      <div class="adds">${Object.entries(ROOMS).filter(([k, t]) => !t.outdoor || HOUSES[P.houseType].landed).map(([k, t]) => `<button class="chip" data-addroom="${k}" data-lv="${lv}">+ ${t.icon} ${t.label}</button>`).join('')}</div></div>`;
    }
    h += `<div class="adds noprint" style="margin-top:14px"><button class="btn" data-addlevel>+ 加一层</button></div>`;
    return h;
  }

  // ---------- ② 房间 ----------
  function sketch(r) {
    const g = Q.geo(r, P); if (!(g.L > 0 && g.W > 0)) return '';
    const s = 160 / Math.max(g.L, g.W), w = g.L * s, hh = g.W * s, x0 = 40 + (160 - w) / 2, y0 = 14;
    return `<svg viewBox="0 0 220 ${hh + 40}" role="img" aria-label="房间示意"><rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="var(--navy-soft)" stroke="var(--navy)" stroke-width="2" rx="2"/>
      <text x="${x0 + w / 2}" y="${y0 - 3}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">长 ${nf(g.L)} 尺</text>
      <text x="${x0 - 4}" y="${y0 + hh / 2}" text-anchor="end" font-size="10" fill="var(--ink-dim)" dominant-baseline="middle">宽 ${nf(g.W)}</text>
      <text x="${x0 + w / 2}" y="${y0 + hh / 2}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--navy)" dominant-baseline="middle">${nf(g.floor)} 平方尺</text>
      <text x="${x0 + w / 2}" y="${y0 + hh + 16}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">${ROOMS[r.type].outdoor ? '户外' : `墙面 ${nf(g.wall)} · 周长 ${nf(g.perim)}`}</text></svg>`;
  }
  function viewRoom(C) {
    if (!P.rooms.length) return `<h2>② 房间</h2><p class="hint">先在「① 户型」选房屋类型。</p>`;
    if (!room(roomId)) roomId = P.rooms[0].id;
    const r = room(roomId), T = ROOMS[r.type], g = Q.geo(r, P), bad = badRooms(C.K);
    let h = `<div class="roombar noprint">${P.rooms.map(x => `<button class="rchip ${x.id === roomId ? 'on' : ''} ${bad.has(x.id) ? 'bad' : ''}" data-goroom="${x.id}">${ROOMS[x.type].icon} ${esc(Q.roomLabel(x, P))}<small class="mono">${roomTotal(C.lines, x.id) ? rm(roomTotal(C.lines, x.id)) : '未选工程'}</small></button>`).join('')}</div>`;
    h += `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:22px">${T.icon}</span><input class="cust" style="flex:1;font-weight:700;font-size:15px" data-rname="${r.id}" value="${esc(r.name)}"><button class="btn warn" data-delroom="${r.id}">删除房间</button></div>
      <div class="dims" style="margin-top:12px"><div>
        <div class="row">${field('长', '尺', stepper(`data-rf="L"`, r.L, 0.5))}${field('宽', '尺', stepper(`data-rf="W"`, r.W, 0.5))}${T.outdoor ? '' : field('层高', '尺', stepper(`data-rf="H"`, r.H ?? 9, 0.5))}${T.outdoor ? '' : field('门', '樘', stepper(`data-rf="doors"`, r.doors, 1))}</div>
        ${T.outdoor ? '' : `<div class="wins"><div class="fld">窗户（每樘填宽和高，窗帘、窗台石、换窗都按这里算）</div>${(r.windows || []).map((w, i) => `<div class="win"><span class="no">第 ${i + 1} 樘</span>${field('宽', '尺', stepper(`data-win="${i}" data-wk="w"`, w.w ?? '', 0.5))}${field('高', '尺', stepper(`data-win="${i}" data-wk="h"`, w.h ?? '', 0.5))}<button class="x" data-delwin="${i}" title="删除这樘窗">✕</button></div>`).join('')}<button class="chip" data-addwin>+ 加一樘窗</button></div>`}
        <div style="margin-top:12px">${r.measured ? '<span class="ok" style="display:inline-block">✓ 尺寸已确认</span>' : '<button class="btn okb" data-measured>尺寸已现场确认</button> <span class="hint">现在是默认尺寸，改过数字也会自动确认</span>'}</div>
      </div><div class="sketch">${sketch(r)}</div></div></div>`;
    h += `<h2>这间要做什么</h2><p class="hint">点卡片选择，再点一次取消。数量按尺寸自动算，卡片里只有少数需要确认的数字。</p>`;
    const avail = T.packs.filter(c => PACKS[c]);
    GROUPS.forEach(([gid, gname]) => {
      const codes = avail.filter(c => PACKS[c].g === gid); if (!codes.length) return;
      h += `<div class="grp"><h3>${gname}</h3><div class="packs">${codes.map(c => packCard(r, c, g, C)).join('')}</div></div>`;
    });
    h += `<div class="subtotal"><span>${esc(r.name)} 小计</span><span class="mono" style="color:var(--accent)">${rm(roomTotal(C.lines, r.id))}</span></div>`;
    return h;
  }
  function packCard(r, c, g, C) {
    const pk = PACKS[c], on = r.packs.includes(c);
    const myLines = on ? C.lines.filter(l => l.roomId === r.id && l.pack === c) : [];

    const sub = myLines.reduce((t, l) => t + l.total, 0);

    return `<div class="pack ${on ? 'on' : ''} ${on && pk.items ? 'wide' : ''}"><button type="button" class="h" style="all:unset;display:flex;gap:8px;align-items:center;width:100%;cursor:pointer" data-pack="${c}"><span class="tick">${on ? '✓' : ''}</span><span class="ic">${pk.icon}</span><span>${pk.label}</span><span class="rm2 mono">${on ? (myLines.some(l => l.unpriced) ? '待定价' : rm(sub)) : ''}</span></button>
      ${on && pk.items ? `<div class="pkbody">${(r.items || []).map((it, i) => `<div class="item"><label class="fld">名称<input class="cust" style="min-width:120px" data-item="${i}" data-ik="name" value="${esc(it.name)}" placeholder="例如：换鞋凳"></label>${field('数量', '项', stepper(`data-item="${i}" data-ik="qty"`, it.qty ?? 1, 1))}${field('单价', 'RM/项', stepper(`data-item="${i}" data-ik="price"`, it.price ?? 0, 50))}<button class="x" data-delitem="${i}" title="删除">✕</button></div>`).join('')}<button class="chip" data-additem>+ 加一项</button><div class="lines">不能按面积算的小件（凳子、桌子、层板等），逐项填名称和单价</div></div>` : ''}
      ${on && !pk.items ? `<div class="pkbody">${Q.inputsOf(c).map(i => field(i.label + (i.area && num(v[i.k]) !== g[i.k] ? ` <span class="desc">（房间 ${nf(g[i.k])}，<button type="button" class="x" style="font-size:11px;text-decoration:underline;padding:0" data-resetpv="${c}" data-pk="${i.k}">恢复</button>）</span>` : ''), i.unit, stepper(`data-pv="${c}" data-pk="${i.k}"`, v[i.k], i.unit === '尺' ? 0.5 : i.area ? 5 : 1))).join('')}<div class="lines">${myLines.map(l => `${esc(l.name)} <b class="mono">${nf(l.qty)}</b> ${l.unitName}`).join(' · ') || '数量为 0，请先补尺寸'}</div>${specLine ? `<div class="adds" style="margin:0;flex-basis:100%">${specLine}</div>` : ''}</div>` : (!on && pk.hint ? `<div class="desc" style="margin:4px 0 0 26px">${pk.hint}</div>` : '')}</div>`;
  }

  // ---------- ③ 全屋 ----------
  function viewHouseItems(C) {
    let h = `<h2>③ 全屋项目</h2><p class="hint">不属于某个房间的工程。开工放线、成品保护、公寓物业申请、垃圾清运、开荒清洁、水管打压、楼上搬运会按房间自动加上，不用在这里选。</p>`;
    const landed = !!(HOUSES[P.houseType] && HOUSES[P.houseType].landed);
    Q.HOUSE_GROUPS.forEach(([gid, gname]) => {
      const items = HOUSE_ITEMS.filter(it => it.grp === gid && (!it.landed || landed || P.house[it.k]?.on));
      if (!items.length) return;
      h += `<div class="grp"><h3>${gname}</h3><div class="packs">` + items.map(it => {
        const q = P.house[it.k] || {}, on = !!q.on, v = Q.houseValues(q, it);
        const my = on ? C.lines.filter(l => l.from === it.label) : [], sub = my.reduce((t, l) => t + l.total, 0);
        return `<div class="pack ${on ? 'on' : ''}"><button type="button" style="all:unset;display:flex;gap:8px;align-items:center;width:100%;cursor:pointer" data-hitem="${it.k}"><span class="tick">${on ? '✓' : ''}</span><span style="font-size:18px">${it.icon}</span><span style="font-weight:600">${it.label}</span><span class="mono" style="margin-left:auto;font-size:12px;color:var(--accent);white-space:nowrap">${on ? (my.some(l => l.unpriced) ? '待定价' : rm(sub)) : ''}</span></button>
          ${on && it.inputs ? `<div class="pkbody">${it.inputs.map(i => field(i.label, i.unit, stepper(`data-hv="${it.k}" data-hk="${i.k}"`, v[i.k], i.unit === '平方尺' ? 10 : 1))).join('')}</div>` : ''}${it.why ? `<div class="desc" style="margin-top:4px">${it.why}</div>` : ''}</div>`;
      }).join('') + `</div></div>`;
    });

        <label class="fld">名称<input class="cust" style="min-width:180px" data-extra="${i}" data-ek="name" value="${esc(x.name)}" placeholder="例如：屋顶瓦片翻新"></label>

        ${field('数量', esc(x.unit || '项'), stepper(`data-extra="${i}" data-ek="qty"`, x.qty ?? 1, 1))}${field('单价', 'RM/' + esc(x.unit || '项'), stepper(`data-extra="${i}" data-ek="price"`, x.price ?? 0, 50))}
        <span class="mono" style="margin-left:auto;color:var(--accent);font-weight:700">${rm(num(x.qty) * num(x.price))}</span><button class="x" data-delextra="${i}" title="删除">✕</button></div></div>`).join('')}<button class="btn" data-addextra>+ 手动增项</button></div>`;
    h += `</div><h2>收费</h2><div class="card"><div class="row">
      <label class="fld"><span><input type="checkbox" data-design ${P.design !== false ? 'checked' : ''}> 收设计费（RM ${C.T.settings.designRate}/平方尺 × 有施工的室内面积 ${nf(C.T.floorSum)}）</span></label>

    return h;
  }

  // ---------- ④ 做法与选材 ----------
  function planBar() {
    const ps = Q.plans(P);
    return `<div class="adds noprint" style="margin:0 0 10px">${ps.map(p => `<button class="rchip ${p.id === plan().id ? 'on' : ''}" style="min-width:auto" data-plan="${p.id}">${esc(p.name || '方案 ' + p.id)}</button>`).join('')}<button class="chip" data-copyplan>+ 复制成新方案</button>${ps.length > 1 ? `<button class="chip" data-delplan>删除当前方案</button>` : ''}</div>`;
  }
  const placeSet = (pl, roomId, pack, cat, k, v) => { (((pl.roomSpecs[roomId] = pl.roomSpecs[roomId] || {})['@' + pack] = pl.roomSpecs[roomId]['@' + pack] || {})[cat] = pl.roomSpecs[roomId]['@' + pack][cat] || {})[k] = v; };
  function optDelta(r, pack, cat, k, val, base) {
    const clone = JSON.parse(JSON.stringify(P));
    placeSet(Q.activePlan(clone), r.id, pack, cat, k, val);
    const L = Q.buildLines(clone), key = Q.SPEC_CATS[cat].keys[k];
    if (L.some(l => l.roomId === r.id && l.pack === pack && l.priceTbd.includes(`${key.label}：${val}`))) return '<span class="desc" style="color:var(--yellow)">价差待定</span>';
    const d = Q.totals(clone, L).total - base;
    return `<span class="desc mono" style="color:${d > 0 ? 'var(--accent)' : d < 0 ? 'var(--ok)' : 'var(--ink-dim)'}">${d === 0 ? '不加价' : (d > 0 ? '+' : '−') + rm(Math.abs(d))}</span>`;
  }
  function placeCard(r, place, C) {
    const pk = PACKS[place.pack], ls = C.lines.filter(l => l.roomId === r.id && l.pack === place.pack);
    const main = ls.find(l => l.spec) || ls[0], same = P.rooms.filter(x => x.id !== r.id && (x.packs || []).includes(place.pack));
    let h = `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:20px">${pk.icon}</span><b style="font-size:15px">${esc(place.label)}</b><span class="desc">${main ? `${esc(main.name)} ${nf(main.qty)} ${main.unitName}` : ''}</span><span class="desc" style="margin-left:auto;font-weight:600;color:${place.open ? 'var(--yellow)' : 'var(--ok)'}">${place.open ? '未定 · 暂按标准档估价' : '✓ 已定'}</span></div>`;
    place.keys.forEach(([cat, k]) => {
      const key = Q.SPEC_CATS[cat].keys[k], cur = Q.specOf(P, r, cat, k, null, place.pack), std = Q.stdOf(key, r);
      h += `<div style="padding:10px 0 4px;border-top:1px dashed var(--line);margin-top:10px"><div style="font-size:13px;font-weight:700;margin-bottom:6px">${key.label}</div><div class="adds" style="margin:0">${key.opts.map(o => `<button class="pack opt ${cur.decided && cur.v === o ? 'on' : ''}" data-place="${place.pack}" data-spec-cat="${cat}" data-spec-k="${k}" data-spec-v="${esc(o)}"><span class="tick">${cur.decided && cur.v === o ? '✓' : ''}</span> <b>${esc(o)}</b>${o === std ? ' <span class="desc">标准</span>' : ''}<br>${optDelta(r, place.pack, cat, k, o, C.T.total)}</button>`).join('')}</div></div>`;
    });
    h += `<div class="adds" style="margin-top:10px">${place.open ? `<button class="btn okb" data-place-std="${place.pack}">没想好，先按标准档</button>` : ''}${same.length && !place.open ? `<button class="btn" data-place-copy="${place.pack}">同款用到其他 ${same.length} 个空间的「${esc(place.label)}」</button>` : ''}</div></div>`;
    return h;
  }
  let specRoomId = null;
  function viewSpec(C) {
    let h = `<h2>④ 选材</h2><p class="hint">一个房间一个房间看：每个要做的位置（地面、墙面、天花、柜子……）选材料和做法。选项下面是换成它以后总价的变化。没想好的先按标准档估价，以后随时回来改。</p>${planBar()}`;
    const rooms = P.rooms.map(r => ({ r, places: Q.placesOf(P, r, C.lines) })).filter(x => x.places.length);
    if (!rooms.length) return h + `<p class="hint">先在「② 房间」选要做的项目。</p>`;
    if (!rooms.some(x => x.r.id === specRoomId)) specRoomId = (rooms.find(x => x.places.some(p => p.open)) || rooms[0]).r.id;
    h += `<div class="roombar noprint">${rooms.map(({ r, places }) => { const open = places.filter(p => p.open).length; return `<button class="rchip ${r.id === specRoomId ? 'on' : ''}" data-specroom="${r.id}">${ROOMS[r.type].icon} ${esc(Q.roomLabel(r, P))}<small style="color:${open ? 'var(--yellow)' : 'var(--ok)'}">${open ? open + ' 处未定' : '✓ 已定'}</small></button>`; }).join('')}</div>`;
    const cur = rooms.find(x => x.r.id === specRoomId);
    h += `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 10px"><h2 style="margin:0">${ROOMS[cur.r.type].icon} ${esc(Q.roomLabel(cur.r, P))}</h2>${cur.places.some(p => p.open) ? `<button class="btn okb" data-room-std>这间其余都按标准档</button>` : ''}</div>`;
    h += cur.places.map(pl => placeCard(cur.r, pl, C)).join('');
    const idx = rooms.indexOf(cur), next = rooms[idx + 1];
    if (next) h += `<div style="text-align:right;margin-top:6px"><button class="btn pri" data-specroom="${next.r.id}">下一个：${esc(Q.roomLabel(next.r, P))} →</button></div>`;
    return h;
  }

  // ---------- ⑤ 检查与报价单 ----------
  function viewQuote(C) {
    const { lines, T, K } = C;

    let h = `<h2>⑤ 报价单</h2>${planBar()}<div class="adds noprint" style="margin:0 0 10px">${[['estimate', '预估报价（可有暂定项）'], ['formal', '正式报价（全部定好）']].map(([m, l]) => `<button class="rchip ${mode === m ? 'on' : ''}" style="min-width:auto" data-mode="${m}">${l}</button>`).join('')}</div>`;
    const ps = Q.plans(P);
    if (ps.length > 1) {
      const rows = ps.map(p => { const L = Q.buildLines(P, p.id), T2 = Q.totals(P, L); return { p, total: T2.total, open: L.filter(l => l.tbd.length).length }; });
      h += `<div class="card noprint"><b>方案对比</b><table class="q" style="margin-top:6px"><thead><tr><th>方案</th><th class="r">总价</th><th class="r">与${esc(rows[0].p.name)}相差</th><th class="r">暂定项</th></tr></thead><tbody>${rows.map(x => `<tr><td>${esc(x.p.name)}${x.p.id === plan().id ? ' <span class="desc">（当前）</span>' : ''}</td><td class="r mono">${rm(x.total)}</td><td class="r mono">${x === rows[0] ? '—' : (x.total >= rows[0].total ? '+' : '−') + rm(Math.abs(x.total - rows[0].total))}</td><td class="r mono">${x.open}</td></tr>`).join('')}</tbody></table></div>`;
    }
    h += `<h3 style="font-size:13px;margin:10px 0 6px">检查</h3><div class="noprint">`;
    if (!K.red.length && !K.yellow.length) h += `<div class="ok">✓ 全部检查通过，可以出${mode === 'formal' ? '正式' : '预估'}报价单</div>`;
    h += K.red.map(x => `<button class="issue r" data-go="${x.go}"><b>必须处理</b><span>${esc(x.m)}</span></button>`).join('');
    h += K.yellow.map(x => `<button class="issue y" data-go="${x.go}"><b>请确认</b><span>${esc(x.m)}</span></button>`).join('');

    const unpriced = [...new Set(lines.filter(l => PRICE[l.code].unpriced).map(l => l.code))];
    if (unpriced.length) h += `<div class="card noprint" id="price"><b>待核定单价（本单先填，公司价目表补好后自动带出）</b>${unpriced.map(c => `<div class="priceRow"><span>${esc(PRICE[c].name)}</span>${field('综合单价', 'RM/' + PRICE[c].unit, stepper(`data-price="${c}"`, P.prices[c]?.lab ?? 0, 10))}</div>`).join('')}</div>`;
    h += `<h2>费用构成</h2><div class="bar">${T.byStage.map((s, i) => `<span title="${s.name}" style="width:${(s.total / Math.max(1, T.direct)) * 100}%;background:${STAGE_COLORS[(s.no - 1) % 9]}"></span>`).join('')}</div>
      <div class="legend">${T.byStage.map(s => `<span><i style="background:${STAGE_COLORS[(s.no - 1) % 9]}"></i>${s.name} <span class="mono">${rm(s.total)}</span></span>`).join('')}</div>`;
    h += `<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">${mode === 'formal' ? '正式报价单' : '预估报价单'} · ${esc(plan().name || '')}</h2><button class="btn pri noprint" data-print ${K.red.length ? 'disabled title="先处理红色项目"' : ''}>${K.red.length ? `还有 ${K.red.length} 项要处理` : '打印 / 存 PDF'}</button></div>
      ${mode === 'estimate' && lines.some(l => l.tbd.length) ? '<p class="hint" style="color:var(--yellow)">标「暂定」的项目材料还没定，暂按标准档估价，定好后金额可能变化。</p>' : ''}
      <p class="hint">客户：${esc(P.info.name) || '（未填）'} · ${HOUSES[P.houseType]?.label || ''} · 施工面积 ${nf(T.floorSum)} 平方尺</p>
      <div class="scroll-x"><table class="q"><thead><tr><th>项目</th><th>空间</th><th class="r">数量</th><th class="r">单价</th><th class="r">金额</th></tr></thead><tbody>`;
    STAGES.forEach(st => {
      const ls = lines.filter(l => l.stage === st.id); if (!ls.length) return;
      h += `<tr class="st"><td colspan="4">${st.no}. ${st.name}</td><td class="r mono">${rm(ls.reduce((t, l) => t + l.total, 0))}</td></tr>`;
      h += ls.map(l => `<tr><td>${esc(l.name)}${l.spec ? `<div class="desc" style="color:var(--navy)">${esc(l.spec)}${l.tbd.length ? ' <b style="color:var(--yellow)">暂定</b>' : ''}${l.priceTbd.length ? ' <b style="color:var(--yellow)">价差待定</b>' : ''}</div>` : ''}${PRICE[l.code].desc ? `<div class="desc">${esc(PRICE[l.code].desc)}</div>` : ''}</td><td>${esc(l.room)}</td><td class="r mono">${nf(l.qty)} ${l.unitName}</td><td class="r mono">${nf(l.unit)}</td><td class="r mono">${rm(l.total)}</td></tr>`).join('');
    });
    h += `</tbody></table></div><div class="totals" style="margin-top:12px">
      <div><span>工程直接费</span><span class="mono">${rm(T.direct)}</span></div>
      ${T.design ? `<div><span>设计费</span><span class="mono">${rm(T.design)}</span></div>` : ''}
      <div><span>管理费（${T.settings.mgmtRate}%）</span><span class="mono">${rm(T.mgmt)}</span></div>
      ${T.discount ? `<div><span>优惠</span><span class="mono">− ${rm(T.discount)}</span></div>` : ''}
      ${T.sst ? `<div><span>SST</span><span class="mono">${rm(T.sst)}</span></div>` : ''}
      <div class="grand"><span>合计</span><span class="mono">${rm(T.total)}</span></div></div>
      <h3 style="font-size:13px;margin:16px 0 6px">付款节点</h3><div class="totals">${T.pay.map(p => `<div><span>${p.name}（${p.pct}%）</span><span class="mono">${rm(p.amt)}</span></div>`).join('')}</div></div>
      <div class="noprint" style="margin-top:20px"><button class="btn warn" data-reset>${confirmReset ? '再点一次确认清空' : '新建报价（清空当前）'}</button></div>`;
    return h;
  }

  // ---------- 渲染（重画后让正在填的框留在原位，页面不跳） ----------
  function render() {
    const C = compute(); save();
    document.getElementById('grand').textContent = rm(C.T.total);
    const tabs = [['house', '① 户型'], ['room', '② 房间'], ['all', '③ 全屋'], ['spec', '④ 选材'], ['quote', '⑤ 报价单'], ['book', '⚙<span class="tl"> 价目表</span>']];
    document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}${k === 'quote' && C.K.red.length ? `<span class="dot">${C.K.red.length}</span>` : ''}</button>`).join('');
    const a = document.activeElement, app = document.getElementById('app');
    let sel = null, top = null, caret = null;
    if (a && app.contains(a) && a.tagName === 'INPUT') { sel = 'input' + [...a.attributes].filter(x => x.name.startsWith('data-')).map(x => `[${x.name}="${CSS.escape(x.value)}"]`).join(''); top = a.getBoundingClientRect().top; try { caret = a.selectionStart; } catch (e) {} }
    const y = window.scrollY;

    window.scrollTo(0, y);
    if (sel) { const el = app.querySelector(sel); if (el) { el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} const d = el.getBoundingClientRect().top - top; if (Math.abs(d) > 1) window.scrollBy(0, d); } }
    document.querySelector('[data-info="name"]').value = P.info.name || '';
  }

  // ---------- 公司价目表 ----------
  let bookMsg = null;

      <div class="row"><button class="btn pri" data-book="dl">下载价格模板</button>
      <label class="btn">上传填好的价格<input type="file" accept=".csv,text/csv" data-bookfile hidden></label>
      ${info ? '<button class="btn warn" data-book="clear">删掉已上传的价格</button>' : ''}</div>
      ${bookMsg ? `<div class="issue ${bookMsg.ok ? 'g' : 'r'}"><b>${bookMsg.ok ? '已上传' : '没上传'}</b><span>${bookMsg.lines.map(esc).join('<br>')}</span></div>` : ''}</div>
      <div class="card"><b>怎么填</b><ul class="hint">
      <li>「项目单价」：材料、辅料、人工都是卖给客户的价格（每个单位），损耗% 只加在材料上。</li>
      <li>「选材价差」：客户选了这个选项，每个单位比标准档多收多少，便宜的填负数。</li>
      <li>空着 = 还没定，报价单会提示「单价待核定 / 价差待定」；填 0 = 不加价。</li>
      <li>不要改「类型」和「编号」两列。只填售价，不要填成本。</li>
      <li>价格只存在这台电脑的浏览器里，其他员工的电脑要各自上传一次。</li></ul></div>`;
    return h;
  }
  document.addEventListener('change', e => {
    if (!e.target.hasAttribute('data-bookfile')) return;
    const f = e.target.files[0]; if (!f) return;
    const B = window.QV2_BOOK, rd = new FileReader();
    rd.onload = () => {
      // 只按系统自带价目表校验编号，避免旧上传影响
      const res = B.read(rd.result, PRICE);
      const ni = Object.keys(res.items).length, no = Object.values(res.options).reduce((s, o) => s + Object.keys(o).length, 0);
      if (res.errors.length || !(ni + no)) { bookMsg = { ok: false, lines: res.errors.length ? res.errors.slice(0, 8) : ['表里没有填任何价格'] }; render(); return; }
      const at = new Date().toLocaleString('zh-CN', { hour12: false });
      if (!B.save({ items: res.items, options: res.options, info: { file: f.name, at, items: ni, options: no } })) { bookMsg = { ok: false, lines: ['浏览器不让保存（可能是无痕模式）'] }; render(); return; }
      location.reload();
    };
    rd.readAsText(f, 'utf-8');
  });

  // ---------- 写入状态 ----------
  function setValue(el, v) {
    const r = room(roomId), ds = el.dataset;
    if (ds.rf) { r[ds.rf] = v; if (ds.rf === 'L' || ds.rf === 'W') r.measured = true; }
    else if (ds.win !== undefined) { r.windows[+ds.win][ds.wk] = v; }
    else if (ds.pv) { r.vals = r.vals || {}; (r.vals[ds.pv] = r.vals[ds.pv] || {})[ds.pk] = v; }
    else if (ds.item !== undefined) { r.items[+ds.item][ds.ik] = v; }
    else if (ds.extra !== undefined) { P.extras[+ds.extra][ds.ek] = v; }
    else if (ds.hv) { (P.house[ds.hv] = P.house[ds.hv] || {})[ds.hk] = v; }
    else if (ds.price !== undefined) { P.prices[ds.price] = { mat: 0, aux: 0, waste: 0, lab: v }; }
    else if (el.hasAttribute('data-discount')) P.discount = v;
  }
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.info) { P.info[t.dataset.info] = t.value; save(); return; }
    if (t.dataset.rname) { room(t.dataset.rname).name = t.value; save(); return; }
    if (t.dataset.ek === 'name') { P.extras[+t.dataset.extra].name = t.value; save(); return; }
    if (t.dataset.ik === 'name') { room(roomId).items[+t.dataset.item].name = t.value; save(); return; }
    if (t.closest('.stp')) { setValue(t, t.value); const C = compute(); save(); document.getElementById('grand').textContent = rm(C.T.total); }
  });
  document.addEventListener('change', e => { const ds = e.target.dataset; if (ds.extra !== undefined && (ds.ek === 'unit' || ds.ek === 'stage')) { P.extras[+ds.extra][ds.ek] = e.target.value; render(); return; } if (e.target.closest('.stp') || ds.rname || ds.ik === 'name' || ds.ek === 'name') render(); if (e.target.hasAttribute('data-design')) { P.design = e.target.checked; render(); } });
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const ds = b.dataset;
    if (ds.book === 'dl') { const csv = window.QV2_BOOK.template(PRICE, Q.SPEC_CATS, Q.OPTION_PRICES); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = '新版报价器价目表.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return; }
    if (ds.book === 'clear') { if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = '再点一次确认删除'; return; } window.QV2_BOOK.clear(); location.reload(); return; }
    if (ds.tab) { tab = ds.tab; confirmReset = false; render(); window.scrollTo(0, 0); return; }
    if (ds.house) {
      if (P.houseType !== ds.house) { const keep = P.rooms.some(r => r.packs.length); P.houseType = ds.house; if (!keep) P.rooms = Q.presetRooms(ds.house); }
      roomId = P.rooms[0]?.id; render(); return;
    }
    if (ds.goroom) { roomId = ds.goroom; tab = 'room'; render(); window.scrollTo(0, 0); return; }
    if (ds.addroom) { const n = P.rooms.filter(r => r.type === ds.addroom).length + 1; const r = Q.newRoom(ds.addroom, +ds.lv, n); P.rooms.push(r); render(); return; }
    if (b.hasAttribute('data-addlevel')) { const lv = Math.max(1, ...P.rooms.map(r => r.level || 1)) + 1; P.rooms.push(Q.newRoom('bedroom', lv, P.rooms.filter(r => r.type === 'bedroom').length + 1)); render(); return; }
    if (ds.delroom) { P.rooms = P.rooms.filter(r => r.id !== ds.delroom); roomId = P.rooms[0]?.id; render(); return; }
    if (b.hasAttribute('data-addwin')) { room(roomId).windows.push({ w: '', h: '' }); render(); const ins = document.querySelectorAll('[data-wk="w"]'); ins[ins.length - 1]?.focus(); return; }
    if (ds.delwin !== undefined) { room(roomId).windows.splice(+ds.delwin, 1); render(); return; }
    if (b.hasAttribute('data-additem')) { const r = room(roomId); (r.items = r.items || []).push({ name: '', qty: 1, price: 0 }); render(); const ins = document.querySelectorAll('[data-ik="name"]'); ins[ins.length - 1]?.focus(); return; }
    if (b.hasAttribute('data-addextra')) { (P.extras = P.extras || []).push({ name: '', unit: '项', stage: 'outdoor', qty: 1, price: 0 }); render(); const ins = document.querySelectorAll('[data-ek="name"]'); ins[ins.length - 1]?.focus(); return; }
    if (ds.delextra !== undefined) { P.extras.splice(+ds.delextra, 1); render(); return; }
    if (ds.delitem !== undefined) { room(roomId).items.splice(+ds.delitem, 1); render(); return; }
    if (ds.resetpv) { const r = room(roomId); if (r.vals?.[ds.resetpv]) delete r.vals[ds.resetpv][ds.pk]; render(); return; }
    if (b.hasAttribute('data-measured')) { room(roomId).measured = true; render(); return; }
    if (ds.pack) {
      const r = room(roomId), c = ds.pack, pk = PACKS[c];
      if (r.packs.includes(c)) r.packs = r.packs.filter(x => x !== c);
      else { if (pk.pick) r.packs = r.packs.filter(x => PACKS[x].pick !== pk.pick); r.packs.push(c); if (pk.items && !(r.items || []).length) r.items = [{ name: '', qty: 1, price: 0 }]; }
      render(); return;
    }
    if (ds.gospec) { tab = 'spec'; specRoomId = roomId; render(); window.scrollTo(0, 0); return; }
    if (ds.specroom) { specRoomId = ds.specroom; render(); window.scrollTo(0, 0); return; }
    if (ds.place && ds.specV !== undefined) { placeSet(plan(), specRoomId, ds.place, ds.specCat, ds.specK, ds.specV); render(); return; }
    if (ds.placeStd || b.hasAttribute('data-room-std')) {
      const r = room(specRoomId), C = compute();
      Q.placesOf(P, r, C.lines).filter(pl => !ds.placeStd || pl.pack === ds.placeStd).forEach(pl => pl.keys.forEach(([cat, k]) => {
        const cur = Q.specOf(P, r, cat, k, null, pl.pack);
        if (!cur.decided) placeSet(plan(), r.id, pl.pack, cat, k, cur.v);
      }));
      render(); return;
    }
    if (ds.placeCopy) {
      const r = room(specRoomId), pack = ds.placeCopy, C = compute();
      const pl = Q.placesOf(P, r, C.lines).find(x => x.pack === pack);
      P.rooms.filter(x => x.id !== r.id && (x.packs || []).includes(pack)).forEach(x => pl.keys.forEach(([cat, k]) => placeSet(plan(), x.id, pack, cat, k, Q.specOf(P, r, cat, k, null, pack).v)));
      render(); return;
    }
    if (ds.plan) { P.planId = ds.plan; render(); return; }
    if (b.hasAttribute('data-copyplan')) {
      const ps = Q.plans(P), cur = plan(), id = String.fromCharCode(65 + ps.length);
      ps.push({ id, name: '方案 ' + id, specs: JSON.parse(JSON.stringify(cur.specs || {})), roomSpecs: JSON.parse(JSON.stringify(cur.roomSpecs || {})) });
      P.planId = id; render(); return;
    }
    if (b.hasAttribute('data-delplan')) { const ps = Q.plans(P); if (ps.length > 1) { P.plans = ps.filter(p => p.id !== plan().id); P.planId = P.plans[0].id; } render(); return; }
    if (ds.mode) { P.quoteMode = ds.mode; render(); return; }
    if (ds.hitem) { const q = P.house[ds.hitem] = P.house[ds.hitem] || {}; q.on = !q.on; render(); return; }
    if (ds.stp) {
      const inp = b.parentElement.querySelector('input'), step = parseFloat(ds.stp);
      const v = Math.max(0, r2(num(inp.value) + step)); inp.value = v; setValue(inp, v); render(); return;
    }
    if (ds.go) {
      if (ds.go === 'all') { tab = 'all'; render(); return; }
      if (ds.go.startsWith('spec:')) { tab = 'spec'; specRoomId = ds.go.slice(5); } else if (ds.go === 'house') tab = 'house'; else if (ds.go === 'price') { document.getElementById('price')?.scrollIntoView({ behavior: 'smooth' }); return; } else { roomId = ds.go; tab = 'room'; }
      render(); window.scrollTo(0, 0); return;
    }
    if (b.hasAttribute('data-print')) { if (!b.disabled) window.print(); return; }
    if (b.hasAttribute('data-reset')) { if (!confirmReset) { confirmReset = true; render(); return; } P = blank(); confirmReset = false; tab = 'house'; roomId = null; render(); return; }
  });
  render();
  window.__qv2 = { get: () => P, compute };
})();
</script>
</body>
</html>
