<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新版报价器 · HOUZY</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F3; --surface: #FFFFFF; --line: #DEDAD1;
    --ink: #1C1B19; --ink-dim: #6B6860;
    --navy: #17324F; --navy-soft: #E7EDF3; --on-navy: #FFFFFF;
    --accent: #C4501C; --ok: #2F6B4F; --ok-soft: #E3F0E8; --off: #B8B3A7;
    --ok-line: #B5D6C2; --accent-soft: #FBEAE1;
    --red: #B42318; --red-soft: #FDECEA; --yellow: #8A5A00; --yellow-soft: #FFF4D6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151A; --surface: #1E1D23; --line: #34333A; --ink: #EDEBE6; --ink-dim: #9A968D;
      --navy: #9FC0E0; --navy-soft: #202B36; --on-navy: #16151A; --accent: #E37A46; --ok: #5FA382; --ok-soft: #1D2E25; --off: #4A4840;
      --ok-line: #355A45; --accent-soft: #3A2419;
      --red: #F08A80; --red-soft: #3A1F1E; --yellow: #E8C06A; --yellow-soft: #33291A; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; color: var(--ink); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 120px; }

  /* 顶部：总价永远看得到 */
  .top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top h1 { font-size: 16px; margin: 0; }
  .top h1 small { display: block; font-size: 11px; color: var(--ink-dim); font-weight: 500; }
  .top .cust { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
  .top .sum { text-align: right; }
  .top .sum small { display: block; font-size: 11px; color: var(--ink-dim); }
  .top .sum b { font-size: 20px; color: var(--accent); }
  .tabs { max-width: 1080px; margin: 0 auto; padding: 0 16px 10px; display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 6px; }
  .tab[data-tab="book"] { padding: 8px 10px; font-size: 15px !important; }
  .card > h2:first-child { margin-top: 0; }
  .tab { border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 10px; padding: 8px 4px; font-weight: 600; font-size: 13px; position: relative; }
  .tab.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .tab .dot { position: absolute; top: -6px; right: -4px; background: var(--red); color: #fff; border-radius: 10px; font-size: 10px; padding: 1px 6px; }

  h2 { font-size: 17px; margin: 22px 0 6px; }
  .hint { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 12px; line-height: 1.5; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }

  /* ① 房屋类型 */
  .houses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .house { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; text-align: left; }
  .house b { display: block; font-size: 15px; }
  .house span { font-size: 12px; color: var(--ink-dim); }
  .house.on { border-color: var(--navy); background: var(--navy-soft); }

  /* 可视化平面：房间块大小按面积 */
  .floor { margin-top: 14px; }
  .floor h3 { font-size: 13px; color: var(--ink-dim); margin: 0 0 6px; font-weight: 600; }
  .plan { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); }
  .rm { min-width: 104px; min-height: 84px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); padding: 8px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); }
  .rm .ic { font-size: 20px; }
  .rm .nm { font-weight: 700; font-size: 13px; }
  .rm .dm { font-size: 11px; color: var(--ink-dim); }
  .rm .am { font-size: 12px; color: var(--accent); font-weight: 600; }
  .rm.work { background: var(--navy-soft); border-color: var(--navy); }
  .rm.bad { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px dashed var(--line); background: transparent; border-radius: 16px; padding: 5px 10px; color: var(--ink-dim); font-size: 12.5px; }
  .chip:hover { border-color: var(--navy); color: var(--navy); }
  .recogT input.cust, .recogT select.cust { min-width: 0; width: 100%; padding: 5px 6px; }
  .recogT td { vertical-align: middle; } .recogT tr.off td { opacity: .45; } .recogT td:nth-child(2) { min-width: 120px; }
  .drawings { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 340px)); gap: 12px; margin-top: 10px; }
  .thumb { display: block; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); padding: 0; cursor: zoom-in; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }
  .thumb.empty { display: flex; align-items: center; justify-content: center; color: var(--ink-dim); font-size: 13px; border-style: dashed; cursor: default; }
  .roompics { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .thumb.sm { width: 96px; flex: none; font-size: 11px; }
  .thumb.sm > span, .thumb.sm span:not(.x) { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; text-align: center; padding: 2px 0; }
  .thumb.sm .x { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; line-height: 22px; padding: 0; }
  .thumb.add { display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--navy); border-style: dashed; cursor: pointer; }
  .thumb.add span { font-size: 11px; line-height: 1.3; }
  .sync .rchip { max-width: 100%; white-space: normal; text-align: left; }
  /* 问「其他空间也做吗」时，这张工项卡占满一整行，房间按钮横着排，不挤成一条 */
  .pack:has(.sync) { grid-column: 1 / -1; }
  .pmaps { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .pmap { position: relative; margin-top: 8px; width: 240px; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .pmap img { display: block; width: 100%; }
  .pbox { position: absolute; border: 1.5px solid rgba(30, 58, 95, .45); background: rgba(30, 58, 95, .06); border-radius: 3px; padding: 0; cursor: pointer; overflow: hidden; }
  .pbox span { position: absolute; left: 2px; top: 1px; font-size: 10px; line-height: 1.1; color: #1E3A5F; background: rgba(255,255,255,.85); padding: 0 3px; border-radius: 2px; max-width: calc(100% - 4px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbox:hover { background: rgba(30, 58, 95, .14); }
  .pbox.cur { border: 2.5px solid #D9632B; background: rgba(217, 99, 43, .25); }
  .pbox.cur span { color: #fff; background: #D9632B; }
  .dropping { outline: 2px dashed var(--navy); outline-offset: 3px; border-radius: 10px; background: var(--accent-soft); }
  .thumb.add { aspect-ratio: auto; height: 72px; padding-bottom: 18px; }
  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10,10,12,.88); display: flex; flex-direction: column; }
  .viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; color: #fff; }
  .viewer .vbar span { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer .vbody { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 0 12px 16px; }
  .viewer .vbody img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 6px; }
  .viewer .vbody img.z { max-width: none; max-height: none; width: 220%; }
  .demoPlans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .demoPlans figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .demoPlans img { width: 100%; display: block; }
  .demoPlans figcaption { font-size: 12px; color: #555; text-align: center; margin-top: 4px; }
  .sync { flex-basis: 100%; background: var(--navy-soft); border-radius: 10px; padding: 10px 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sync b { color: var(--navy); font-size: 13px; }
  svg.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; color: var(--navy); }
  .btn svg.ic, .tab svg.ic, .chip svg.ic { color: currentColor; }
  .pack.on svg.ic, .rm.work svg.ic { color: var(--navy); }
  .chip.on { border-style: solid; border-color: var(--navy); background: var(--navy); color: var(--on-navy); }

  /* ② 房间 */
  .roombar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  .rchip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; text-align: left; min-width: 96px; }
  .rchip small { display: block; font-size: 11px; color: var(--ink-dim); }
  .rchip.on { border-color: var(--navy); background: var(--navy-soft); }
  .rchip.na:not(.on) { border-style: dashed; color: var(--ink-dim); }
  .rchip small { font-size: 10.5px; color: var(--ink-dim); }
  .rchip.bad { border-color: var(--red); }
  .exttag { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; vertical-align: 1px; }
  .extchip { border-style: solid; }
  .extchip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .extchip.on svg.ic { color: var(--accent); }
  .rchip.done { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
  .rchip.done svg.ic, .rchip.cart svg.ic { color: var(--ok); }
  .rchip.done.on { border-color: var(--ok); }
  .rchip.cart { border-style: dashed; border-color: var(--ok-line); color: var(--ok); font-weight: 600; min-width: auto; }
  .rchip.cart.open { background: var(--ok-soft); }
  .rm.done { background: var(--ok-soft); border-color: var(--ok-line); }
  .rm.done svg.ic { color: var(--ok); }
  .donebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .donetag { display: inline-flex; gap: 6px; align-items: center; background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); border-radius: 8px; padding: 7px 12px; font-weight: 600; }
  .donetag svg.ic { color: var(--ok); }
  .dims { display: grid; grid-template-columns: 1fr 200px; gap: 14px; align-items: start; }
  @media (max-width: 640px) { .dims { grid-template-columns: 1fr; } .tab { font-size: 11.5px; padding: 8px 2px; } .tab .tl { display: none; } }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-dim); }
  .stp { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .stp button { border: none; background: var(--navy-soft); color: var(--navy); width: 34px; font-size: 18px; font-weight: 700; }
  .stp input { width: 64px; border: none; text-align: center; padding: 8px 2px; background: transparent; font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; }
  .stp input:focus { outline: 2px solid var(--navy); outline-offset: -2px; }
  .unit { font-size: 11px; color: var(--ink-dim); }
  .wins { margin-top: 10px; }
  .win { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .win .no { font-weight: 700; color: var(--ink-dim); width: 54px; font-size: 12px; }
  .x { border: none; background: transparent; color: var(--ink-dim); font-size: 16px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; color: var(--ink); }
  .btn.pri { background: var(--navy); border-color: var(--navy); color: var(--on-navy); font-weight: 600; }
  .btn.okb { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .btn.warn { border-color: var(--red); color: var(--red); }
  .bookT input.bkin { width: 74px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 7px; text-align: right; background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
  .bookT input.bkin.chg { border-color: var(--accent); background: var(--yellow-soft); }
  .bookT td { vertical-align: middle; }
  @media (max-width: 640px) {
    .bookT thead { display: none; }
    .bookT tr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .bookT td { padding: 0; border: none; }
    .bookT td.bkname { grid-column: 1 / -1; font-weight: 600; }
    .bookT td.bkunit { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }
    .bookT td[data-l] { text-align: left; font-size: 11px; color: var(--ink-dim); }
    .bookT td[data-l]::before { content: attr(data-l); display: block; margin-bottom: 2px; }
    .bookT td.bksum { grid-column: 1 / -1; text-align: right; font-size: 13px; color: var(--ink); }
    .bookT td.bksum::before { display: inline; margin-right: 6px; color: var(--ink-dim); }
    .bookT input.bkin { width: 100%; }
    .bookT td:empty { display: none; }
  }
  .bookStat { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .bookStat div { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .bookStat b { font-size: 22px; display: block; }
  .sketch { max-width: 220px; margin: 0 auto; width: 100%; }
  .sketch svg { width: 100%; height: auto; display: block; }
  .grp { margin-top: 16px; }
  .grp h3 { font-size: 12px; letter-spacing: .04em; color: var(--ink-dim); margin: 0 0 6px; font-weight: 700; }
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; align-items: start; }
  .pack { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; color: var(--ink); display: block; width: 100%; }
  .pack .h { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .pack .h .ic { font-size: 18px; }
  .pack .h .rm2 { margin-left: auto; font-size: 12px; color: var(--ink-dim); font-weight: 500; white-space: nowrap; }
  .pack.wide { grid-column: 1 / -1; }
  .pack.on { border-color: var(--navy); background: var(--navy-soft); }
  .pack.on .h .rm2 { color: var(--accent); font-weight: 700; }
  .pack.opt { width: auto; padding: 8px 12px; min-width: 110px; }
  .pack.opt .tick { vertical-align: -3px; }
  .pack .tick { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--off); display: inline-grid; place-items: center; font-size: 12px; flex: none; }
  .pack.on .tick { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .pkbody { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
  .pkbody .lines, .pkbody .chip { flex-basis: 100%; }
  .item { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .lines { font-size: 11.5px; color: var(--ink-dim); line-height: 1.6; }
  .subtotal { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 700; }

  /* ④ 检查与报价单 */
  .issue { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 9px; margin-bottom: 6px; font-size: 13px; width: 100%; text-align: left; border: none; color: var(--ink); }
  .issue.r { background: var(--red-soft); } .issue.r b { color: var(--red); }
  .issue.y { background: var(--yellow-soft); } .issue.y b { color: var(--yellow); }
  .issue.g { background: var(--ok-soft); } .issue.g b { color: var(--ok); }
  .ok { background: var(--ok-soft); color: var(--ok); padding: 10px 12px; border-radius: 9px; font-weight: 600; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 8px 0 6px; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  table.q { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.q th { text-align: left; font-size: 11px; color: var(--ink-dim); border-bottom: 1px solid var(--line); padding: 6px 4px; }
  table.q td { border-bottom: 1px dashed var(--line); padding: 6px 4px; vertical-align: top; }
  table.q td.r, table.q th.r { text-align: right; }
  table.q tr.st td { font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--line); padding-top: 12px; }
  .desc { font-size: 11px; color: var(--ink-dim); }
  .scroll-x { overflow-x: auto; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; }
  .priceRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .priceRow span { flex: 1; min-width: 160px; }
  /* ---------- 客户演示模式 ---------- */
  body.demo-on .top, body.demo-on #app { display: none; }
  #demo { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  .dbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .dbar .in { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .dbar .brand { font-weight: 700; letter-spacing: .08em; color: var(--navy); }
  .dbar .tot { margin-left: auto; text-align: right; }
  .dbar .tot small { display: block; font-size: 11px; color: var(--ink-dim); }
  .dbar .tot b { font-size: 20px; color: var(--accent); }
  .dots { display: flex; gap: 6px; justify-content: center; padding: 8px 16px 0; flex-wrap: wrap; }
  .dots button { width: 9px; height: 9px; border-radius: 50%; border: none; padding: 0; background: var(--line); }
  .dots button.on { background: var(--navy); width: 22px; border-radius: 5px; }
  .slide { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 22px 16px 110px; animation: din .35s ease; }
  @keyframes din { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
  .slide h1 { font-size: 30px; margin: 6px 0 4px; line-height: 1.2; }
  .slide .kick { font-size: 12px; letter-spacing: .14em; color: var(--accent); font-weight: 700; text-transform: uppercase; }
  .big { font-size: 46px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 18px 0; }
  .facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .facts b { display: block; font-size: 20px; }
  .facts span { font-size: 12px; color: var(--ink-dim); }
  .donutWrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .donutWrap svg { width: 220px; height: 220px; flex: none; }
  .dleg { flex: 1; min-width: 220px; }
  .dleg div { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .dleg i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .dleg .mono { margin-left: auto; }
  .works { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
  .works span { background: var(--navy-soft); color: var(--navy); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

  function fillRecog(data, lv) {
    const known = new Set(Object.keys(ROOMS));
    recog.rooms = (data.rooms || []).filter(r => known.has(r.type)).map((r, i) => ({
      type: r.type, name: r.name, L: r.length_ft, W: r.width_ft, level: Math.max(1, Math.min(4, r.level || lv)), page: i, on: true,
      evidence: (r.size_source || '') + (r.note ? '：' + r.note : ''), box: okBox(r.box)
    }));
    recog.warnings = [data.notes || '', 'AI 识别结果仅供参考，尺寸请到现场复尺。'].filter(Boolean); recog.engine = data.engine || 'AI';
    recog.all = new Set(recog.rooms.map(r => r.level)).size > 1;
    recog.step = recog.rooms.length ? `识别到 ${recog.rooms.length} 个空间。请逐项核对，确认后才会加入报价。` : '没找到房间。';
  }
  function recogCard() {
    if (!recog) return '';
    const R = recog, lvMax = Math.max(4, ...P.rooms.map(r => r.level || 1));
    let h = `<div class="card" id="recog"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>识别结果 · ${R.all ? '全部楼层' : esc(levelName(R.level)) + '平面图'}</b><button class="chip" data-recogclose>关闭</button></div>
      <p class="hint" style="${R.err ? 'color:var(--red)' : ''}">${esc(R.step)}</p>${R.login ? '<a class="btn pri" href="login.html?next=quote-v2.html" target="_blank" rel="noopener">登录员工账号</a>' : ''}`;
    if (R.paste) return h + `<textarea id="pastebox" rows="6" style="width:100%;font:12px ui-monospace,monospace" placeholder='{"rooms":[…],"notes":"…"}'></textarea><button class="btn pri" data-pasteok style="margin-top:8px">读入</button></div>`;
    if (R.busy || !R.rooms.length) return h + '</div>';
    h += `<div class="scroll-x"><table class="q recogT"><thead><tr><th></th><th>名称</th><th>类型</th><th>楼层</th><th class="r">长</th><th class="r">宽</th><th>图上文字</th></tr></thead><tbody>${R.rooms.map((r, i) => `<tr class="${r.on ? '' : 'off'}">
      <td id="rc${i}"><b class="hint">${i + 1}</b> <input type="checkbox" data-rc="${i}" data-rk="on" ${r.on ? 'checked' : ''} aria-label="加入"></td>
      <td><input class="cust" data-rc="${i}" data-rk="name" value="${esc(r.name)}"></td>
      <td><select class="cust" data-rc="${i}" data-rk="type">${Object.entries(ROOMS).map(([k, t]) => `<option value="${k}" ${r.type === k ? 'selected' : ''}>${t.label}</option>`).join('')}</select></td>
      <td><select class="cust" data-rc="${i}" data-rk="level">${Array.from({ length: lvMax }, (_, j) => `<option value="${j + 1}" ${r.level === j + 1 ? 'selected' : ''}>${j + 1} 楼</option>`).join('')}</select></td>
      <td class="r"><input class="cust bkin" inputmode="decimal" data-rc="${i}" data-rk="L" value="${r.L ?? ''}" placeholder="${ROOMS[r.type].L}"></td>
      <td class="r"><input class="cust bkin" inputmode="decimal" data-rc="${i}" data-rk="W" value="${r.W ?? ''}" placeholder="${ROOMS[r.type].W}"></td>
      <td class="desc">${esc(r.evidence)}${r.L == null ? '<br>没读到尺寸，先用默认' : ''}${i && R.rooms[i - 1].level === r.level ? `<br><button class="chip" data-rmerge="${i}">↑ 和上一行合成一间</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <div class="pmaps">${[...new Set(R.rooms.map(r => r.level))].sort().map(lv => planMap(lv, R.rooms.map((r, i) => ({ ...r, id: 'rc' + i, tag: String(i + 1) })), null, 'data-rcfocus')).join('')}</div>
      <p class="hint">${R.warnings.map(esc).join(' ')}</p>
      ${P.rooms.length ? (() => { const lvs = [...new Set(R.rooms.filter(r => r.on).map(r => r.level))], same = P.rooms.filter(r => lvs.includes(r.level || 1)), work = same.filter(r => r.packs.length).length;
        const lvN = lvs.map(levelName).join('、'), others = P.rooms.length - same.length;
        // 识别到的楼层直接替换那几层原来的空间（模板），其他楼层不动；只有已选了工程的房间才特别提醒
        return `<p class="hint" style="margin:10px 0 4px;color:var(--ink)">点下面按钮后，<b>${lvN}</b>原来的 ${same.length} 个空间会换成识别结果${others ? `；其他楼层的 ${others} 个不动` : ''}。</p>${work ? `<div class="issue y"><b>注意</b><span>${lvN}有 ${work} 间已经选了工程，替换后要重新选。</span></div>` : ''}`; })() : ''}
      <button class="btn pri" data-recogapply style="margin-top:8px">加入报价（${R.rooms.filter(r => r.on).length} 个空间）</button></div>`;
    return h;
  }

  function planCard() {
    const levels = Math.max(HOUSES[P.houseType]?.levels || 1, ...P.rooms.map(r => r.level || 1));
    let h = `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>平面图</b><span class="hint">图片或 PDF；PDF 多页会按顺序放到各楼层。照着图加房间、填尺寸。</span></div><div class="drawings">`;
    for (let lv = 1; lv <= levels; lv++) {
      const d = drawingOf(lv);
      h += `<div class="drawing" data-drop="plan:${lv}">${d ? `<button class="thumb" data-view="plan:${lv}"><img src="${d.img}" alt="${esc(levelName(lv))}平面图"></button>` : `<div class="thumb empty">还没有${esc(levelName(lv))}平面图<br>可把文件拖到这里</div>`}
        <div class="adds" style="margin:6px 0 0"><b style="align-self:center">${esc(levelName(lv))}</b><button class="chip" style="border-style:solid" data-pick="plan:${lv}">${d ? '换一张' : '上传'}</button>${d ? `<button class="chip" data-delplan-img="${lv}">删除</button><button class="chip on" data-airecog="${lv}" ${recog && recog.busy ? 'disabled' : ''}>${ic('search')} AI 识别房间</button><button class="chip" data-recog="${lv}" ${recog && recog.busy ? 'disabled' : ''}>只读文字（免费）</button><button class="chip" data-pasterecog="${lv}">粘贴识别结果</button>` : ''}</div></div>`;
    }
    h += `</div>${imgBusy ? '<p class="hint">正在处理图片…</p>' : ''}${imgMsg ? `<div class="issue ${imgMsg.ok ? 'g' : 'r'}" style="margin-top:8px"><b>${imgMsg.ok ? '好了' : '没上传'}</b><span>${esc(imgMsg.m)}</span></div>` : ''}</div>`;
    return h;
  }
  function roomPics(r) {
    const d = drawingOf(r.level || 1), ps = IMG.rooms[r.id] || [];
    return `<div class="roompics" data-drop="photo:${r.id}">${d && !r.box ? `<button class="thumb sm" data-view="plan:${r.level || 1}" title="看平面图"><img src="${d.img}" alt="平面图"><span>平面图</span></button>` : ''}
      ${ps.map((x, i) => `<span class="thumb sm"><button style="all:unset;cursor:zoom-in" data-view="room:${r.id}:${i}"><img src="${x.img}" alt="${esc(r.name)}照片 ${i + 1}"></button><button class="x" data-delphoto="${r.id}:${i}" title="删除">✕</button></span>`).join('')}
      ${ps.length < ROOM_PHOTO_MAX ? `<button class="thumb sm add" data-pick="photo:${r.id}">＋<span>手绘图/照片<br>可拖进来</span></button>` : ''}</div>${imgMsg && !imgMsg.ok ? `<div class="issue r" style="margin-top:6px"><b>没上传</b><span>${esc(imgMsg.m)}</span></div>` : ''}`;
  }
  function viewerHtml() {
    if (!viewer) return '';
    const [kind, a, b] = viewer.split(':');
    const x = kind === 'plan' ? drawingOf(+a) : (IMG.rooms[a] || [])[+b];
    if (!x) return '';
    return `<div class="viewer" data-viewclose><div class="vbar"><span>${esc(x.name || '')}</span><button class="btn" data-viewzoom>放大 / 缩小</button><button class="btn" data-viewclose>✕ 关闭</button></div><div class="vbody"><img src="${x.img}" class="${viewer.endsWith('|z') ? 'z' : ''}" alt=""></div></div>`;
  }
  const room = id => P.rooms.find(r => r.id === id);

  function compute() { const lines = Q.buildLines(P); return { lines, T: Q.totals(P, lines), K: Q.checks(P, lines, P.quoteMode || 'estimate') }; }
  const plan = () => Q.activePlan(P);

  const roomTotal = (lines, id) => lines.filter(l => l.roomId === id).reduce((t, l) => t + l.total, 0);
  let lastK = { red: [] };
  const badRooms = K => { lastK = K; return new Set(K.red.map(x => x.go)); };

  // ---------- 小部件 ----------
  const stepper = (attrs, value, step = 1) => `<span class="stp"><button type="button" data-stp="-${step}" ${attrs}>−</button><input inputmode="decimal" value="${esc(value)}" ${attrs}><button type="button" data-stp="+${step}" ${attrs}>+</button></span>`;
  const field = (label, unit, inner) => `<label class="fld">${label}<span>${inner} <span class="unit">${unit || ''}</span></span></label>`;

  // ---------- ① 户型 ----------
  function viewHouse(C) {
    const bad = badRooms(C.K);
    let h = `<h2>① 选房屋类型</h2><p class="hint">选好后自动排出常见房间，按实际情况增删。点任何一个房间就进入该房间。</p><div class="houses">`;
    h += Object.entries(HOUSES).map(([k, x]) => `<button class="house ${P.houseType === k ? 'on' : ''}" data-house="${k}"><b>${x.label}</b><span>${x.en}${x.landed ? ' · 有地' : ''}</span></button>`).join('') + '</div>';
    if (!P.houseType) return h;
    const levels = Math.max(HOUSES[P.houseType].levels, ...P.rooms.map(r => r.level || 1));
    h += layoutCard() + planCard() + recogCard();
    h += `<h2>平面示意 <span class="hint" style="font-weight:400">· 方块大小按面积 · 蓝色 = 已选工程 · 红框 = 有待处理</span></h2>`;
    for (let lv = 1; lv <= levels; lv++) {
      const rs = P.rooms.filter(r => (r.level || 1) === lv);
      h += `<div class="floor"><h3>${levels > 1 ? (lv === 1 ? '底层 Ground Floor' : lv + ' 楼') : '户内'}</h3><div class="plan">${rs.map(r => {
        const g = Q.geo(r, P), t = roomTotal(C.lines, r.id);
        return `<button class="rm ${r.packs.length ? 'work' : ''} ${r.done ? 'done' : ''} ${bad.has(r.id) ? 'bad' : ''}" style="flex:${Math.max(1, g.floor)} 1 ${Math.max(104, Math.sqrt(Math.max(g.floor, 1)) * 11)}px" data-goroom="${r.id}"><span class="ic">${ic(ROOMS[r.type].icon)}</span><span><span class="nm">${esc(r.name)}</span>${r.ext ? ' <span class="exttag">加建</span>' : ''}<br><span class="dm mono">${nf(g.L)}×${nf(g.W)} 尺 · ${nf(g.floor)} 平方尺</span></span><span class="am mono">${t ? rm(t) : ''}</span></button>`;
      }).join('') || '<span class="hint" style="margin:8px">这一层还没有房间</span>'}</div>
      <div class="adds">${Object.entries(ROOMS).filter(([k, t]) => !(t.outdoor || t.landed) || HOUSES[P.houseType].landed).map(([k, t]) => `<button class="chip" data-addroom="${k}" data-lv="${lv}">+ ${ic(t.icon)} ${t.label}</button>`).join('')}</div></div>`;
    }
    h += `<div class="adds noprint" style="margin-top:14px"><button class="btn" data-addlevel>+ 加一层</button></div>`;
    return h;
  }

  // ---------- ② 房间 ----------
  function sketch(r) {
    const g = Q.geo(r, P); if (!(g.L > 0 && g.W > 0)) return '';
    const s = 160 / Math.max(g.L, g.W), w = g.L * s, hh = g.W * s, x0 = 40 + (160 - w) / 2, y0 = 14;
    return `<svg viewBox="0 0 220 ${hh + 40}" role="img" aria-label="房间示意"><rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="var(--navy-soft)" stroke="var(--navy)" stroke-width="2" rx="2"/>
      <text x="${x0 + w / 2}" y="${y0 - 3}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">长 ${nf(g.L)} 尺</text>
      <text x="${x0 - 4}" y="${y0 + hh / 2}" text-anchor="end" font-size="10" fill="var(--ink-dim)" dominant-baseline="middle">宽 ${nf(g.W)}</text>
      <text x="${x0 + w / 2}" y="${y0 + hh / 2}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--navy)" dominant-baseline="middle">${nf(g.floor)} 平方尺</text>
      <text x="${x0 + w / 2}" y="${y0 + hh + 16}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">${ROOMS[r.type].outdoor ? '户外' : `墙面 ${nf(g.wall)} · 周长 ${nf(g.perim)}`}</text></svg>`;
  }
  // 房间栏像购物车：完成的房间收进「已完成」，选择栏只留没做完的；当前这间总是显示
  const cartOpen = {};
  function roomBar(list, curId, attr, sub, isDone, key, doneWord) {
    const act = list.filter(x => !isDone(x) || x.id === curId), done = list.filter(x => isDone(x) && x.id !== curId);
    const chip = (x, d) => `<button class="rchip ${x.id === curId ? 'on' : ''} ${d ? 'done' : ''} ${sub(x).bad ? 'bad' : ''}" ${attr}="${x.id}">${ic(d ? 'check' : ROOMS[x.type].icon)} ${esc(Q.roomLabel(x, P))}${x.ext ? ' <span class="exttag">加建</span>' : ''}<small${sub(x).color ? ` style="color:${sub(x).color}"` : ''}>${sub(x).t}</small></button>`;
    const nDone = list.filter(isDone).length;
    return `<div class="roombar noprint">${act.map(x => chip(x, isDone(x))).join('')}
      ${nDone ? `<button class="rchip cart ${cartOpen[key] ? 'open' : ''}" data-cart="${key}">${ic('check')} ${doneWord} ${nDone}/${list.length}<small>${done.length ? (cartOpen[key] ? '收起' : '点开查看') : '就是当前这间'}</small></button>` : ''}
      ${cartOpen[key] ? done.map(x => chip(x, true)).join('') : ''}</div>`;
  }
  // 下一间没完成的房间（按排列顺序，从当前往后找，找不到再从头找）
  const nextOpen = (cur, isDone) => { const i = P.rooms.findIndex(r => r.id === cur); return [...P.rooms.slice(i + 1), ...P.rooms.slice(0, i)].find(r => !isDone(r)); };

  function viewRoom(C) {
    if (!P.rooms.length) return `<h2>② 房间</h2><p class="hint">先在「① 户型」选房屋类型。</p>`;
    if (!room(roomId)) roomId = P.rooms[0].id;
    const r = room(roomId), T = ROOMS[r.type], g = Q.geo(r, P), bad = badRooms(C.K);
    let h = roomBar(P.rooms, roomId, 'data-goroom', x => ({ t: roomTotal(C.lines, x.id) ? rm(roomTotal(C.lines, x.id)) : (x.done ? '不做' : '未选工程'), bad: bad.has(x.id) }), x => !!x.done, 'room', '已完成');
    h += `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:22px">${ic(T.icon)}</span><input class="cust" style="flex:1;font-weight:700;font-size:15px" data-rname="${r.id}" value="${esc(r.name)}">${P.rooms.length > 1 && r.packs.length ? '<button class="btn" data-copyopen>复制这间做法到…</button>' : ''}${P.rooms.some(x => x.id !== r.id && (x.level || 1) === (r.level || 1)) ? '<button class="btn" data-mergeopen>合并…</button>' : ''}<button class="btn warn" data-delroom="${r.id}">删除房间</button></div>
      ${mergeOpen === r.id ? `<div class="sync" style="margin-top:12px"><b>把哪一间并进「${esc(r.name)}」？</b><span class="hint">同一个空间被拆开时用（例如客厅、餐厅、干厨房之间没有墙）。面积相加，两间选的工程都保留，另一间会删掉。</span><div class="adds">${P.rooms.filter(x => x.id !== r.id && (x.level || 1) === (r.level || 1)).map(x => `<button class="chip" data-mergein="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-mergeopen>取消</button></div></div>` : ''}
      ${HOUSES[P.houseType]?.landed && !T.outdoor ? `<div class="donebar"><button class="chip extchip ${r.ext ? 'on' : ''}" data-ext>${r.ext ? ic('check') + ' ' : ''}这间是加建部分（新建地基、墙、屋顶，按 ${nf(g.floor)} 平方尺算）</button>${r.ext ? `<span class="hint">结构 ${rm(C.lines.filter(l => l.roomId === r.id && l.code === 'extension').reduce((t, l) => t + l.total, 0))}，整单会加一次市政局申请</span>` : ''}</div>` : ''}
      ${doneBar(r, bad)}${copyPanel(r)}${(() => { const m = planMap(r.level || 1, P.rooms, r.id, 'data-goroom'); return m ? `<div style="margin-top:10px"><button class="chip" data-plantoggle>${planOpen ? '▾ 收起平面图' : '▸ 看这间在平面图上的位置'}</button>${planOpen ? m : ''}</div>` : ''; })()}${roomPics(r)}
      <div class="dims" style="margin-top:12px"><div>
        <div class="row">${field('长', '尺', stepper(`data-rf="L"`, r.L, 0.5))}${field('宽', '尺', stepper(`data-rf="W"`, r.W, 0.5))}${T.outdoor ? '' : field('层高', '尺', stepper(`data-rf="H"`, r.H ?? 9, 0.5))}${T.outdoor ? '' : field('门', '樘', stepper(`data-rf="doors"`, r.doors, 1))}</div>
        ${T.outdoor ? '' : winEditor(r)}
        <div style="margin-top:12px">${r.measured ? '<span class="ok" style="display:inline-block">✓ 尺寸已确认</span>' : '<button class="btn okb" data-measured>尺寸已现场确认</button> <span class="hint">现在是默认尺寸，改过数字也会自动确认</span>'}</div>
      </div><div class="sketch">${sketch(r)}</div></div></div>`;
    h += `<h2>这间要做什么</h2><p class="hint">点卡片选择；已选的卡片点名字会跳到要填的数字，点左边的 ✓ 才是取消。数量按尺寸自动算，卡片里只有少数需要确认的数字。</p>`;
    // 这类房间常用的工项 + 从别的房间带过来的其他工项（也要显示，才能看到和取消）
    const avail = [...new Set([...T.packs, ...r.packs])].filter(c => PACKS[c]);
    GROUPS.forEach(([gid, gname]) => {
      const codes = avail.filter(c => PACKS[c].g === gid); if (!codes.length) return;
      h += `<div class="grp"><h3>${gname}</h3><div class="packs">${codes.map(c => packCard(r, c, g, C).replace(/<\/div>$/, () => syncBar(r, c) + '</div>')).join('')}</div></div>`;
    });
    h += `<h3 style="margin:16px 0 4px">不确定 / 价目表没有的项目</h3><p class="hint">点「＋ 人工增加项」自己填名称、数量、单价，会算进这间的小计。</p>${extrasEditor(r.id)}`;
    h += `<div class="subtotal"><span>${esc(r.name)} 小计</span><span class="mono" style="color:var(--accent)">${rm(roomTotal(C.lines, r.id))}</span></div>`;
    // 选完工项通常停在页面底部，这里再放一个「完成」按钮，不用滚回顶部
    h += doneBar(r, bad);
    return h;
  }
  // 窗户尺寸：房间尺寸区和窗帘/窗台石/换窗卡片里都能填，是同一份数据
  // 窗户尺寸：房间尺寸区、窗帘/窗台石/换窗卡片、沿用到别的房间时，都能填；每樘窗都绑定它所在的房间（data-wroom）
  function winEditor(r, mode) {
    const A = (i, k) => `data-wroom="${r.id}" data-win="${i}" data-wk="${k}"`;
    const title = mode === 'sync' ? `「${esc(Q.roomLabel(r, P))}」有几樘窗？每樘填宽和高` : `「${esc(Q.roomLabel(r, P))}」的窗户${mode === 'card' ? '（和上面房间尺寸里的是同一份）' : '（每樘填宽和高，窗帘、窗台石、换窗都按这里算）'}`;
    return `<div class="wins"${mode ? ' style="margin:6px 0"' : ''}><div class="fld">${title}</div>${(r.windows || []).map((w, i) => `<div class="win"><span class="no">第 ${i + 1} 樘</span><label class="fld" style="margin:0">位置<input class="cust" style="width:110px" ${A(i, 'at')} value="${esc(w.at || '')}" placeholder="如：客厅前窗"></label>${field('宽', '尺', stepper(A(i, 'w'), w.w ?? '', 0.5))}${field('高', '尺', stepper(A(i, 'h'), w.h ?? '', 0.5))}<button class="x" data-wroom="${r.id}" data-delwin="${i}" title="删除这樘窗">✕</button></div>`).join('')}<button class="chip" data-wroom="${r.id}" data-addwin${mode ? `="${mode}"` : ''}>+ 加一樘窗</button></div>`;
  }
  function doneBar(r, bad) {
    return `<div class="donebar">${r.done ? `<span class="donetag">${ic('check')} 这间已完成</span><button class="btn" data-undone>${ic('undo')} 重新编辑</button>` : bad.has(r.id) ? `<div class="issue r" style="margin:0"><b>先处理这些才能点完成</b><span>${lastK.red.filter(x => x.go === r.id).map(x => esc(x.m)).join('<br>')}</span></div>` : `<button class="btn okb" data-done>${ic('check')} ${r.packs.length || r.ext ? '这间完成' : '这间不做，完成'}${nextOpen(r.id, x => !!x.done) ? '，下一间' : ''}</button>`}</div>`;
  }
  // 沿用到其他空间：点了某个工项后，问其他能做这项的房间要不要一样（同类房间排前面）
  let syncPrompt = null, copyOpen = false, copyMsg = null;

    const chip = x => { const has = (x.packs || []).includes(c); return `<button type="button" class="rchip ${has ? 'on' : ''} ${fits(x) ? '' : 'na'}" style="min-width:auto" data-sync-to="${x.id}">${has ? '✓ ' : ''}${esc(Q.roomLabel(x, P))}${fits(x) ? '' : ' <small>一般不做</small>'}</button>${has && PACKS[c].needWindows && !(x.windows || []).some(w => num(w.w) > 0 && num(w.h) > 0) && !(syncPrompt.wins || []).includes(x.id) ? `<button type="button" class="chip" style="border-color:var(--red);color:var(--red)" data-syncwin="${x.id}">填 ${esc(x.name)} 的窗户</button>` : ''}`; };

      <div class="adds" style="margin:6px 0 0">${same.length ? `<span class="hint" style="align-self:center;flex-basis:100%">同类（${esc(Q.kinLabel(r.type))}）：</span>${same.map(chip).join('')}` : ''}${diff.length ? `<span class="hint" style="align-self:center;flex-basis:100%">${same.length ? '其他类型：' : ''}</span>${diff.map(chip).join('')}` : ''}</div>
      ${PACKS[c].needWindows ? (syncPrompt.wins || []).map(id => room(id)).filter(t => t && (t.packs || []).includes(c)).map(t => `<div style="background:var(--card,#fff);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px">${winEditor(t, 'sync')}</div>`).join('') : ''}
      <div class="adds" style="margin:8px 0 0">${todo.length ? `<button type="button" class="btn ${on ? 'okb' : ''}" data-sync-all>${on ? '全部也做' : '全部也取消'}（${todo.length} 间）</button>` : ''}${todo.some(x => Q.kinOf(x.type) === k) && todo.length !== todo.filter(x => Q.kinOf(x.type) === k).length ? `<button type="button" class="btn" data-sync-same>只${Q.kinLabel(r.type)}（${todo.filter(x => Q.kinOf(x.type) === k).length} 间）</button>` : ''}<button type="button" class="btn" data-sync-close>只这间</button></div></div>`;
  }
  function copyPanel(r) {

    const others = P.rooms.filter(x => x.id !== r.id).sort((a, b) => (Q.kinOf(b.type) === Q.kinOf(r.type)) - (Q.kinOf(a.type) === Q.kinOf(r.type)));

  }
  function packCard(r, c, g, C) {
    const pk = PACKS[c], on = r.packs.includes(c);
    const myLines = on ? C.lines.filter(l => l.roomId === r.id && l.pack === c) : [];

      ${on && !pk.items ? `<div class="pkbody">${Q.inputsOf(c).map(i => field(i.label + (i.area && num(v[i.k]) !== g[i.k] ? ` <span class="desc">（房间 ${nf(g[i.k])}，<button type="button" class="x" style="font-size:11px;text-decoration:underline;padding:0" data-resetpv="${c}" data-pk="${i.k}">恢复</button>）</span>` : ''), i.unit, stepper(`data-pv="${c}" data-pk="${i.k}"`, v[i.k], i.unit === '尺' ? 0.5 : i.area ? 5 : 1))).join('')}${pk.needWindows ? winEditor(r, 'card') : ''}<div class="lines">${myLines.map(l => `${esc(l.name)} <b class="mono">${nf(l.qty)}</b> ${l.unitName}`).join(' · ') || (pk.needWindows ? '上面加窗户、填宽和高后自动算' : '数量为 0，请先补尺寸')}</div>${specLine ? `<div class="adds" style="margin:0;flex-basis:100%">${specLine}</div>` : ''}</div>` : (!on && pk.hint ? `<div class="desc" style="margin:4px 0 0 26px">${pk.hint}</div>` : '')}</div>`;
  }

  // ---------- 人工增加项：价目表没有或不确定的项目，可挂在房间或全屋 ----------
  function extrasEditor(rid) {

        <label class="fld">单位<select class="cust" data-extra="${i}" data-ek="unit">${Q.EXTRA_UNITS.map(u => `<option ${x.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
        <label class="fld">归属阶段<select class="cust" data-extra="${i}" data-ek="stage">${STAGES.map(st => `<option value="${st.id}" ${x.stage === st.id ? 'selected' : ''}>${st.no}. ${st.name}</option>`).join('')}</select></label>

  // ---------- ③ 全屋 ----------

      <label class="fld"><span><input type="checkbox" data-design ${P.design !== false ? 'checked' : ''}> 收设计费（RM ${C.T.settings.designRate}/平方尺 × 有施工的室内面积 ${nf(C.T.floorSum)}）</span></label>

  // ---------- ④ 做法与选材 ----------
  function planBar() {
    const ps = Q.plans(P);
    return `<div class="adds noprint" style="margin:0 0 10px">${ps.map(p => `<button class="rchip ${p.id === plan().id ? 'on' : ''}" style="min-width:auto" data-plan="${p.id}">${esc(p.name || '方案 ' + p.id)}</button>`).join('')}<button class="chip" data-copyplan>+ 复制成新方案</button>${ps.length > 1 ? `<button class="chip" data-delplan>删除当前方案</button>` : ''}</div>`;
  }
  const placeSet = (pl, roomId, pack, cat, k, v) => { (((pl.roomSpecs[roomId] = pl.roomSpecs[roomId] || {})['@' + pack] = pl.roomSpecs[roomId]['@' + pack] || {})[cat] = pl.roomSpecs[roomId]['@' + pack][cat] || {})[k] = v; };
  function optDelta(r, pack, cat, k, val, base) {
    const clone = JSON.parse(JSON.stringify(P));

  let specRoomId = null;

    h += `<h2>费用构成</h2><div class="bar">${T.byStage.map((s, i) => `<span title="${s.name}" style="width:${(s.total / Math.max(1, T.direct)) * 100}%;background:${STAGE_COLORS[(s.no - 1) % 9]}"></span>`).join('')}</div>
      <div class="legend">${T.byStage.map(s => `<span><i style="background:${STAGE_COLORS[(s.no - 1) % 9]}"></i>${s.name} <span class="mono">${rm(s.total)}</span></span>`).join('')}</div>`;
    h += `<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">${mode === 'formal' ? '正式报价单' : '预估报价单'} · ${esc(plan().name || '')}</h2><button class="btn pri noprint" data-print ${K.red.length ? 'disabled title="先处理红色项目"' : ''}>${K.red.length ? `还有 ${K.red.length} 项要处理` : '打印 / 存 PDF'}</button></div>
      ${mode === 'estimate' && lines.some(l => l.tbd.length) ? '<p class="hint" style="color:var(--yellow)">标「暂定」的项目材料还没定，暂按标准档估价，定好后金额可能变化。</p>' : ''}
      <p class="hint">客户：${esc(P.info.name) || '（未填）'} · ${HOUSES[P.houseType]?.label || ''} · 施工面积 ${nf(T.floorSum)} 平方尺</p>

    if (ds.placeStd || b.hasAttribute('data-room-std')) {
      const r = room(specRoomId), C = compute();
      Q.placesOf(P, r, C.lines).filter(pl => !ds.placeStd || pl.pack === ds.placeStd).forEach(pl => pl.keys.forEach(([cat, k]) => {
        const cur = Q.specOf(P, r, cat, k, null, pl.pack);
        if (!cur.decided) placeSet(plan(), r.id, pl.pack, cat, k, cur.v);
      }));
      render(); return;
    }
    if (ds.placeCopy) {
      const r = room(specRoomId), pack = ds.placeCopy, C = compute();
      const pl = Q.placesOf(P, r, C.lines).find(x => x.pack === pack);
      P.rooms.filter(x => x.id !== r.id && (x.packs || []).includes(pack)).forEach(x => pl.keys.forEach(([cat, k]) => placeSet(plan(), x.id, pack, cat, k, Q.specOf(P, r, cat, k, null, pack).v)));
      render(); return;
    }
    if (ds.plan) { P.planId = ds.plan; render(); return; }
    if (b.hasAttribute('data-copyplan')) {
      const ps = Q.plans(P), cur = plan(), id = String.fromCharCode(65 + ps.length);
      ps.push({ id, name: '方案 ' + id, specs: JSON.parse(JSON.stringify(cur.specs || {})), roomSpecs: JSON.parse(JSON.stringify(cur.roomSpecs || {})) });
      P.planId = id; render(); return;
    }
    if (b.hasAttribute('data-delplan')) { const ps = Q.plans(P); if (ps.length > 1) { P.plans = ps.filter(p => p.id !== plan().id); P.planId = P.plans[0].id; } render(); return; }
    if (ds.mode) { P.quoteMode = ds.mode; render(); return; }
    if (ds.hitem) { const q = P.house[ds.hitem] = P.house[ds.hitem] || {}; q.on = !q.on; render(); return; }
    if (ds.stp) {
      const inp = b.parentElement.querySelector('input'), step = parseFloat(ds.stp);
      const v = Math.max(0, r2(num(inp.value) + step)); inp.value = v; setValue(inp, v); render(); return;
    }
    if (ds.go) {
      if (ds.go === 'all') { tab = 'all'; render(); return; }
      if (ds.go.startsWith('spec:')) { tab = 'spec'; specRoomId = ds.go.slice(5); } else if (ds.go === 'house') tab = 'house'; else if (ds.go === 'price') { document.getElementById('price')?.scrollIntoView({ behavior: 'smooth' }); return; } else { roomId = ds.go; tab = 'room'; }
      render(); window.scrollTo(0, 0); return;
    }
    if (b.hasAttribute('data-print')) { if (!b.disabled) window.print(); return; }
    if (b.hasAttribute('data-reset')) { if (!confirmReset) { confirmReset = true; render(); return; } P = blank(); IMG = { drawings: [], rooms: {} }; saveImg(); confirmReset = false; tab = 'house'; roomId = null; render(); return; }
  });
  render();
  window.__qv2 = { get: () => P, compute };
})();
