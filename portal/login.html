<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — 系统入口</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#1a3a2a','gg':'#2d5e43','gd':'#c8a96e','gc':'#f5f2ed'}}}}</script>
</head>
<body class="bg-hg min-h-screen flex items-center justify-center p-4" style="font-family:'Noto Sans SC',sans-serif">

<div class="w-full max-w-sm">
  <!-- Logo -->
  <div class="text-center mb-10">
    <a href="/" class="inline-flex items-center gap-3">
      <div class="w-12 h-12 bg-gd flex items-center justify-center">
        <span class="text-hg font-bold text-xl" style="font-family:'Playfair Display',serif">H</span>
      </div>
      <div class="text-left">
        <div class="text-white font-bold tracking-widest text-lg">HOUZY HOME</div>
        <div class="text-gd text-xs tracking-widest">ORDER MANAGEMENT</div>
      </div>
    </a>
  </div>

  <!-- Customer shortcut -->
  <a href="customer.html"
     class="flex items-center gap-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl p-5 mb-4 transition-all group">
    <div class="w-11 h-11 bg-gd rounded-full flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-hg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <div class="flex-1">
      <div class="text-white font-semibold">查询我的订单</div>
      <div class="text-gray-400 text-sm">输入手机号 · 查看进度</div>
    </div>
    <svg class="w-4 h-4 text-gd group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </a>

  <!-- Login panel -->
  <div id="login-panel">
    <!-- Staff / Supplier login -->
    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-11 h-11 bg-white/10 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <div>
          <div class="text-white font-semibold">员工 / 厂家 / 管理员</div>
          <div class="text-gray-400 text-xs">Staff · Supplier · Admin</div>
        </div>
      </div>

      <form id="form" onsubmit="doLogin(event)" class="space-y-3">
        <input type="email" id="email" placeholder="电邮地址 Email" required autocomplete="username"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <input type="password" id="pw" placeholder="密码 Password" required autocomplete="current-password"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <button type="submit" id="btn"
                class="w-full py-3 bg-gd text-hg font-bold rounded-lg hover:brightness-110 transition text-sm">
          登录 Login
        </button>
        <p id="err" class="text-red-400 text-xs hidden"></p>
      </form>
    </div>

    <!-- Register link -->
    <p class="text-center mt-4 text-sm">
      <a onclick="showRegister()" class="text-gd cursor-pointer hover:brightness-125 transition">没有账号？立即注册 →</a>
    </p>
  </div>

  <!-- Registration panel -->
  <div id="reg-panel" class="hidden">
    <!-- Back link -->
    <p class="mb-4">
      <a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm">← 返回登录</a>
    </p>

    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <h2 class="text-white font-bold text-lg mb-5">申请注册账号</h2>

      <!-- Role selector -->
      <div class="flex gap-3 mb-5">
        <button id="reg-btn-staff" onclick="selectRegType('staff')"
                class="flex-1 py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-sm font-medium transition">
          👤 员工 Staff
        </button>
        <button id="reg-btn-supplier" onclick="selectRegType('supplier')"
                class="flex-1 py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-sm font-medium transition">
          🏭 厂家 Supplier
        </button>
      </div>

      <div class="space-y-3">
        <!-- Staff fields -->
        <div id="reg-staff-fields" class="space-y-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">姓名 *</label>
            <input type="text" id="reg-name" placeholder="请输入姓名"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">手机号 *</label>
            <input type="tel" id="reg-phone" placeholder="请输入手机号"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">邮箱 *</label>
            <input type="email" id="reg-email" placeholder="请输入邮箱地址"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">员工编号</label>
            <input type="text" id="reg-employee-no" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">部门</label>
            <input type="text" id="reg-department" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">职位</label>
            <input type="text" id="reg-position" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
        </div>

        <!-- Supplier fields -->
        <div id="reg-supplier-fields" class="space-y-3 hidden">
          <div>
            <label class="block text-xs text-gray-400 mb-1">厂家名称 *</label>
            <input type="text" id="reg-company" placeholder="请输入公司名称"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">联系人姓名 *</label>
            <input type="text" id="reg-sup-name" placeholder="请输入联系人姓名"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">手机号 *</label>
            <input type="tel" id="reg-sup-phone" placeholder="请输入手机号"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">邮箱 *</label>
            <input type="email" id="reg-sup-email" placeholder="请输入邮箱地址"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">统一社会信用代码</label>
            <input type="text" id="reg-credit-code" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">公司地址</label>
            <input type="text" id="reg-address" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">主营产品/业务</label>
            <input type="text" id="reg-products" placeholder="选填"
                   class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
          </div>
        </div>

        <!-- Common: password -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">密码 *</label>
          <input type="password" id="reg-pw" placeholder="请设置登录密码"
                 class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">确认密码 *</label>
          <input type="password" id="reg-pw2" placeholder="请再次输入密码"
                 class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        </div>

        <button onclick="submitReg()" id="reg-btn-submit"
                class="w-full py-3 bg-gd text-hg font-bold rounded-lg hover:brightness-110 transition text-sm">
          提交申请
        </button>
        <p id="reg-err" class="text-red-400 text-xs hidden"></p>
      </div>
    </div>
  </div>

  <p class="text-center text-gray-600 text-xs mt-8">© 2026 HOUZY HOME SDN. BHD.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ 替换为您的 Supabase 凭证 → Supabase Dashboard > Settings > API
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

// Already logged in?
sb.auth.getSession().then(({ data: { session } }) => { if (session) redirect(); });

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.textContent = '登录中...'; btn.disabled = true; err.classList.add('hidden');

  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('pw').value
  });
  if (error) {
    err.textContent = error.message.includes('Invalid') ? '邮箱或密码错误' : error.message;
    err.classList.remove('hidden');
    btn.textContent = '登录 Login'; btn.disabled = false;
    return;
  }
  redirect();
}

async function redirect() {
  const { data } = await sb.rpc('get_my_profile');
  if (!data) {
    // No profile — user likely has a pending or rejected registration
    await sb.auth.signOut();
    const err = document.getElementById('err');
    err.textContent = '账号审核中，请等待管理员审核后再登录。';
    err.classList.remove('hidden');
    document.getElementById('btn').textContent = '登录 Login';
    document.getElementById('btn').disabled = false;
    return;
  }
  const role = data?.role || 'customer';
  const map = { staff: 'staff.html', supplier: 'supplier.html', admin: 'staff.html', customer: 'customer.html' };
  window.location.href = map[role] || 'customer.html';
}

// ── Registration ──
let regType = 'staff';

function showRegister() {
  document.getElementById('login-panel').classList.add('hidden');
  document.getElementById('reg-panel').classList.remove('hidden');
}

function showLogin() {
  document.getElementById('login-panel').classList.remove('hidden');
  document.getElementById('reg-panel').classList.add('hidden');
  document.getElementById('reg-err').classList.add('hidden');
}

function selectRegType(t) {
  regType = t;
  const staffBtn = document.getElementById('reg-btn-staff');
  const supBtn   = document.getElementById('reg-btn-supplier');
  const staffFlds = document.getElementById('reg-staff-fields');
  const supFlds   = document.getElementById('reg-supplier-fields');

  if (t === 'staff') {
    staffBtn.className = 'flex-1 py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-sm font-medium transition';
    supBtn.className   = 'flex-1 py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-sm font-medium transition';
    staffFlds.classList.remove('hidden');
    supFlds.classList.add('hidden');
  } else {
    supBtn.className   = 'flex-1 py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-sm font-medium transition';
    staffBtn.className = 'flex-1 py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-sm font-medium transition';
    supFlds.classList.remove('hidden');
    staffFlds.classList.add('hidden');
  }
}

async function submitReg() {
  const errEl = document.getElementById('reg-err');
  const btn   = document.getElementById('reg-btn-submit');
  errEl.classList.add('hidden');

  // Collect fields
  let name, phone, email;
  let payload = { type: regType };

  if (regType === 'staff') {
    name  = document.getElementById('reg-name').value.trim();
    phone = document.getElementById('reg-phone').value.trim();
    email = document.getElementById('reg-email').value.trim();
    if (!name || !phone || !email) {
      errEl.textContent = '请填写姓名、手机号和邮箱'; errEl.classList.remove('hidden'); return;
    }
    payload.name            = name;
    payload.phone           = phone;
    payload.email           = email;
    payload.employee_no     = document.getElementById('reg-employee-no').value.trim() || null;
    payload.department      = document.getElementById('reg-department').value.trim() || null;
    payload.position_title  = document.getElementById('reg-position').value.trim() || null;
  } else {
    const company = document.getElementById('reg-company').value.trim();
    name  = document.getElementById('reg-sup-name').value.trim();
    phone = document.getElementById('reg-sup-phone').value.trim();
    email = document.getElementById('reg-sup-email').value.trim();
    if (!company || !name || !phone || !email) {
      errEl.textContent = '请填写厂家名称、联系人姓名、手机号和邮箱'; errEl.classList.remove('hidden'); return;
    }
    payload.company_name  = company;
    payload.name          = name;
    payload.phone         = phone;
    payload.email         = email;
    payload.credit_code   = document.getElementById('reg-credit-code').value.trim() || null;
    payload.address       = document.getElementById('reg-address').value.trim() || null;
    payload.products      = document.getElementById('reg-products').value.trim() || null;
  }

  const pw  = document.getElementById('reg-pw').value;
  const pw2 = document.getElementById('reg-pw2').value;
  if (!pw || pw.length < 6) {
    errEl.textContent = '密码至少需要6位'; errEl.classList.remove('hidden'); return;
  }
  if (pw !== pw2) {
    errEl.textContent = '两次输入的密码不一致'; errEl.classList.remove('hidden'); return;
  }

  btn.textContent = '提交中...'; btn.disabled = true;

  // Sign up with Supabase auth
  const { data: authData, error: authErr } = await sb.auth.signUp({ email, password: pw });
  if (authErr) {
    const msg = authErr.message.includes('already registered') || authErr.message.includes('already been registered')
      ? '该邮箱已注册，请直接登录或联系管理员。'
      : authErr.message;
    errEl.textContent = msg; errEl.classList.remove('hidden');
    btn.textContent = '提交申请'; btn.disabled = false;
    return;
  }

  // Insert registration record
  payload.user_id = authData?.user?.id || null;
  const { error: insErr } = await sb.from('registrations').insert(payload);
  if (insErr) {
    errEl.textContent = '提交失败: ' + insErr.message; errEl.classList.remove('hidden');
    btn.textContent = '提交申请'; btn.disabled = false;
    return;
  }

  // Sign out immediately — they need admin approval first
  await sb.auth.signOut();

  btn.textContent = '提交申请'; btn.disabled = false;

  // Show success — replace form content
  document.getElementById('reg-panel').innerHTML = `
    <div class="bg-white/5 border border-white/10 rounded-xl p-8 text-center">
      <div class="text-4xl mb-4">✅</div>
      <h2 class="text-white font-bold text-lg mb-3">申请已提交！</h2>
      <p class="text-gray-300 text-sm leading-relaxed mb-6">请等待管理员审核，审核通过后即可登录。</p>
      <a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm">← 返回登录</a>
    </div>`;
}
</script>
</body>
</html>
