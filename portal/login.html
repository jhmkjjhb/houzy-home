<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ⚠️ 替换为您的 Supabase 凭证 → Supabase Dashboard > Settings > API
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

// Detect password recovery flow (handles both PKCE and implicit flows)
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    showPanel('reset-panel');
  }
});

(async () => {
  // Also handle hash-based recovery token (older Supabase versions)
  const hash = new URLSearchParams(window.location.hash.replace('#',''));
  if (hash.get('type') === 'recovery') {
    showPanel('reset-panel');
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data } = await sb.rpc('get_my_profile');
    if (data) redirect(data);
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.textContent = '登录中...'; btn.disabled = true; err.classList.add('hidden');

  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('pw').value
  });
  if (error) {
    const m = error.message || '';
    if (m.includes('Invalid') || m.includes('invalid')) {
      err.textContent = '邮箱或密码错误，请重新输入';
    } else if (m.includes('Email not confirmed') || m.includes('not confirmed')) {
      err.textContent = '邮箱尚未验证，请先点击注册时收到的确认邮件（请检查垃圾邮件箱）';
    } else if (m.includes('disabled') || m.includes('banned')) {
      err.textContent = '账号已被停用，请联系管理员';
    } else {
      err.textContent = '登录失败：' + m;
    }
    err.classList.remove('hidden');
    btn.textContent = '登录 Login'; btn.disabled = false;
    return;
  }
  redirect();
}

function showPanel(id) {
  ['login-panel','forgot-panel','reset-panel','reg-panel'].forEach(p => {
    const el = document.getElementById(p);
    if (el) el.classList.toggle('hidden', p !== id);
  });
}
function showLogin()    { showPanel('login-panel'); }
function showForgot()   { showPanel('forgot-panel'); }
async function showRegister() {
  showPanel('reg-panel');
  const sel = document.getElementById('reg-store');
  if (sel && sel.options.length <= 1) {
    const { data } = await sb.from('stores').select('id, name').eq('active', true).order('name');
    if (data?.length) {
      sel.innerHTML = '<option value="" style="background:#1a3a2a">请选择所属店面</option>' +
        data.map(s => `<option value="${s.id}" style="background:#1a3a2a">${s.name}</option>`).join('');
    }
  }
}

async function redirect(data) {
  if (!data) {
    const { data: profileData, error: rpcErr } = await sb.rpc('get_my_profile');
    data = profileData;
    if (rpcErr) console.error('get_my_profile error:', rpcErr.message);
  }
  if (!data) {
    await sb.auth.signOut();
    const err = document.getElementById('err');
    err.textContent = '账号资料未找到，可能正在审核中或审批未完成，请联系管理员确认。';
    err.classList.remove('hidden');
    document.getElementById('btn').textContent = '登录 Login';
    document.getElementById('btn').disabled = false;
    return;
  }
  const role = data?.role || 'customer';
  const map = { staff: 'staff.html', supplier: 'supplier.html', admin: 'staff.html', customer: 'customer.html' };
  window.location.href = map[role] || 'customer.html';
}

async function submitForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const btn = document.getElementById('forgot-btn');
  const msg = document.getElementById('forgot-msg');
  if (!email) { msg.textContent = '请输入邮箱地址'; msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  btn.textContent = '发送中...'; btn.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  btn.textContent = '发送重置链接'; btn.disabled = false;
  if (error) {
    msg.textContent = '发送失败：' + error.message;
    msg.className = 'text-xs text-red-400';
  } else {
    msg.textContent = '✅ 重置链接已发送，请检查您的邮箱（包括垃圾邮件）。';
    msg.className = 'text-xs text-green-400';
  }
  msg.classList.remove('hidden');
}

async function submitReset() {
  const pw  = document.getElementById('reset-pw').value;
  const pw2 = document.getElementById('reset-pw2').value;
  const btn = document.getElementById('reset-btn');
  const msg = document.getElementById('reset-msg');
  if (!pw || pw.length < 6) { msg.textContent = '密码至少需要6位'; msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  if (pw !== pw2) { msg.textContent = '两次密码不一致'; msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  btn.textContent = '设置中...'; btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.textContent = '确认设置'; btn.disabled = false;
  if (error) {
    msg.textContent = '设置失败：' + error.message;
    msg.className = 'text-xs text-red-400';
    msg.classList.remove('hidden');
  } else {
    msg.textContent = '✅ 密码已更新！正在跳转登录…';
    msg.className = 'text-xs text-green-400';
    msg.classList.remove('hidden');
    setTimeout(() => { window.location.hash = ''; redirect(); }, 1500);
  }
}

// ── Registration ──
let regType = 'staff';

function selectRegType(t) {
  regType = t;
  const staffBtn = document.getElementById('reg-btn-staff');
  const supBtn   = document.getElementById('reg-btn-supplier');
  const staffFlds = document.getElementById('reg-staff-fields');
  const supFlds   = document.getElementById('reg-supplier-fields');

  if (t === 'staff') {
    staffBtn.className = 'flex-1 py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-sm font-medium transition';
    supBtn.className   = 'flex-1 py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-sm font-medium transition';
    staffFlds.classList.remove('hidden');
    supFlds.classList.add('hidden');
  } else {
    supBtn.className   = 'flex-1 py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-sm font-medium transition';
    staffBtn.className = 'flex-1 py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-sm font-medium transition';
    supFlds.classList.remove('hidden');
    staffFlds.classList.add('hidden');
  }
}

async function submitReg() {
  const errEl = document.getElementById('reg-err');
  const btn   = document.getElementById('reg-btn-submit');
  errEl.classList.add('hidden');

  // Collect fields
  let name, phone, email;
  let payload = { type: regType };

  if (regType === 'staff') {
    name  = document.getElementById('reg-name').value.trim();
    phone = document.getElementById('reg-phone').value.trim();
    email = document.getElementById('reg-email').value.trim();
    const storeId = document.getElementById('reg-store')?.value;
    if (!name || !phone || !email) {
      errEl.textContent = '请填写姓名、手机号和邮箱'; errEl.classList.remove('hidden'); return;
    }
    if (!storeId) {
      errEl.textContent = '请选择所属店面'; errEl.classList.remove('hidden'); return;
    }
    payload.name            = name;
    payload.phone           = phone;
    payload.email           = email;
    payload.store_id        = storeId;
    payload.employee_no     = document.getElementById('reg-employee-no').value.trim() || null;
    payload.department      = document.getElementById('reg-department').value.trim() || null;
    payload.position_title  = document.getElementById('reg-position').value.trim() || null;
  } else {
    const company = document.getElementById('reg-company').value.trim();
    name  = document.getElementById('reg-sup-name').value.trim();
    phone = document.getElementById('reg-sup-phone').value.trim();
    email = document.getElementById('reg-sup-email').value.trim();
    if (!company || !name || !phone || !email) {
      errEl.textContent = '请填写厂家名称、联系人姓名、手机号和邮箱'; errEl.classList.remove('hidden'); return;
    }
    payload.company_name  = company;
    payload.name          = name;
    payload.phone         = phone;
    payload.email         = email;
    payload.credit_code   = document.getElementById('reg-credit-code').value.trim() || null;
    payload.address       = document.getElementById('reg-address').value.trim() || null;
    payload.products      = document.getElementById('reg-products').value.trim() || null;
  }

  const pw  = document.getElementById('reg-pw').value;
  const pw2 = document.getElementById('reg-pw2').value;
  if (!pw || pw.length < 6) {
    errEl.textContent = '密码至少需要6位'; errEl.classList.remove('hidden'); return;
  }
  if (pw !== pw2) {
    errEl.textContent = '两次输入的密码不一致'; errEl.classList.remove('hidden'); return;
  }

  btn.textContent = '提交中...'; btn.disabled = true;

  // Step 1: Create auth account
  let userId = null;
  const { data: authData, error: authErr } = await sb.auth.signUp({ email, password: pw,
    options: { data: { name, role: regType } }
  });
  if (authErr) {
    const msg = authErr.message || '';
    if (msg.includes('already registered') || msg.includes('already')) {
      // Email already in auth — that's OK, continue to submit registration record
    } else if (msg.includes('rate limit') || msg.includes('429')) {
      errEl.textContent = '提交过于频繁，请稍后再试';
      errEl.classList.remove('hidden'); btn.textContent = '提交申请'; btn.disabled = false; return;
    } else if (msg.includes('invalid') && msg.includes('email')) {
      errEl.textContent = '邮箱地址格式不正确，请检查后重试';
      errEl.classList.remove('hidden'); btn.textContent = '提交申请'; btn.disabled = false; return;
    } else if (msg.includes('Password') || msg.includes('password')) {
      errEl.textContent = '密码不符合要求，请使用至少6位字符';
      errEl.classList.remove('hidden'); btn.textContent = '提交申请'; btn.disabled = false; return;
    } else {
      errEl.textContent = '账号创建失败，请联系管理员（' + msg + '）';
      errEl.classList.remove('hidden'); btn.textContent = '提交申请'; btn.disabled = false; return;
    }
  } else {
    userId = authData?.user?.id || null;
  }

  // Step 2: Insert registration record while session is still active (before signOut)
  payload.user_id = userId;
  const { error: insErr } = await sb.from('registrations').insert(payload);

  // Step 3: Sign out regardless of insert result
  await sb.auth.signOut();

  if (insErr) {
    const imsg = insErr.message || '';
    if (imsg.includes('relation') || imsg.includes('does not exist')) {
      errEl.textContent = '系统配置错误：注册表尚未创建，请联系管理员运行数据库迁移';
    } else if (imsg.includes('violates row-level security') || imsg.includes('permission')) {
      errEl.textContent = '权限错误：请联系管理员检查数据库 RLS 策略（registrations GRANT）';
    } else if (imsg.includes('duplicate') || imsg.includes('unique')) {
      errEl.textContent = '该邮箱已提交过申请，请等待管理员审核或联系管理员';
    } else {
      errEl.textContent = '提交失败：' + imsg;
    }
    errEl.classList.remove('hidden'); btn.textContent = '提交申请'; btn.disabled = false; return;
  }

  btn.textContent = '提交申请'; btn.disabled = false;

  // Show success — replace form content
  document.getElementById('reg-panel').innerHTML = `
    <div class="bg-white/5 border border-white/10 rounded-xl p-8 text-center">
      <div class="text-4xl mb-4">✅</div>
      <h2 class="text-white font-bold text-lg mb-3">申请已提交！</h2>
      <div class="text-left space-y-3 mb-6">
        <div class="flex items-start gap-3">
          <span class="text-gd font-bold flex-shrink-0">1.</span>
          <p class="text-gray-300 text-sm">请前往您的邮箱，点击确认链接以激活账号（注意查看垃圾邮件）</p>
        </div>
        <div class="flex items-start gap-3">
          <span class="text-gd font-bold flex-shrink-0">2.</span>
          <p class="text-gray-300 text-sm">邮箱确认后，请等待管理员审核，审核通过后即可登录</p>
        </div>
      </div>
      <a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm">← 返回登录</a>
    </div>`;
}
</script>
</body>
</html>
