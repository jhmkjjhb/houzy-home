<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — Portal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#153927">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOUZY HOME">
<script>if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(e){console.warn('[PWA] SW reg failed:',e);});});}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#1a3a2a','gg':'#2d5e43','gd':'#c8a96e','gc':'#f5f2ed'}}}}</script>
</head>
<body class="bg-hg min-h-screen flex items-center justify-center p-4 cursor-pointer" style="font-family:'Noto Sans SC',sans-serif" onclick="window.location.href='https://houzyhome.com'">

<!-- Floating language picker (top-right) -->
<div class="fixed top-3 right-3 z-50" onclick="event.stopPropagation()">
  <div class="relative">
    <button onclick="toggleLangDrop()" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg px-3 py-2 text-xs text-white">
      🌐 <span id="lang-label">简体中文</span>
      <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div id="lang-drop" class="hidden absolute right-0 top-full mt-1 bg-white rounded-lg shadow-xl py-1 overflow-hidden min-w-[140px]">
      <button onclick="setLang('en')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
      <button onclick="setLang('zh-CN')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
      <button onclick="setLang('zh-TW')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁體中文</button>
      <button onclick="setLang('ms')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
      <button onclick="setLang('th')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
    </div>
  </div>
</div>

<div class="w-full max-w-sm cursor-default" onclick="event.stopPropagation()">
  <!-- Logo -->
  <div class="text-center mb-10">
    <a href="https://houzyhome.com" class="inline-flex items-center gap-3">
      <img src="/favicon.svg" alt="HOUZY HOME" class="w-12 h-12 rounded-md flex-shrink-0" style="box-shadow:0 0 0 1px rgba(200,169,110,.35)">
      <div class="text-left">
        <div class="text-white font-bold tracking-widest text-lg">HOUZY HOME</div>
        <div class="text-gd text-xs tracking-widest">ORDER MANAGEMENT</div>
      </div>
    </a>
  </div>

  <!-- Customer shortcut -->
  <a href="customer.html"
     class="flex items-center gap-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl p-5 mb-4 transition-all group">
    <div class="w-11 h-11 bg-gd rounded-full flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-hg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <div class="flex-1">
      <div class="text-white font-semibold" data-i18n="customer_lookup_title">查询我的订单</div>
      <div class="text-gray-400 text-sm" data-i18n="customer_lookup_sub">输入手机号 · 查看进度</div>
    </div>
    <svg class="w-4 h-4 text-gd group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
  </a>

  <!-- Login panel -->
  <div id="login-panel">
    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-11 h-11 bg-white/10 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <div>
          <div class="text-white font-semibold" data-i18n="login_panel_title">员工 / 厂家 / 仓管 / 管理员</div>
          <div class="text-gray-400 text-xs" data-i18n="login_panel_sub">Staff · Supplier · Warehouse · Admin</div>
        </div>
      </div>
      <form id="form" onsubmit="doLogin(event)" class="space-y-3">
        <input type="email" id="email" placeholder="电邮地址 Email" data-i18n-ph="ph_email" required autocomplete="username"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <input type="password" id="pw" placeholder="密码 Password" data-i18n-ph="ph_password" required autocomplete="current-password"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <button type="submit" id="btn" data-i18n="login_btn"
                class="w-full py-3 bg-gd text-hg font-bold rounded-lg hover:brightness-110 transition text-sm">
          登录 Login
        </button>
        <p id="err" class="text-red-400 text-xs hidden"></p>
      </form>
    </div>
    <div class="flex justify-between mt-4 text-sm">
      <a onclick="showForgot()" class="text-gray-400 cursor-pointer hover:text-gd transition" data-i18n="forgot_pw">忘记密码？</a>
      <a onclick="showRegister()" class="text-gd cursor-pointer hover:brightness-125 transition" data-i18n="no_account">没有账号？立即注册 →</a>
    </div>
  </div>

  <!-- Forgot password panel -->
  <div id="forgot-panel" class="hidden">
    <p class="mb-4"><a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm" data-i18n="back_to_login">← 返回登录</a></p>
    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <h2 class="text-white font-bold text-lg mb-2" data-i18n="reset_pw_title">重置密码</h2>
      <p class="text-gray-400 text-xs mb-4" data-i18n="reset_pw_hint">输入注册邮箱，我们将发送密码重置链接到您的邮箱。</p>
      <div class="space-y-3">
        <input type="email" id="forgot-email" placeholder="电邮地址 Email" data-i18n-ph="ph_email"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <button onclick="submitForgot()" id="forgot-btn" data-i18n="send_reset_link"
                class="w-full py-3 bg-gd text-hg font-bold rounded-lg hover:brightness-110 transition text-sm">
          发送重置链接
        </button>
        <p id="forgot-msg" class="text-xs hidden"></p>
      </div>
    </div>
  </div>

  <!-- Reset password panel -->
  <div id="reset-panel" class="hidden">
    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <h2 class="text-white font-bold text-lg mb-2" data-i18n="set_new_pw_title">设置新密码</h2>
      <p class="text-gray-400 text-xs mb-4" data-i18n="set_new_pw_hint">请输入您的新密码。</p>
      <div class="space-y-3">
        <input type="password" id="reset-pw" placeholder="新密码（至少6位）" data-i18n-ph="ph_new_pw"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <input type="password" id="reset-pw2" placeholder="确认新密码" data-i18n-ph="ph_confirm_pw"
               class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
        <button onclick="submitReset()" id="reset-btn" data-i18n="confirm_set_btn"
                class="w-full py-3 bg-gd text-hg font-bold rounded-lg hover:brightness-110 transition text-sm">
          确认设置
        </button>
        <p id="reset-msg" class="text-xs hidden"></p>
      </div>
    </div>
  </div>

  <!-- Registration panel -->
  <div id="reg-panel" class="hidden">
    <p class="mb-4">
      <a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm" data-i18n="back_to_login">← 返回登录</a>
    </p>
    <div class="bg-white/5 border border-white/10 rounded-xl p-5">
      <h2 class="text-white font-bold text-lg mb-5" data-i18n="reg_title">申请注册账号</h2>
      <div class="grid grid-cols-2 gap-2 mb-5">
        <button id="reg-btn-staff" onclick="selectRegType('staff')"
                class="py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-xs font-medium transition" data-i18n="role_staff">
          👤 员工 Staff
        </button>
        <button id="reg-btn-supplier" onclick="selectRegType('supplier')"
                class="py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-xs font-medium transition" data-i18n="role_supplier">
          🏭 厂家 Supplier
        </button>
        <button id="reg-btn-logistics" onclick="selectRegType('logistics')"
                class="py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-xs font-medium transition" data-i18n="role_logistics">
          🚚 物流 Logistics
        </button>
        <button id="reg-btn-warehouse" onclick="selectRegType('warehouse')"
                class="py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-xs font-medium transition" data-i18n="role_warehouse">
          📦 仓管 Warehouse
        </button>
      </div>
      <div class="space-y-3">
        <!-- Staff fields -->
        <div id="reg-staff-fields" class="space-y-3">
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_name">姓名 *</label>
            <input type="text" id="reg-name" placeholder="请输入姓名" data-i18n-ph="ph_enter_name" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_phone">手机号 *</label>
            <input type="tel" id="reg-phone" placeholder="请输入手机号" data-i18n-ph="ph_enter_phone" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_email">邮箱 *</label>
            <input type="email" id="reg-email" placeholder="请输入邮箱地址" data-i18n-ph="ph_enter_email" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_emp_no">员工编号</label>
            <input type="text" id="reg-employee-no" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_dept">部门</label>
            <input type="text" id="reg-department" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_position">职位</label>
            <input type="text" id="reg-position" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_store">所属店面 *</label>
            <select id="reg-store" class="w-full bg-white/10 border border-white/20 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
              <option value="" style="background:#1a3a2a" data-i18n-opt="opt_select_store">请选择所属店面</option>
            </select></div>
        </div>
        <!-- Supplier fields -->
        <div id="reg-supplier-fields" class="space-y-3 hidden">
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_company">厂家名称 *</label>
            <input type="text" id="reg-company" placeholder="请输入公司名称" data-i18n-ph="ph_enter_company" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_contact_name">联系人姓名 *</label>
            <input type="text" id="reg-sup-name" placeholder="请输入联系人姓名" data-i18n-ph="ph_enter_contact" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_phone">手机号 *</label>
            <input type="tel" id="reg-sup-phone" placeholder="请输入手机号" data-i18n-ph="ph_enter_phone" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_email">邮箱 *</label>
            <input type="email" id="reg-sup-email" placeholder="请输入邮箱地址" data-i18n-ph="ph_enter_email" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_credit_code">统一社会信用代码</label>
            <input type="text" id="reg-credit-code" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_company_addr">公司地址</label>
            <input type="text" id="reg-address" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div>
            <label class="block text-xs text-gray-400 mb-2" data-i18n="lbl_product_types">专业供应产品类型（可多选）</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="WY"><span class="text-sm text-gray-300" data-i18n="pt_WY">卫浴</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="CG"><span class="text-sm text-gray-300" data-i18n="pt_CG">橱柜</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="DB"><span class="text-sm text-gray-300" data-i18n="pt_DB">地板/地砖</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="DJ"><span class="text-sm text-gray-300" data-i18n="pt_DJ">灯具</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="MC"><span class="text-sm text-gray-300" data-i18n="pt_MC">门窗</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="JJ"><span class="text-sm text-gray-300" data-i18n="pt_JJ">家具</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="WJ"><span class="text-sm text-gray-300" data-i18n="pt_WJ">五金</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="DQ"><span class="text-sm text-gray-300" data-i18n="pt_DQ">电器</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="TL"><span class="text-sm text-gray-300" data-i18n="pt_TL">涂料/壁纸</span></label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="reg-pt-check accent-yellow-400" value="QT"><span class="text-sm text-gray-300" data-i18n="pt_QT">其他</span></label>
            </div>
          </div>
        </div>
        <!-- Logistics fields -->
        <div id="reg-logistics-fields" class="space-y-3 hidden">
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_name">姓名 *</label>
            <input type="text" id="reg-log-name" placeholder="请输入姓名" data-i18n-ph="ph_enter_name" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_phone">手机号 *</label>
            <input type="tel" id="reg-log-phone" placeholder="请输入手机号" data-i18n-ph="ph_enter_phone" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_email">邮箱 *</label>
            <input type="email" id="reg-log-email" placeholder="请输入邮箱地址" data-i18n-ph="ph_enter_email" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_team_company">公司/团队名称</label>
            <input type="text" id="reg-log-company" placeholder="选填" data-i18n-ph="ph_optional" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
        </div>
        <!-- Warehouse fields -->
        <div id="reg-warehouse-fields" class="space-y-3 hidden">
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_name">姓名 *</label>
            <input type="text" id="reg-wh-name" placeholder="请输入姓名" data-i18n-ph="ph_enter_name" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_phone">手机号 *</label>
            <input type="tel" id="reg-wh-phone" placeholder="请输入手机号" data-i18n-ph="ph_enter_phone" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_email">邮箱 *</label>
            <input type="email" id="reg-wh-email" placeholder="请输入邮箱地址" data-i18n-ph="ph_enter_email" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
          <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_store">所属店面 *</label>
            <select id="reg-wh-store" class="w-full bg-white/10 border border-white/20 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd">
              <option value="" style="background:#1a3a2a" data-i18n-opt="opt_select_store">请选择所属店面</option>
            </select></div>
        </div>
        <!-- Password -->
        <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_password">密码 *</label>
          <input type="password" id="reg-pw" placeholder="请设置登录密码" data-i18n-ph="ph_set_pw" class="w-full bg-white/10 border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-gd"></div>
        <div><label class="block text-xs text-gray-400 mb-1" data-i18n="lbl_confirm_pw">确认密码 *</label>

const LANG_LABELS = { 'en':'English', 'zh-CN':'简体中文', 'zh-TW':'繁體中文', 'ms':'Bahasa Melayu', 'th':'ภาษาไทย' };
let currentLang = localStorage.getItem('houzy-lang') || 'zh-CN';
if (!LOGIN_I18N[currentLang]) currentLang = 'zh-CN';
function t(k) { return (LOGIN_I18N[currentLang] || LOGIN_I18N['zh-CN'])[k] || k; }

function toggleLangDrop() {
  document.getElementById('lang-drop').classList.toggle('hidden');
}
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('houzy-lang', lang);
  const lbl = LANG_LABELS[lang] || lang;
  const lblEl = document.getElementById('lang-label'); if (lblEl) lblEl.textContent = lbl;
  document.getElementById('lang-drop')?.classList.add('hidden');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n); if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.dataset.i18nPh); if (v) el.placeholder = v;
  });
  document.querySelectorAll('[data-i18n-opt]').forEach(el => {
    const v = t(el.dataset.i18nOpt); if (v) el.textContent = v;
  });
  document.body.style.fontFamily = lang === 'th' ? "'Noto Sans Thai',sans-serif" : "'Noto Sans SC',sans-serif";
  // 让 HTML lang 属性也同步（无障碍/SEO）
  document.documentElement.lang = lang;
}
// 启动时应用一次
window.addEventListener('DOMContentLoaded', () => setLang(currentLang));
// 点外面收菜单
document.addEventListener('click', (e) => {
  const drop = document.getElementById('lang-drop');
  if (!drop || drop.classList.contains('hidden')) return;
  if (e.target.closest('button')?.getAttribute('onclick')?.includes('toggleLangDrop')) return;
  drop.classList.add('hidden');
});

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') showPanel('reset-panel');
});

(async () => {
  const hash = new URLSearchParams(window.location.hash.replace('#',''));
  if (hash.get('type') === 'recovery') { showPanel('reset-panel'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { const { data } = await sb.rpc('get_my_profile'); if (data) redirect(data); }
})();

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.textContent = t('logging_in'); btn.disabled = true; err.classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('pw').value
  });
  if (error) {
    const m = error.message || '';
    if (m.includes('Invalid') || m.includes('invalid')) err.textContent = t('err_invalid_creds');
    else if (m.includes('not confirmed')) err.textContent = t('err_email_not_verified');
    else if (m.includes('disabled') || m.includes('banned')) err.textContent = t('err_acc_disabled');
    else err.textContent = t('err_login_failed') + m;
    err.classList.remove('hidden');
    btn.textContent = t('login_btn'); btn.disabled = false;
    return;
  }
  redirect();
}

function showPanel(id) {
  ['login-panel','forgot-panel','reset-panel','reg-panel'].forEach(p => {
    const el = document.getElementById(p);
    if (el) el.classList.toggle('hidden', p !== id);
  });
}
function showLogin()  { showPanel('login-panel'); }
function showForgot() { showPanel('forgot-panel'); }
async function showRegister() {
  showPanel('reg-panel');
  const { data } = await sb.from('stores').select('id, name').eq('active', true).order('name');
  const noStoreOpt = `<option value="" style="background:#1a3a2a">${t('opt_select_store')}</option>`;
  const opts = data?.length
    ? noStoreOpt + data.map(s => `<option value="${s.id}" style="background:#1a3a2a">${s.name}</option>`).join('')
    : noStoreOpt;
  ['reg-store','reg-wh-store'].forEach(id => {
    const sel = document.getElementById(id);
    if (sel && sel.options.length <= 1) sel.innerHTML = opts;
  });
}

async function redirect(data) {
  if (!data) {
    const { data: profileData, error: rpcErr } = await sb.rpc('get_my_profile');
    data = profileData;
    if (rpcErr) console.error('get_my_profile error:', rpcErr.message);
  }
  if (!data) {
    await sb.auth.signOut();
    const err = document.getElementById('err');
    err.textContent = t('err_no_profile');
    err.classList.remove('hidden');
    document.getElementById('btn').textContent = t('login_btn');
    document.getElementById('btn').disabled = false;
    return;
  }
  const role = data?.role || 'customer';
  const map = {
    staff:'staff.html', store_manager:'staff.html', regional_manager:'staff.html',
    general_manager:'staff.html', superadmin:'staff.html', admin:'staff.html',
    warehouse:'warehouse.html', supplier:'supplier.html', logistics:'logistics.html', customer:'customer.html'
  };
  window.location.href = map[role] || 'customer.html';
}

async function submitForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  const btn = document.getElementById('forgot-btn'), msg = document.getElementById('forgot-msg');
  if (!email) { msg.textContent = t('err_enter_email'); msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  btn.textContent = t('sending'); btn.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  btn.textContent = t('send_reset_link'); btn.disabled = false;
  msg.textContent = error ? t('err_send_failed') + error.message : t('reset_link_sent');
  msg.className = 'text-xs ' + (error ? 'text-red-400' : 'text-green-400');
  msg.classList.remove('hidden');
}

async function submitReset() {
  const pw = document.getElementById('reset-pw').value, pw2 = document.getElementById('reset-pw2').value;
  const btn = document.getElementById('reset-btn'), msg = document.getElementById('reset-msg');
  if (!pw || pw.length < 6) { msg.textContent = t('err_pw_length'); msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  if (pw !== pw2) { msg.textContent = t('err_pw_mismatch'); msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); return; }
  btn.textContent = t('setting_pw'); btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.textContent = t('confirm_set_btn'); btn.disabled = false;
  if (error) { msg.textContent = t('err_set_failed') + error.message; msg.className = 'text-xs text-red-400'; msg.classList.remove('hidden'); }
  else { msg.textContent = t('pw_updated'); msg.className = 'text-xs text-green-400'; msg.classList.remove('hidden'); setTimeout(() => { window.location.hash = ''; redirect(); }, 1500); }
}

let regType = 'staff';
function selectRegType(tt) {
  regType = tt;
  const on  = 'py-3 rounded-lg border-2 border-gd bg-white/10 text-white text-xs font-medium transition';
  const off = 'py-3 rounded-lg border-2 border-white/20 bg-white/5 text-gray-400 text-xs font-medium transition';
  ['staff','supplier','logistics','warehouse'].forEach(type => {
    const b = document.getElementById(`reg-btn-${type}`); if (b) b.className = type===tt ? on : off;
    const f = document.getElementById(`reg-${type}-fields`); if (f) f.classList.toggle('hidden', type!==tt);
  });
}

async function submitReg() {
  const errEl = document.getElementById('reg-err'), btn = document.getElementById('reg-btn-submit');
  errEl.classList.add('hidden');
  let name, phone, email;
  let payload = { type: regType };

  if (regType === 'staff') {
    name  = document.getElementById('reg-name').value.trim();
    phone = document.getElementById('reg-phone').value.trim();
    email = document.getElementById('reg-email').value.trim();
    const storeId = document.getElementById('reg-store')?.value;
    if (!name||!phone||!email) { errEl.textContent=t('err_fill_basic'); errEl.classList.remove('hidden'); return; }
    if (!storeId) { errEl.textContent=t('err_select_store'); errEl.classList.remove('hidden'); return; }
    payload = { ...payload, name, phone, email, store_id: storeId,
      employee_no: document.getElementById('reg-employee-no').value.trim()||null,
      department:  document.getElementById('reg-department').value.trim()||null,
      position_title: document.getElementById('reg-position').value.trim()||null };
  } else if (regType === 'supplier') {
    const company = document.getElementById('reg-company').value.trim();
    name  = document.getElementById('reg-sup-name').value.trim();
    phone = document.getElementById('reg-sup-phone').value.trim();
    email = document.getElementById('reg-sup-email').value.trim();
    if (!company||!name||!phone||!email) { errEl.textContent=t('err_fill_supplier'); errEl.classList.remove('hidden'); return; }
    const checkedPts = [...document.querySelectorAll('.reg-pt-check:checked')].map(el => el.value);
    payload = { ...payload, company_name: company, name, phone, email,
      credit_code: document.getElementById('reg-credit-code').value.trim()||null,
      address:     document.getElementById('reg-address').value.trim()||null,
      products:    checkedPts.length ? checkedPts.join(',') : null };
  } else if (regType === 'logistics') {
    name  = document.getElementById('reg-log-name').value.trim();
    phone = document.getElementById('reg-log-phone').value.trim();
    email = document.getElementById('reg-log-email').value.trim();
    if (!name||!phone||!email) { errEl.textContent=t('err_fill_basic'); errEl.classList.remove('hidden'); return; }
    payload = { ...payload, name, phone, email, company_name: document.getElementById('reg-log-company').value.trim()||null };
  } else {
    name  = document.getElementById('reg-wh-name').value.trim();
    phone = document.getElementById('reg-wh-phone').value.trim();
    email = document.getElementById('reg-wh-email').value.trim();
    const storeId = document.getElementById('reg-wh-store')?.value;
    if (!name||!phone||!email) { errEl.textContent=t('err_fill_basic'); errEl.classList.remove('hidden'); return; }
    if (!storeId) { errEl.textContent=t('err_select_store'); errEl.classList.remove('hidden'); return; }
    payload = { ...payload, name, phone, email, store_id: storeId };
  }

  const pw = document.getElementById('reg-pw').value, pw2 = document.getElementById('reg-pw2').value;
  if (!pw||pw.length<6) { errEl.textContent=t('err_pw_length'); errEl.classList.remove('hidden'); return; }
  if (pw!==pw2) { errEl.textContent=t('err_pw_mismatch'); errEl.classList.remove('hidden'); return; }

  btn.textContent = t('submitting'); btn.disabled = true;

  let userId = null;
  const { data: authData, error: authErr } = await sb.auth.signUp({ email, password: pw, options: { data: { name, role: regType } } });
  if (authErr) {
    const msg = authErr.message || '';
    if (msg.includes('already registered') || msg.includes('already')) {
      // already exists, continue
    } else if (msg.includes('rate limit') || msg.includes('429')) {
      errEl.textContent = t('err_rate_limit'); errEl.classList.remove('hidden'); btn.textContent=t('submit_btn'); btn.disabled=false; return;
    } else if (msg.includes('invalid') && msg.includes('email')) {
      errEl.textContent = t('err_email_format'); errEl.classList.remove('hidden'); btn.textContent=t('submit_btn'); btn.disabled=false; return;
    } else if (msg.includes('Password') || msg.includes('password')) {
      errEl.textContent = t('err_pw_req'); errEl.classList.remove('hidden'); btn.textContent=t('submit_btn'); btn.disabled=false; return;
    } else {
      errEl.textContent = t('err_acc_create_fail') + msg; errEl.classList.remove('hidden'); btn.textContent=t('submit_btn'); btn.disabled=false; return;
    }
  } else {
    userId = authData?.user?.id || null;
  }

  payload.user_id = userId;
  const { error: insErr } = await sb.from('registrations').insert(payload);
  await sb.auth.signOut();

  if (insErr) {
    const imsg = insErr.message || '';
    errEl.textContent = t('err_submit_fail') + imsg;
    errEl.classList.remove('hidden'); btn.textContent=t('submit_btn'); btn.disabled=false; return;
  }

  btn.textContent = t('submit_btn'); btn.disabled = false;
  document.getElementById('reg-panel').innerHTML = `
    <div class="bg-white/5 border border-white/10 rounded-xl p-8 text-center">
      <div class="text-4xl mb-4">✅</div>
      <h2 class="text-white font-bold text-lg mb-3">${t('submitted_title')}</h2>
      <div class="text-left space-y-3 mb-6">
        <div class="flex items-start gap-3"><span class="text-gd font-bold flex-shrink-0">1.</span>
          <p class="text-gray-300 text-sm">${t('submitted_step1')}</p></div>
        <div class="flex items-start gap-3"><span class="text-gd font-bold flex-shrink-0">2.</span>
          <p class="text-gray-300 text-sm">${t('submitted_step2')}</p></div>
      </div>
      <a onclick="showLogin()" class="text-gd cursor-pointer hover:brightness-125 transition text-sm">${t('back_to_login')}</a>
    </div>`;
}
