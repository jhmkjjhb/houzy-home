<style>
  .filter-btn{background:white;color:#6b7280;border:1px solid #e5e7eb}
  .filter-btn.active{background:#1a3a2a;color:white;border-color:#1a3a2a}
  .stage-btn.selected{border-color:#1a3a2a!important;color:#1a3a2a!important;background:rgba(26,58,42,.07)!important;font-weight:500!important}

<body class="bg-gc min-h-screen" style="font-family:Inter,'Noto Sans SC',sans-serif">

<!-- Header -->
<nav class="bg-hg shadow-md no-print">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <img src="/favicon.svg" alt="HOUZY" class="w-7 h-7 rounded-md flex-shrink-0">
      <span class="text-white text-sm hz-serif" style="font-weight:700;letter-spacing:.5px">HOUZY HOME</span>
    </a>
    <div class="flex items-center gap-3">
      <div class="relative">
        <button onclick="toggleLangDrop()" class="flex items-center gap-1 text-gd hover:text-white text-xs border border-white/20 px-2 py-1 rounded">
          🌐 <span id="lang-label">简体中文</span>
        </button>
        <div id="lang-drop" class="hidden absolute right-0 top-full mt-1 bg-white rounded-lg shadow-xl py-1 overflow-hidden min-w-[140px] z-50">
          <button onclick="setLang('en')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">English</button>
          <button onclick="setLang('zh-CN')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">简体中文</button>
          <button onclick="setLang('zh-TW')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">繁體中文</button>
          <button onclick="setLang('ms')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">Bahasa Melayu</button>
          <button onclick="setLang('th')" class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 text-gray-700">ภาษาไทย</button>
        </div>
      </div>
      <span id="sup-name" class="text-gd text-sm"></span>
      <button onclick="logout()" class="text-gray-400 hover:text-white text-xs border border-white/20 px-3 py-1 rounded" data-i18n="logout">退出</button>
    </div>
  </div>
</nav>

<!-- Orders list -->
<div id="v-orders" class="max-w-3xl mx-auto px-4 py-6 no-print">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-lg font-bold text-gray-800" data-i18n="page_title">我的订单</h1>
    <span id="order-count" class="text-sm text-gray-400"></span>
  </div>

  <!-- Urgent banner for pending orders -->
  <div id="alert-banner" class="hidden mb-4"></div>

  <!-- Filter tabs -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
    <button class="filter-btn active px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('',this)" data-i18n="filter_all">全部</button>
    <button id="btn-assigned" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('__pending__',this)" data-i18n="filter_pending">待接单</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('in_production',this)" data-i18n="filter_producing">生产中</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('production_complete',this)" data-i18n="filter_ready">待发货</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('shipped',this)" data-i18n="filter_shipped">已发货</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('completed',this)" data-i18n="filter_completed">已完成</button>
  </div>

  <div id="orders-list"></div>
</div>

<!-- Order detail -->
<div id="v-detail" class="hidden max-w-3xl mx-auto px-4 py-6 no-print">
  <div class="flex items-center gap-3 mb-5">
    <button onclick="show('v-orders')" class="text-gray-400 hover:text-gray-600" data-i18n="back">← 返回</button>
    <h1 class="text-lg font-bold text-gray-800" data-i18n="detail_title">订单详情</h1>
    <button onclick="printTaskSheet()" class="ml-auto text-xs border border-gray-200 px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-50" data-i18n="print_btn">打印任务单</button>
  </div>
  <div id="detail-content"></div>
</div>

<!-- Print view (only visible when printing) -->
<div id="v-print" class="hidden p-8" style="max-width:720px;margin:0 auto">
  <div id="print-content"></div>
</div>

function badge(s) {

  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${x.cls}">${stLabel(s)}</span>`;
}
function maskPhone(p) {
  if (!p) return '-';
  const s = String(p);
  return s.length >= 7 ? s.slice(0,3) + '****' + s.slice(-4) : s;
}
// Escape DB text before interpolating into innerHTML (prevent XSS)
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
}
function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function init() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  profile = await sb.rpc('get_my_profile').then(r => r.data);
  if (!profile || profile.role !== 'supplier') {
    alert(t('no_permission')); window.location.href = 'login.html'; return;
  }

  const {data:sup} = await sb.from('suppliers').select('*').eq('user_id', profile.id).single();
  supplier = sup;
  document.getElementById('sup-name').textContent = supplier?.name || profile.name;
  await loadOrders();
}

let _myPendingOrderIds = new Set();   // 分给我、且我还有未接单(pending)商品的订单
let _mySubByOrder = {};               // 本厂家在每单的子状态：pending/producing/ready/shipped/arrived
function isMinePending(o) { return _myPendingOrderIds.has(o?.id); }
function mySubFor(oid) { return _mySubByOrder[oid] || null; }
// 从本厂家在某单的商品状态推断子状态(最慢项)
function _mySubFromItems(arr) {
  const sts = (arr||[]).map(i => i.item_status || 'pending');
  if (!sts.length) return null;
  if (sts.some(s => s==='pending'))       return 'pending';
  if (sts.some(s => s==='in_production')) return 'producing';
  if (sts.some(s => s==='ready'))         return 'ready';
  if (sts.every(s => ['arrived','damaged','completed'].includes(s))) return 'arrived';
  return 'shipped';
}

async function loadOrders() {
  const {data:items} = await sb.from('order_items')
    .select('order_id,item_status').eq('supplier_id', supplier?.id);

  _myPendingOrderIds = new Set(
    (items||[]).filter(i => !i.item_status || i.item_status === 'pending')
               .map(i => i.order_id).filter(Boolean));
  // 按订单分组算本厂家子状态
  const byOid = {};
  (items||[]).forEach(it => { (byOid[it.order_id] = byOid[it.order_id] || []).push(it); });
  _mySubByOrder = {};
  Object.entries(byOid).forEach(([oid, arr]) => { _mySubByOrder[oid] = _mySubFromItems(arr); });
  const itemOrderIds = (items||[]).map(i => i.order_id).filter(Boolean);
  const supId = supplier?.id;

  let q = sb.from('orders')
    .select('*, stores(name), customers(name,phone)')
    .order('created_at', {ascending:false});

  if (itemOrderIds.length && supId)   q = q.or(`id.in.(${itemOrderIds.join(',')}),supplier_id.eq.${supId}`);
  else if (itemOrderIds.length)       q = q.in('id', itemOrderIds);
  else if (supId)                     q = q.eq('supplier_id', supId);
  else { loadError = null; allOrders = []; renderOrders(); return; }

  const {data, error} = await q;
  // Fail loud: surface query errors (e.g. RLS denial) instead of an empty state
  loadError = error || null;
  if (error) console.error('[supplier loadOrders]', error.message);
  allOrders = data || [];
  renderOrders();
}

function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  // Update "待接单" badge count
  // 待接单 = 我还有 pending 商品的单（不管订单总状态，乙方案多厂家子状态）
  const assignedOrders = allOrders.filter(o => isMinePending(o) || !SUPPLIER_CONFIRMED.includes(o.status));
  const btnAssigned = document.getElementById('btn-assigned');
  if (btnAssigned) {
    btnAssigned.innerHTML = assignedOrders.length
      ? `${t('filter_pending')} <span class="inline-flex items-center justify-center w-4 h-4 text-xs rounded-full bg-orange-500 text-white ml-1">${assignedOrders.length}</span>`
      : t('filter_pending');
  }

  // Alert banner
  const banner = document.getElementById('alert-banner');
  if (assignedOrders.length && !currentFilter) {
    banner.classList.remove('hidden');
    banner.innerHTML = `<div class="bg-orange-50 border border-orange-200 rounded-xl p-3 flex items-center gap-3">
      <span class="text-2xl">⏳</span>
      <div class="flex-1">
        <p class="text-sm font-medium text-orange-700">${t('pending_alert').replace('{n}', assignedOrders.length)}</p>
        <p class="text-xs text-orange-500 mt-0.5">${t('pending_alert_sub')}</p>
      </div>
      <button onclick="setFilter('__pending__',document.getElementById('btn-assigned'))"
              class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg whitespace-nowrap">${t('goto_now')}</button>
    </div>`;
  } else {
    banner.classList.add('hidden');
  }

  const filtered = currentFilter === '__pending__'
    ? allOrders.filter(o => isMinePending(o) || !SUPPLIER_CONFIRMED.includes(o.status))
    : currentFilter
      ? allOrders.filter(o => !isMinePending(o) && o.status === currentFilter)
      : allOrders;

  const el = document.getElementById('orders-list');

  // Fail loud: distinct visible error (RLS denial ≠ genuinely empty)
  if (loadError) {
    document.getElementById('order-count').textContent = '';
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="text-red-600 font-medium">${t('err_load')}</p>
      <p class="text-gray-400 text-sm mt-1">${esc(loadError.message || t('err_load_hint'))}</p>
    </div>`;
    return;
  }

  document.getElementById('order-count').textContent = `${t('count_pfx')}${filtered.length}${t('count_sfx')}`;

  if (!filtered.length) {
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">📦</div>
      <p class="text-gray-400">${t('no_orders')}</p>
    </div>`;
    return;
  }

  if (!currentFilter) {
    // Grouped kanban view
    const groups = [
      {statuses:['assigned','paid','pending_payment'], label:t('filter_pending')},
      {statuses:['accepted'],                          label:t('st_accepted')},
      {statuses:['in_production'],                     label:t('filter_producing')},
      {statuses:['production_complete'],               label:t('filter_ready')},
      {statuses:['shipped','in_transit'],              label:t('filter_shipped')},
      {statuses:['arrived','installing','completed'],  label:t('filter_completed')},
    ];
    const shown = new Set();
    let html = '';
    const _subToLabel = { pending:t('filter_pending'), producing:t('filter_producing'), ready:t('filter_ready'), shipped:t('filter_shipped'), arrived:t('filter_completed') };
    for (const g of groups) {
      // 互斥分组：本厂家在该单的子状态决定它进哪一组(不看订单总状态)
      const gOrders = filtered.filter(o => {
        const sub = mySubFor(o.id);
        if (sub) return _subToLabel[sub] === g.label;
        return g.statuses.includes(o.status);  // 无本厂家商品时按全局兜底
      });
      if (!gOrders.length) continue;
      gOrders.forEach(o => shown.add(o.id));
      html += `<div class="mb-5">
        <div class="flex items-center gap-2 mb-2">
          <div class="h-px flex-1 bg-gray-200"></div>
          <span class="text-xs font-semibold text-gray-400 px-2 tracking-wide">${g.label}（${gOrders.length}）</span>
          <div class="h-px flex-1 bg-gray-200"></div>
        </div>
        ${gOrders.map(o => orderCard(o)).join('')}
      </div>`;
    }
    // Catch-all for unlisted statuses
    filtered.filter(o => !shown.has(o.id)).forEach(o => { html += orderCard(o); });
    el.innerHTML = html;
  } else {
    el.innerHTML = filtered.map(o => orderCard(o)).join('');
  }
}

function orderCard(o) {
  const st = o.status;
  const minePending = isMinePending(o);
  const sub = mySubFor(o.id);
  let actionBtns = `<button onclick="openDetail('${o.id}')"
    class="px-3 py-1.5 text-xs border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">${t('btn_detail')}</button>`;

  // 按本厂家子状态决定动作按钮（多厂家互不影响）
  if (sub === 'pending' || (!sub && (minePending || !SUPPLIER_CONFIRMED.includes(st)))) {
    actionBtns += `
      <button onclick="rejectOrder(event,'${o.id}')"
              class="px-3 py-1.5 text-xs border border-red-200 rounded-lg text-red-500 hover:bg-red-50">${t('btn_reject')}</button>
      <button onclick="acceptOrder(event,'${o.id}')"
              class="px-3 py-1.5 text-xs bg-orange-500 text-white rounded-lg hover:bg-orange-600 font-medium">${t('btn_accept')}</button>`;

    actionBtns = `<button onclick="openDetail('${o.id}')"
      class="px-3 py-1.5 text-xs bg-hg text-white rounded-lg hover:bg-gg">${t('btn_update_progress')}</button>`;

    actionBtns = `<button onclick="openDetail('${o.id}')"
      class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">${t('btn_fill_ship')}</button>`;
  } else if (!sub && st === 'accepted') {
    actionBtns += `<button onclick="quickStartProd(event,'${o.id}')"
      class="px-3 py-1.5 text-xs bg-violet-600 text-white rounded-lg hover:bg-violet-700">${t('btn_start_prod')}</button>`;
  }

  return `
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-3">
    <div class="flex items-start justify-between mb-3">
      <div>
        <div class="font-mono font-bold text-hg text-sm">${esc(o.order_no)}</div>
        <div class="text-gray-400 text-xs mt-0.5">${esc(o.stores?.name)||'-'} · ${fmtDate(o.created_at)}</div>
      </div>
      ${minePending ? `<span class="text-xs px-2 py-0.5 rounded-full font-medium bg-orange-100 text-orange-700">${t('filter_pending')}</span>` : badge(o.status)}
    </div>
    ${o.description ? `<p class="text-sm text-gray-600 mb-3 line-clamp-2">${esc(o.description)}</p>` : ''}
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">${esc(o.customers?.name)}</span>
      <div class="flex gap-2">${actionBtns}</div>
    </div>
  </div>`;
}

// ── Quick actions from card ──────────────────────────────────────────

// 乙·多厂家：只接"我自己的"商品(pending→in_production)，不碰别的厂家；
// 订单总状态绝不回退，仅当还在接单前阶段才推进到 in_production
// 走 SECURITY DEFINER 函数：供应商对 order_items 无 UPDATE 权限，直接改会被
// RLS 静默拒绝。函数内部校验是本厂家、只动自己的 pending 商品、不回退总状态、写日志。
async function _acceptMyItems(orderId, notes) {
  const { data, error } = await sb.rpc('supplier_accept_order', { p_order_id: orderId });
  if (error) { alert(t('err_accept_fail') + error.message); return false; }
  if (!data || !data.ok) { alert(t('err_no_accept') + (data?.message || t('err_unknown_reason'))); return false; }
  const n = (notes || '').trim();
  if (n) {
    await sb.from('order_logs').insert({
      order_id: orderId, status: 'in_production',
      operator_id: profile.id, operator_role: 'supplier',
      operator_name: supplier?.name || profile.name,
      notes: t('accept_log_pfx') + n,
    });
  }
  alert(t('ok_accepted').replace('{n}', data.count || 0));
  return true;
}

async function acceptOrder(e, orderId) {
  e.stopPropagation();
  const notes = prompt(t('prompt_accept_notes'));
  if (notes === null) return;
  if (await _acceptMyItems(orderId, notes)) await loadOrders();
}

async function rejectOrder(e, orderId) {
  e.stopPropagation();
  const reason = prompt(t('prompt_reject_reason'));
  if (reason === null) return;
  if (!reason.trim()) { alert(t('err_reason_empty')); return; }
  const { data, error } = await sb.rpc('supplier_reject_order',
    { p_order_id: orderId, p_reason: reason.trim() });
  if (error) { alert(t('err_reject_fail') + error.message); return; }
  if (!data || !data.ok) { alert(t('err_no_reject') + (data?.message || t('err_unknown_reason'))); return; }
  alert(t('ok_rejected').replace('{n}', data.count));
  await loadOrders();
}

async function quickStartProd(e, orderId) {
  e.stopPropagation();
  const notes = prompt(t('prompt_start_notes'));
  if (notes === null) return;
  await sb.from('orders').update({status:'in_production'}).eq('id', orderId);
  await sb.from('order_logs').insert({
    order_id:orderId, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: notes||t('log_start_default'),
  });
  await loadOrders();
}

        </div>

      </div>

        ${o.ship_carrier?`<div class="flex justify-between py-2"><span class="text-gray-400">物流公司</span><span class="font-medium">${esc(o.ship_carrier)}</span></div>`:''}
        ${o.tracking_no?`<div class="flex justify-between py-2"><span class="text-gray-400">物流单号</span><span class="font-mono font-medium text-orange-600">${esc(o.tracking_no)}</span></div>`:''}
        ${o.description?`<div class="pt-2"><span class="text-gray-400">描述</span><p class="mt-1 text-gray-600">${esc(o.description)}</p></div>`:''}

      </div>
    </div>

    ${itemsHtml}

    ${drawingHtml}

    ${childOrdersCard}


    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
      <h3 class="font-semibold text-gray-800 mb-4">进度日志</h3>

// ── Detail action handlers ────────────────────────────────────────────

function selectStage(btn) {
  document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function detailAccept(id) {
  const notes = document.getElementById('accept-notes')?.value.trim();
  if (await _acceptMyItems(id, notes)) { await loadOrders(); openDetail(id); }
}

async function detailReject(id) {
  const reason = prompt('请填写拒绝原因（必填）：');
  if (reason === null) return;
  if (!reason.trim()) { alert('拒绝原因不能为空'); return; }
  const { data, error } = await sb.rpc('supplier_reject_order',
    { p_order_id: id, p_reason: reason.trim() });
  if (error) { alert('拒单失败：' + error.message); return; }
  if (!data || !data.ok) { alert('未拒单：' + (data?.message || '未知')); return; }
  alert('✅ 已拒接 ' + data.count + ' 件，已退回店面');
  show('v-orders');
  await loadOrders();
}

async function detailStartProd(id) {
  const notes = document.getElementById('start-notes')?.value.trim();
  await sb.from('orders').update({status:'in_production'}).eq('id', id);
  sb.from('orders').update({prod_stage:null}).eq('id', id).catch(()=>{});
  await sb.from('order_logs').insert({
    order_id:id, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: notes||'已开始生产',
  });
  await loadOrders();
  openDetail(id);
}

// 图纸硬卡：三方未齐不能推进生产
async function _drawingGate(orderId) {
  const { data, error } = await sb.rpc('drawing_ready',
    { p_order_id: orderId, p_supplier_id: supplier?.id });
  if (error) { alert('图纸状态校验失败：' + error.message); return false; }
  if (!data) { alert('⚠ 图纸三方未确认齐（客户 / 运营 / 厂家）。\n请先在上方「图纸三方确认」上传图纸并三方都确认，才能进生产加工/完成。'); return false; }
  return true;
}
async function supDrawingUpload(orderId) {
  const url = document.getElementById('sup-dwg-url')?.value?.trim();
  if (!url) { alert('请先填写图纸链接'); return; }
  const { data, error } = await sb.rpc('drawing_upload',
    { p_order_id: orderId, p_supplier_id: supplier?.id, p_url: url });
  if (error) { alert('上传失败：' + error.message); return; }
  if (!data?.ok) { alert(data?.message || '上传失败'); return; }
  alert('✅ 图纸已上传 v' + data.version + (data.version>1?'（三方确认作废，需重新确认）':''));
  openDetail(orderId);
}
async function supDrawingConfirm(orderId) {
  if (!confirm('确认本版图纸是即将投产的最终版？\n厂家将依此图纸开始/继续生产，过程中不再变更。')) return;
  const { data, error } = await sb.rpc('drawing_confirm',
    { p_order_id: orderId, p_supplier_id: supplier?.id });
  if (error) { alert('确认失败：' + error.message); return; }
  if (!data?.ok) { alert(data?.message || '确认失败'); return; }
  alert('✅ 厂家已确认图纸');
  openDetail(orderId);
}

async function updateProdProgress(id) {
  const selectedBtn = document.querySelector('.stage-btn.selected');
  const stageLabel  = selectedBtn?.dataset.label;
  const notes = document.getElementById('prod-notes')?.value.trim();

  if (!stageLabel && !notes) { alert('请选择生产阶段或填写备注'); return; }
  if (!(await _drawingGate(id))) return;   // 三方未齐硬卡

  const updateBtn = document.querySelector(`button[onclick="updateProdProgress('${id}')"]`);
  if (updateBtn) { updateBtn.disabled = true; updateBtn.textContent = '提交中...'; }

  const stageKey = selectedBtn?.dataset.key || null;
  const logNotes = [stageLabel?`【${stageLabel}】`:null, notes||null].filter(Boolean).join(' ');
  if (stageKey) await sb.from('orders').update({ prod_stage: stageKey }).eq('id', id);
  await sb.from('order_logs').insert({
    order_id:id, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: logNotes,
  });

  // Lock the entire progress form after successful submission
  document.querySelectorAll('.stage-btn').forEach(b => {
    b.disabled = true;
    b.classList.add('opacity-40', 'cursor-not-allowed');
  });
  const notesEl = document.getElementById('prod-notes');
  if (notesEl) { notesEl.disabled = true; notesEl.classList.add('bg-gray-50', 'text-gray-400'); }
  if (updateBtn) {
    updateBtn.disabled = true;
    updateBtn.textContent = '✅ 已提交';
    updateBtn.className = 'py-2.5 border border-gray-300 text-gray-400 font-medium rounded-lg text-sm cursor-not-allowed';
  }
  const msg = document.getElementById('prod-msg');
  if (msg) { msg.textContent = '✅ 进度已更新，运营团队将同步收到'; msg.classList.remove('hidden'); }
}

async function markProdComplete(id) {
  const btn = document.querySelector(`button[onclick="markProdComplete('${id}')"]`);
  if (!btn) return;
  if (!btn.dataset.confirming && !(await _drawingGate(id))) return;   // 三方未齐硬卡

  // 第一次点击：变成确认状态
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ 再次点击确认完成';
    btn.className = 'py-2.5 bg-amber-500 text-white font-semibold rounded-lg text-sm';
    setTimeout(() => {
      if (btn.dataset.confirming) {
        btn.dataset.confirming = '';
        btn.textContent = '✓ 生产完成';
        btn.className = 'py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg text-sm';
      }
    }, 4000);
    return;
  }

  // 第二次点击：执行
  btn.disabled = true;
  btn.textContent = '提交中...';
  btn.dataset.confirming = '';

  // 乙·Phase A：只标记本厂家的商品 ready，不再写全局 orders.status；
  // 服务端函数兜底权限+只动本厂家。
  const { data, error } = await sb.rpc('supplier_mark_ready', { p_order_id: id });
  if (error || !data || !data.ok) {
    alert('操作失败：' + (error?.message || data?.message || '未知错误'));
    btn.disabled = false;
    btn.textContent = '✓ 生产完成';
    btn.className = 'py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg text-sm';
    return;
  }
  alert('✅ 本厂家 '+ data.count +' 件商品已标记生产完成');
  await loadOrders();
  openDetail(id);
}

async function submitShipping(id) {
  const method   = document.getElementById('ship-method')?.value;
  const companySel = document.getElementById('ship-company')?.value;
  const companyCustom = document.getElementById('ship-company-custom')?.value.trim();
  const company  = companySel === '其他' ? (companyCustom || '其他') : companySel;
  const tracking = document.getElementById('ship-tracking')?.value.trim();
  const notes    = document.getElementById('ship-notes')?.value.trim();

  if (!method)   { alert('请选择运输方式'); return; }
  if (!company)  { alert('请选择物流公司'); return; }
  if (!tracking) { alert('请填写物流单号'); return; }

  const btn = document.querySelector(`button[onclick="submitShipping('${id}')"]`);
  if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }

  // 乙·Phase A：只发本厂家的商品 (ready→shipped) + 写本厂家物流；
  // 全单是否进"已发货"由服务端按全部商品聚合决定，不会带飞别的厂家。
  const { data, error } = await sb.rpc('supplier_ship_items', {
    p_order_id: id,
    p_carrier: company,
    p_tracking_no: tracking,
    p_method: method,
    p_notes: notes || null,
  });
  if (error || !data || !data.ok) {
    alert(t('err_ship_fail2') + (error?.message || data?.message || t('err_unknown_error')));
    if (btn) { btn.disabled = false; btn.textContent = t('confirm_ship_btn'); }
    return;
  }
  alert(t('ok_ship_done').replace('{n}', data.count) +
        (data.order_advanced ? t('ok_all_shipped') : ''));
  const msg = document.getElementById('ship-msg');
  if (msg) msg.classList.remove('hidden');
  setTimeout(async () => { await loadOrders(); openDetail(id); }, 600);
}
