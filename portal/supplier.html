<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUZY HOME — 厂家门户</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{'hg':'#1a3a2a','gg':'#2d5e43','gd':'#c8a96e','gc':'#f5f2ed'}}}}</script>
<style>
  .filter-btn{background:white;color:#6b7280;border:1px solid #e5e7eb}
  .filter-btn.active{background:#1a3a2a;color:white;border-color:#1a3a2a}
  .stage-btn.selected{border-color:#1a3a2a!important;color:#1a3a2a!important;background:rgba(26,58,42,.07)!important;font-weight:500!important}
  @media print{
    .no-print{display:none!important}
    #v-orders,#v-detail{display:none!important}
    #v-print{display:block!important}
    body{background:white}
  }
</style>
</head>
<body class="bg-gc min-h-screen" style="font-family:'Noto Sans SC',sans-serif">

<!-- Header -->
<nav class="bg-hg shadow-md no-print">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <div class="w-7 h-7 bg-gd flex items-center justify-center text-hg font-bold text-sm">H</div>
      <span class="text-white font-semibold text-sm">HOUZY HOME</span>
    </a>
    <div class="flex items-center gap-4">
      <span id="sup-name" class="text-gd text-sm"></span>
      <button onclick="logout()" class="text-gray-400 hover:text-white text-xs border border-white/20 px-3 py-1 rounded">退出</button>
    </div>
  </div>
</nav>

<!-- Orders list -->
<div id="v-orders" class="max-w-3xl mx-auto px-4 py-6 no-print">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-lg font-bold text-gray-800">我的订单</h1>
    <span id="order-count" class="text-sm text-gray-400"></span>
  </div>

  <!-- Urgent banner for pending orders -->
  <div id="alert-banner" class="hidden mb-4"></div>

  <!-- Filter tabs -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
    <button class="filter-btn active px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('',this)">全部</button>
    <button id="btn-assigned" class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('__pending__',this)">待接单</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('in_production',this)">生产中</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('production_complete',this)">待发货</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('shipped',this)">已发货</button>
    <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap" onclick="setFilter('completed',this)">已完成</button>
  </div>

  <div id="orders-list"></div>
</div>

<!-- Order detail -->
<div id="v-detail" class="hidden max-w-3xl mx-auto px-4 py-6 no-print">
  <div class="flex items-center gap-3 mb-5">
    <button onclick="show('v-orders')" class="text-gray-400 hover:text-gray-600">← 返回</button>
    <h1 class="text-lg font-bold text-gray-800">订单详情</h1>
    <button onclick="printTaskSheet()" class="ml-auto text-xs border border-gray-200 px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-50">🖨 打印任务单</button>
  </div>
  <div id="detail-content"></div>
</div>

<!-- Print view (only visible when printing) -->
<div id="v-print" class="hidden p-8" style="max-width:720px;margin:0 auto">
  <div id="print-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://csabbxiijzghooppayae.supabase.co';
const SB_KEY = 'sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH';
const sb = supabase.createClient(SB_URL, SB_KEY);

let profile = null, supplier = null, allOrders = [], currentFilter = '', currentDetailData = null, loadError = null;

const STATUS = {
  pending_payment:    {label:'待支付',   cls:'bg-yellow-100 text-yellow-700'},
  paid:               {label:'已支付',   cls:'bg-blue-100 text-blue-700'},
  assigned:           {label:'待接单',   cls:'bg-orange-100 text-orange-700'},
  accepted:           {label:'已接单',   cls:'bg-violet-100 text-violet-700'},
  in_production:      {label:'生产中',   cls:'bg-violet-200 text-violet-800'},
  production_complete:{label:'生产完成', cls:'bg-indigo-100 text-indigo-700'},
  shipped:            {label:'已发货',   cls:'bg-orange-100 text-orange-700'},
  in_transit:         {label:'运输中',   cls:'bg-orange-100 text-orange-700'},
  arrived:            {label:'已到货',   cls:'bg-teal-100 text-teal-700'},
  installing:         {label:'安装中',   cls:'bg-teal-100 text-teal-700'},
  completed:          {label:'已完成',   cls:'bg-green-100 text-green-700'},
  after_sales:        {label:'售后中',   cls:'bg-red-100 text-red-700'},
  closed:             {label:'已关闭',   cls:'bg-gray-100 text-gray-500'},
};

const LOGISTICS_MY = ['J&T Express','Ninja Van','Pos Laju','DHL Malaysia','FedEx Malaysia','GDex','Teleport'];
const LOGISTICS_SEA = ['COSCO 中远','Evergreen 长荣','Maersk 马士基','PIL','ONE','骐盛国际物流'];
const LOGISTICS_CN  = ['顺丰速运','德邦物流','京东物流','圆通速递','中通快递','韵达快递','申通快递','百世快递'];
const LOGISTICS = [...LOGISTICS_MY, ...LOGISTICS_SEA, ...LOGISTICS_CN, '其他'];

const PROD_STAGES = [
  {key:'drawing',   label:'图纸确认'},
  {key:'material',  label:'材料采购'},
  {key:'producing', label:'生产加工'},
  {key:'qc',        label:'质检中'},
];

const SUPPLIER_CONFIRMED = ['accepted','in_production','production_complete','shipped','in_transit','arrived','installing','completed','after_sales','closed'];

function badge(s) {
  const x = STATUS[s] || {label:s, cls:'bg-gray-100 text-gray-500'};
  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${x.cls}">${x.label}</span>`;
}
function maskPhone(p) {
  if (!p) return '-';
  const s = String(p);
  return s.length >= 7 ? s.slice(0,3) + '****' + s.slice(-4) : s;
}
// Escape DB text before interpolating into innerHTML (prevent XSS)
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
}
function fmtDateTime(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? '-' : dt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function show(id) {
  ['v-orders','v-detail'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
}

async function init() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  profile = await sb.rpc('get_my_profile').then(r => r.data);
  if (!profile || profile.role !== 'supplier') {
    alert('权限不足'); window.location.href = 'login.html'; return;
  }

  const {data:sup} = await sb.from('suppliers').select('*').eq('user_id', profile.id).single();
  supplier = sup;
  document.getElementById('sup-name').textContent = supplier?.name || profile.name;
  await loadOrders();
}

let _myPendingOrderIds = new Set();   // 分给我、且我还有未接单(pending)商品的订单
function isMinePending(o) { return _myPendingOrderIds.has(o?.id); }

async function loadOrders() {
  const {data:items} = await sb.from('order_items')
    .select('order_id,item_status').eq('supplier_id', supplier?.id);

  _myPendingOrderIds = new Set(
    (items||[]).filter(i => !i.item_status || i.item_status === 'pending')
               .map(i => i.order_id).filter(Boolean));
  const itemOrderIds = (items||[]).map(i => i.order_id).filter(Boolean);
  const supId = supplier?.id;

  let q = sb.from('orders')
    .select('*, stores(name), customers(name,phone)')
    .order('created_at', {ascending:false});

  if (itemOrderIds.length && supId)   q = q.or(`id.in.(${itemOrderIds.join(',')}),supplier_id.eq.${supId}`);
  else if (itemOrderIds.length)       q = q.in('id', itemOrderIds);
  else if (supId)                     q = q.eq('supplier_id', supId);
  else { loadError = null; allOrders = []; renderOrders(); return; }

  const {data, error} = await q;
  // Fail loud: surface query errors (e.g. RLS denial) instead of an empty state
  loadError = error || null;
  if (error) console.error('[supplier loadOrders]', error.message);
  allOrders = data || [];
  renderOrders();
}

function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  // Update "待接单" badge count
  // 待接单 = 我还有 pending 商品的单（不管订单总状态，乙方案多厂家子状态）
  const assignedOrders = allOrders.filter(o => isMinePending(o) || !SUPPLIER_CONFIRMED.includes(o.status));
  const btnAssigned = document.getElementById('btn-assigned');
  if (btnAssigned) {
    btnAssigned.innerHTML = assignedOrders.length
      ? `待接单 <span class="inline-flex items-center justify-center w-4 h-4 text-xs rounded-full bg-orange-500 text-white ml-1">${assignedOrders.length}</span>`
      : '待接单';
  }

  // Alert banner
  const banner = document.getElementById('alert-banner');
  if (assignedOrders.length && !currentFilter) {
    banner.classList.remove('hidden');
    banner.innerHTML = `<div class="bg-orange-50 border border-orange-200 rounded-xl p-3 flex items-center gap-3">
      <span class="text-2xl">⏳</span>
      <div class="flex-1">
        <p class="text-sm font-medium text-orange-700">有 ${assignedOrders.length} 笔订单待接单</p>
        <p class="text-xs text-orange-500 mt-0.5">请尽快确认，超时将通知店长重新分配</p>
      </div>
      <button onclick="setFilter('__pending__',document.getElementById('btn-assigned'))"
              class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg whitespace-nowrap">立即查看</button>
    </div>`;
  } else {
    banner.classList.add('hidden');
  }

  const filtered = currentFilter === '__pending__'
    ? allOrders.filter(o => isMinePending(o) || !SUPPLIER_CONFIRMED.includes(o.status))
    : currentFilter
      ? allOrders.filter(o => !isMinePending(o) && o.status === currentFilter)
      : allOrders;

  const el = document.getElementById('orders-list');

  // Fail loud: distinct visible error (RLS denial ≠ genuinely empty)
  if (loadError) {
    document.getElementById('order-count').textContent = '';
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="text-red-600 font-medium">订单加载失败</p>
      <p class="text-gray-400 text-sm mt-1">${esc(loadError.message || '可能是权限不足，请联系管理员')}</p>
    </div>`;
    return;
  }

  document.getElementById('order-count').textContent = `共 ${filtered.length} 条`;

  if (!filtered.length) {
    el.innerHTML = `<div class="text-center py-16">
      <div class="text-4xl mb-3">📦</div>
      <p class="text-gray-400">暂无相关订单</p>
    </div>`;
    return;
  }

  if (!currentFilter) {
    // Grouped kanban view
    const groups = [
      {statuses:['assigned','paid','pending_payment'], label:'待接单'},
      {statuses:['accepted'],                          label:'已接单'},
      {statuses:['in_production'],                     label:'生产中'},
      {statuses:['production_complete'],               label:'待发货'},
      {statuses:['shipped','in_transit'],              label:'已发货'},
      {statuses:['arrived','installing','completed'],  label:'已完成'},
    ];
    const shown = new Set();
    let html = '';
    for (const g of groups) {
      // 我还有 pending 商品的单只进「待接单」组（多厂家子状态：互斥分组）
      const gOrders = filtered.filter(o => isMinePending(o)
        ? g.label === '待接单'
        : g.statuses.includes(o.status));
      if (!gOrders.length) continue;
      gOrders.forEach(o => shown.add(o.id));
      html += `<div class="mb-5">
        <div class="flex items-center gap-2 mb-2">
          <div class="h-px flex-1 bg-gray-200"></div>
          <span class="text-xs font-semibold text-gray-400 px-2 tracking-wide">${g.label}（${gOrders.length}）</span>
          <div class="h-px flex-1 bg-gray-200"></div>
        </div>
        ${gOrders.map(o => orderCard(o)).join('')}
      </div>`;
    }
    // Catch-all for unlisted statuses
    filtered.filter(o => !shown.has(o.id)).forEach(o => { html += orderCard(o); });
    el.innerHTML = html;
  } else {
    el.innerHTML = filtered.map(o => orderCard(o)).join('');
  }
}

function orderCard(o) {
  const st = o.status;
  const minePending = isMinePending(o);
  let actionBtns = `<button onclick="openDetail('${o.id}')"
    class="px-3 py-1.5 text-xs border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">详情</button>`;

  if (minePending || !SUPPLIER_CONFIRMED.includes(st)) {
    actionBtns += `
      <button onclick="rejectOrder(event,'${o.id}')"
              class="px-3 py-1.5 text-xs border border-red-200 rounded-lg text-red-500 hover:bg-red-50">拒绝</button>
      <button onclick="acceptOrder(event,'${o.id}')"
              class="px-3 py-1.5 text-xs bg-orange-500 text-white rounded-lg hover:bg-orange-600 font-medium">接单</button>`;
  } else if (st === 'accepted') {
    actionBtns += `<button onclick="quickStartProd(event,'${o.id}')"
      class="px-3 py-1.5 text-xs bg-violet-600 text-white rounded-lg hover:bg-violet-700">→ 开始生产</button>`;
  } else if (st === 'in_production') {
    actionBtns = `<button onclick="openDetail('${o.id}')"
      class="px-3 py-1.5 text-xs bg-hg text-white rounded-lg hover:bg-gg">更新进度</button>`;
  } else if (st === 'production_complete') {
    actionBtns = `<button onclick="openDetail('${o.id}')"
      class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">📦 填写发货</button>`;
  }

  return `
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-3">
    <div class="flex items-start justify-between mb-3">
      <div>
        <div class="font-mono font-bold text-hg text-sm">${esc(o.order_no)}</div>
        <div class="text-gray-400 text-xs mt-0.5">${esc(o.stores?.name)||'-'} · ${fmtDate(o.created_at)}</div>
      </div>
      ${minePending ? `<span class="text-xs px-2 py-0.5 rounded-full font-medium bg-orange-100 text-orange-700">待接单</span>` : badge(o.status)}
    </div>
    ${o.description ? `<p class="text-sm text-gray-600 mb-3 line-clamp-2">${esc(o.description)}</p>` : ''}
    <div class="flex items-center justify-between">
      <span class="text-xs text-gray-400">${esc(o.customers?.name)}</span>
      <div class="flex gap-2">${actionBtns}</div>
    </div>
  </div>`;
}

// ── Quick actions from card ──────────────────────────────────────────

// 乙·多厂家：只接"我自己的"商品(pending→in_production)，不碰别的厂家；
// 订单总状态绝不回退，仅当还在接单前阶段才推进到 in_production
// 走 SECURITY DEFINER 函数：供应商对 order_items 无 UPDATE 权限，直接改会被
// RLS 静默拒绝。函数内部校验是本厂家、只动自己的 pending 商品、不回退总状态、写日志。
async function _acceptMyItems(orderId, notes) {
  const { data, error } = await sb.rpc('supplier_accept_order', { p_order_id: orderId });
  if (error) { alert('接单失败：' + error.message); return false; }
  if (!data || !data.ok) { alert('未接单：' + (data?.message || '未知原因')); return false; }
  const n = (notes || '').trim();
  if (n) {
    await sb.from('order_logs').insert({
      order_id: orderId, status: 'in_production',
      operator_id: profile.id, operator_role: 'supplier',
      operator_name: supplier?.name || profile.name,
      notes: '接单备注：' + n,
    });
  }
  alert('✅ 已接单：' + (data.count || 0) + ' 件商品进入生产');
  return true;
}

async function acceptOrder(e, orderId) {
  e.stopPropagation();
  const notes = prompt('接单备注（可选，如：预计X个工作日完成）：');
  if (notes === null) return;
  if (await _acceptMyItems(orderId, notes)) await loadOrders();
}

async function rejectOrder(e, orderId) {
  e.stopPropagation();
  const reason = prompt('请填写拒绝原因（必填）：');
  if (reason === null) return;
  if (!reason.trim()) { alert('拒绝原因不能为空'); return; }
  // S1: 拒单回退到 'paid'（staff.html 的核心步骤,店长在此重新派单）。
  // 关键:必须同时清掉本厂家的关联,否则订单仍显示"已派给本厂家",
  // 会留在本厂家列表里并可能被静默重新触发。
  // 派单在 order_items.supplier_id 上做(见 staff.html),orders.supplier_id 一并清空。
  await sb.from('orders').update({status:'paid', supplier_id:null}).eq('id', orderId);
  if (supplier?.id) {
    await sb.from('order_items').update({supplier_id:null})
      .eq('order_id', orderId).eq('supplier_id', supplier.id);
  }
  await sb.from('order_logs').insert({
    order_id:orderId, status:'paid',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes:`❌ 厂商拒绝接单（需店长重新派单）：${reason.trim()}`,
  });
  await loadOrders();
}

async function quickStartProd(e, orderId) {
  e.stopPropagation();
  const notes = prompt('开始生产备注（可选）：');
  if (notes === null) return;
  await sb.from('orders').update({status:'in_production'}).eq('id', orderId);
  await sb.from('order_logs').insert({
    order_id:orderId, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: notes||'已开始生产',
  });
  await loadOrders();
}

// ── Order detail ─────────────────────────────────────────────────────

async function openDetail(id) {
  show('v-detail');
  document.getElementById('detail-content').innerHTML =
    '<div class="text-center py-10 text-gray-400">加载中…</div>';

  const [{data:o}, {data:_rawItems}, {data:logs}] = await Promise.all([
    sb.from('orders').select('*, stores(name), customers(name,phone,address)').eq('id',id).single(),
    sb.from('order_items').select('*').eq('order_id',id).order('sort_order'),
    sb.from('order_logs').select('*').eq('order_id',id).order('created_at',{ascending:true}),
  ]);
  // 厂家只看分给自己的商品（详情/打印/缓存都用过滤后的 items，防信息越界）
  const items = (_rawItems || []).filter(it =>
    String(it.supplier_id || '') === String(supplier?.id || ''));

  // 本厂家图纸三方确认
  const { data: _dAll } = await sb.rpc('drawing_get_for_order', { p_order_id: id });
  const _myDrawing = (_dAll || []).find(x =>
    String(x.supplier_id) === String(supplier?.id)) || null;
  const _drawReady = !!(_myDrawing && _myDrawing.drawing_url
    && _myDrawing.cust_confirmed_at && _myDrawing.staff_confirmed_at && _myDrawing.sup_confirmed_at);

  const [{ data: parentOrder }, { data: childByFk }, { data: childByDesc }] = await Promise.all([
    o?.parent_order_id
      ? sb.from('orders').select('id,order_no').eq('id', o.parent_order_id).single()
      : Promise.resolve({ data: null }),
    sb.from('orders').select('id,order_no,status,amount,created_at').eq('parent_order_id', id).order('created_at'),
    sb.from('orders').select('id,order_no,status,amount,created_at').like('description', `补件单%${o.order_no}%`).order('created_at'),
  ]);
  const childMap = new Map();
  (childByFk || []).forEach(c => childMap.set(c.id, c));
  (childByDesc || []).forEach(c => { if (c.id !== id) childMap.set(c.id, c); });
  const childOrders = Array.from(childMap.values()).sort((a,b) => (a.created_at || '').localeCompare(b.created_at || ''));

  currentDetailData = {o, items};


  const logsHtml = (logs||[]).map((l,i,arr) => {
    const isLast = i === arr.length-1;
    return `<div class="flex gap-3">
      <div class="flex flex-col items-center flex-shrink-0 w-4">
        <div class="w-2.5 h-2.5 rounded-full ${isLast?'bg-hg':'bg-gray-300'} mt-0.5"></div>
        ${!isLast?'<div class="w-px bg-gray-200 flex-1 my-1 mx-auto"></div>':''}
      </div>
      <div class="pb-3 flex-1">
        <div class="flex items-center gap-2 flex-wrap">${badge(l.status)}
          <span class="text-gray-400 text-xs">${fmtDateTime(l.created_at)}</span>
        </div>
        ${l.notes?`<p class="text-gray-600 text-sm mt-0.5">${esc(l.notes)}</p>`:''}
        <p class="text-gray-400 text-xs">${esc(l.operator_name)}</p>
      </div>
    </div>`;
  }).join('');

  const st = o?.status;
  const minePending = isMinePending(o);
  let actionSection = '';

  if (minePending || !SUPPLIER_CONFIRMED.includes(st)) {

// ── Detail action handlers ────────────────────────────────────────────

function selectStage(btn) {
  document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function detailAccept(id) {
  const notes = document.getElementById('accept-notes')?.value.trim();
  if (await _acceptMyItems(id, notes)) { await loadOrders(); openDetail(id); }
}

async function detailReject(id) {
  const reason = prompt('请填写拒绝原因（必填）：');
  if (reason === null) return;
  if (!reason.trim()) { alert('拒绝原因不能为空'); return; }
  // S1: 同 rejectOrder —— 回退 'paid' 并清空本厂家关联,等店长重新派单。
  await sb.from('orders').update({status:'paid', supplier_id:null}).eq('id', id);
  if (supplier?.id) {
    await sb.from('order_items').update({supplier_id:null})
      .eq('order_id', id).eq('supplier_id', supplier.id);
  }
  await sb.from('order_logs').insert({
    order_id:id, status:'paid',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes:`❌ 厂商拒绝接单（需店长重新派单）：${reason.trim()}`,
  });
  show('v-orders');
  await loadOrders();
}

async function detailStartProd(id) {
  const notes = document.getElementById('start-notes')?.value.trim();
  await sb.from('orders').update({status:'in_production'}).eq('id', id);
  sb.from('orders').update({prod_stage:null}).eq('id', id).catch(()=>{});
  await sb.from('order_logs').insert({
    order_id:id, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: notes||'已开始生产',
  });
  await loadOrders();
  openDetail(id);
}

// 图纸硬卡：三方未齐不能推进生产
async function _drawingGate(orderId) {
  const { data, error } = await sb.rpc('drawing_ready',
    { p_order_id: orderId, p_supplier_id: supplier?.id });
  if (error) { alert('图纸状态校验失败：' + error.message); return false; }
  if (!data) { alert('⚠ 图纸三方未确认齐（客户 / 运营 / 厂家）。\n请先在上方「图纸三方确认」上传图纸并三方都确认，才能进生产加工/完成。'); return false; }
  return true;
}
async function supDrawingUpload(orderId) {
  const url = document.getElementById('sup-dwg-url')?.value?.trim();
  if (!url) { alert('请先填写图纸链接'); return; }
  const { data, error } = await sb.rpc('drawing_upload',
    { p_order_id: orderId, p_supplier_id: supplier?.id, p_url: url });
  if (error) { alert('上传失败：' + error.message); return; }
  if (!data?.ok) { alert(data?.message || '上传失败'); return; }
  alert('✅ 图纸已上传 v' + data.version + (data.version>1?'（三方确认作废，需重新确认）':''));
  openDetail(orderId);
}
async function supDrawingConfirm(orderId) {
  if (!confirm('确认此图纸无误？将记录你的身份+时间，用于事后追责。')) return;
  const { data, error } = await sb.rpc('drawing_confirm',
    { p_order_id: orderId, p_supplier_id: supplier?.id });
  if (error) { alert('确认失败：' + error.message); return; }
  if (!data?.ok) { alert(data?.message || '确认失败'); return; }
  alert('✅ 厂家已确认图纸');
  openDetail(orderId);
}

async function updateProdProgress(id) {
  const selectedBtn = document.querySelector('.stage-btn.selected');
  const stageLabel  = selectedBtn?.dataset.label;
  const notes = document.getElementById('prod-notes')?.value.trim();

  if (!stageLabel && !notes) { alert('请选择生产阶段或填写备注'); return; }
  if (!(await _drawingGate(id))) return;   // 三方未齐硬卡

  const updateBtn = document.querySelector(`button[onclick="updateProdProgress('${id}')"]`);
  if (updateBtn) { updateBtn.disabled = true; updateBtn.textContent = '提交中...'; }

  const stageKey = selectedBtn?.dataset.key || null;
  const logNotes = [stageLabel?`【${stageLabel}】`:null, notes||null].filter(Boolean).join(' ');
  if (stageKey) await sb.from('orders').update({ prod_stage: stageKey }).eq('id', id);
  await sb.from('order_logs').insert({
    order_id:id, status:'in_production',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes: logNotes,
  });

  // Lock the entire progress form after successful submission
  document.querySelectorAll('.stage-btn').forEach(b => {
    b.disabled = true;
    b.classList.add('opacity-40', 'cursor-not-allowed');
  });
  const notesEl = document.getElementById('prod-notes');
  if (notesEl) { notesEl.disabled = true; notesEl.classList.add('bg-gray-50', 'text-gray-400'); }
  if (updateBtn) {
    updateBtn.disabled = true;
    updateBtn.textContent = '✅ 已提交';
    updateBtn.className = 'py-2.5 border border-gray-300 text-gray-400 font-medium rounded-lg text-sm cursor-not-allowed';
  }
  const msg = document.getElementById('prod-msg');
  if (msg) { msg.textContent = '✅ 进度已更新，运营团队将同步收到'; msg.classList.remove('hidden'); }
}

async function markProdComplete(id) {
  const btn = document.querySelector(`button[onclick="markProdComplete('${id}')"]`);
  if (!btn) return;
  if (!btn.dataset.confirming && !(await _drawingGate(id))) return;   // 三方未齐硬卡

  // 第一次点击：变成确认状态
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.textContent = '⚠️ 再次点击确认完成';
    btn.className = 'py-2.5 bg-amber-500 text-white font-semibold rounded-lg text-sm';
    setTimeout(() => {
      if (btn.dataset.confirming) {
        btn.dataset.confirming = '';
        btn.textContent = '✓ 生产完成';
        btn.className = 'py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg text-sm';
      }
    }, 4000);
    return;
  }

  // 第二次点击：执行
  btn.disabled = true;
  btn.textContent = '提交中...';
  btn.dataset.confirming = '';

  const { error } = await sb.from('orders').update({status:'production_complete', prod_stage:null}).eq('id', id);
  if (error) {
    alert('操作失败：' + error.message);
    btn.disabled = false;
    btn.textContent = '✓ 生产完成';
    btn.className = 'py-2.5 bg-hg text-white font-semibold rounded-lg hover:bg-gg text-sm';
    return;
  }
  await sb.from('order_logs').insert({
    order_id:id, status:'production_complete',
    operator_id:profile.id, operator_role:'supplier',
    operator_name:supplier?.name||profile.name,
    notes:'生产完成，准备发货',
  });
  await loadOrders();
  openDetail(id);
}

async function submitShipping(id) {
  const method   = document.getElementById('ship-method')?.value;
  const companySel = document.getElementById('ship-company')?.value;
  const companyCustom = document.getElementById('ship-company-custom')?.value.trim();
  const company  = companySel === '其他' ? (companyCustom || '其他') : companySel;
  const tracking = document.getElementById('ship-tracking')?.value.trim();
  const notes    = document.getElementById('ship-notes')?.value.trim();

  if (!method)   { alert('请选择运输方式'); return; }
  if (!company)  { alert('请选择物流公司'); return; }
  if (!tracking) { alert('请填写物流单号'); return; }

  const btn = document.querySelector(`button[onclick="submitShipping('${id}')"]`);
  if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }

  const methodLabel = {land:'陆运', sea:'海运', air:'空运'}[method] || method;

  // 商品行同步标记为已备货（让运营端装柜核对通过）
  await sb.from('order_items').update({ item_status: 'ready' })
    .eq('order_id', id)
    .not('item_status', 'in', '("shipped","arrived","damaged")');

  // 核心更新：状态 + 物流单号（必须成功）
  const { error: coreErr } = await sb.from('orders').update({
    status: 'shipped',
    tracking_no: tracking,
  }).eq('id', id);

  if (coreErr) {
    alert('发货失败：' + coreErr.message);
    if (btn) { btn.disabled = false; btn.textContent = '确认发货'; }
    return;
  }

  // 扩展更新：运输方式 + 物流公司（列不存在时静默跳过）
  await sb.from('orders').update({
    ship_method: method,
    ship_carrier: company,
  }).eq('id', id);

  const logNotes = [`运输：${methodLabel}`, `物流：${company}`, `单号：${tracking}`, notes||null].filter(Boolean).join(' | ');
  await sb.from('order_logs').insert({
    order_id: id, status: 'shipped',
    operator_id: profile.id, operator_role: 'supplier',
    operator_name: supplier?.name || profile.name,
    notes: logNotes,
  });

  const msg = document.getElementById('ship-msg');
  if (msg) msg.classList.remove('hidden');
  setTimeout(async () => { await loadOrders(); openDetail(id); }, 1200);
}

// ── Print task sheet ──────────────────────────────────────────────────

function printTaskSheet() {
  if (!currentDetailData) return;
  const {o, items} = currentDetailData;

  const itemRows = (items||[]).map(it => `
    <tr>
      <td style="padding:8px 6px;border-bottom:1px solid #eee">${esc(it.product_name)||'-'}</td>
      <td style="padding:8px 6px;border-bottom:1px solid #eee">${esc(it.model_spec)||'-'}</td>
      <td style="padding:8px 6px;border-bottom:1px solid #eee;text-align:center">${esc(it.quantity)} ${esc(it.unit)}</td>
      <td style="padding:8px 6px;border-bottom:1px solid #eee;color:#555">${esc(it.notes)}</td>
    </tr>`).join('');

  document.getElementById('print-content').innerHTML = `
    <div style="border-bottom:3px solid #1a3a2a;padding-bottom:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <h1 style="font-size:22px;font-weight:bold;color:#1a3a2a;margin:0">生产任务单</h1>
        <div style="font-size:12px;color:#999;margin-top:3px">${esc(supplier?.name)||'HOUZY HOME'}</div>
      </div>
      <div style="font-size:11px;color:#bbb">打印：${new Date().toLocaleString('zh-CN')}</div>
    </div>
    <table style="width:100%;font-size:13px;margin-bottom:18px;border-collapse:collapse">
      <tr><td style="color:#888;width:90px;padding:5px 0;vertical-align:top">订单编号</td>
          <td style="font-weight:bold;font-family:monospace;font-size:15px">${esc(o.order_no)}</td></tr>
      <tr><td style="color:#888;padding:5px 0">门店</td><td>${esc(o.stores?.name)||'-'}</td></tr>
      <tr><td style="color:#888;padding:5px 0">客户姓名</td><td>${esc(o.customers?.name)||'-'}</td></tr>
      <tr><td style="color:#888;padding:5px 0;vertical-align:top">送货地址</td><td>${esc(o.customers?.address)||'-'}</td></tr>
      <tr><td style="color:#888;padding:5px 0">创建日期</td><td>${fmtDate(o.created_at)}</td></tr>
      ${o.description?`<tr><td style="color:#888;padding:5px 0;vertical-align:top">订单描述</td><td>${esc(o.description)}</td></tr>`:''}
      ${o.notes?`<tr><td style="color:#888;padding:5px 0;vertical-align:top">备注</td><td>${esc(o.notes)}</td></tr>`:''}
    </table>
    <h3 style="font-size:14px;font-weight:bold;margin-bottom:10px;padding-top:14px;border-top:1px solid #ddd">商品明细</h3>
    ${items?.length ? `
    <table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead>
        <tr style="background:#f0f0f0">
          <th style="padding:8px 6px;text-align:left;border-bottom:2px solid #ccc">产品名称</th>
          <th style="padding:8px 6px;text-align:left;border-bottom:2px solid #ccc">型号规格</th>
          <th style="padding:8px 6px;text-align:center;border-bottom:2px solid #ccc">数量</th>
          <th style="padding:8px 6px;text-align:left;border-bottom:2px solid #ccc">备注</th>
        </tr>
      </thead>
      <tbody>${itemRows}</tbody>
    </table>` : '<p style="color:#aaa;font-size:13px">无商品明细</p>'}
    <div style="margin-top:40px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;font-size:12px;color:#777">
      <div style="border-top:1px solid #aaa;padding-top:6px;text-align:center">生产负责人</div>
      <div style="border-top:1px solid #aaa;padding-top:6px;text-align:center">质检签字</div>
      <div style="border-top:1px solid #aaa;padding-top:6px;text-align:center">发货确认</div>
    </div>`;

  window.print();
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
