:12px;color:var(--muted)}input,textarea,select{border:1px solid var(--line);background:#fffefa;border-radius:3px;padding:11px 12px;color:var(--ink);min-width:0}textarea{min-height:82px;resize:vertical}.btn{border:1px solid var(--line);background:transparent;color:var(--forest);padding:10px 14px;border-radius:3px}.btn.primary{background:var(--forest);border-color:var(--forest);color:white}.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:12px;color:var(--muted);line-height:1.6}.notice{padding:12px 14px;border-left:3px solid var(--gold);background:#f7f3e8;color:#665633;margin:12px 0}.error{color:var(--red);background:#fbefec;padding:12px;margin:12px 0}.ok{color:var(--forest);background:#eaf1eb;padding:12px;margin:12px 0}.stage{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.stage h3{font:500 20px Georgia,"Noto Serif SC",serif;color:var(--forest);margin:0 0 12px}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(220px,1.6fr) .5fr repeat(4,minmax(100px,.65fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.itemname b{display:block;font-size:13px;font-weight:600}.itemname small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.unit{font-size:12px;color:var(--muted)}.item input{width:100%;padding:9px 8px;font-size:13px}.itemhead{font-size:10px;letter-spacing:.08em;color:var(--muted)}.round{border-top:1px solid var(--line);padding:16px 0}.round h3{margin:0;color:var(--forest)}.supplier-links{display:grid;gap:7px;margin-top:10px}.supplier-links .row{flex-wrap:wrap}.linkrow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:12px}.linkrow input{width:100%;padding:8px;font-size:11px}.compare{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;font-size:12px;vertical-align:top}th{font-weight:600;color:var(--forest);background:#f8f5ed}td.num{text-align:right;font-variant-numeric:tabular-nums}.low{color:var(--forest);font-weight:700}.badge{display:inline-block;color:var(--forest);background:#e8efe8;padding:3px 7px;border-radius:2px;font-size:10px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.tabs button{background:none;border:0;color:var(--muted);padding:8px 10px}.tabs button.on{color:var(--forest);border-bottom:2px solid var(--gold)}.sum{font:500 30px Georgia,serif;color:var(--forest)}@media(max-width:720px){.shell{padding:16px 12px 48px}.hero{display:block}.stamp{display:inline-block;margin-top:14px}.panel{padding:16px}.item{grid-template-columns:minmax(150px,1fr) 54px repeat(2,minmax(88px,1fr));gap:6px}.itemhead{display:none}.item input:nth-of-type(3),.item input:nth-of-type(4){grid-row:2}.itemname{grid-column:1/-1}.linkrow{grid-template-columns:1fr auto}.linkrow input{grid-column:1/-1;grid-row:2}.tabs{overflow:auto}.tabs button{white-space:nowrap}}:focus-visible{outline:2px solid #9e793c;outline-offset:2px}

<body><main class="shell"><header class="mast"><div class="mark">H</div><div><b>HOUZY HOME</b><small>SUPPLIER COST DESK · 供应商成本询价</small></div></header><section class="hero"><div><div class="eyebrow">Trade pricing · Internal cost only</div><h1 id="title">供应商工程报价</h1><p id="intro">按 HOUZY 现有价目表逐项填写成本报价。同一询价可邀请多家供应商，项目、单位与规格保持一致。</p></div><div class="stamp">CONFIDENTIAL · 成本资料</div></section><div id="app"><div class="panel">正在载入询价单…</div></div></main>
<script>
(() => {
  const SB_URL='https://csabbxiijzghooppayae.supabase.co', SB_KEY='sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH', ENDPOINT=SB_URL+'/functions/v1/supplier-price-quote';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const app=document.getElementById('app'), params=new URLSearchParams(location.search), token=params.get('token');
  const client=window.supabase.createClient(SB_URL,SB_KEY); let session=null, rows=[], rounds=[];
  async function api(body,method='POST'){
    const headers={'Content-Type':'application/json'}; if(session?.access_token)headers.Authorization='Bearer '+session.access_token;
    const res=await fetch(ENDPOINT+(method==='GET'?'?token='+encodeURIComponent(token||''):''),{method,headers,...(method==='POST'?{body:JSON.stringify(body)}:{})});
    const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'请求失败');return data;
  }
  function itemMeta(){
    const Q=window.QV2, B=window.QV2_BOOK, PRICE=window.QV2_PRICE;
    const all=B.parseCsv(B.template(PRICE,Q.SPEC_CATS,Q.OPTION_PRICES,Q.TILE_PIECE_PRICES)).slice(1);
    return all.map(r=>({type:r[0],id:r[1],name:r[2],unit:r[3],note:r[8]||'',stage:PRICE[r[1]]?.stage||PRICE[r[1].split('@').pop()]?.stage||(r[0]==='瓷砖片价'?'tile':'')}));
  }
  function inputRow(i,q={}){return `<div class="item"><div class="itemname"><b>${esc(i.name)}</b><small>${esc(i.id)} · ${esc(i.note||'供应商成本价，按本行单位填写')}</small></div><div class="unit">${esc(i.unit)}</div>${[['material','材料'],['auxiliary','辅料'],['labour','人工'],['waste','损耗%']].map(([k,l])=>`<label><span class="itemhead">${l}</span><input inputmode="decimal" type="number" min="0" step="0.01" data-cost="${esc(i.id)}" data-field="${k}" aria-label="${esc(i.name)} ${l}" placeholder="${l==='损耗%'?'%':'RM'}" value="${q[k]??''}"></label>`).join('')}</div>`}
  async function supplierView(){
    document.getElementById('intro').textContent='仅供受邀供应商使用。请按清单逐项填写成本价；本链接不会显示其他供应商报价。';
    let data; try{data=await api({},'GET')}catch(e){app.innerHTML=`<div class="panel error">${esc(e.message)}</div>`;return}
    const r=data.round; document.getElementById('title').textContent=r.title;
    const values=new Map((data.quote||[]).map(x=>[x.id,x]));
    app.innerHTML=`<div class="panel"><div class="row"><span class="badge">${esc(r.trade)}</span><span class="badge">成本价 · RM</span><span class="hint">报价供应商：${esc(data.supplier)}</span></div><div class="notice">此表价格属于内部采购成本。请按现有项目编号、规格和单位报价；材料、辅料、人工各栏都请填写；该项不收费请填 0，无法报价则留空并在备注说明。报价未填写完整的项目不会进入成本价目表。不要将本页转发给其他供应商。</div>${r.closes_at?`<p class="hint">提交截止：${new Date(r.closes_at).toLocaleString()}</p>`:''}<div id="vendorItems"></div><div class="row" style="margin-top:18px"><div class="field"><label>报价有效期</label><input id="validity" placeholder="例如：30 天 / 至 2026-12-31" value="${esc(data.validity||'')}"></div></div><div class="field" style="margin-top:12px"><label>备注、缺项或规格差异</label><textarea id="note" placeholder="例如：不含搬运；某规格需另行确认">${esc(data.note||'')}</textarea></div><p class="hint">行内空白表示未报价；损耗率可不填。请在提交前检查币种为 RM。</p><button class="btn primary" id="submitQuote">${data.status==='submitted'?'更新成本报价':'提交成本报价'}</button><span id="result" class="hint" style="margin-left:10px"></span></div>`;
    const holder=document.getElementById('vendorItems'), stageMap=new Map();
    (r.items||[]).forEach(i=>{const g=i.stage||'other';if(!stageMap.has(g))stageMap.set(g,[]);stageMap.get(g).push(i)});
    holder.innerHTML=[...stageMap].map(([stage,list])=>`<section class="stage"><h3>${esc(stageLabel(stage))}</h3><div class="itemhead row"><span>项目 / 规格</span><span>单位</span><span>材料 · RM</span><span>辅料 · RM</span><span>人工 · RM</span><span>损耗 %</span></div><div class="items">${list.map(i=>inputRow(i,values.get(i.id))).join('')}</div></section>`).join('');
    document.getElementById('submitQuote').onclick=async()=>{const btn=document.getElementById('submitQuote'),result=document.getElementById('result');btn.disabled=true;result.textContent='正在提交…';try{const quote=(r.items||[]).map(i=>{const x={id:i.id};document.querySelectorAll(`[data-cost="${CSS.escape(i.id)}"]`).forEach(el=>{x[el.dataset.field]=el.value.trim()});return x}).filter(x=>Object.keys(x).some(k=>k!=='id'&&x[k]!==''));await api({action:'submit',token,quote,validity:document.getElementById('validity').value,note:document.getElementById('note').value});result.textContent='成本报价已提交';btn.textContent='更新成本报价'}catch(e){result.textContent=e.message}finally{btn.disabled=false}};
  }
  function stageLabel(id){return (window.QV2_STAGES||[]).find(x=>x.id===id)?.name||id}
  async function adminView(){
    const {data:{session:s}}=await client.auth.getSession();session=s;
    if(!session){location.href='/portal/login.html?redirect='+encodeURIComponent('/portal/supplier-price-quote.html');return}
    document.getElementById('title').textContent='供应商成本询价';document.getElementById('intro').textContent='从现有公司价目表按工种发出同一份项目清单，多家分别填写；逐项比较后再选定并同步成本价。';
    try{await api({action:'list'}); }catch(e){app.innerHTML=`<div class="panel error">${esc(e.message)}</div>`;return}
    app.innerHTML=`<nav class="tabs"><button class="on" data-tab="new">模块填写链接</button><button data-tab="history">我的询价库</button></nav><section id="view"></section>`;
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));renderAdmin(b.dataset.tab)});
    await refreshRounds();renderAdmin('new');
  }
  async function refreshRounds(){rounds=(await api({action:'list'})).rounds||[]}
  function renderAdmin(tab){
    const view=document.getElementById('view');if(tab==='costbook'){
      view.innerHTML='<div class="panel">正在载入成本价目表…</div>';
      api({action:'costbook'}).then(({rows})=>{view.innerHTML=`<div class="panel"><h2 style="font:500 24px Georgia;color:var(--forest);margin-top:0">公司成本价目表</h2><p class="notice">此处只保存已选定供应商的内部成本价，不会覆盖报价器的客户售价，也不会出现在客户报价单或演示页。</p><div class="compare"><table><thead><tr><th>项目 / 规格</th><th>单位</th><th>材料</th><th>辅料</th><th>人工</th><th>供应商</th><th>更新时间</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.item_name)}<br><small>${esc(x.item_id)}</small></td><td>${esc(x.unit)}</td><td class="num">RM ${Number(x.material).toFixed(2)}</td><td class="num">RM ${Number(x.auxiliary).toFixed(2)}</td><td class="num">RM ${Number(x.labour).toFixed(2)}</td><td>${esc(x.supplier_name)}</td><td>${new Date(x.updated_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="7" class="hint">选定供应商后，成本价会显示在这里。</td></tr>'}</tbody></table></div><p class="hint">${rows.length} 个成本项目 · 按编号与报价器现有价目表匹配</p></div>`}).catch(e=>{view.innerHTML=`<div class="panel error">${esc(e.message)}</div>`});
      return;
    }
    if(tab==='new'){
      const stages=(window.QV2_STAGES||[]).map(s=>({...s,items:itemMeta().filter(x=>x.stage===s.id)})).filter(s=>s.items.length);
      view.innerHTML=`<div class="panel"><h2 style="font:500 24px Georgia;color:var(--forest);margin:0 0 6px">选模块，发供应商填写链接</h2><p class="hint">点击施工模块，填写受邀供应商名称，就能生成该模块的专属链接。供应商按报价器现有项目填写成本价。</p><div class="module-grid">${stages.map(s=>`<article class="module-card"><div><h3>${esc(s.name)}</h3><p>${s.items.length} 个价目表项目</p></div><button class="btn primary" data-open-stage="${s.id}">生成填写链接</button></article>`).join('')}</div></div><div class="panel" id="invitePanel" hidden></div>`;
      let selected='';
      document.querySelectorAll('[data-open-stage]').forEach(b=>b.onclick=()=>{selected=b.dataset.openStage;const info=stages.find(s=>s.id===selected);const panel=document.getElementById('invitePanel');panel.hidden=false;panel.innerHTML=`<div class="row" style="justify-content:space-between"><div><span class="badge">${esc(info.name)}</span><h2 style="font:500 23px Georgia;color:var(--forest);margin:8px 0">邀请供应商填写</h2></div><button class="btn" id="closeInvite">收起</button></div><p class="hint">此模块共 ${info.items.length} 项。每家供应商会拿到独立链接，只填写自己的报价。</p><div class="field"><label>供应商名称（每行一家）</label><textarea id="suppliers" placeholder="供应商 A\n供应商 B"></textarea></div><div style="margin-top:12px"><button class="btn primary" id="createRound">生成专属链接</button></div><div id="createdLinks" class="supplier-links"></div>`;document.getElementById('closeInvite').onclick=()=>panel.hidden=true;document.getElementById('createRound').onclick=async()=>{const btn=document.getElementById('createRound');btn.disabled=true;try{const suppliers=document.getElementById('suppliers').value.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean),items=info.items,title=stageLabel(selected)+' 供应商询价 · '+new Date().toLocaleDateString('zh-CN');const out=await api({action:'create',title,trade:stageLabel(selected),items,suppliers});document.getElementById('createdLinks').innerHTML=out.links.map(x=>`<div class="linkrow"><b>${esc(x.supplier)}</b><input readonly value="${esc(x.url)}"><button class="btn" data-copy="${esc(x.url)}">复制链接</button></div>`).join('');document.querySelectorAll('[data-copy]').forEach(copy=>copy.onclick=async()=>{await navigator.clipboard.writeText(copy.dataset.copy);copy.textContent='已复制'});await refreshRounds()}catch(e){alert(e.message)}finally{btn.disabled=false}}});
      return;
    }
    view.innerHTML=rounds.length?rounds.map(roundCard).join(''):'<div class="panel hint">还没有询价单。从“新建询价”按工种创建第一份。</div>';
    view.querySelectorAll('[data-award]').forEach(b=>b.onclick=async()=>{if(!confirm('选定该供应商，并把已报价项目同步进公司成本价目表？'))return;b.disabled=true;try{const out=await api({action:'award',round_id:b.dataset.round,invite_id:b.dataset.award});alert(`已同步 ${out.count} 项成本价；${out.skipped} 项因报价未填完整而保留为空。`);await refreshRounds();renderAdmin('history')}catch(e){alert(e.message);b.disabled=false}});
  }
  function roundCard(r){
    const rows=r.items||[],inv=r.invites||[], submitted=inv.filter(x=>x.status==='submitted');
    const complete=(item,q)=>q&&(item.type==='瓷砖片价'?q.material!=null:q.material!=null&&q.auxiliary!=null&&q.labour!=null);
    const sharedRows=rows.filter(item=>submitted.length&&submitted.every(s=>complete(item,(s.quote||[]).find(q=>q.id===item.id))));
    return `<article class="panel round"><div class="row" style="justify-content:space-between"><div><span class="badge">${esc(r.trade)}</span> <span class="badge">${esc(r.status==='awarded'?'已选定':r.status==='closed'?'已截止':'开放中')}</span><h3>${esc(r.title)}</h3><div class="hint">${new Date(r.created_at).toLocaleDateString()} · ${rows.length} 项 · ${submitted.length}/${inv.length} 家已提交</div><div class="hint">最低价按相同项目编号和单位逐项比较；缺项或未填完整的报价不参与该项比较。价目表没有工程量，因此不计算整单总价。</div></div><div><span class="badge">${sharedRows.length?`${sharedRows.length} 项可比`:'尚无共同完整报价'}</span></div></div><div class="compare"><table><thead><tr><th>项目 / 单位</th>${inv.map(s=>`<th>${esc(s.supplier_name)}<br><small>${esc(s.status==='submitted'?'已提交':'待报价')}</small></th>`).join('')}</tr></thead><tbody>${rows.slice(0,180).map(item=>`<tr><td>${esc(item.name)}<br><small>${esc(item.unit)}</small></td>${inv.map(s=>{const q=(s.quote||[]).find(x=>x.id===item.id),done=complete(item,q),amount=done?Number(q.material||0)+Number(q.auxiliary||0)+Number(q.labour||0):null,prices=inv.filter(z=>z.status==='submitted').map(z=>{const y=(z.quote||[]).find(v=>v.id===item.id);return complete(item,y)?Number(y.material||0)+Number(y.auxiliary||0)+Number(y.labour||0):Infinity});return `<td class="num ${done&&amount===Math.min(...prices)?'low':''}">${amount==null?(q?'未报完整':'—'):'RM '+amount.toLocaleString('en-MY',{maximumFractionDigits:2})}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="supplier-links">${inv.map(s=>`<div class="row" style="justify-content:space-between;border-top:1px dashed var(--line);padding-top:9px"><span>${esc(s.supplier_name)} · ${esc(s.status==='submitted'?'已提交 '+new Date(s.submitted_at).toLocaleString():'尚未提交')} ${s.validity?`· 有效期 ${esc(s.validity)}`:''}</span>${s.status==='submitted'&&r.status==='open'?`<button class="btn primary" data-award="${s.id}" data-round="${r.id}">选定并同步成本价</button>`:''}</div>${s.note?`<div class="hint">备注：${esc(s.note)}</div>`:''}`).join('')}</div></article>`;
  }
  function previewView(){
    document.getElementById('title').textContent='供应商成本询价 · 交互预览';
    document.getElementById('intro').textContent='从施工模块选择需要询价的项目，发链接给供应商填写，再到“我的询价库”挑选合适报价。样例不会保存。';
    const allItems=itemMeta(),stages=(window.QV2_STAGES||[]).map(s=>({...s,items:allItems.filter(x=>x.stage===s.id)})).filter(s=>s.items.length);
    app.innerHTML='<nav class="tabs"><button class="on" id="previewCompare">模块与询价库</button><button id="previewVendor">供应商填写示例</button></nav><section id="previewContent"></section>';
    const host=document.getElementById('previewContent'),compareBtn=document.getElementById('previewCompare'),vendorBtn=document.getElementById('previewVendor');
    const renderModules=()=>{
      compareBtn.classList.add('on');vendorBtn.classList.remove('on');
      host.innerHTML=`<div class="notice">不是只有泥水。每个模块从报价器现有项目自动生成自己的链接；供应商只填收到的模块。</div><div class="module-grid">${stages.map(s=>`<article class="module-card"><div><h3>${esc(s.name)}</h3><p>${s.items.length} 个项目</p></div><button class="btn" data-preview-module="${s.id}">看该模块比价</button></article>`).join('')}</div><div id="previewComparison"></div>`;
      host.querySelectorAll('[data-preview-module]').forEach(btn=>btn.onclick=()=>{const s=stages.find(x=>x.id===btn.dataset.previewModule),items=s.items.slice(0,7),sample=(name,base)=>({id:name,supplier_name:name,status:'submitted',submitted_at:new Date().toISOString(),validity:'30 天',note:name==='供应商 B'?'报价备注：辅料需确认。':'',quote:items.map((x,i)=>({id:x.id,material:base+i*2,auxiliary:x.type==='瓷砖片价'?null:base*.45,labour:x.type==='瓷砖片价'?null:base*.8}))});document.getElementById('previewComparison').innerHTML=`<div class="notice">${esc(s.name)} · 样例价格不会保存，正式比价按相同项目逐项显示。</div>${roundCard({id:'preview',title:s.name+' · 供应商询价',trade:s.name,status:'open',created_at:new Date().toISOString(),items,invites:[sample('供应商 A',18),sample('供应商 B',16)]})}`});
    };
    const renderVendor=()=>{compareBtn.classList.remove('on');vendorBtn.classList.add('on');const items=stages.find(s=>s.id==='tile')?.items.slice(0,7)||stages[0]?.items.slice(0,7)||[];host.innerHTML=`<div class="panel"><div class="row"><span class="badge">${esc(stageLabel('tile'))}</span><span class="badge">成本价 · RM</span><span class="hint">报价供应商：供应商 A</span></div><div class="notice">只显示分配给本供应商的模块。材料、辅料、人工不收费请填 0；未填写完整的项目不会进入成本价目表。</div>${items.map(i=>`<section class="stage"><div class="items">${inputRow(i)}</div></section>`).join('')}<div class="field" style="margin-top:14px"><label>备注、缺项或规格差异</label><textarea placeholder="例如：不含搬运"></textarea></div><p class="hint">演示数据不会发送或保存。</p><button class="btn primary" disabled>提交成本报价</button></div>`};
    compareBtn.onclick=renderModules;vendorBtn.onclick=renderVendor;renderModules();
  }
  if(params.get('preview'))previewView();else if(token)supplierView();else adminView();
})();
</script></body></html>
