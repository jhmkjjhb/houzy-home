:12px;color:var(--muted)}input,textarea,select{border:1px solid var(--line);background:#fffefa;border-radius:3px;padding:11px 12px;color:var(--ink);min-width:0}textarea{min-height:82px;resize:vertical}.btn{border:1px solid var(--line);background:transparent;color:var(--forest);padding:10px 14px;border-radius:3px}.btn.primary{background:var(--forest);border-color:var(--forest);color:white}.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:12px;color:var(--muted);line-height:1.6}.notice{padding:12px 14px;border-left:3px solid var(--gold);background:#f7f3e8;color:#665633;margin:12px 0}.error{color:var(--red);background:#fbefec;padding:12px;margin:12px 0}.ok{color:var(--forest);background:#eaf1eb;padding:12px;margin:12px 0}.stage{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.stage h3{font:500 20px Georgia,"Noto Serif SC",serif;color:var(--forest);margin:0 0 12px}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(220px,1.6fr) .5fr repeat(var(--quote-cols,4),minmax(100px,.65fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.itemname b{display:block;font-size:13px;font-weight:600}.itemname small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.unit{font-size:12px;color:var(--muted)}.item input{width:100%;padding:9px 8px;font-size:13px}.itemhead{font-size:10px;letter-spacing:.08em;color:var(--muted)}.round{border-top:1px solid var(--line);padding:16px 0}.supplier-links{display:grid;gap:7px;margin-top:10px}.supplier-links .row{flex-wrap:wrap}.linkrow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:12px}.linkrow input{width:100%;padding:8px;font-size:11px}.compare{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;font-size:12px;vertical-align:top}th{font-weight:600;color:var(--forest);bac <body><main class="shell"><header class="mast"><div class="mark">H</div><div><b>HOUZY HOME</b><small>SUPPLIER COST DESK · 供应商成本询价</small></div></header><section class="hero"><div><div class="eyebrow">Trade pricing · Internal cost only</div><h1 id="title">供应商工程报价</h1><p id="intro">按 HOUZY 现有价目表逐项填写成本报价。同一询价可邀请多家供应商，项目、单位与规格保持一致。</p></div><div class="stamp">CONFIDENTIAL · 成本资料</div></section><div id="app"><div class="panel">正在载入询价单…</div></div></main>
<script>
(() => {
  const SB_URL='https://csabbxiijzghooppayae.supabase.co', SB_KEY='sb_publishable__9KY2RRSxb1excfVxBTH_Q_5HtFWxmH', ENDPOINT=SB_URL+'/functions/v1/supplier-price-quote';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const app=document.getElementById('app'), params=new URLSearchParams(location.search), token=params.get('token');
  if(params.get('embed')==='1')document.documentElement.classList.add('embedded');
  const client=window.supabase.createClient(SB_URL,SB_KEY); let session=null, rows=[], rounds=[];
  async function api(body,method='POST'){
    const headers={'Content-Type':'application/json'}; if(session?.access_token)headers.Authorization='Bearer '+session.access_token;
    const res=await fetch(ENDPOINT+(method==='GET'?'?token='+encodeURIComponent(token||''):''),{method,headers,...(method==='POST'?{body:JSON.stringify(body)}:{})});
    const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'请求失败');return data;
  }
  function itemMeta(scope='work'){
    const Q=window.QV2, B=window.QV2_BOOK, PRICE=window.QV2_PRICE;
    const all=B.parseCsv(B.template(PRICE,Q.SPEC_CATS,Q.OPTION_PRICES,Q.TILE_PIECE_PRICES)).slice(1);
    return all.filter(r=>scope==='material'?window.QV2_SUPPLIER_TRADES.isMaterialItem(r[1],r[0],r[4]):r[0]!=='瓷砖片价').map(r=>{const trade=window.QV2_SUPPLIER_TRADES.resolve(r[1],r[0]);return {type:r[0],id:r[1],name:r[2],unit:r[3],note:r[8]||'',stage:trade.id,trade:trade.name,code:trade.code,quote_scope:scope,quote_fields:scope==='material'?['material']:['auxiliary','labour']}});
  }
  function quoteFields(i){return i.quote_fields||(i.type==='瓷砖片价'?['material']:['material','auxiliary','labour','waste'])}
  function inputRow(i,q={}){const labels={material:i.type==='选材价差'?'主材差额':'主材单价',auxiliary:'施工辅料',labour:'人工',waste:'损耗%'};const fields=quoteFields(i);return `<div class="item" style="--quote-cols:${fields.length}"><div class="itemname"><b>${esc(i.name)}</b><small>${esc(i.id)} · ${esc(i.note||'按本行单位报价')}</small></div><div class="unit">${esc(i.unit)}</div>${fields.map(k=>`<label><span class="itemhead">${labels[k]||k}${k==='waste'?'':' · RM'}</span><input inputmode="decimal" type="number" min="${k==='material'&&i.type==='选材价差'?'-999999':'0'}" step="0.01" data-cost="${esc(i.id)}" data-field="${k}" aria-label="${esc(i.name)} ${labels[k]||k}" placeholder="${k==='waste'?'%':'RM'}" value="${q[k]??''}"></label>`).join('')}</div>`}
  async function supplierView(){
    document.getElementById('intro').textContent='仅供受邀供应商使用。请按清单逐项填写成本价；本链接不会显示其他供应商报价。';
    let data; try{data=await api({},'GET')}catch(e){app.innerHTML=`<div class="panel error">${esc(e.message)}</div>`;return}
    const r=data.round; document.getElementById('title').textContent=r.title;
    const values=new Map((data.quote||[]).map(x=>[x.id,x]));
    const scope=r.items?.[0]?.quote_scope||'legacy';
    app.innerHTML=`<div class="panel"><div class="row"><span class="badge">${esc(r.trade)}</span><span class="badge">${r.items.length} 个项目</span><span class="badge">${scope==='material'?'主材采购成本 · RM':scope==='work'?'施工成本（不含主材）· RM':'成本价 · RM'}</span><span class="hint">报价方：${esc(data.supplier)}</span></div><div class="notice">${scope==='material'?'本询价只填写主材采购成本；施工辅料与人工由施工承包方另行报价。':scope==='work'?'本询价只填写施工辅料与人工，不含主材；主材由厂家或材料供应商独立询价。':'本链接只对应指定工种，请按项目编号、规格和单位填写对应报价。'}不收费请填 0，无法报价请留空并在备注说明。不要将本页转发给其他供应商。</div>${r.closes_at?`<p class="hint">提交截止：${new Date(r.closes_at).toLocaleString()}</p>`:''}<div id="vendorItems"></div><div class="row" style="margin-top:18px"><div class="field"><label>报价有效期</label><input id="validity" placeholder="例如：30 天 / 至 2026-12-31" value="${esc(data.validity||'')}"></div></div><div class="field" style="margin-top:12px"><label>备注、品牌、型号或规格差异</label><textarea id="note" placeholder="例如：品牌、型号、保修年限，或不含搬运">${esc(data.note||'')}</textarea></div><p class="hint">行内空白表示未报价。请在提交前检查币种为 RM。</p><button class="btn primary" id="submitQuote">${data.status==='submitted'?'更新成本报价':'提交成本报价'}</button><span id="result" class="hint" style="margin-left:10px"></span></div>`;
    const holder=document.getElementById('vendorItems'), stageMap=new Map();
    (r.items||[]).forEach(i=>{const g=i.stage||'other';if(!stageMap.has(g))stageMap.set(g,[]);stageMap.get(g).push(i)});
    holder.innerHTML=[...stageMap].map(([stage,list])=>`<section class="stage"><h3>${esc(stageLabel(stage))}</h3><div class="itemhead row"><span>项目 / 规格</span><span>单位</span>${quoteFields(list[0]).map(k=>`<span>${k==='material'?(list[0].type==='选材价差'?'主材差额':'主材成本'):k==='auxiliary'?'施工辅料':k==='labour'?'人工':'损耗%'}</span>`).join('')}</div><div class="items">${list.map(i=>inputRow(i,values.get(i.id))).join('')}</div></section>`).join('');
    document.getElementById('submitQuote').onclick=async()=>{const btn=document.getElementById('submitQuote'),result=document.getElementById('result');btn.disabled=true;result.textContent='正在提交…';try{const quote=(r.items||[]).map(i=>{const x={id:i.id};document.querySelectorAll(`[data-cost="${CSS.escape(i.id)}"]`).forEach(el=>{x[el.dataset.field]=el.value.trim()});return x}).filter(x=>Object.keys(x).some(k=>k!=='id'&&x[k]!==''));await api({action:'submit',token,quote,validity:document.getElementById('validity').value,note:document.getElementById('note').value});result.textContent='成本报价已提交';btn.textContent='更新成本报价'}catch(e){result.textContent=e.message}finally{btn.disabled=false}};
  }
  function stageLabel(id){return (window.QV2_SUPPLIER_TRADES?.GROUPS||[]).find(x=>x.id===id)?.name||id}
  async function adminView(){
    const {data:{session:s}}=await client.auth.getSession();session=s;
    if(!session){window.top.location.href='/portal/login.html?next='+encodeURIComponent('quote-v2.html?tab=supplier');return}
    document.getElementById('title').textContent='供应商成本询价';document.getElementById('intro').textContent='主材采购与施工报价分开：主材向厂家、材料供应商询价；施工辅料与人工向对应工种包工头询价。';
    try{await api({action:'list'}); }catch(e){app.innerHTML=`<div class="panel error">${esc(e.message)}</div>`;return}
    app.innerHTML=`<nav class="tabs"><button class="on" data-tab="new">新建询价</button><button data-tab="history">我的询价库</button><button data-tab="costbook">成本价目表</button></nav><section id="view"></section>`;
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));renderAdmin(b.dataset.tab)});
    await refreshRounds();renderAdmin('new');
  }
  async function refreshRounds(){rounds=(await api({action:'list'})).rounds||[]}
  function renderAdmin(tab){
    const view=document.getElementById('view');if(tab==='costbook'){
      view.innerHTML='<div class="panel">正在载入成本价目表…</div>';
      api({action:'costbook'}).then(({rows})=>{view.innerHTML=`<div class="panel"><h2 style="font:500 24px Georgia;color:var(--forest);margin-top:0">公司成本价目表</h2><p class="notice">主材采购成本与施工成本分别记录报价方；主材成本来自厂家 / 材料供应商，施工成本来自对应工种承包方。</p><div class="compare"><table><thead><tr><th>项目 / 规格</th><th>单位</th><th>主材</th><th>主材供应商</th><th>施工辅料</th><th>人工</th><th>施工方</th><th>更新时间</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.item_name)}<br><small>${esc(x.item_id)}</small></td><td>${esc(x.unit)}</td><td class="num">RM ${Number(x.material).toFixed(2)}</td><td>${esc(x.material_supplier_name||'—')}</td><td class="num">RM ${Number(x.auxiliary).toFixed(2)}</td><td class="num">RM ${Number(x.labour).toFixed(2)}</td><td>${esc(x.work_supplier_name||'—')}</td><td>${new Date(x.updated_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="8" class="hint">选定主材供应商或施工承包方后，成本会显示在这里。</td></tr>'}</tbody></table></div><p class="hint">${rows.length} 个成本项目 · 主材采购与施工承包分开匹配</p></div>`}).catch(e=>{view.innerHTML=`<div class="panel error">${esc(e.message)}</div>`});
      return;
    }
    if(tab==='new'){
      view.innerHTML=`<div class="tabs" style="margin-bottom:12px"><button class="on" data-scope="material">主材采购询价</button><button data-scope="work">施工包工报价</button></div><section id="scopeView"></section>`;
      let scope='material';const scopeView=view.querySelector('#scopeView');
      const renderScope=()=>{
        const stages=(window.QV2_SUPPLIER_TRADES.GROUPS||[]).map(s=>({...s,items:itemMeta(scope).filter(x=>x.stage===s.id)})).filter(s=>s.items.length);
        scopeView.innerHTML=`<div class="panel"><h2 style="font:500 24px Georgia;color:var(--forest);margin:0 0 6px">${scope==='material'?'向厂家或材料供应商询主材':'向对应工种包工头询施工价'}</h2><p class="hint">${scope==='material'?'只询主材成本，按材料单价、规格和品牌填写；不包含施工辅料与人工。':'只询施工辅料和人工，主材成本不在本询价中；电工与给排水等按实际工种分别发送。'}</p><div class="module-grid">${stages.map(s=>`<article class="module-card"><div><h3>${esc(s.name)}${scope==='material'?' · 主材':''}</h3><p>${s.items.length} 个询价项目</p></div><button class="btn primary" data-open-stage="${s.id}">生成填写链接</button></article>`).join('')}</div></div><div class="panel" id="invitePanel" hidden></div>`;
        scopeView.querySelectorAll('[data-open-stage]').forEach(b=>b.onclick=()=>{const selected=b.dataset.openStage,info=stages.find(s=>s.id===selected),panel=scopeView.querySelector('#invitePanel');panel.hidden=false;panel.innerHTML=`<div class="row" style="justify-content:space-between"><div><span class="badge">${scope==='material'?'主材采购':'施工包工'} · ${esc(info.name)}</span><h2 style="font:500 23px Georgia;color:var(--forest);margin:8px 0">邀请${scope==='material'?'材料供应商':'施工承包方'}填写</h2></div><button class="btn" id="closeInvite">收起</button></div><p class="hint">此询价包含 ${info.items.length} 项，只能填写${scope==='material'?'主材':'施工辅料与人工'}成本。每家供应商会拿到独立链接。</p><div class="field"><label>${scope==='material'?'厂家 / 材料供应商名称':'包工头 / 施工承包方名称'}（每行一家）</label><textarea id="suppliers" placeholder="供应商 A\n供应商 B"></textarea></div><div style="margin-top:12px"><button class="btn primary" id="createRound">生成专属链接</button></div><div id="createdLinks" class="supplier-links"></div>`;document.getElementById('closeInvite').onclick=()=>panel.hidden=true;document.getElementById('createRound').onclick=async()=>{const btn=document.getElementById('createRound');btn.disabled=true;try{const suppliers=document.getElementById('suppliers').value.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean),items=info.items,title=(scope==='material'?'主材采购':'施工包工')+' · '+info.name+' · '+new Date().toLocaleDateString('zh-CN');const out=await api({action:'create',title,trade:(scope==='material'?'主材采购 · ':'施工包工 · ')+stageLabel(selected),items,suppliers});document.getElementById('createdLinks').innerHTML=out.links.map(x=>`<div class="linkrow"><b>${esc(x.supplier)}</b><input readonly value="${esc(x.url)}"><button class="btn" data-copy="${esc(x.url)}">复制链接</button></div>`).join('');document.querySelectorAll('[data-copy]').forEach(copy=>copy.onclick=async()=>{await navigator.clipboard.writeText(copy.dataset.copy);copy.textContent='已复制'});await refreshRounds()}catch(e){alert(e.message)}finally{btn.disabled=false}}});
      };
      view.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;view.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('on',x===b));renderScope()});renderScope();
      return;
    }
    view.innerHTML=rounds.length?rounds.map(roundCard).join(''):'<div class="panel hint">还没有询价单。从“新建询价”分别发起主材采购或施工包工询价。</div>';
    view.querySelectorAll('[data-award]').forEach(b=>b.onclick=async()=>{if(!confirm('选定该供应商，并把已报价项目同步进公司成本价目表？'))return;b.disabled=true;try{const out=await api({action:'award',round_id:b.dataset.round,invite_id:b.dataset.award});alert(`已同步 ${out.count} 项成本价；${out.skipped} 项因报价未填完整而保留为空。`);await refreshRounds();renderAdmin('history')}catch(e){alert(e.message);b.disabled=false}});
  }
  function roundCard(r){
    const rows=r.items||[],inv=r.invites||[], submitted=inv.filter(x=>x.status==='submitted');
    const fieldsFor=item=>item.quote_fields||(item.type==='瓷砖片价'?['material']:['material','auxiliary','labour']);
    const complete=(item,q)=>q&&fieldsFor(item).every(k=>q[k]!=null);
    const amountFor=(item,q)=>fieldsFor(item).reduce((sum,k)=>sum+Number(q[k]||0),0);
    const sharedRows=rows.filter(item=>submitted.length&&submitted.every(s=>complete(item,(s.quote||[]).find(q=>q.id===item.id))));
    const scope=rows[0]?.quote_scope||'legacy';
    return `<article class="panel round"><div class="row" style="justify-content:space-between"><div><span class="badge">${scope==='material'?'主材采购':scope==='work'?'施工报价':esc(r.trade)}</span> <span class="badge">${esc(r.status==='awarded'?'已选定':r.status==='closed'?'已截止':'开放中')}</span><h3>${esc(r.title)}</h3><div class="hint">${new Date(r.created_at).toLocaleDateString()} · ${rows.length} 项 · ${submitted.length}/${inv.length} 家已提交</div><div class="hint">同类别按相同项目编号和单位逐项比较；主材与施工成本分开比较，不计算整单总价。</div></div><div><span class="badge">${sharedRows.length?`${sharedRows.length} 项可比`:'尚无共同完整报价'}</span></div></div><div class="compare"><table><thead><tr><th>项目 / 单位</th>${inv.map(s=>`<th>${esc(s.supplier_name)}<br><small>${esc(s.status==='submitted'?'已提交':'待报价')}</small></th>`).join('')}</tr></thead><tbody>${rows.slice(0,180).map(item=>`<tr><td>${esc(item.name)}<br><small>${esc(item.unit)}</small></td>${inv.map(s=>{const q=(s.quote||[]).find(x=>x.id===item.id),done=complete(item,q),amount=done?amountFor(item,q):null,prices=inv.filter(z=>z.status==='submitted').map(z=>{const y=(z.quote||[]).find(v=>v.id===item.id);return complete(item,y)?amountFor(item,y):Infinity});return `<td class="num ${done&&amount===Math.min(...prices)?'low':''}">${amount==null?(q?'未报完整':'—'):'RM '+amount.toLocaleString('en-MY',{maximumFractionDigits:2})}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="supplier-links">${inv.map(s=>`<div class="row" style="justify-content:space-between;border-top:1px dashed var(--line);padding-top:9px"><span>${esc(s.supplier_name)} · ${esc(s.status==='submitted'?'已提交 '+new Date(s.submitted_at).toLocaleString():'尚未提交')} ${s.validity?`· 有效期 ${esc(s.validity)}`:''}</span>${s.status==='submitted'&&r.status==='open'?`<button class="btn primary" data-award="${s.id}" data-round="${r.id}">选定并同步成本价</button>`:''}</div>${s.note?`<div class="hint">备注：${esc(s.note)}</div>`:''}`).join('')}</div></article>`;
  }
  function previewView(){
    document.getElementById('title').textContent='供应商成本询价 · 交互预览';
    const previewScope=params.get('scope')==='material'?'material':'work';
    document.getElementById('intro').textContent='主材采购与施工包工分开询价：主材由厂家 / 材料供应商报价，施工辅料和人工由对应工种承包方报价。样例不会保存。';
    const allItems=itemMeta(previewScope),stages=(window.QV2_SUPPLIER_TRADES.GROUPS||[]).map(s=>({...s,items:allItems.filter(x=>x.stage===s.id)})).filter(s=>s.items.length);
    app.innerHTML='<nav class="tabs"><button class="on" id="previewCompare">模块与询价库</button><button id="previewVendor">供应商填写示例</button></nav><section id="previewContent"></section>';
    const host=document.getElementById('previewContent'),compareBtn=document.getElementById('previewCompare'),vendorBtn=document.getElementById('previewVendor');
    const renderModules=()=>{
      compareBtn.classList.add('on');vendorBtn.classList.remove('on');
      host.innerHTML=`<div class="notice">${previewScope==='material'?'主材采购供应商只报价材料成本；施工辅料与人工在施工包工询价中另行比较。':'施工承包方只报价施工辅料与人工；主材由厂家或材料供应商另行询价。'}不同工种独立分组。</div><div class="module-grid">${stages.map(s=>`<article class="module-card"><div><h3>${esc(s.name)}</h3><p>${s.items.length} 个项目</p></div><button class="btn" data-preview-module="${s.id}">看该组比价</button></article>`).join('')}</div><div id="previewComparison"></div>`;
      host.querySelectorAll('[data-preview-module]').forEach(btn=>btn.onclick=()=>{const s=stages.find(x=>x.id===btn.dataset.previewModule),items=s.items.slice(0,7),sample=(name,base)=>({id:name,supplier_name:name,status:'submitted',submitted_at:new Date().toISOString(),validity:'30 天',note:name==='供应商 B'?'报价备注：辅料需确认。':'',quote:items.map((x,i)=>({id:x.id,material:base+i*2,auxiliary:x.type==='瓷砖片价'?null:base*.45,labour:x.type==='瓷砖片价'?null:base*.8}))});document.getElementById('previewComparison').innerHTML=`<div class="notice">${esc(s.name)} · 样例价格不会保存，正式比价按相同项目逐项显示。</div>${roundCard({id:'preview',title:s.name+' · 供应商询价',trade:s.name,status:'open',created_at:new Date().toISOString(),items,invites:[sample('供应商 A',18),sample('供应商 B',16)]})}`});
    };
    const renderVendor=()=>{
      compareBtn.classList.remove('on');vendorBtn.classList.add('on');
      const initial=stages.find(s=>s.id==='masonry')||stages[0];
      host.innerHTML=`<div class="panel"><div class="row"><div class="field"><label>供应商本次收到的${previewScope==='material'?'主材类别':'施工工种'}</label><select id="previewVendorStage">${stages.map(s=>`<option value="${s.id}" ${s.id===initial.id?'selected':''}>${esc(s.name)} · ${s.items.length} 项</option>`).join('')}</select></div><span class="badge">${previewScope==='material'?'主材采购成本':'施工成本（不含主材）'} · RM</span><span class="hint">报价方：供应商 A</span></div><div class="notice">${previewScope==='material'?'厂家 / 材料供应商只填主材单价或主材差额。':'施工承包方只填施工辅料与人工，不含主材。'}演示数据不会发送或保存。</div><div id="previewVendorItems"></div><div class="field" style="margin-top:14px"><label>备注、品牌、型号或规格差异</label><textarea placeholder="例如：品牌 / 型号"></textarea></div><p class="hint">演示数据不会发送或保存。</p><button class="btn primary" disabled>提交报价</button></div>`;
      const select=document.getElementById('previewVendorStage'),itemsHost=document.getElementById('previewVendorItems');
      const showItems=()=>{const s=stages.find(x=>x.id===select.value);itemsHost.innerHTML=`<section class="stage"><h3>${esc(s.name)} · ${s.items.length} 项</h3><div class="itemhead row"><span>项目 / 规格</span><span>单位</span>${quoteFields(s.items[0]).map(k=>`<span>${k==='material'?'主材成本':k==='auxiliary'?'施工辅料':k==='labour'?'人工':'损耗%'}</span>`).join('')}</div><div class="items">${s.items.map(i=>inputRow(i)).join('')}</div></section>`};
      select.onchange=showItems;showItems();
    };
    compareBtn.onclick=renderModules;vendorBtn.onclick=renderVendor;renderModules();
  }
  if(params.get('preview'))previewView();else if(token)supplierView();else adminView();
})();
</script></body></html>
