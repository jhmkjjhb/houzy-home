<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HOUZY HOME 精工施工交底卡（工人版）</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#1A3A2A;--gold:#C8A96E;--cream:#F5F2ED;--ink:#1A1A1A;--muted:#6B665E;--no:#B3261E;--ok:#1F7A3E}
    *{box-sizing:border-box}
    body{margin:0;background:#E9E5DE;color:var(--ink);font:17px/1.6 "Noto Sans SC",sans-serif}
    header{background:var(--green);color:var(--cream);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
    header img{width:36px;height:36px;border-radius:6px}
    header strong{font:600 18px "Playfair Display",serif;letter-spacing:.1em;display:block;line-height:1.1}
    header small{font-size:12px;color:#C9C2B4}
    header button{margin-left:8px;background:var(--gold);color:var(--green);border:0;border-radius:6px;padding:8px 14px;font:700 15px "Noto Sans SC";cursor:pointer}
    header #lang{margin-left:auto;background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
    nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #D8D2C7;position:sticky;top:64px;z-index:4}
    nav a{flex:none;text-decoration:none;color:var(--green);border:1.5px solid var(--green);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
    main{max-width:860px;margin:0 auto;padding:16px}
    .rule{background:#fff;border-left:6px solid var(--gold);padding:14px 18px;margin:8px 0 18px;font-size:16px}
    .rule b{color:var(--green)}
    .card{scroll-margin-top:124px;background:#fff;border-radius:8px;margin:0 0 22px;overflow:hidden;box-shadow:0 2px 0 #D8D2C7}
    .card h2{margin:0;background:var(--green);color:#fff;padding:12px 18px;font:900 26px "Noto Sans SC";display:flex;align-items:baseline;gap:12px}
    .card h2 span{font:700 15px "Playfair Display";color:var(--gold)}
    .card h2 em{font-style:normal;font-size:14px;font-weight:500;color:#C9C2B4;margin-left:auto}
    .sec{padding:12px 18px 6px}
    .sec h3{margin:0 0 6px;font-size:15px;letter-spacing:.1em;color:var(--muted)}
    ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
    ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid #EEE9E1}
    ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font:700 16px/30px "Playfair Display";text-align:center}
    ol.steps b{display:block;font-size:18px}
    ol.steps small{display:block;color:var(--muted);font-size:15px}
    .std{font:700 18px "Noto Sans SC",sans-serif;color:var(--green);background:#F1EBDD;border-radius:6px;padding:3px 10px;white-space:nowrap;align-self:center}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #EEE9E1}
    .two > div{padding:12px 18px}
    .two ul{margin:0;padding:0;list-style:none}
    .two li{padding:4px 0 4px 28px;position:relative;font-size:16px}
    .no li::before{content:"✕";position:absolute;left:0;color:var(--no);font-weight:900}
    .chk li::before{content:"☐";position:absolute;left:0;color:var(--ok);font-weight:900;font-size:18px;line-height:1.3}
    .no{background:#FBF1EF}
    .no h3{color:var(--no)!important}
    .chk h3{color:var(--ok)!important}
    .photo{padding:10px 18px 14px;background:#F6F3EC;font-size:15px;border-top:1px solid #EEE9E1}
    .photo b{color:var(--green)}
    .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 18px 16px;font-size:14px;color:var(--muted)}
    .sign div{border-bottom:1px solid #999;padding-top:22px}
    footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 40px}
    @media (max-width:640px){
      body{font-size:16px}
      ol.steps li{grid-template-columns:32px 1fr}
      .std{grid-column:2;justify-self:start}
      .two{grid-template-columns:1fr}
      .card h2 em{display:none}
    }
    @media print{
      body{background:#fff;font-size:13px}
      header button,nav,.rule{display:none}
      header{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      main{max-width:none;padding:0}
      .card{break-after:page;box-shadow:none;border:1px solid #bbb}
      .card h2,.std,.no,.photo,ol.steps li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      ol.steps b{font-size:15px}
    }
  </style>
</head>
<body>
  <header>
    <img src="/favicon.svg" alt="">
    <div><strong>HOUZY HOME</strong><small data-t="sub">精工施工交底卡 · 工人版</small></div>
    <button type="button" id="lang">EN</button>
    <button type="button" onclick="print()" data-t="print">打印 / 存 PDF</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <div class="rule" id="rule"></div>
    <div id="cards"></div>
  </main>
  <footer data-t="foot">HOUZY HOME SDN. BHD. · 合屋整装 · 内部施工标准，请勿外传</footer>
